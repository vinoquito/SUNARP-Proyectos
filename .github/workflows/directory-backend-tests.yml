name: Directory backend checks

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  directory-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run directory regression tests
        run: node --test tests/directory-service.test.cjs
