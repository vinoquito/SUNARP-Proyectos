<section data-app-view="informacion-personal" hidden>

  <div class="directory-page">

    <!-- Filtros -->
    <div class="sunarp-filter-bar">

      <div class="sunarp-filter">
        <label for="directorySedeFilter">Sede</label>
        <select id="directorySedeFilter" class="sunarp-select">
          <option value="">Selecciona una sede</option>
        </select>
      </div>

      <div class="sunarp-filter">
        <label for="directoryLocalFilter">Local</label>
        <select id="directoryLocalFilter" class="sunarp-select" disabled>
          <option value="">Selecciona primero una sede</option>
        </select>
      </div>

      <div
        id="directoryHierarchyFilters"
        class="sunarp-filter-collection"
        hidden>
      </div>

      <div class="sunarp-filter">
        <label for="directoryCargoFilter">Cargo</label>
        <select id="directoryCargoFilter" class="sunarp-select" disabled>
          <option value="">Selecciona primero un local</option>
        </select>
      </div>

    </div>

    <!-- Tabla -->
    <article class="sunarp-card">

      <div
        id="directoryTableContainer"
        aria-live="polite">
      </div>

    </article>

  </div>

</section>
