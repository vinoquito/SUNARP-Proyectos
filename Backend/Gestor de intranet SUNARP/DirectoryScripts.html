<script>
  /**
   * Devuelve las estructuras reales que deben aparecer en los filtros:
   * las unidades con asignaciones coincidentes y sus ancestros reales.
   * Los ancestros son seleccionables; nunca se crean opciones de contexto.
   */
  function _directoryBuildHierarchyFilterSets_(records, structures, siteId, localId) {
    const site = String(siteId || '').trim();
    const local = String(localId || '').trim();
    const structureMap = new Map((structures || []).map(node => [
      String(node.id || '').trim(), node
    ]));
    const selectableIds = new Set();
    if (!site || !local) return selectableIds;

    (records || []).forEach(record => {
      const recordSite = String(record.filter_sede_id || record.sede_id || '').trim();
      const recordLocal = String(record.filter_local_id || record.local_id || '').trim();
      const structureId = String(record.estructura_id || '').trim();
      if (recordSite !== site || recordLocal !== local || !structureId) return;

      let current = structureMap.get(structureId);
      const visited = new Set();
      while (current) {
        const currentId = String(current.id || '').trim();
        if (!currentId || visited.has(currentId)) break;
        if (String(current.sede_id || '').trim() !== site) break;
        visited.add(currentId);
        selectableIds.add(currentId);
        const parentId = String(current.parent_id || '').trim();
        current = parentId ? structureMap.get(parentId) || null : null;
      }
    });
    return selectableIds;
  }

  /** Devuelve la ruta completa de una estructura real de la misma sede. */
  function _directoryGetHierarchyDisplayPath_(node, structures) {
    const structureMap = new Map((structures || []).map(item => [
      String(item.id || '').trim(), item
    ]));
    const parts = [];
    const visited = new Set();
    const expectedSiteId = String(node && node.sede_id || '').trim();
    let current = node;
    while (current) {
      const id = String(current.id || '').trim();
      if (!id || visited.has(id)) break;
      if (String(current.sede_id || '').trim() !== expectedSiteId) break;
      visited.add(id);
      const name = String(current.name || '').trim();
      if (name) parts.unshift(name);
      const parentId = String(current.parent_id || '').trim();
      current = parentId ? structureMap.get(parentId) || null : null;
    }
    return parts.join(' / ');
  }

  /**
 * GESTOR DE INTRANET SUNARP
 * Módulo: Información de personal
 *
 * Operaciones:
 * - Listar servidores.
 * - Buscar y filtrar.
 * - Registrar.
 * - Editar.
 * - Desactivar.
 * - Reactivar.
 *
 * Interfaz: SUNARP UI.
 * Operaciones de datos: SUNARP Core.
 * Reglas particulares: DirectoryService.gs.
 */

const DirectoryPage = (() => {

  const DIRECTORY_SITE_CLIENT_CACHE_TTL_MS = 55000;

  const state = {
    records: [],
    catalogs: null,
    authorizedSedes: [],
    table: null,
    hierarchyPath: [],
    activeSedeId: '',
    siteDataCache: new Map(),
    siteRequestId: 0,
    siteLoading: false,
    loading: false,
    loaded: false,
    eventsBound: false,
    pageActionsActive: false
  };


  /* =====================================================
     1. COMUNICACIÓN CON EL SERVIDOR
     ===================================================== */

  function callServer(functionName, ...args) {
    return new Promise((resolve, reject) => {

      const runner = google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(reject);

      runner[functionName](...args);

    });
  }


  function notify(type, message) {
    if (window.SUNARPUI &&
        typeof SUNARPUI.notify === 'function') {
      SUNARPUI.notify(type, message);
    }
  }


  function escapeHtml(value) {
    return String(value ?? '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }


  function key(value) {
    return String(value ?? '').trim();
  }


  function isActive(record) {
    return !(
      record.active === false ||
      record.active === 0 ||
      String(record.active).toLowerCase() === 'false' ||
      String(record.active) === '0'
    );
  }


  /* =====================================================
     2. ELEMENTOS DE LA VISTA
     ===================================================== */

  function getElements() {
    return {
      sedeFilter: document.getElementById(
        'directorySedeFilter'
      ),

      localFilter: document.getElementById(
        'directoryLocalFilter'
      ),

      hierarchyFilters: document.getElementById(
        'directoryHierarchyFilters'
      ),

      cargoFilter: document.getElementById(
        'directoryCargoFilter'
      ),

      table: document.getElementById(
        'directoryTableContainer'
      )
    };
  }



  /* =====================================================
     3. FILTROS DINÁMICOS DE SEDE, JERARQUÍA Y CARGO
     ===================================================== */

  function sortByName(a, b) {
    return String(a.name || '').localeCompare(
      String(b.name || ''),
      'es',
      { sensitivity: 'base' }
    );
  }


  /**
   * Devuelve la ruta orgánica completa de un servidor.
   * Ejemplo: Órgano -> Oficina -> Unidad.
   */
  function getRecordStructurePath(record) {
    const structureMap = new Map(
      state.catalogs.estructuraOrg.map(node => [
        key(node.id),
        node
      ])
    );

    const path = [];
    const visited = new Set();

    let current = structureMap.get(
      key(record.estructura_id)
    );

    while (current) {
      const currentId = key(current.id);

      if (!currentId || visited.has(currentId)) {
        break;
      }

      visited.add(currentId);
      path.unshift(current);

      const parentId = key(current.parent_id);

      current = parentId
        ? structureMap.get(parentId) || null
        : null;
    }

    return path;
  }


  /**
   * Comprueba si un registro corresponde a la ruta
   * jerárquica que está seleccionada.
   */
  function recordMatchesHierarchyPath(record, path) {
    if (!path || !path.length) return true;

    const recordPath = getRecordStructurePath(record);

    if (recordPath.length < path.length) {
      return false;
    }

    return path.every((selectedId, index) =>
      key(recordPath[index].id) === key(selectedId)
    );
  }


  /**
   * Aplica los filtros seleccionados.
   *
   * excludedFilters permite excluir uno de los filtros
   * para calcular las opciones disponibles de ese filtro
   * a partir de los otros dos.
   */
  function getRecordsForFilters(excludedFilters) {
    const excluded = excludedFilters || new Set();
    const elements = getElements();

    const sedeId = elements.sedeFilter
      ? key(elements.sedeFilter.value)
      : '';
    const localId = elements.localFilter
      ? key(elements.localFilter.value)
      : '';
    const cargoId = elements.cargoFilter
      ? key(elements.cargoFilter.value)
      : '';

    return state.records.filter(record => {
      const recordSedeId = key(record.filter_sede_id || record.sede_id);
      const recordLocalId = key(record.filter_local_id || record.local_id);

      if (!excluded.has('sede') && sedeId && recordSedeId !== sedeId) return false;
      if (!excluded.has('local') && localId && recordLocalId !== localId) return false;
      if (!excluded.has('cargo') && cargoId && key(record.cargo_id) !== cargoId) return false;
      if (!excluded.has('hierarchy') &&
          !recordMatchesHierarchyPath(record, state.hierarchyPath)) return false;
      return true;
    });
  }


  function getUsedCatalogItems(records, field, catalog) {
    const usedIds = new Set(
      records
        .map(record => key(record[field]))
        .filter(Boolean)
    );

    return (catalog || [])
      .filter(item => usedIds.has(key(item.id)))
      .sort(sortByName);
  }


  /**
   * Actualiza las opciones de un selector y conserva
   * su selección si todavía está disponible.
   */
  function updateFilterOptions(select, placeholder, items) {
    if (!select) return;

    const selectedValue = key(select.value);

    select.replaceChildren();

    const defaultOption = document.createElement('option');

    defaultOption.value = '';
    defaultOption.textContent = placeholder;

    select.appendChild(defaultOption);

    items.forEach(item => {
      const option = document.createElement('option');

      option.value = key(item.id);
      option.textContent = item.name;

      select.appendChild(option);
    });

    const selectionExists = items.some(item =>
      key(item.id) === selectedValue
    );

    select.value = selectionExists ? selectedValue : '';
  }


  /**
   * Sedes utilizadas por los registros que cumplen
   * los filtros de cargo y jerarquía.
   */
  function populateSedeFilter() {
    const select = getElements().sedeFilter;
    if (!select) return;
    const sedes = (state.authorizedSedes || [])
      .filter(item => isActive(item))
      .slice()
      .sort(sortByName);
    updateFilterOptions(select, 'Selecciona una sede', sedes);
    // La selección siempre es explícita, incluso cuando solo existe una sede.
    select.disabled = sedes.length === 0;
    const wrapper = select.closest('.sunarp-filter');
    if (wrapper) wrapper.hidden = false;
  }


  function populateLocalFilter() {
    const select = getElements().localFilter;
    if (!select) return;
    const siteId = key(getElements().sedeFilter && getElements().sedeFilter.value);

    if (!siteId || siteId !== state.activeSedeId) {
      updateFilterOptions(select, 'Selecciona primero una sede', []);
      select.disabled = true;
      return;
    }

    const options = new Map();
    state.records.forEach(record => {
      const id = key(record.filter_local_id || record.local_id);
      const recordSedeId = key(record.filter_sede_id || record.sede_id);
      if (!id || recordSedeId !== siteId || options.has(id)) return;
      options.set(id, { id, name: key(record.local_name) || id });
    });
    const locals = Array.from(options.values()).sort(sortByName);
    updateFilterOptions(
      select,
      locals.length ? 'Selecciona un local' : 'No hay locales disponibles en esta sede',
      locals
    );
    select.disabled = locals.length === 0;
  }


  function populateCargoFilter() {
    const select = getElements().cargoFilter;
    if (!select) return;
    const elements = getElements();
    const siteId = key(elements.sedeFilter && elements.sedeFilter.value);
    const localId = key(elements.localFilter && elements.localFilter.value);

    if (!siteId || siteId !== state.activeSedeId || !localId) {
      updateFilterOptions(
        select,
        !siteId ? 'Selecciona primero una sede' : 'Selecciona primero un local',
        []
      );
      select.disabled = true;
      return;
    }

    const options = new Map();
    getRecordsForFilters(new Set(['cargo'])).forEach(record => {
      const id = key(record.cargo_id);
      if (!id || options.has(id)) return;
      options.set(id, { id, name: key(record.cargo_name) || id });
    });
    const cargos = Array.from(options.values()).sort(sortByName);
    updateFilterOptions(
      select,
      cargos.length ? 'Todos los cargos de este local' : 'No hay cargos para esta selección',
      cargos
    );
    select.disabled = cargos.length === 0;
  }


  function getHierarchyFilterSets() {
    const elements = getElements();
    const siteId = key(elements.sedeFilter && elements.sedeFilter.value);
    const localId = key(elements.localFilter && elements.localFilter.value);
    const structures = state.catalogs && state.catalogs.estructuraOrg || [];

    if (!siteId || siteId !== state.activeSedeId || !localId) {
      return { selectableIds: new Set() };
    }

    return {
      selectableIds: _directoryBuildHierarchyFilterSets_(
        state.records,
        structures,
        siteId,
        localId
      )
    };
  }


  function getHierarchyNodes(parentId) {
    const sets = getHierarchyFilterSets();
    return (state.catalogs.estructuraOrg || [])
      .filter(node =>
        key(node.parent_id) === key(parentId) &&
        sets.selectableIds.has(key(node.id))
      )
      .slice()
      .sort((a, b) => {
        const orderA = Number(a.order) || 0;
        const orderB = Number(b.order) || 0;
        return orderA - orderB ||
          String(a.name).localeCompare(String(b.name), 'es');
      });
  }


  /**
   * Determina la etiqueta del nivel jerárquico.
   * También se utiliza en el formulario de registro.
   */
  function getHierarchyLabel(nodes, level) {
    const types = [
      ...new Set(
        nodes
          .map(node => key(node.tipo_estructura_name))
          .filter(Boolean)
      )
    ];

    if (types.length === 1) {
      return types[0].charAt(0).toLocaleUpperCase() +
        types[0].slice(1);
    }

    return level === 0
      ? 'Órgano o dependencia'
      : 'Unidad o dependencia';
  }


  /**
   * Construye un selector para cada nivel jerárquico.
   */
  function appendHierarchyLevel(parentId, level) {
    const container = getElements().hierarchyFilters;

    if (!container) return;

    const nodes = getHierarchyNodes(parentId);

    if (!nodes.length) return;

    const wrapper = document.createElement('div');

    wrapper.className = 'sunarp-filter';

    const selectId = `directoryHierarchyFilter${level}`;

    const label = document.createElement('label');

    label.htmlFor = selectId;
    label.textContent = getHierarchyLabel(nodes, level);

    const select = document.createElement('select');

    select.id = selectId;
    select.className = 'sunarp-select';

    const placeholder = document.createElement('option');

    placeholder.value = '';
    placeholder.textContent = level === 0
      ? 'Todas'
      : 'Todas las dependencias';

    select.appendChild(placeholder);

    const sets = getHierarchyFilterSets();
    nodes.forEach(node => {
      const option = document.createElement('option');
      const id = key(node.id);
      option.value = id;
      option.textContent = _directoryGetHierarchyDisplayPath_(
        node,
        state.catalogs.estructuraOrg || []
      ) || node.name;
      select.appendChild(option);
    });

    const previousSelection =
      state.hierarchyPath[level] || '';

    const exists = nodes.some(node =>
      key(node.id) === key(previousSelection)
    );

    const selectedValue = exists
      ? key(previousSelection)
      : '';

    if (!exists && previousSelection) {
      state.hierarchyPath =
        state.hierarchyPath.slice(0, level);
    }

    select.value = selectedValue;

    select.addEventListener('change', () => {
      const value = key(select.value);

      state.hierarchyPath =
        state.hierarchyPath.slice(0, level);

      if (value) {
        state.hierarchyPath.push(value);
      }

      refreshDependentFilters('hierarchy');
    });

    wrapper.appendChild(label);
    wrapper.appendChild(select);

    container.appendChild(wrapper);

    if (selectedValue) {
      appendHierarchyLevel(selectedValue, level + 1);
    }
  }


  /**
   * Reconstruye los filtros jerárquicos.
   *
   * Solo utiliza registros que cumplen los filtros
   * de sede y cargo.
   */
  function renderHierarchyFilters() {
    const container = getElements().hierarchyFilters;
    if (!container) return;
    container.replaceChildren();

    const elements = getElements();
    const siteId = key(elements.sedeFilter && elements.sedeFilter.value);
    const localId = key(elements.localFilter && elements.localFilter.value);
    const validLocal = state.records.some(record =>
      key(record.filter_sede_id || record.sede_id) === siteId &&
      key(record.filter_local_id || record.local_id) === localId
    );

    if (!siteId || siteId !== state.activeSedeId || !localId || !validLocal) {
      state.hierarchyPath = [];
      container.hidden = true;
      return;
    }

    appendHierarchyLevel('', 0);
    container.hidden = container.childElementCount === 0;
    if (container.hidden) state.hierarchyPath = [];
  }


  function hasAvailableFilterSelection(filter) {
    const elements = getElements();
    if (filter === 'sede') {
      const selected = key(elements.sedeFilter && elements.sedeFilter.value);
      return !selected || (state.catalogs.sedes || []).some(item => key(item.id) === selected);
    }
    if (filter === 'cargo') {
      const selected = key(elements.cargoFilter && elements.cargoFilter.value);
      return !selected || (state.catalogs.cargos || []).some(item => key(item.id) === selected);
    }
    if (filter === 'hierarchy') {
      const structures = new Map((state.catalogs.estructuraOrg || []).map(item => [key(item.id), item]));
      return state.hierarchyPath.every((id, index) => {
        const node = structures.get(key(id));
        if (!node) return false;
        const expectedParent = index ? key(state.hierarchyPath[index - 1]) : '';
        return key(node.parent_id) === expectedParent;
      });
    }
    return true;
  }


  /**
   * Recalcula los filtros relacionados cuando cambia
   * cualquiera de ellos.
   *
   * Se conserva el filtro que acaba de modificar el usuario.
   * Los demás se limpian cuando dejan de tener registros
   * compatibles con las nuevas selecciones.
   */
  function refreshDependentFilters(changedFilter) {
    const elements = getElements();
    if (changedFilter === 'sede') return;

    const parentChanged = ['local', 'hierarchy'].includes(changedFilter);
    if (changedFilter === 'local') state.hierarchyPath = [];
    if (parentChanged && elements.cargoFilter) elements.cargoFilter.value = '';

    populateLocalFilter();
    populateCargoFilter();
    renderHierarchyFilters();
    renderTable();
  }


  function getFilteredRecords() {
    return getRecordsForFilters(new Set());
  }

  function prepareRows(records) {

    return records.map(record => ({

      ...record,

      servidor: [
        record.nombres,
        record.apellidos
      ].filter(Boolean).join(' '),

      anexo_display:
        record.anexo === '' ||
        record.anexo === null ||
        record.anexo === undefined
          ? '—'
          : String(record.anexo),

      dependencia_display: record.estructura_name || '—',

      local_display: record.local_name || '—',

      estado_display: isActive(record)
        ? 'Activo'
        : 'Inactivo'

    }));

  }


  /* =====================================================
     6. TABLA REUTILIZABLE
     ===================================================== */


    
  function renderTable() {
    const container = getElements().table;
    if (!container) return;

    if (!state.activeSedeId) {
      if (state.table) {
        state.table.destroy();
        state.table = null;
      }
      container.textContent = 'Selecciona una sede para consultar la información de personal.';
      return;
    }

    if (!window.SUNARPUI || typeof SUNARPUI.createDataTable !== 'function') {
      throw new Error('No está disponible el componente DataTable de SUNARP UI.');
    }

    const options = {
      containerId: 'directoryTableContainer',
      mode: 'client',
      data: prepareRows(getFilteredRecords()),
      emptyMessage: 'No se encontraron registros para los filtros seleccionados.',
      columns: [
        { key: 'servidor', label: 'Servidor', searchable: true },
        { key: 'cargo_name', label: 'Cargo', searchable: true },
        { key: 'anexo_display', label: 'Anexo', align: 'center', searchable: true },
        { key: 'dependencia_display', label: 'Dependencia', searchable: true },
        { key: 'local_display', label: 'Local', searchable: true },
        {
          key: 'active',
          label: 'Estado',
          searchable: false,
          render: (value, record) => {
            const active = isActive(record);
            const wrapper = document.createElement('div');
            wrapper.className = 'sunarp-datatable-status access-status-cell';
            const badge = SUNARPUI.createBadge({
              label: active ? 'Activo' : 'Inactivo',
              variant: active ? 'success' : 'danger',
              icon: active ? 'check_circle' : 'cancel'
            });
            wrapper.appendChild(badge);
            const statusButton = document.createElement('button');
            statusButton.type = 'button';
            statusButton.className =
              `sunarp-datatable-status-link access-status-link ${
                active
                  ? 'sunarp-datatable-status-link--deactivate access-status-link--deactivate'
                  : 'sunarp-datatable-status-link--activate access-status-link--activate'
              }`;
            statusButton.textContent = active ? 'Desactivar' : 'Activar';
            statusButton.addEventListener('click', async () => {
              statusButton.disabled = true;
              try {
                await changeDirectoryStatus(record, !active);
              } catch (error) {
                notify('error', error.message || 'No se pudo cambiar el estado.');
              } finally {
                if (statusButton.isConnected) statusButton.disabled = false;
              }
            });
            wrapper.appendChild(statusButton);
            return wrapper;
          }
        }
      ],
      pageSize: 10,
      pageSizeOptions: [10, 25, 50],
      rowActions: [
        {
          label: 'Editar',
          icon: 'edit',
          variant: 'primary',
          title: 'Editar servidor',
          onClick: record => openDirectoryForm(record)
        },
        {
          label: 'Nueva asignación',
          icon: 'plus',
          variant: 'primary',
          title: 'Registrar otra asignación para esta persona',
          onClick: record => openDirectoryForm(record, { assignmentOnly: true })
        },
        {
          label: 'Historial',
          icon: 'history',
          variant: 'primary',
          title: 'Consultar historial del servidor',
          onClick: record => {
            if (!window.SUNARPAccessHistory ||
                typeof window.SUNARPAccessHistory.open !== 'function') {
              notify('error', 'No está disponible el componente de historial.');
              return;
            }
            window.SUNARPAccessHistory.open(
              'SERVIDOR',
              record.persona_id,
              [record.nombres, record.apellidos].filter(Boolean).join(' ')
            );
          }
        },
        {
          label: 'Eliminar',
          icon: 'delete',
          variant: 'danger',
          title: 'Eliminar asignación',
          onClick: record => deleteDirectoryEntry(record)
        }
      ]
    };

    if (!state.table) {
      state.table = SUNARPUI.createDataTable(options);
    } else {
      // Actualización local: conserva el componente y no consulta al servidor.
      state.table.setData(options.data);
    }
  }


  function getFormStructurePath(structureId) {

    const structureMap = new Map(
      state.catalogs.estructuraOrg.map(node => [
        key(node.id),
        node
      ])
    );

    const path = [];
    const visited = new Set();

    let current = structureMap.get(key(structureId));

    while (current) {

      const currentId = key(current.id);

      if (!currentId || visited.has(currentId)) {
        break;
      }

      visited.add(currentId);
      path.unshift(currentId);

      const parentId = key(current.parent_id);

      current = parentId
        ? structureMap.get(parentId) || null
        : null;

    }

    return path;
  }


  function getFormHierarchyNodes(parentId, sedeId) {

    return state.catalogs.estructuraOrg
      .filter(node => {

        if (parentId) {
          return key(node.parent_id) === key(parentId);
        }

        return (
          !key(node.parent_id) &&
          key(node.sede_id) === key(sedeId)
        );

      })
      .sort((a, b) => {

        const orderA = Number(a.order) || 0;
        const orderB = Number(b.order) || 0;

        return orderA - orderB ||
          String(a.name).localeCompare(String(b.name), 'es');

      });
  }


  function renderFormLocalOptions(
    structureId,
    selectedRelationId
  ) {

    const select = document.getElementById(
      'directoryFormLocal'
    );

    if (!select) return;

    select.innerHTML = '';

    const placeholder = document.createElement('option');

    placeholder.value = '';
    placeholder.textContent = structureId
      ? 'Selecciona un local'
      : 'Selecciona una dependencia';

    select.appendChild(placeholder);

    const relations = state.catalogs.estructuraLocal
      .filter(relation =>
        key(relation.estructura_id) === key(structureId) &&
        relation.active !== false &&
        relation.active !== 0 &&
        String(relation.active).toLowerCase() !== 'false'
      );

    relations.forEach(relation => {

      const option = document.createElement('option');

      option.value = key(relation.id);

      option.textContent = [
        relation.local_name,
        relation.referencia
      ].filter(Boolean).join(' — ');

      select.appendChild(option);

    });

    select.value = relations.some(relation =>
      key(relation.id) === key(selectedRelationId)
    )
      ? key(selectedRelationId)
      : '';

    select.disabled = relations.length === 0;

  }


  function renderFormHierarchy(
    sedeId,
    selectedPath,
    selectedRelationId
  ) {

    const container = document.getElementById(
      'directoryFormHierarchy'
    );

    if (!container) return;

    container.innerHTML = '';

    let selectedStructureId = '';

    function appendLevel(parentId, level) {

      const nodes = getFormHierarchyNodes(
        parentId,
        sedeId
      );

      if (!nodes.length) return;

      const wrapper = document.createElement('div');
      wrapper.className = 'sunarp-form-field sunarp-form-field--full';

      const label = document.createElement('label');
      label.textContent = getHierarchyLabel(nodes, level);

      const select = document.createElement('select');
      select.className = 'sunarp-select';

      const placeholder = document.createElement('option');
      placeholder.value = '';
      placeholder.textContent = 'Selecciona una opción';

      select.appendChild(placeholder);

      nodes.forEach(node => {

        const option = document.createElement('option');

        option.value = key(node.id);
        option.textContent = node.name;

        select.appendChild(option);

      });

      const previous = selectedPath[level] || '';

      const exists = nodes.some(node =>
        key(node.id) === previous
      );

      const selectedValue = exists ? previous : '';

      if (!exists) {
        selectedPath.splice(level);
      }

      select.value = selectedValue;

      select.addEventListener('change', () => {

        selectedPath.splice(level);

        if (select.value) {
          selectedPath.push(select.value);
        }

        renderFormHierarchy(
          sedeId,
          selectedPath,
          ''
        );

      });

      label.appendChild(select);
      wrapper.appendChild(label);
      container.appendChild(wrapper);

      if (selectedValue) {
        selectedStructureId = selectedValue;
        appendLevel(selectedValue, level + 1);
      }

    }

    appendLevel('', 0);

    // El local se relaciona con el último elemento
    // seleccionado de la jerarquía.
    if (selectedPath.length) {
      selectedStructureId = selectedPath[
        selectedPath.length - 1
      ];
    }

    renderFormLocalOptions(
      selectedStructureId,
      selectedRelationId
    );

  }

  async function openDirectoryForm(record, options = {}) {

    const assignmentOnly = options.assignmentOnly === true;
    const isEditing = Boolean(record) && !assignmentOnly;
    if (!state.activeSedeId || !state.catalogs || !Array.isArray(state.catalogs.estructuraOrg)) {
      notify('warning', 'Selecciona una sede antes de registrar o editar información de personal.');
      return;
    }
    let formRecord = record;

    if (isEditing) {
      try {
        const detail = await callServer('getDirectoryPersonById', record.persona_id);
        if (!detail) throw new Error('No se encontró la ficha de la persona.');
        const assignment = (detail.assignments || []).find(item =>
          key(item.asignacion_id) === key(record.asignacion_id || record.id)
        );
        if (!assignment) throw new Error('No se encontró la asignación que deseas editar dentro de tu ámbito.');
        formRecord = Object.assign({}, detail, assignment, {
          id: assignment.asignacion_id
        }, detail.personalData || {});
      } catch (error) {
        notify('error', error.message || 'No se pudo recuperar la ficha de la persona.');
        return;
      }
    }

    const formData = buildDirectoryForm(formRecord, assignmentOnly);

    // Convertir la cadena HTML del formulario en un fragmento DOM.
    const template = document.createElement('template');

    template.innerHTML = formData.html.trim();

    // SUNARP UI recibe un elemento DOM mediante la propiedad content.
    SUNARPUI.openModal({
      title: assignmentOnly
        ? 'Nueva asignación'
        : (isEditing ? 'Editar servidor' : 'Registrar servidor'),

      content: template.content,
      size: 'lg'
    });

    // Obtener los elementos una vez insertado el contenido en el modal.
    const form = document.getElementById('directoryForm');

    const sedeSelect = document.getElementById(
      'directoryFormSede'
    );

    const modeSelect = document.getElementById('directoryFormAssignmentMode');
    const relationSelect = document.getElementById('directoryFormLocal');
    const directLocalSelect = document.getElementById('directoryFormDirectLocal');

    function refreshDirectLocalOptions(sedeId, selectedId) {
      const current = selectedId !== undefined ? key(selectedId) : key(directLocalSelect.value);
      directLocalSelect.replaceChildren();
      const placeholder = document.createElement('option');
      placeholder.value = '';
      placeholder.textContent = 'Selecciona un local';
      directLocalSelect.appendChild(placeholder);
      state.catalogs.locales
        .filter(local => !sedeId || key(local.sede_id) === key(sedeId))
        .slice().sort(sortByName).forEach(local => {
          const option = document.createElement('option');
          option.value = key(local.id);
          option.textContent = local.name;
          directLocalSelect.appendChild(option);
        });
      directLocalSelect.value = Array.from(directLocalSelect.options).some(option => option.value === current)
        ? current : '';
    }

    function syncAssignmentMode() {
      const mode = modeSelect.value;
      const useStructure = mode === 'structure' || mode === 'both';
      const useDirectLocal = mode === 'local' || mode === 'both';
      document.getElementById('directoryFormHierarchyField').style.display = useStructure ? '' : 'none';
      document.getElementById('directoryFormRelationField').style.display = useStructure ? '' : 'none';
      document.getElementById('directoryFormDirectLocalField').style.display = useDirectLocal ? '' : 'none';
      relationSelect.required = useStructure;
      directLocalSelect.required = useDirectLocal;
      // Ocultar conserva la selección anterior: el usuario puede cambiar
      // de modalidad y volver sin perder la estructura ya elegida.
      if (!useDirectLocal) directLocalSelect.value = '';
      if (mode === 'both' && relationSelect.value) {
        const relation = state.catalogs.estructuraLocal.find(x => key(x.id) === key(relationSelect.value));
        if (relation) directLocalSelect.value = key(relation.local_id);
      }
    }

    relationSelect.addEventListener('change', () => {
      if (modeSelect.value === 'both') {
        const relation = state.catalogs.estructuraLocal.find(x => key(x.id) === key(relationSelect.value));
        directLocalSelect.value = relation ? key(relation.local_id) : '';
      }
    });
    modeSelect.addEventListener('change', syncAssignmentMode);


    const cancelButton = document.getElementById(
      'directoryFormCancel'
    );

    // Comprobar que el formulario se haya insertado correctamente.
    if (!form || !sedeSelect || !cancelButton) {

      SUNARPUI.closeModal();

      notify(
        'error',
        'No se pudo inicializar el formulario del directorio.'
      );

      return;
    }

    // Construir los selectores jerárquicos y el local físico.
    renderFormHierarchy(
      formData.selectedSede,
      formData.selectedPath,
      formData.selectedRelationId
    );

    refreshDirectLocalOptions(formData.selectedSede, formData.selectedLocalId);
    syncAssignmentMode();

    // Cambiar de sede reinicia la selección jerárquica.
    sedeSelect.addEventListener('change', () => {

      renderFormHierarchy(
        sedeSelect.value,
        [],
        ''
      );
      refreshDirectLocalOptions(sedeSelect.value, '');

    });

    // Cerrar el formulario.
    cancelButton.addEventListener('click', () => {
      SUNARPUI.closeModal();
    });

    // Guardar el registro.
    form.addEventListener('submit', saveForm);

  }



  /* =====================================================
     10. GUARDAR REGISTRO
     ===================================================== */

  async function saveForm(event) {

    event.preventDefault();

    const form = event.currentTarget;

    if (!form.reportValidity()) return;

    const id = document.getElementById(
      'directoryFormId'
    ).value;

    const nombres = document.getElementById(
      'directoryFormNombres'
    ).value.trim();

    const apellidos = document.getElementById(
      'directoryFormApellidos'
    ).value.trim();

    const cargoId = document.getElementById(
      'directoryFormCargo'
    ).value;

    const anexoInput = document.getElementById(
      'directoryFormAnexo'
    ).value;

    const assignmentMode = document.getElementById('directoryFormAssignmentMode').value;
    const estructuraLocalId = (assignmentMode === 'structure' || assignmentMode === 'both')
      ? document.getElementById('directoryFormLocal').value
      : '';
    const localId = (assignmentMode === 'local' || assignmentMode === 'both')
      ? document.getElementById('directoryFormDirectLocal').value
      : '';

    if ((assignmentMode === 'structure' || assignmentMode === 'both') && !estructuraLocalId) {
      notify('warning', 'Selecciona la unidad orgánica y su relación con el local.');
      return;
    }
    if ((assignmentMode === 'local' || assignmentMode === 'both') && !localId) {
      notify('warning', 'Selecciona el local directamente asignado.');
      return;
    }
    if (assignmentMode === 'both') {
      const relation = state.catalogs.estructuraLocal.find(x => key(x.id) === key(estructuraLocalId));
      if (!relation || key(relation.local_id) !== key(localId)) {
        notify('warning', 'El local debe coincidir con el local de la relación estructura-local seleccionada.');
        return;
      }
    }

    const personaId = document.getElementById('directoryFormPersonaId').value;
    const payload = {
      persona_id: personaId,
      asignacion_id: id,
      nombres,
      apellidos,
      correo_institucional: document.getElementById('directoryFormCorreoInstitucional')?.value.trim().toLowerCase() || '',
      tipo_documento: document.getElementById('directoryFormTipoDocumento')?.value.trim() || '',
      numero_documento: document.getElementById('directoryFormNumeroDocumento')?.value.trim() || '',
      fecha_nacimiento: document.getElementById('directoryFormFechaNacimiento')?.value || '',
      fecha_inicio_servicios: document.getElementById('directoryFormFechaInicio')?.value || '',
      fecha_cese: document.getElementById('directoryFormFechaCese')?.value || '',
      cargo_id: cargoId,
      condicion_cargo: document.getElementById('directoryFormCondicionCargo').value.trim(),
      anexo: anexoInput === '' ? '' : Number(anexoInput),
      estructura_local_id: estructuraLocalId,
      local_id: localId,
      observaciones: document.getElementById('directoryFormObservaciones')?.value.trim() || ''
    };

    const saveButton = document.getElementById(
      'directoryFormSave'
    );

    saveButton.disabled = true;
    saveButton.textContent = 'Guardando...';

    try {

      const result = await callServer(
        'saveDirectoryEntry',
        payload
      );

      SUNARPUI.closeModal();

      notify(
        'success',
        result.message || 'Registro guardado correctamente.'
      );

      await refreshActiveSede();

    } catch (error) {

      notify(
        'error',
        error.message || 'No se pudo guardar el registro.'
      );

      saveButton.disabled = false;
      saveButton.textContent = id
        ? 'Guardar cambios'
        : (personaId ? 'Registrar asignación' : 'Registrar servidor');

    }

  }


  /* =====================================================
     11. DESACTIVAR Y REACTIVAR
     ===================================================== */

  
/**
 * Activa o desactiva un servidor desde su celda de estado.
 */
async function changeDirectoryStatus(record, active) {

  const result = await callServer(
    'setDirectoryAssignmentActive',
    record.asignacion_id || record.id,
    active
  );

  await refreshActiveSede();

  notify(
    'success',
    result.message ||
      `Asignación ${active ? 'activada' : 'desactivada'} correctamente.`
  );

}


/**
 * Elimina definitivamente un servidor.
 * Utiliza SweetAlert2 para solicitar confirmación.
 */
async function deleteDirectoryEntry(record) {

  if (!window.Swal) {
    throw new Error(
      'SweetAlert2 no está disponible. Verifica su carga en SUNARP UI.'
    );
  }

  const fullName = [
    record.nombres,
    record.apellidos
  ].filter(Boolean).join(' ');

  // Confirmación de eliminación.
  const confirmation = await Swal.fire({

    title: '¿Eliminar asignación?',

    text: `Se eliminará la asignación de ${fullName}. La persona y sus datos personales se conservarán.`,

    icon: 'warning',

    showCancelButton: true,

    confirmButtonText: 'Sí, eliminar',

    cancelButtonText: 'Cancelar',

    reverseButtons: true,

    focusCancel: true,

    customClass: {
      popup: 'sunarp-swal-popup'
    }

  });

  if (!confirmation.isConfirmed) {
    return;
  }

  // Ejecutar eliminación en el servidor.
  const result = await callServer(
    'deleteDirectoryAssignment',
    record.asignacion_id || record.id
  );

  // Recargar la información actualizada.
  await refreshActiveSede();

  notify(
    'success',
    result.message || 'Asignación eliminada correctamente.'
  );

}

  /* =====================================================
     13. EVENTOS DE FILTROS
     ===================================================== */


  function bindEvents() {
    if (state.eventsBound) return;
    const elements = getElements();
    if (!elements.sedeFilter || !elements.localFilter || !elements.cargoFilter) return;

    elements.sedeFilter.addEventListener('change', () => {
      loadSelectedSede(elements.sedeFilter.value);
    });
    elements.localFilter.addEventListener('change', () => {
      refreshDependentFilters('local');
    });
    elements.cargoFilter.addEventListener('change', () => {
      refreshDependentFilters('cargo');
    });
    state.eventsBound = true;
  }


  function clearDirectoryTable(message) {
    const container = getElements().table;
    if (state.table) {
      state.table.destroy();
      state.table = null;
    }
    if (container) container.textContent = message || '';
  }


  async function loadSelectedSede(sedeId, force = false) {
    const selectedSedeId = key(sedeId);
    const elements = getElements();
    const requestId = ++state.siteRequestId;

    if (!selectedSedeId) {
      state.activeSedeId = '';
      state.records = [];
      state.hierarchyPath = [];
      state.catalogs = { sedes: state.authorizedSedes || [] };
      if (elements.localFilter) elements.localFilter.value = '';
      if (elements.cargoFilter) elements.cargoFilter.value = '';
      populateLocalFilter();
      populateCargoFilter();
      renderHierarchyFilters();
      clearDirectoryTable('Selecciona una sede para consultar la información de personal.');
      return;
    }

    const isAuthorizedSede = (state.authorizedSedes || []).some(item =>
      key(item.id) === selectedSedeId
    );
    if (!isAuthorizedSede) {
      elements.sedeFilter.value = '';
      notify('warning', 'La sede seleccionada no está dentro de tus ámbitos autorizados.');
      return;
    }

    state.siteLoading = true;
    state.activeSedeId = '';
    state.records = [];
    state.hierarchyPath = [];
    state.catalogs = { sedes: state.authorizedSedes || [] };
    if (elements.localFilter) elements.localFilter.value = '';
    if (elements.cargoFilter) elements.cargoFilter.value = '';
    populateLocalFilter();
    populateCargoFilter();
    renderHierarchyFilters();
    clearDirectoryTable('Cargando información de la sede seleccionada...');

    try {
      const cacheEntry = state.siteDataCache.get(selectedSedeId);
      const useClientCache = Boolean(
        !force &&
        cacheEntry &&
        cacheEntry.data &&
        Date.now() - cacheEntry.loadedAt < DIRECTORY_SITE_CLIENT_CACHE_TTL_MS
      );
      let result = useClientCache ? cacheEntry.data : null;
      if (!result) {
        result = await callServer('getDirectorySiteData', selectedSedeId);
      }
      if (requestId !== state.siteRequestId) return;

      if (!result || !result.catalogs || !Array.isArray(result.records)) {
        throw new Error('El servidor devolvió una carga incompleta para la sede seleccionada.');
      }

      state.siteDataCache.set(selectedSedeId, {
        data: result,
        loadedAt: Date.now()
      });
      state.records = result.records;
      // Los filtros de navegación usan state.authorizedSedes; los formularios
      // usan solo los catálogos de la sede que el servidor acaba de cargar.
      state.catalogs = result.catalogs;
      state.activeSedeId = selectedSedeId;

      populateLocalFilter();
      populateCargoFilter();
      renderHierarchyFilters();
      renderTable();

      console.info('[DirectoryPage] Sede cargada:', {
        sedeId: selectedSedeId,
        records: state.records.length,
        assignments: result.summary ? result.summary.assignments : state.records.length,
        source: useClientCache ? 'session-cache' : 'server'
      });
    } catch (error) {
      if (requestId !== state.siteRequestId) return;
      state.activeSedeId = '';
      state.records = [];
      state.catalogs = { sedes: state.authorizedSedes || [] };
      elements.sedeFilter.value = '';
      populateLocalFilter();
      populateCargoFilter();
      renderHierarchyFilters();
      clearDirectoryTable('No se pudo cargar la información de la sede.');
      notify('error', error.message || 'No se pudo cargar la información de la sede.');
    } finally {
      if (requestId === state.siteRequestId) state.siteLoading = false;
    }
  }


  async function refreshActiveSede() {
    const elements = getElements();
    const selectedSedeId = state.activeSedeId ||
      key(elements.sedeFilter && elements.sedeFilter.value);
    if (!selectedSedeId) return load(true);
    state.siteDataCache.delete(selectedSedeId);
    return loadSelectedSede(selectedSedeId, true);
  }


  async function load(force = false) {
    if (state.loading) return;

    if (state.loaded && !force) {
      setPageActions();
      return;
    }

    const elements = getElements();
    const previousSedeId = key(elements.sedeFilter && elements.sedeFilter.value);
    const hadLoadedSnapshot = state.loaded && Boolean(state.catalogs);

    state.loading = true;
    let finishLoading = null;

    try {
      if (window.SUNARPUI && typeof SUNARPUI.beginLoading === 'function') {
        finishLoading = SUNARPUI.beginLoading();
      }

      const startedAt = performance.now();
      const result = await callServer('getDirectoryInitialData');
      const serverElapsed = performance.now() - startedAt;

      if (!result || !result.catalogs || !Array.isArray(result.catalogs.sedes)) {
        throw new Error('El servidor devolvió una lista de sedes incompleta.');
      }

      state.authorizedSedes = result.catalogs.sedes;
      state.catalogs = { sedes: state.authorizedSedes };
      state.records = [];
      state.activeSedeId = '';
      state.hierarchyPath = [];
      state.siteDataCache.clear();

      if (elements.sedeFilter) elements.sedeFilter.value = '';
      if (elements.localFilter) elements.localFilter.value = '';
      if (elements.cargoFilter) elements.cargoFilter.value = '';

      clearDirectoryTable('Selecciona una sede para consultar la información de personal.');
      populateSedeFilter();
      populateLocalFilter();
      populateCargoFilter();
      renderHierarchyFilters();
      bindEvents();

      state.loaded = true;
      setPageActions();

      console.info('[DirectoryPage] Selector inicial de sedes:', {
        serverMs: Math.round(serverElapsed),
        authorizedSedes: state.authorizedSedes.length,
        assignmentRecordsLoaded: 0
      });

      if (force && previousSedeId &&
          state.authorizedSedes.some(item => key(item.id) === previousSedeId)) {
        elements.sedeFilter.value = previousSedeId;
        await loadSelectedSede(previousSedeId, true);
      }
    } catch (error) {
      state.loaded = hadLoadedSnapshot;
      console.error('Error al cargar el selector de Información de personal:', error);
      notify(
        hadLoadedSnapshot ? 'warning' : 'error',
        hadLoadedSnapshot
          ? 'No se pudo actualizar la lista de sedes. Se conserva la información cargada.'
          : (error.message || 'No se pudo cargar la lista de sedes.')
      );
      if (!hadLoadedSnapshot && elements.table) {
        elements.table.textContent = 'No se pudo cargar la lista de sedes autorizadas.';
      }
    } finally {
      state.loading = false;
      if (typeof finishLoading === 'function') finishLoading();
    }
  }


  /* =====================================================
     15. NAVEGACIÓN
     ===================================================== */

  document.addEventListener('sunarp:navigate', event => {

    const route = String(
      event.detail?.route || ''
    );

    if (route === 'informacion-personal') {
      load();
    } else {
      clearPageActions();
    }

  });


  return Object.freeze({
    load,
    refresh: refreshActiveSede
  });

})();
</script>
