      const result = await callServer('saveDirectoryEntry', payload);
      SUNARPUI.closeModal();
      notify('success', result.message || 'Servidor guardado correctamente.');
      if (state.activeSedeId) await refreshActiveSede();
    } catch (error) {
      notify('error', error.message || 'No se pudo guardar el servidor.');
      saveButton.disabled = false;
      saveButton.textContent = personaId ? 'Guardar cambios' : 'Registrar servidor';
    }
  }


  /* =====================================================
     11. DESACTIVAR Y REACTIVAR
     ===================================================== */

  
/**
 * Activa o desactiva un servidor desde su celda de estado.
 */
async function changeDirectoryStatus(record, active) {

  const result = await callServer(
    'setDirectoryAssignmentActive',
    record.asignacion_id || record.id,
    active
  );

  await refreshActiveSede();

  notify(
    'success',
    result.message ||
      `Asignación ${active ? 'activada' : 'desactivada'} correctamente.`
  );

}


/**
 * Elimina definitivamente un servidor.
 * Utiliza SweetAlert2 para solicitar confirmación.
 */
async function deleteDirectoryEntry(record) {

  if (!window.Swal) {
    throw new Error(
      'SweetAlert2 no está disponible. Verifica su carga en SUNARP UI.'
    );
  }

  const fullName = [
    record.nombres,
    record.apellidos
  ].filter(Boolean).join(' ');

  // Confirmación de eliminación.
  const confirmation = await Swal.fire({

    title: '¿Eliminar servidor?',

    text: 'Se eliminarán el registro, su ficha de datos personales y todas sus asignaciones únicamente si no existen acciones previas en la auditoría institucional.',

    icon: 'warning',

    showCancelButton: true,

    confirmButtonText: 'Sí, eliminar',

    cancelButtonText: 'Cancelar',

    reverseButtons: true,

    focusCancel: true,

    customClass: {
      popup: 'sunarp-swal-popup'
    }

  });

  if (!confirmation.isConfirmed) {
    return;
  }

  // Ejecutar eliminación en el servidor.
  const result = await callServer(
    'deleteDirectoryPerson',
    record.persona_id
  );

  // Recargar la información actualizada.
  await refreshActiveSede();

  notify(
    'success',
    result.message || 'Servidor eliminado correctamente.'
  );

}


  /* =====================================================
     12. ACCIÓN SUPERIOR: NUEVO SERVIDOR
     ===================================================== */

  function setPageActions() {

    if (
      !window.SUNARPUI ||
      typeof SUNARPUI.setPageActions !== 'function'
    ) {
      return;
    }

    SUNARPUI.setPageActions([

      {
        label: 'Nuevo servidor',
        icon: 'person_add',
        variant: 'primary',
        onClick: () => openDirectoryForm(null)
      }

    ]);

    state.pageActionsActive = true;

  }


  function clearPageActions() {

    if (
      state.pageActionsActive &&
      window.SUNARPUI &&
      typeof SUNARPUI.clearPageActions === 'function'
    ) {
      SUNARPUI.clearPageActions();
    }

    state.pageActionsActive = false;

  }


  /* =====================================================
     13. EVENTOS DE FILTROS
     ===================================================== */


  function bindEvents() {
    if (state.eventsBound) return;
    const elements = getElements();
    if (!elements.sedeFilter || !elements.localFilter || !elements.cargoFilter) return;
    elements.sedeFilter.addEventListener('change', () => {
      loadSelectedSede(key(elements.sedeFilter.value));
    });
    elements.localFilter.addEventListener('change', () => {
      refreshDependentFilters('local');
    });
    elements.cargoFilter.addEventListener('change', () => {
      refreshDependentFilters('cargo');
    });
    state.eventsBound = true;
  }

  function clearDirectoryTable(message) {
    const container = getElements().table;
    if (state.table) {
      state.table.destroy();
      state.table = null;
    }
    if (container) container.textContent = message || '';
  }


  function getSiteClientCacheData(sedeId) {
    const id = key(sedeId);
    const entry = state.siteDataCache.get(id);
    if (!entry) return null;
    if (!entry.data || Date.now() - entry.loadedAt >= DIRECTORY_SITE_CLIENT_CACHE_TTL_MS) {
      state.siteDataCache.delete(id);
      return null;
    }
    // LRU: actualizar la posición sin renovar loadedAt. La vigencia se mide
    // desde la respuesta del servidor y no se prolonga por cada visita.
    state.siteDataCache.delete(id);
    state.siteDataCache.set(id, entry);
    return entry.data;
  }


  function rememberSiteClientCacheData(sedeId, data) {
    const id = key(sedeId);
    if (!id || !data) return;
    state.siteDataCache.delete(id);
    state.siteDataCache.set(id, { data, loadedAt: Date.now() });
    while (state.siteDataCache.size > DIRECTORY_SITE_CLIENT_CACHE_MAX_ENTRIES) {
      const oldestId = state.siteDataCache.keys().next().value;
      state.siteDataCache.delete(oldestId);
    }
  }


  function startDirectoryContextWarmup() {
    if (state.contextWarmupPromise || !state.authorizedSedes.length) return;
    const startedAt = performance.now();
    state.contextWarmupPromise = callServer('warmDirectoryContextCache')
      .then(result => {
        console.info('[DirectoryPage] Contexto preparado:', {
          warmupClientMs: Math.round(performance.now() - startedAt),
          warmupServerMs: result ? result.serverMs : null,
          authorizationMs: result ? result.authorizationMs : null,
          contextMs: result ? result.contextMs : null,
          peopleRowsLoaded: result ? result.peopleRowsLoaded : null
        });
        return result;
      })
      .catch(error => {
        // El precalentamiento es oportunista. La carga de sede mantiene su
        // propia ruta autorizada y puede construir el contexto si falla.
        console.warn('[DirectoryPage] No se pudo precalentar el contexto:', error.message || error);
        return null;
      });
  }


  async function loadSelectedSede(sedeId, force = false) {
    const selectedSedeId = key(sedeId);
    const elements = getElements();
    const requestId = ++state.siteRequestId;

    if (!selectedSedeId) {
      state.siteLoading = false;
      state.activeSedeId = '';
      state.records = [];
      state.hierarchyPath = [];
      state.hierarchyIndex = null;
      state.hierarchySelectableIds = new Set();
      state.catalogs = { sedes: state.authorizedSedes || [] };
      if (elements.localFilter) {
        elements.localFilter.value = '';
        elements.localFilter.disabled = true;
      }
      if (elements.cargoFilter) elements.cargoFilter.value = '';
      populateLocalFilter();
      populateCargoFilter();
      renderHierarchyFilters();
      clearDirectoryTable('Selecciona una sede y un local para consultar la información de personal.');
      return;
    }

    const isAuthorizedSede = (state.authorizedSedes || []).some(item =>
      key(item.id) === selectedSedeId
    );
    if (!isAuthorizedSede) {
      elements.sedeFilter.value = '';
      notify('warning', 'La sede seleccionada no está dentro de tus ámbitos autorizados.');
      return;
    }

    state.siteLoading = true;
    state.activeSedeId = '';
    state.records = [];
    state.hierarchyPath = [];
    state.hierarchyIndex = null;
    state.hierarchySelectableIds = new Set();
    state.catalogs = { sedes: state.authorizedSedes || [] };
    if (elements.localFilter) {
      elements.localFilter.value = '';
      elements.localFilter.disabled = true;
    }
    if (elements.cargoFilter) elements.cargoFilter.value = '';
    populateLocalFilter();
    populateCargoFilter();
    renderHierarchyFilters();
    clearDirectoryTable('Cargando información de la sede seleccionada...');

    try {
      const cachedData = force ? null : getSiteClientCacheData(selectedSedeId);
      const useClientCache = Boolean(cachedData);
      let result = useClientCache ? cachedData : null;
      let roundTripMs = 0;
      let contextWarmupWaitMs = 0;
      if (!result) {
        if (state.contextWarmupPromise) {
          const warmupWaitStartedAt = performance.now();
          await state.contextWarmupPromise;
          contextWarmupWaitMs = performance.now() - warmupWaitStartedAt;
        }
        if (requestId !== state.siteRequestId) return;
        const requestStartedAt = performance.now();
        result = await callServer('getDirectorySiteData', selectedSedeId);
        roundTripMs = performance.now() - requestStartedAt;
      }
      if (requestId !== state.siteRequestId) return;
      if (!result || !result.catalogs || !Array.isArray(result.records)) {
        throw new Error('El servidor devolvió una carga incompleta para la sede seleccionada.');
      }

      const clientProcessingStartedAt = performance.now();
      if (!useClientCache) rememberSiteClientCacheData(selectedSedeId, result);
      state.records = result.records;
      state.catalogs = result.catalogs;
      state.activeSedeId = selectedSedeId;

      const indexStartedAt = performance.now();
      state.hierarchyIndex = _directoryBuildHierarchyClientIndex_(
        state.records,
        state.catalogs.estructuraOrg || []
      );
      state.hierarchySelectableIds = _directoryBuildHierarchyFilterSets_(
        state.records,
        state.catalogs.estructuraOrg || [],
        state.catalogs.filterContract,
        selectedSedeId
      );
      const clientIndexMs = performance.now() - indexStartedAt;

      const filtersStartedAt = performance.now();
      populateLocalFilter();
      populateCargoFilter();
      renderHierarchyFilters();
      const filterSetupMs = performance.now() - filtersStartedAt;
      renderTable();
      const clientProcessingMs = performance.now() - clientProcessingStartedAt;
      const diagnostics = result.diagnostics || {};
      const serverMs = Number.isFinite(Number(diagnostics.serverMs))
        ? Number(diagnostics.serverMs)
        : null;

      console.info('[DirectoryPage] Sede cargada:', {
        sedeId: selectedSedeId,
        records: state.records.length,
        assignments: result.summary ? result.summary.assignments : state.records.length,
        source: useClientCache ? 'session-cache' : 'server',
        serverMs,
        roundTripMs: Math.round(roundTripMs),
        contextWarmupWaitMs: Math.round(contextWarmupWaitMs),
        roundTripResidualMs: serverMs === null || useClientCache
          ? null
          : Math.round(Math.max(0, roundTripMs - serverMs)),
        serverStages: diagnostics.stages || null,
        clientIndexMs: Math.round(clientIndexMs),
        filterSetupMs: Math.round(filterSetupMs),
        clientProcessingMs: Math.round(clientProcessingMs)
      });
    } catch (error) {
      if (requestId !== state.siteRequestId) return;
      state.activeSedeId = '';
      state.records = [];
      state.hierarchyIndex = null;
      state.hierarchySelectableIds = new Set();
      state.catalogs = { sedes: state.authorizedSedes || [] };
      elements.sedeFilter.value = '';
      if (elements.localFilter) {
        elements.localFilter.value = '';
        elements.localFilter.disabled = true;
      }
      populateLocalFilter();
      populateCargoFilter();
      renderHierarchyFilters();
      clearDirectoryTable('No se pudo cargar la información de la sede.');
      notify('error', error.message || 'No se pudo cargar la información de la sede.');
    } finally {
      if (requestId === state.siteRequestId) state.siteLoading = false;
    }
  }

  async function refreshActiveSede() {
    if (state.activeSedeId === '__ALL__') return load(true);
    const elements = getElements();
    const selectedSedeId = state.activeSedeId ||
      key(elements.sedeFilter && elements.sedeFilter.value);
    if (!selectedSedeId) return load(true);
    state.siteDataCache.delete(selectedSedeId);
    return loadSelectedSede(selectedSedeId, true);
  }

  async function load(force = false) {
    if (state.loading) return;
    if (state.loaded && !force) {
      setPageActions();
      return;
    }
    const elements = getElements();
    const previousSedeId = key(elements.sedeFilter && elements.sedeFilter.value);
    const hadLoadedSnapshot = state.loaded && Boolean(state.catalogs);
    state.loading = true;
    let finishLoading = null;
    let autoLoadedSoleSede = false;
    try {
      if (window.SUNARPUI && typeof SUNARPUI.beginLoading === 'function') {
        finishLoading = SUNARPUI.beginLoading();
      }
      const requestStartedAt = performance.now();
      const result = await callServer('getDirectoryInitialData');
      const roundTripMs = performance.now() - requestStartedAt;
      if (!result || !result.catalogs || !Array.isArray(result.catalogs.sedes)) {
        throw new Error('El servidor devolvió una lista de sedes incompleta.');
      }
      const clientSetupStartedAt = performance.now();
      state.authorizedSedes = result.catalogs.sedes;
      state.hasTotalScope = Boolean(result.scopeSummary && result.scopeSummary.total === true);
      state.catalogs = { sedes: state.authorizedSedes };
      state.records = [];
      state.hierarchyIndex = null;
      state.hierarchySelectableIds = new Set();
      state.activeSedeId = '';
      state.hierarchyPath = [];
      state.siteDataCache.clear();
      if (elements.sedeFilter) elements.sedeFilter.value = '';
      if (elements.localFilter) {
        elements.localFilter.value = '';
        elements.localFilter.disabled = true;
      }
      if (elements.cargoFilter) elements.cargoFilter.value = '';
      clearDirectoryTable(state.hasTotalScope
        ? 'Selecciona una sede para consultar la información de personal.'
        : 'Cargando únicamente la información de tus ámbitos autorizados...');
      populateSedeFilter();
      populateLocalFilter();
      populateCargoFilter();
      renderHierarchyFilters();
      bindEvents();
      state.loaded = true;
      setPageActions();
      const clientSetupMs = performance.now() - clientSetupStartedAt;
      const diagnostics = result.diagnostics || {};
      const serverMs = Number.isFinite(Number(diagnostics.serverMs))
        ? Number(diagnostics.serverMs)
        : null;

      // TOTAL siempre requiere una elección explícita, incluso cuando solo
      // existe una sede autorizada. Los ámbitos fijos se aplican directamente.
      if (!state.hasTotalScope && state.authorizedSedes.length === 1) {
        const soleSedeId = key(state.authorizedSedes[0].id);
        if (soleSedeId) {
          if (elements.sedeFilter) elements.sedeFilter.value = soleSedeId;
          autoLoadedSoleSede = true;
          console.info('[DirectoryPage] Carga automática de única sede autorizada:', {
            sedeId: soleSedeId
          });
          await loadSelectedSede(soleSedeId);
        }
      } else if (!state.hasTotalScope && state.authorizedSedes.length > 1) {
        startDirectoryContextWarmup();
      }

      console.info('[DirectoryPage] Selector inicial de sedes:', {
        serverMs,
        roundTripMs: Math.round(roundTripMs),
        roundTripResidualMs: serverMs === null
          ? null
          : Math.round(Math.max(0, roundTripMs - serverMs)),
        serverStages: diagnostics.stages || null,
        clientSetupMs: Math.round(clientSetupMs),
        authorizedSedes: state.authorizedSedes.length,
        totalScopeRequiresSelection: state.hasTotalScope,
        autoLoadedSoleSede,
        assignmentRecordsLoaded: autoLoadedSoleSede ? state.records.length : 0
      });

      if (force && !autoLoadedSoleSede && previousSedeId &&
          state.authorizedSedes.some(item => key(item.id) === previousSedeId)) {
        elements.sedeFilter.value = previousSedeId;
        await loadSelectedSede(previousSedeId, true);
      }
    } catch (error) {
      state.loaded = hadLoadedSnapshot;
      console.error('Error al cargar el selector de Información de personal:', error);
      notify(
        hadLoadedSnapshot ? 'warning' : 'error',
        hadLoadedSnapshot
          ? 'No se pudo actualizar la lista de sedes. Se conserva la información cargada.'
          : (error.message || 'No se pudo cargar la lista de sedes.')
      );
      if (!hadLoadedSnapshot && elements.table) {
        elements.table.textContent = 'No se pudo cargar la lista de sedes autorizadas.';
      }
    } finally {
      state.loading = false;
      if (typeof finishLoading === 'function') finishLoading();
    }
  }

  /* =====================================================
     15. NAVEGACIÓN
     ===================================================== */

  document.addEventListener('sunarp:navigate', event => {

    const route = String(
      event.detail?.route || ''
    );

    if (route === 'informacion-personal') {
      load();
    } else {
      clearPageActions();
    }

  });


  return Object.freeze({
    load,
    refresh: refreshActiveSede
  });

})();
</script>
