  async function openDirectoryForm(record) {

    const isEditing = Boolean(record);
    let previousCatalogs = state.catalogs;
    let formRecord = record;
    try {
      const formDataResponse = await callServer('getDirectoryFormData', isEditing ? 'INFORMACION_PERSONAL_EDITAR' : 'INFORMACION_PERSONAL_CREAR');
      if (!formDataResponse || !formDataResponse.catalogs) {
        throw new Error('No se pudieron cargar los catálogos del formulario.');
      }
      state.catalogs = Object.assign({}, previousCatalogs || {}, formDataResponse.catalogs);
      state.formScopes = formDataResponse.scopes || [];
    } catch (error) {
      notify('error', error.message || 'No se pudieron cargar los datos del formulario.');
      return;
    }

    if (isEditing) {
      try {
        const detail = await callServer('getDirectoryPersonById', record.persona_id);
        if (!detail) throw new Error('No se encontró la ficha de la persona.');
        const assignment = (detail.assignments || []).find(item =>
          key(item.asignacion_id) === key(record.asignacion_id || record.id)
        );
        if (!assignment) throw new Error('No se encontró la asignación que deseas editar dentro de tu ámbito.');
        const allAssignments = (detail.assignments || []).slice();
        const orderedAssignments = [assignment].concat(allAssignments.filter(item =>
          key(item.asignacion_id) !== key(assignment.asignacion_id)
        ));
        formRecord = Object.assign({}, detail, assignment, {
          id: assignment.asignacion_id,
          assignments: orderedAssignments
        }, detail.personalData || {});
      } catch (error) {
        notify('error', error.message || 'No se pudo recuperar la ficha de la persona.');
        return;
      }
    }

    const formData = buildDirectoryForm(formRecord);

    // Convertir la cadena HTML del formulario en un fragmento DOM.
    const template = document.createElement('template');

    template.innerHTML = formData.html.trim();

    // SUNARP UI recibe un elemento DOM mediante la propiedad content.
    SUNARPUI.openModal({
      title: isEditing ? 'Editar servidor' : 'Registrar servidor',

      content: template.content,
      size: 'xl'
    });

    // Inicializar las asignaciones dentro del mismo formulario.
    const form = document.getElementById('directoryForm');
    const assignmentsContainer = document.getElementById('directoryAssignmentsContainer');
    const firstAssignmentRow = document.getElementById('directoryAssignmentRow');
    const cancelButton = document.getElementById('directoryFormCancel');
    function createDirectoryFormSection(title, description, number) {
      const section = document.createElement('section');
      section.className = 'directory-form-section';
      const heading = document.createElement('div');
      heading.className = 'directory-form-section-heading';
      const titleElement = document.createElement('h3');
      titleElement.textContent = number + '. ' + title;
      const descriptionElement = document.createElement('p');
      descriptionElement.textContent = description;
      heading.append(titleElement, descriptionElement);
      section.appendChild(heading);
      return section;
    }

    function arrangeDirectoryForm(formElement, editing) {
      formElement.classList.add('directory-form');

      const personaId = document.getElementById('directoryFormPersonaId');
      const actions = formElement.querySelector('.directory-form-actions') ||
        document.querySelector('#directoryFormCancel')?.parentElement?.parentElement;
      const panel = document.getElementById('directoryDocumentSearchPanel');
      const searchButton = document.getElementById('directoryDocumentSearch');
      const resultHost = document.getElementById('directoryDocumentSearchResult');
      const verifiedField = document.getElementById('directoryDocumentVerified');

      let validationSection = null;
      if (!editing && panel) {
        const typeField = document.getElementById('directoryFormTipoDocumento')?.closest('.sunarp-form-field');
        const numberField = document.getElementById('directoryFormNumeroDocumento')?.closest('.sunarp-form-field');
        const grid = document.createElement('div');
        grid.className = 'directory-form-grid';
        if (typeField) grid.appendChild(typeField);
        if (numberField) grid.appendChild(numberField);

        const clearButton = document.createElement('button');
        clearButton.type = 'button';
        clearButton.id = 'directoryDocumentClear';
        clearButton.className = 'sunarp-btn sunarp-btn-outline';
        clearButton.textContent = 'Limpiar';

        const buttonRow = document.createElement('div');
        buttonRow.className = 'directory-form-inline-actions';
        if (searchButton) {
          searchButton.textContent = 'Buscar persona';
          searchButton.className = 'sunarp-btn sunarp-btn-primary';
          buttonRow.append(searchButton, clearButton);
        }

        panel.replaceChildren();
        validationSection = createDirectoryFormSection(
          'Validar identidad',
          'Comprueba el tipo y número de documento antes de registrar a una persona.',
          1
        );
        validationSection.classList.add('directory-form-validation');
        validationSection.append(grid, buttonRow);
        if (resultHost) validationSection.appendChild(resultHost);
        if (verifiedField) validationSection.appendChild(verifiedField);
        panel.replaceWith(validationSection);
      }

      const personalSection = createDirectoryFormSection(
        'Datos personales',
        'Información de identificación y datos personales del servidor.',
        editing ? 1 : 2
      );
      const personalFieldset = document.createElement('fieldset');
      personalFieldset.id = 'directoryPersonalFields';
      personalFieldset.className = 'directory-form-fieldset';
      personalFieldset.disabled = !editing;
      const personalGrid = document.createElement('div');
      personalGrid.className = 'directory-form-grid';

      const personalIds = editing
        ? ['directoryFormTipoDocumento', 'directoryFormNumeroDocumento',
           'directoryFormNombres', 'directoryFormApellidos',
           'directoryFormCorreoInstitucional', 'directoryFormFechaNacimiento',
           'directoryFormFechaInicio', 'directoryFormFechaCese']
        : ['directoryFormNombres', 'directoryFormApellidos',
           'directoryFormCorreoInstitucional', 'directoryFormFechaNacimiento',
           'directoryFormFechaInicio', 'directoryFormFechaCese'];

      personalIds.forEach(id => {
        const control = document.getElementById(id);
        const field = control && control.closest('.sunarp-form-field');
        if (field) {
          if (id === 'directoryFormCorreoInstitucional' ||
              id === 'directoryFormFechaNacimiento' ||
              id === 'directoryFormFechaInicio' ||
              id === 'directoryFormFechaCese') {
            field.classList.add('directory-form-field-full');
          }
          personalGrid.appendChild(field);
        }
      });
      personalFieldset.appendChild(personalGrid);
      personalSection.appendChild(personalFieldset);

      const assignmentSection = createDirectoryFormSection(
        'Asignaciones',
        'Registra los cargos y la ubicación institucional correspondiente a cada asignación.',
        editing ? 2 : 3
      );
      assignmentSection.classList.add('directory-form-assignments');
      const assignmentFieldset = document.createElement('fieldset');
      assignmentFieldset.id = 'directoryAssignmentsFieldset';
      assignmentFieldset.className = 'directory-form-fieldset';
      assignmentFieldset.disabled = !editing;

      const addButton = document.getElementById('directoryAddAssignment');
      const assignmentContainer = document.getElementById('directoryAssignmentsContainer');
      if (addButton) {
        addButton.textContent = 'Agregar asignación';
        addButton.className = 'sunarp-btn sunarp-btn-outline directory-add-assignment';
        assignmentFieldset.appendChild(addButton);
      }

      function arrangeAssignmentRow(row, index) {
        row.classList.add('directory-assignment-row');
        const hiddenId = row.querySelector('[id^="directoryFormAssignmentId"]');

        const title = document.createElement('div');
        title.className = 'directory-assignment-heading';
        const titleText = document.createElement('strong');
        titleText.className = 'directory-assignment-title';
        titleText.textContent = 'Asignación ' + (index + 1);
        title.appendChild(titleText);

        const details = document.createElement('div');
        details.className = 'directory-form-grid';
        const location = document.createElement('div');
        location.className = 'directory-assignment-location';
        const locationTitle = document.createElement('h4');
        locationTitle.textContent = 'Ubicación institucional';
        const locationGrid = document.createElement('div');
        locationGrid.className = 'directory-form-grid';
        const actionsRow = document.createElement('div');
        actionsRow.className = 'directory-assignment-row-actions';

        const fieldFor = id => {
          const control = row.querySelector('[id^="' + id + '"]');
          return control ? control.closest('.sunarp-form-field') : null;
        };

        ['directoryFormCargo', 'directoryFormCondicionCargo',
         'directoryFormAnexo', 'directoryFormObservaciones'].forEach(id => {
          const field = fieldFor(id);
          if (field) {
            if (id === 'directoryFormObservaciones') field.classList.add('directory-form-field-full');
            details.appendChild(field);
          }
        });

        const siteField = fieldFor('directoryFormSede');
        const localField = fieldFor('directoryFormDirectLocal');
        const hierarchyField = row.querySelector('[id^="directoryFormHierarchyField"]');
        const relationField = fieldFor('directoryFormLocal');

        if (siteField) {
          siteField.id = 'directoryFormSiteField';
          locationGrid.appendChild(siteField);
        }
        if (localField) {
          const label = localField.querySelector('label');
          if (label) label.textContent = 'Local';
          locationGrid.appendChild(localField);
        }

        location.append(locationTitle, locationGrid);
        if (hierarchyField) {
          hierarchyField.classList.add('directory-form-hierarchy');
          location.appendChild(hierarchyField);
        }
        if (relationField) {
          const label = relationField.querySelector('label');
          if (label) label.textContent = 'Ubicación dentro del local';
          relationField.classList.add('directory-form-field-full');
          location.appendChild(relationField);
        }

        row.replaceChildren();
        if (hiddenId) row.appendChild(hiddenId);
        row.append(title, details, location, actionsRow);
      }

      if (assignmentContainer) {
        Array.from(assignmentContainer.querySelectorAll('.directory-assignment-row'))
          .forEach((row, index) => arrangeAssignmentRow(row, index));
        assignmentFieldset.appendChild(assignmentContainer);
      }
      assignmentSection.appendChild(assignmentFieldset);

      formElement.replaceChildren();
      if (personaId) formElement.appendChild(personaId);
      if (validationSection) formElement.appendChild(validationSection);
      formElement.append(personalSection, assignmentSection);
      if (actions) formElement.appendChild(actions);
    }
    const scopes = state.formScopes || [];
    const siteScopes = scopes.filter(scope => scope.type === 'SEDE' && scope.referenceId);
    const structureScopes = scopes.filter(scope => scope.type === 'ESTRUCTURA_ORG' && scope.referenceId);
    const localScopes = scopes.filter(scope => scope.type === 'LOCAL' && scope.referenceId);
    const totalScope = scopes.some(scope => scope.type === 'TOTAL');
    const allowedSiteIds = new Set(siteScopes.map(scope => key(scope.referenceId)));
    structureScopes.forEach(scope => {
      const node = (state.catalogs.estructuraOrg || []).find(item => key(item.id) === key(scope.referenceId));
      if (node && node.sede_id) allowedSiteIds.add(key(node.sede_id));
    });
    localScopes.forEach(scope => {
      const node = (state.catalogs.locales || []).find(item => key(item.id) === key(scope.referenceId));
      if (node && node.sede_id) allowedSiteIds.add(key(node.sede_id));
    });
    const canChooseSite = totalScope || allowedSiteIds.size > 1;

    function getRowElement(id, suffix) {
      return document.getElementById(id + suffix);
    }

    function refreshDirectLocalOptions(sedeId, selectedId, suffix) {
      const select = getRowElement('directoryFormDirectLocal', suffix);
      if (!select) return;
      const current = selectedId !== undefined ? key(selectedId) : key(select.value);
      select.replaceChildren();
      const placeholder = document.createElement('option');
      placeholder.value = '';
      placeholder.textContent = 'Selecciona un local';
      select.appendChild(placeholder);

      const plan = _directoryGetAccessFilterPlan_({ scopes }, sedeId);
      const permittedLocalIds = new Set(plan.localScopeIds || []);
      let locals = [];
      if (plan.localMode === 'selectable') {
        locals = key(sedeId)
          ? (state.catalogs.locales || []).filter(local => key(local.sede_id) === key(sedeId))
          : [];
      } else if (plan.localMode === 'selectable-scoped' || plan.localMode === 'fixed') {
        locals = (state.catalogs.locales || []).filter(local =>
          permittedLocalIds.has(key(local.id)) &&
          (!key(sedeId) || key(local.sede_id) === key(sedeId))
        );
      }

      locals.filter(isActive).slice().sort(sortByName).forEach(local => {
        const option = document.createElement('option');
        option.value = key(local.id);
        option.textContent = local.name;
        select.appendChild(option);
      });

      const fixedLocalId = plan.localMode === 'fixed' ? key(plan.localScopeIds[0]) : '';
      const desired = current || fixedLocalId;
      select.value = Array.from(select.options).some(option => option.value === desired)
        ? desired : '';
    }

    function syncAssignmentMode(suffix) {
      const siteSelect = getRowElement('directoryFormSede', suffix);
      const localSelect = getRowElement('directoryFormDirectLocal', suffix);
      const sedeId = siteSelect ? key(siteSelect.value) : key(formData.selectedSede);
      const plan = _directoryGetAccessFilterPlan_({ scopes }, sedeId);
      const localSelectable = plan.localMode === 'selectable' || plan.localMode === 'selectable-scoped';
      const fixedLocalId = plan.localMode === 'fixed' ? key(plan.localScopeIds[0]) : '';

      const siteField = getRowElement('directoryFormSiteField', suffix);
      const localField = getRowElement('directoryFormDirectLocalField', suffix);
      const hierarchyField = getRowElement('directoryFormHierarchyField', suffix);
      const relationField = getRowElement('directoryFormRelationField', suffix);

      if (siteField) siteField.hidden = !canChooseSite;
      if (siteSelect) siteSelect.required = canChooseSite;
      if (localField) {
        localField.hidden = !localSelectable;
        localField.style.display = localSelectable ? '' : 'none';
      }
      if (localSelect) {
        localSelect.required = localSelectable;
        if (fixedLocalId) localSelect.value = fixedLocalId;
      }
      if (hierarchyField) hierarchyField.hidden = plan.hierarchyMode === 'none';
      if (relationField && !relationField.querySelector('select')?.options.length) {
        relationField.hidden = true;
      }
    }

    function initializeAssignmentRow(row, index, assignment) {
      const suffix = index ? '_' + index : '';
      row.dataset.index = String(index);
      row.id = index ? 'directoryAssignmentRow_' + index : 'directoryAssignmentRow';

      const get = prefix => row.querySelector('[id^="' + prefix + '"]');
      const assignmentId = get('directoryFormAssignmentId');
      const cargo = get('directoryFormCargo');
      const condition = get('directoryFormCondicionCargo');
      const annex = get('directoryFormAnexo');
      const observations = get('directoryFormObservaciones');
      const siteSelect = get('directoryFormSede');
      const localSelect = get('directoryFormDirectLocal');
      const relationSelect = get('directoryFormLocal');

      const relation = assignment
        ? (state.catalogs.estructuraLocal || []).find(item =>
            key(item.id) === key(assignment.estructura_local_id))
        : null;
      const structure = assignment && assignment.estructura_id
        ? (state.catalogs.estructuraOrg || []).find(item =>
            key(item.id) === key(assignment.estructura_id))
        : null;
      const localId = assignment
        ? key(assignment.local_id || (relation && relation.local_id))
        : key(formData.selectedLocalId);
      const local = localId
        ? (state.catalogs.locales || []).find(item => key(item.id) === localId)
        : null;
      const selectedSite = assignment
        ? key(assignment.sede_id || (structure && structure.sede_id) || (local && local.sede_id))
        : key(formData.selectedSede);

      if (assignmentId) assignmentId.value = assignment ? key(assignment.asignacion_id) : '';
      if (cargo) cargo.value = assignment ? key(assignment.cargo_id) : '';
      if (condition) condition.value = assignment ? (assignment.condicion_cargo || '') : '';
      if (annex) annex.value = assignment && assignment.anexo !== undefined ? assignment.anexo : '';
      if (observations) observations.value = assignment ? (assignment.observaciones || '') : '';
      if (siteSelect) siteSelect.value = selectedSite;

      refreshDirectLocalOptions(selectedSite, localId, suffix);
      syncAssignmentMode(suffix);

      let selectedPath = assignment && assignment.estructura_id
        ? getFormStructurePath(assignment.estructura_id)
        : (structureScopes.length === 1 ? [key(structureScopes[0].referenceId)] : []);

      renderFormHierarchy(
        selectedSite,
        selectedPath,
        assignment ? key(assignment.estructura_local_id) : '',
        suffix,
        localId
      );

      if (siteSelect) {
        siteSelect.addEventListener('change', () => {
          refreshDirectLocalOptions(siteSelect.value, '', suffix);
          syncAssignmentMode(suffix);
          selectedPath = [];
          renderFormHierarchy(
            siteSelect.value,
            selectedPath,
            '',
            suffix,
            localSelect ? localSelect.value : ''
          );
        });
      }

      if (localSelect) {
        localSelect.addEventListener('change', () => {
          selectedPath = [];
          renderFormHierarchy(
            siteSelect ? siteSelect.value : selectedSite,
            selectedPath,
            '',
            suffix,
            localSelect.value
          );
        });
      }

      if (relationSelect) {
        relationSelect.addEventListener('change', () => {
          const relationChoice = (state.catalogs.estructuraLocal || []).find(item =>
            key(item.id) === key(relationSelect.value)
          );
          if (relationChoice && localSelect &&
              !getRowElement('directoryFormDirectLocalField', suffix)?.hidden) {
            localSelect.value = key(relationChoice.local_id);
          }
        });
      }
    }

    if (!form || !assignmentsContainer || !firstAssignmentRow || !cancelButton) {
      SUNARPUI.closeModal();
      notify('error', 'No se pudo inicializar el formulario del directorio.');
      return;
    }

    arrangeDirectoryForm(form, isEditing);

    let assignmentsForForm = isEditing && Array.isArray(formRecord.assignments)
      ? formRecord.assignments.slice()
      : [null];
    if (!assignmentsForForm.length) assignmentsForForm = [null];
    assignmentsForForm.forEach((assignment, index) => {
      let row = firstAssignmentRow;
      if (index > 0) {
        row = firstAssignmentRow.cloneNode(true);
        row.querySelectorAll('[id]').forEach(element => {
          element.id = element.id + '_' + index;
        });
        row.querySelectorAll('[for]').forEach(element => {
          element.htmlFor = element.htmlFor + '_' + index;
        });
        row.querySelectorAll('[data-row-remove]').forEach(element => element.remove());
        assignmentsContainer.appendChild(row);
      }
      initializeAssignmentRow(row, index, assignment);
    });

    let nextAssignmentIndex = assignmentsForForm.length;
    const addAssignmentButton = document.getElementById('directoryAddAssignment');
    if (addAssignmentButton) addAssignmentButton.addEventListener('click', () => {
      const index = nextAssignmentIndex++;
      const row = firstAssignmentRow.cloneNode(true);
      row.querySelectorAll('[id]').forEach(element => {
        element.id = element.id + '_' + index;
      });
      row.querySelectorAll('[for]').forEach(element => {
        element.htmlFor = element.htmlFor + '_' + index;
      });
      const remove = document.createElement('button');
      remove.type = 'button';
      remove.className = 'sunarp-btn sunarp-btn-outline';
      remove.textContent = 'Quitar asignación';
      remove.addEventListener('click', () => row.remove());
      const actions = row.querySelector('.directory-assignment-row-actions');
      if (actions) actions.appendChild(remove);
      assignmentsContainer.appendChild(row);
      initializeAssignmentRow(row, index, null);
    });

    // Cerrar el formulario.
    cancelButton.addEventListener('click', () => {
      state.catalogs = previousCatalogs;
      SUNARPUI.closeModal();
    });

    // El alta exige consultar el DNI antes de habilitar el guardado.
    const documentSearchButton = document.getElementById('directoryDocumentSearch');
    const documentClearButton = document.getElementById('directoryDocumentClear');
    const documentVerified = document.getElementById('directoryDocumentVerified');
    const documentSearchResult = document.getElementById('directoryDocumentSearchResult');
    const documentTypeInput = document.getElementById('directoryFormTipoDocumento');
    const documentNumberInput = document.getElementById('directoryFormNumeroDocumento');
    const personalFields = document.getElementById('directoryPersonalFields');
    const assignmentsFieldset = document.getElementById('directoryAssignmentsFieldset');
    const saveButton = document.getElementById('directoryFormSave');

    const setDocumentAlert = (type, title, message, details) => {
      if (!documentSearchResult) return;
      SUNARPUI.showAlert({
        containerId: 'directoryDocumentSearchResult',
        type,
        title,
        message,
        details,
        dismissible: false,
        replace: true
      });
    };

    const setDocumentVerified = verified => {
      if (documentVerified) documentVerified.value = verified ? 'true' : 'false';
      if (saveButton && !isEditing) saveButton.disabled = !verified;
      if (personalFields && !isEditing) personalFields.disabled = !verified;
      if (assignmentsFieldset && !isEditing) assignmentsFieldset.disabled = !verified;
    };

    if (!isEditing) {
      setDocumentVerified(false);
      const invalidateDocumentSearch = () => {
        setDocumentVerified(false);
        if (documentSearchResult) documentSearchResult.replaceChildren();
      };

      documentTypeInput.addEventListener('change', invalidateDocumentSearch);
      documentNumberInput.addEventListener('input', invalidateDocumentSearch);

      documentClearButton.addEventListener('click', () => {
        documentTypeInput.value = '';
        documentNumberInput.value = '';
        invalidateDocumentSearch();
        documentTypeInput.focus();
      });

      documentSearchButton.addEventListener('click', async () => {
        if (!documentTypeInput.value) {
          documentTypeInput.reportValidity();
          return;
        }
        if (!documentNumberInput.value.trim()) {
          documentNumberInput.reportValidity();
          return;
        }

        invalidateDocumentSearch();
        documentSearchButton.disabled = true;
        documentClearButton.disabled = true;
        documentSearchButton.textContent = 'Buscando...';
        documentTypeInput.disabled = true;
        documentNumberInput.disabled = true;

        try {
          const result = await callServer('searchDirectoryPersonByDocument', {
            tipo_documento: documentTypeInput.value,
            numero_documento: documentNumberInput.value.trim()
          });

          if (result && result.found === true) {
            setDocumentVerified(false);
            const fullName = [
              result.person && result.person.nombres,
              result.person && result.person.apellidos
            ].filter(Boolean).join(' ');
            setDocumentAlert(
              'warning',
              'Documento ya registrado',
              'Esta persona ya existe en Información de personal. No se creará un registro duplicado.',
              fullName ? [fullName] : []
            );
          } else {
            setDocumentVerified(true);
            setDocumentAlert(
              'success',
              'Documento disponible',
              'No se encontró una persona con ese tipo y número de documento. Puedes continuar con el registro.'
            );
          }
        } catch (error) {
          setDocumentVerified(false);
          setDocumentAlert(
            'error',
            'No se pudo comprobar el documento',
            error.message || 'Ocurrió un error al consultar el directorio institucional.'
          );
        } finally {
          documentTypeInput.disabled = false;
          documentNumberInput.disabled = false;
          documentSearchButton.disabled = false;
          documentClearButton.disabled = false;
          documentSearchButton.textContent = 'Buscar persona';
        }
      });
    }

    // Guardar el registro.
    form.addEventListener('submit', saveForm);

  }



  /* =====================================================
     10. GUARDAR REGISTRO
     ===================================================== */

  async function saveForm(event) {
    event.preventDefault();
    const form = event.currentTarget;
    if (!form.reportValidity()) return;

    const personaId = document.getElementById('directoryFormPersonaId').value;
    const nombres = document.getElementById('directoryFormNombres').value.trim();
    const apellidos = document.getElementById('directoryFormApellidos').value.trim();
    const documentType = document.getElementById('directoryFormTipoDocumento')?.value || '';
    const documentNumber = document.getElementById('directoryFormNumeroDocumento')?.value.trim() || '';
    if (!personaId && document.getElementById('directoryDocumentVerified')?.value !== 'true') {
      notify('warning', 'Primero debes comprobar que el documento no esté registrado.');
      return;
    }

    const assignmentRows = Array.from(document.querySelectorAll('#directoryAssignmentsContainer .directory-assignment-row'));
    const assignments = [];
    for (const row of assignmentRows) {
      const get = prefix => row.querySelector('[id^="' + prefix + '"]');
      const relationSelect = get('directoryFormLocal');
      const directLocalSelect = get('directoryFormDirectLocal');
      const structureLocalId = relationSelect ? relationSelect.value : '';
      const localId = directLocalSelect ? directLocalSelect.value : '';
      if (!structureLocalId && !localId) {
        notify('warning', 'Cada asignación debe tener una unidad orgánica o un local.');
        return;
      }
      if (structureLocalId && localId) {
        const relation = state.catalogs.estructuraLocal.find(item => key(item.id) === key(structureLocalId));
        if (!relation || key(relation.local_id) !== key(localId)) {
          notify('warning', 'El local debe coincidir con la relación estructura-local de cada asignación.');
          return;
        }
      }
      assignments.push({
        asignacion_id: get('directoryFormAssignmentId')?.value || '',
        cargo_id: get('directoryFormCargo')?.value || '',
        condicion_cargo: get('directoryFormCondicionCargo')?.value.trim() || '',
        anexo: get('directoryFormAnexo')?.value === '' ? '' : Number(get('directoryFormAnexo')?.value),
        observaciones: get('directoryFormObservaciones')?.value.trim() || '',
        estructura_local_id: structureLocalId,
        local_id: localId
      });
    }
    if (!assignments.length) {
      notify('warning', 'Registra al menos una asignación.');
      return;
    }

    const payload = {
      persona_id: personaId,
      nombres,
      apellidos,
      correo_institucional: document.getElementById('directoryFormCorreoInstitucional')?.value.trim().toLowerCase() || '',
      tipo_documento: documentType,
      numero_documento: documentNumber,
      fecha_nacimiento: document.getElementById('directoryFormFechaNacimiento')?.value || '',
      fecha_inicio_servicios: document.getElementById('directoryFormFechaInicio')?.value || '',
      fecha_cese: document.getElementById('directoryFormFechaCese')?.value || '',
      assignments
    };

    const saveButton = document.getElementById('directoryFormSave');
    saveButton.disabled = true;
    saveButton.textContent = 'Guardando...';
    try {
      const result = await callServer('saveDirectoryEntry', payload);
      SUNARPUI.closeModal();
      notify('success', result.message || 'Servidor y asignaciones guardados correctamente.');
      await refreshActiveSede();
    } catch (error) {
      notify('error', error.message || 'No se pudo guardar el registro.');
      saveButton.disabled = false;
      saveButton.textContent = personaId ? 'Guardar cambios' : 'Registrar servidor';
    }
  }

/**
 * Activa o desactiva un servidor desde su celda de estado.
 */
async function changeDirectoryStatus(record, active) {

  const result = await callServer(
    'setDirectoryAssignmentActive',
    record.asignacion_id || record.id,
    active
  );

  await refreshActiveSede();

  notify(
    'success',
    result.message ||
      `Asignación ${active ? 'activada' : 'desactivada'} correctamente.`
  );

}


/**
 * Elimina definitivamente un servidor.
 * Utiliza SweetAlert2 para solicitar confirmación.
 */
async function deleteDirectoryEntry(record) {
  if (!window.Swal) {
    throw new Error('SweetAlert2 no está disponible. Verifica su carga en SUNARP UI.');
  }
  const fullName = [record.nombres, record.apellidos].filter(Boolean).join(' ');
  const confirmation = await Swal.fire({
    title: '¿Eliminar servidor?',
    text: 'Se eliminará el servidor y sus registros relacionados únicamente si no tiene acciones operativas registradas que deban conservarse para la trazabilidad.',
    icon: 'warning',
    showCancelButton: true,
    confirmButtonText: 'Sí, eliminar servidor',
    cancelButtonText: 'Cancelar',
    reverseButtons: true,
    focusCancel: true,
    customClass: { popup: 'sunarp-swal-popup' }
  });
  if (!confirmation.isConfirmed) return;

  const result = await callServer('deleteDirectoryPerson', record.persona_id);
  await refreshActiveSede();
  notify('success', result.message || ('El servidor ' + fullName + ' se eliminó correctamente.'));
}

  /* =====================================================
     13. EVENTOS DE FILTROS
     ===================================================== */


  function bindEvents() {
    if (state.eventsBound) return;
    const elements = getElements();
    if (!elements.sedeFilter || !elements.localFilter || !elements.cargoFilter) return;
    elements.sedeFilter.addEventListener('change', () => {
      loadSelectedSede(key(elements.sedeFilter.value));
    });
    elements.localFilter.addEventListener('change', () => {
      refreshDependentFilters('local');
    });
    elements.cargoFilter.addEventListener('change', () => {
      refreshDependentFilters('cargo');
    });
    state.eventsBound = true;
  }

  function clearDirectoryTable(message) {
    const container = getElements().table;
    if (state.table) {
      state.table.destroy();
      state.table = null;
    }
    if (container) container.textContent = message || '';
  }


  function getSiteClientCacheData(sedeId) {
    const id = key(sedeId);
    const entry = state.siteDataCache.get(id);
    if (!entry) return null;
    if (!entry.data || Date.now() - entry.loadedAt >= DIRECTORY_SITE_CLIENT_CACHE_TTL_MS) {
      state.siteDataCache.delete(id);
      return null;
    }
    // LRU: actualizar la posición sin renovar loadedAt. La vigencia se mide
    // desde la respuesta del servidor y no se prolonga por cada visita.
    state.siteDataCache.delete(id);
    state.siteDataCache.set(id, entry);
    return entry.data;
  }


  function rememberSiteClientCacheData(sedeId, data) {
    const id = key(sedeId);
    if (!id || !data) return;
    state.siteDataCache.delete(id);
    state.siteDataCache.set(id, { data, loadedAt: Date.now() });
    while (state.siteDataCache.size > DIRECTORY_SITE_CLIENT_CACHE_MAX_ENTRIES) {
      const oldestId = state.siteDataCache.keys().next().value;
      state.siteDataCache.delete(oldestId);
    }
  }


  function startDirectoryContextWarmup() {
    if (state.contextWarmupPromise || !state.authorizedSedes.length) return;
    const startedAt = performance.now();
    state.contextWarmupPromise = callServer('warmDirectoryContextCache')
      .then(result => {
        console.info('[DirectoryPage] Contexto preparado:', {
          warmupClientMs: Math.round(performance.now() - startedAt),
          warmupServerMs: result ? result.serverMs : null,
          authorizationMs: result ? result.authorizationMs : null,
          contextMs: result ? result.contextMs : null,
          peopleRowsLoaded: result ? result.peopleRowsLoaded : null
        });
        return result;
      })
      .catch(error => {
        // El precalentamiento es oportunista. La carga de sede mantiene su
        // propia ruta autorizada y puede construir el contexto si falla.
        console.warn('[DirectoryPage] No se pudo precalentar el contexto:', error.message || error);
        return null;
      });
  }


  async function loadSelectedSede(sedeId, force = false) {
    const selectedSedeId = key(sedeId);
    const elements = getElements();
    const requestId = ++state.siteRequestId;

    if (!selectedSedeId) {
      state.siteLoading = false;
      state.activeSedeId = '';
      state.records = [];
      state.hierarchyPath = [];
      state.hierarchyIndex = null;
      state.hierarchySelectableIds = new Set();
      state.catalogs = { sedes: state.authorizedSedes || [] };
      if (elements.localFilter) {
        elements.localFilter.value = '';
        elements.localFilter.disabled = true;
      }
      if (elements.cargoFilter) elements.cargoFilter.value = '';
      populateLocalFilter();
      populateCargoFilter();
      renderHierarchyFilters();
      clearDirectoryTable('Selecciona una sede y un local para consultar la información de personal.');
      return;
    }

    const isAuthorizedSede = (state.authorizedSedes || []).some(item =>
      key(item.id) === selectedSedeId
    );
    if (!isAuthorizedSede) {
      elements.sedeFilter.value = '';
      notify('warning', 'La sede seleccionada no está dentro de tus ámbitos autorizados.');
      return;
    }

    state.siteLoading = true;
    state.activeSedeId = '';
    state.records = [];
    state.hierarchyPath = [];
    state.hierarchyIndex = null;
    state.hierarchySelectableIds = new Set();
    state.catalogs = { sedes: state.authorizedSedes || [] };
    if (elements.localFilter) {
      elements.localFilter.value = '';
      elements.localFilter.disabled = true;
    }
    if (elements.cargoFilter) elements.cargoFilter.value = '';
    populateLocalFilter();
    populateCargoFilter();
    renderHierarchyFilters();
    clearDirectoryTable('Cargando información de la sede seleccionada...');

    try {
      const cachedData = force ? null : getSiteClientCacheData(selectedSedeId);
      const useClientCache = Boolean(cachedData);
      let result = useClientCache ? cachedData : null;
      let roundTripMs = 0;
      let contextWarmupWaitMs = 0;
      if (!result) {
        if (state.contextWarmupPromise) {
          const warmupWaitStartedAt = performance.now();
          await state.contextWarmupPromise;
          contextWarmupWaitMs = performance.now() - warmupWaitStartedAt;
        }
        if (requestId !== state.siteRequestId) return;
        const requestStartedAt = performance.now();
        result = await callServer('getDirectorySiteData', selectedSedeId);
        roundTripMs = performance.now() - requestStartedAt;
      }
      if (requestId !== state.siteRequestId) return;
      if (!result || !result.catalogs || !Array.isArray(result.records)) {
        throw new Error('El servidor devolvió una carga incompleta para la sede seleccionada.');
      }

      const clientProcessingStartedAt = performance.now();
      if (!useClientCache) rememberSiteClientCacheData(selectedSedeId, result);
      state.records = result.records;
      state.catalogs = result.catalogs;
      state.activeSedeId = selectedSedeId;

      const indexStartedAt = performance.now();
      state.hierarchyIndex = _directoryBuildHierarchyClientIndex_(
        state.records,
        state.catalogs.estructuraOrg || []
      );
      state.hierarchySelectableIds = _directoryBuildHierarchyFilterSets_(
        state.records,
        state.catalogs.estructuraOrg || [],
        state.catalogs.filterContract,
        selectedSedeId
      );
      const clientIndexMs = performance.now() - indexStartedAt;

      const filtersStartedAt = performance.now();
      populateLocalFilter();
      populateCargoFilter();
      renderHierarchyFilters();
      const filterSetupMs = performance.now() - filtersStartedAt;
      renderTable();
      const clientProcessingMs = performance.now() - clientProcessingStartedAt;
      const diagnostics = result.diagnostics || {};
      const serverMs = Number.isFinite(Number(diagnostics.serverMs))
        ? Number(diagnostics.serverMs)
        : null;

      console.info('[DirectoryPage] Sede cargada:', {
        sedeId: selectedSedeId,
        records: state.records.length,
        assignments: result.summary ? result.summary.assignments : state.records.length,
        source: useClientCache ? 'session-cache' : 'server',
        serverMs,
        roundTripMs: Math.round(roundTripMs),
        contextWarmupWaitMs: Math.round(contextWarmupWaitMs),
        roundTripResidualMs: serverMs === null || useClientCache
          ? null
          : Math.round(Math.max(0, roundTripMs - serverMs)),
        serverStages: diagnostics.stages || null,
        clientIndexMs: Math.round(clientIndexMs),
        filterSetupMs: Math.round(filterSetupMs),
        clientProcessingMs: Math.round(clientProcessingMs)
      });
    } catch (error) {
      if (requestId !== state.siteRequestId) return;
      state.activeSedeId = '';
      state.records = [];
      state.hierarchyIndex = null;
      state.hierarchySelectableIds = new Set();
      state.catalogs = { sedes: state.authorizedSedes || [] };
      elements.sedeFilter.value = '';
      if (elements.localFilter) {
        elements.localFilter.value = '';
        elements.localFilter.disabled = true;
      }
      populateLocalFilter();
      populateCargoFilter();
      renderHierarchyFilters();
      clearDirectoryTable('No se pudo cargar la información de la sede.');
      notify('error', error.message || 'No se pudo cargar la información de la sede.');
    } finally {
      if (requestId === state.siteRequestId) state.siteLoading = false;
    }
  }

  async function refreshActiveSede() {
    if (state.activeSedeId === '__ALL__') return load(true);
    const elements = getElements();
    const selectedSedeId = state.activeSedeId ||
      key(elements.sedeFilter && elements.sedeFilter.value);
    if (!selectedSedeId) return load(true);
    state.siteDataCache.delete(selectedSedeId);
    return loadSelectedSede(selectedSedeId, true);
  }

  async function load(force = false) {
    if (state.loading) return;
    if (state.loaded && !force) {
      setPageActions();
      return;
    }
    const elements = getElements();
    const previousSedeId = key(elements.sedeFilter && elements.sedeFilter.value);
    const hadLoadedSnapshot = state.loaded && Boolean(state.catalogs);
    state.loading = true;
    let finishLoading = null;
    let autoLoadedSoleSede = false;
    try {
      if (window.SUNARPUI && typeof SUNARPUI.beginLoading === 'function') {
        finishLoading = SUNARPUI.beginLoading();
      }
      const requestStartedAt = performance.now();
      const result = await callServer('getDirectoryInitialData');
      const roundTripMs = performance.now() - requestStartedAt;
      if (!result || !result.catalogs || !Array.isArray(result.catalogs.sedes)) {
        throw new Error('El servidor devolvió una lista de sedes incompleta.');
      }
      const clientSetupStartedAt = performance.now();
      state.authorizedSedes = result.catalogs.sedes;
      state.hasTotalScope = Boolean(result.scopeSummary && result.scopeSummary.total === true);
      state.catalogs = { sedes: state.authorizedSedes };
      state.records = [];
      state.hierarchyIndex = null;
      state.hierarchySelectableIds = new Set();
      state.activeSedeId = '';
      state.hierarchyPath = [];
      state.siteDataCache.clear();
      if (elements.sedeFilter) elements.sedeFilter.value = '';
      if (elements.localFilter) {
        elements.localFilter.value = '';
        elements.localFilter.disabled = true;
      }
      if (elements.cargoFilter) elements.cargoFilter.value = '';
      clearDirectoryTable(state.hasTotalScope
        ? 'Selecciona una sede para consultar la información de personal.'
        : 'Cargando únicamente la información de tus ámbitos autorizados...');
      populateSedeFilter();
      populateLocalFilter();
      populateCargoFilter();
      renderHierarchyFilters();
      bindEvents();
      state.loaded = true;
      setPageActions();
      const clientSetupMs = performance.now() - clientSetupStartedAt;
      const diagnostics = result.diagnostics || {};
      const serverMs = Number.isFinite(Number(diagnostics.serverMs))
        ? Number(diagnostics.serverMs)
        : null;

      // TOTAL siempre requiere una elección explícita, incluso cuando solo
      // existe una sede autorizada. Los ámbitos fijos se aplican directamente.
      if (!state.hasTotalScope && state.authorizedSedes.length === 1) {
        const soleSedeId = key(state.authorizedSedes[0].id);
        if (soleSedeId) {
          if (elements.sedeFilter) elements.sedeFilter.value = soleSedeId;
          autoLoadedSoleSede = true;
          console.info('[DirectoryPage] Carga automática de única sede autorizada:', {
            sedeId: soleSedeId
          });
          await loadSelectedSede(soleSedeId);
        }
      } else if (!state.hasTotalScope && state.authorizedSedes.length > 1) {
        startDirectoryContextWarmup();
      }

      console.info('[DirectoryPage] Selector inicial de sedes:', {
        serverMs,
        roundTripMs: Math.round(roundTripMs),
        roundTripResidualMs: serverMs === null
          ? null
          : Math.round(Math.max(0, roundTripMs - serverMs)),
        serverStages: diagnostics.stages || null,
        clientSetupMs: Math.round(clientSetupMs),
        authorizedSedes: state.authorizedSedes.length,
        totalScopeRequiresSelection: state.hasTotalScope,
        autoLoadedSoleSede,
        assignmentRecordsLoaded: autoLoadedSoleSede ? state.records.length : 0
      });

      if (force && !autoLoadedSoleSede && previousSedeId &&
          state.authorizedSedes.some(item => key(item.id) === previousSedeId)) {
        elements.sedeFilter.value = previousSedeId;
        await loadSelectedSede(previousSedeId, true);
      }
    } catch (error) {
      state.loaded = hadLoadedSnapshot;
      console.error('Error al cargar el selector de Información de personal:', error);
      notify(
        hadLoadedSnapshot ? 'warning' : 'error',
        hadLoadedSnapshot
          ? 'No se pudo actualizar la lista de sedes. Se conserva la información cargada.'
          : (error.message || 'No se pudo cargar la lista de sedes.')
      );
      if (!hadLoadedSnapshot && elements.table) {
        elements.table.textContent = 'No se pudo cargar la lista de sedes autorizadas.';
      }
    } finally {
      state.loading = false;
      if (typeof finishLoading === 'function') finishLoading();
    }
  }

  /* =====================================================
     15. NAVEGACIÓN
     ===================================================== */

  document.addEventListener('sunarp:navigate', event => {

    const route = String(
      event.detail?.route || ''
    );

    if (route === 'informacion-personal') {
      load();
    } else {
      clearPageActions();
    }

  });


  return Object.freeze({
    load,
    refresh: refreshActiveSede
  });

})();
</script>
