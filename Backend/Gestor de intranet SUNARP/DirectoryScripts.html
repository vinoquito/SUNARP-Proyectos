<script>
  /**
 * GESTOR DE INTRANET SUNARP
 * Módulo: Información de personal
 *
 * Operaciones:
 * - Listar servidores.
 * - Buscar y filtrar.
 * - Registrar.
 * - Editar.
 * - Desactivar.
 * - Reactivar.
 *
 * Interfaz: SUNARP UI.
 * Operaciones de datos: SUNARP Core.
 * Reglas particulares: DirectoryService.gs.
 */

const DirectoryPage = (() => {

  const state = {
    records: [],
    catalogs: null,
    table: null,
    hierarchyPath: [],
    loading: false,
    loaded: false,
    eventsBound: false,
    pageActionsActive: false
  };


  /* =====================================================
     1. COMUNICACIÓN CON EL SERVIDOR
     ===================================================== */

  function callServer(functionName, ...args) {
    return new Promise((resolve, reject) => {

      const runner = google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(reject);

      runner[functionName](...args);

    });
  }


  function notify(type, message) {
    if (window.SUNARPUI &&
        typeof SUNARPUI.notify === 'function') {
      SUNARPUI.notify(type, message);
    }
  }


  function escapeHtml(value) {
    return String(value ?? '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }


  function key(value) {
    return String(value ?? '').trim();
  }


  function isActive(record) {
    return !(
      record.active === false ||
      record.active === 0 ||
      String(record.active).toLowerCase() === 'false' ||
      String(record.active) === '0'
    );
  }


  /* =====================================================
     2. ELEMENTOS DE LA VISTA
     ===================================================== */

  function getElements() {
    return {
      sedeFilter: document.getElementById(
        'directorySedeFilter'
      ),

      hierarchyFilters: document.getElementById(
        'directoryHierarchyFilters'
      ),

      cargoFilter: document.getElementById(
        'directoryCargoFilter'
      ),

      table: document.getElementById(
        'directoryTableContainer'
      )
    };
  }



  /* =====================================================
     3. FILTROS DINÁMICOS DE SEDE, JERARQUÍA Y CARGO
     ===================================================== */

  function sortByName(a, b) {
    return String(a.name || '').localeCompare(
      String(b.name || ''),
      'es',
      { sensitivity: 'base' }
    );
  }


  /**
   * Devuelve la ruta orgánica completa de un servidor.
   * Ejemplo: Órgano -> Oficina -> Unidad.
   */
  function getRecordStructurePath(record) {
    const structureMap = new Map(
      state.catalogs.estructuraOrg.map(node => [
        key(node.id),
        node
      ])
    );

    const path = [];
    const visited = new Set();

    let current = structureMap.get(
      key(record.estructura_id)
    );

    while (current) {
      const currentId = key(current.id);

      if (!currentId || visited.has(currentId)) {
        break;
      }

      visited.add(currentId);
      path.unshift(current);

      const parentId = key(current.parent_id);

      current = parentId
        ? structureMap.get(parentId) || null
        : null;
    }

    return path;
  }


  /**
   * Comprueba si un registro corresponde a la ruta
   * jerárquica que está seleccionada.
   */
  function recordMatchesHierarchyPath(record, path) {
    if (!path || !path.length) return true;

    const recordPath = getRecordStructurePath(record);

    if (recordPath.length < path.length) {
      return false;
    }

    return path.every((selectedId, index) =>
      key(recordPath[index].id) === key(selectedId)
    );
  }


  /**
   * Aplica los filtros seleccionados.
   *
   * excludedFilters permite excluir uno de los filtros
   * para calcular las opciones disponibles de ese filtro
   * a partir de los otros dos.
   */
  function getRecordsForFilters(excludedFilters) {
    const excluded = excludedFilters || new Set();
    const elements = getElements();

    const sedeId = elements.sedeFilter
      ? key(elements.sedeFilter.value)
      : '';

    const cargoId = elements.cargoFilter
      ? key(elements.cargoFilter.value)
      : '';

    return state.records.filter(record => {

      if (
        !excluded.has('sede') &&
        sedeId &&
        key(record.sede_id) !== sedeId
      ) {
        return false;
      }

      if (
        !excluded.has('cargo') &&
        cargoId &&
        key(record.cargo_id) !== cargoId
      ) {
        return false;
      }

      if (
        !excluded.has('hierarchy') &&
        !recordMatchesHierarchyPath(
          record,
          state.hierarchyPath
        )
      ) {
        return false;
      }

      return true;
    });
  }


  /**
   * Obtiene únicamente los elementos del catálogo
   * que están siendo utilizados por los registros.
   */
  function getUsedCatalogItems(records, field, catalog) {
    const usedIds = new Set(
      records
        .map(record => key(record[field]))
        .filter(Boolean)
    );

    return (catalog || [])
      .filter(item => usedIds.has(key(item.id)))
      .sort(sortByName);
  }


  /**
   * Actualiza las opciones de un selector y conserva
   * su selección si todavía está disponible.
   */
  function updateFilterOptions(select, placeholder, items) {
    if (!select) return;

    const selectedValue = key(select.value);

    select.replaceChildren();

    const defaultOption = document.createElement('option');

    defaultOption.value = '';
    defaultOption.textContent = placeholder;

    select.appendChild(defaultOption);

    items.forEach(item => {
      const option = document.createElement('option');

      option.value = key(item.id);
      option.textContent = item.name;

      select.appendChild(option);
    });

    const selectionExists = items.some(item =>
      key(item.id) === selectedValue
    );

    select.value = selectionExists ? selectedValue : '';
  }


  /**
   * Sedes utilizadas por los registros que cumplen
   * los filtros de cargo y jerarquía.
   */
  function populateSedeFilter() {
    const select = getElements().sedeFilter;
    if (!select || !state.catalogs) return;

    const contract = state.catalogs.filterContract || {};
    const selectableIds = new Set(contract.selectable && contract.selectable.sedeIds || []);
    const sedes = (state.catalogs.sedes || [])
      .filter(item => !contract.selectable || selectableIds.has(key(item.id)))
      .slice().sort(sortByName);
    updateFilterOptions(select, 'Todas las sedes', sedes);

    const visible = sedes.length > 1;
    const wrapper = select.closest('.sunarp-filter');
    if (wrapper) wrapper.hidden = !visible;
    if (!visible) select.value = '';
  }



    const select = getElements().sedeFilter;

    if (!select || !state.catalogs) return;

    const sedes = (state.catalogs.sedes || []).slice().sort(sortByName);
    updateFilterOptions(select, 'Todas las sedes', sedes);

    const visible = state.catalogs.filterVisibility
      ? state.catalogs.filterVisibility.sede === true
      : sedes.length > 1;
    const wrapper = select.closest('.sunarp-filter');
    if (wrapper) wrapper.hidden = !visible;
    if (!visible) select.value = '';
  }


  /**
   * Cargos utilizados por los registros que cumplen
   * los filtros de sede y jerarquía.
   */
  function populateCargoFilter() {
    const select = getElements().cargoFilter;
    if (!select || !state.catalogs) return;

    const contract = state.catalogs.filterContract || {};
    const selectableIds = new Set(contract.selectable && contract.selectable.cargoIds || []);
    const cargos = (state.catalogs.cargos || [])
      .filter(item => !contract.selectable || selectableIds.has(key(item.id)))
      .slice().sort(sortByName);
    updateFilterOptions(select, 'Todos los cargos', cargos);

    const visible = cargos.length > 1;
    const wrapper = select.closest('.sunarp-filter');
    if (wrapper) wrapper.hidden = !visible;
    if (!visible) select.value = '';
  }



    const select = getElements().cargoFilter;

    if (!select || !state.catalogs) return;

    const cargos = (state.catalogs.cargos || []).slice().sort(sortByName);
    updateFilterOptions(select, 'Todos los cargos', cargos);

    const visible = state.catalogs.filterVisibility
      ? state.catalogs.filterVisibility.cargo === true
      : cargos.length > 1;
    const wrapper = select.closest('.sunarp-filter');
    if (wrapper) wrapper.hidden = !visible;
    if (!visible) select.value = '';
  }


  /* =====================================================
     4. FILTROS JERÁRQUICOS DE LA TABLA
     ===================================================== */


  /**
   * Obtiene las unidades orgánicas que tienen registros
   * asociados y corresponden al nivel jerárquico indicado.
   *
   * Incluye los órganos superiores necesarios para llegar
   * a las unidades que sí tienen servidores registrados.
   */
  function getHierarchyNodes(parentId) {
    const contract = state.catalogs && state.catalogs.filterContract || {};
    const selectable = new Set(contract.selectable && contract.selectable.structureIds || []);
    const contextual = new Set(contract.contextStructureIds || []);
    return (state.catalogs.estructuraOrg || [])
      .filter(node =>
        key(node.parent_id) === key(parentId) &&
        (!contract.selectable || selectable.has(key(node.id)) || contextual.has(key(node.id)))
      )
      .slice()
      .sort((a, b) => {
        const orderA = Number(a.order) || 0;
        const orderB = Number(b.order) || 0;
        return orderA - orderB ||
          String(a.name).localeCompare(String(b.name), 'es');
      });
  }


  /**
   * Determina la etiqueta del nivel jerárquico.
   * También se utiliza en el formulario de registro.
   */
  function getHierarchyLabel(nodes, level) {
    const types = [
      ...new Set(
        nodes
          .map(node => key(node.tipo_estructura_name))
          .filter(Boolean)
      )
    ];

    if (types.length === 1) {
      return types[0].charAt(0).toLocaleUpperCase() +
        types[0].slice(1);
    }

    return level === 0
      ? 'Órgano o dependencia'
      : 'Unidad o dependencia';
  }


  /**
   * Construye un selector para cada nivel jerárquico.
   */
  function appendHierarchyLevel(parentId, level) {
    const container = getElements().hierarchyFilters;

    if (!container) return;

    const nodes = getHierarchyNodes(parentId);

    if (!nodes.length) return;

    const wrapper = document.createElement('div');

    wrapper.className = 'sunarp-filter';

    const selectId = `directoryHierarchyFilter${level}`;

    const label = document.createElement('label');

    label.htmlFor = selectId;
    label.textContent = getHierarchyLabel(nodes, level);

    const select = document.createElement('select');

    select.id = selectId;
    select.className = 'sunarp-select';

    const placeholder = document.createElement('option');

    placeholder.value = '';
    placeholder.textContent = level === 0
      ? 'Todas'
      : 'Todas las dependencias';

    select.appendChild(placeholder);

    const contract = state.catalogs.filterContract || {};
    const selectable = new Set(contract.selectable && contract.selectable.structureIds || []);
    const contextual = new Set(contract.contextStructureIds || []);
    nodes.forEach(node => {
      const option = document.createElement('option');

      option.value = key(node.id);
      option.textContent = contextual.has(key(node.id)) && !selectable.has(key(node.id))
        ? node.name + ' (contexto)'
        : node.name;
      option.disabled = contextual.has(key(node.id)) && !selectable.has(key(node.id));

      select.appendChild(option);
    });

    const previousSelection =
      state.hierarchyPath[level] || '';

    const exists = nodes.some(node =>
      key(node.id) === key(previousSelection)
    );

    const selectedValue = exists
      ? key(previousSelection)
      : '';

    if (!exists && previousSelection) {
      state.hierarchyPath =
        state.hierarchyPath.slice(0, level);
    }

    select.value = selectedValue;

    select.addEventListener('change', () => {
      const value = key(select.value);

      state.hierarchyPath =
        state.hierarchyPath.slice(0, level);

      if (value) {
        state.hierarchyPath.push(value);
      }

      refreshDependentFilters('hierarchy');
    });

    wrapper.appendChild(label);
    wrapper.appendChild(select);

    container.appendChild(wrapper);

    if (selectedValue) {
      appendHierarchyLevel(selectedValue, level + 1);
    } else {
      // Los ancestros se muestran solo como contexto: no se pueden
      // seleccionar, pero permiten llegar a las ramas autorizadas.
      nodes.filter(node =>
        contextual.has(key(node.id)) && !selectable.has(key(node.id))
      ).forEach(node => appendHierarchyLevel(key(node.id), level + 1));
    }
  }


  /**
   * Reconstruye los filtros jerárquicos.
   *
   * Solo utiliza registros que cumplen los filtros
   * de sede y cargo.
   */
  function renderHierarchyFilters() {
    const container = getElements().hierarchyFilters;

    if (!container || !state.catalogs) return;

    const visible = state.catalogs.filterVisibility
      ? state.catalogs.filterVisibility.hierarchy === true
      : (state.catalogs.estructuraOrg || []).length > 1;
    container.hidden = !visible;
    container.replaceChildren();

    if (!visible) {
      state.hierarchyPath = [];
      return;
    }

    appendHierarchyLevel('', 0);
  }


  /**
   * Comprueba si la selección de un filtro sigue teniendo
   * registros compatibles con los demás filtros.
   */
  function hasAvailableFilterSelection(filter) {
    const elements = getElements();
    if (filter === 'sede') {
      const selected = key(elements.sedeFilter && elements.sedeFilter.value);
      return !selected || (state.catalogs.sedes || []).some(item => key(item.id) === selected);
    }
    if (filter === 'cargo') {
      const selected = key(elements.cargoFilter && elements.cargoFilter.value);
      return !selected || (state.catalogs.cargos || []).some(item => key(item.id) === selected);
    }
    if (filter === 'hierarchy') {
      const structures = new Map((state.catalogs.estructuraOrg || []).map(item => [key(item.id), item]));
      return state.hierarchyPath.every((id, index) => {
        const node = structures.get(key(id));
        if (!node) return false;
        const expectedParent = index ? key(state.hierarchyPath[index - 1]) : '';
        return key(node.parent_id) === expectedParent;
      });
    }
    return true;
  }


  /**
   * Recalcula los filtros relacionados cuando cambia
   * cualquiera de ellos.
   *
   * Se conserva el filtro que acaba de modificar el usuario.
   * Los demás se limpian cuando dejan de tener registros
   * compatibles con las nuevas selecciones.
   */
  function refreshDependentFilters(changedFilter) {
    if (changedFilter === 'sede') {
      state.hierarchyPath = [];
    }

    populateSedeFilter();
    populateCargoFilter();
    renderHierarchyFilters();
    renderTable();
  }


  /* =====================================================
     5. FILTRADO Y PREPARACIÓN DE REGISTROS
     ===================================================== */

  function getFilteredRecords() {
    return getRecordsForFilters(new Set());
  }

  function prepareRows(records) {

    return records.map(record => ({

      ...record,

      servidor: [
        record.nombres,
        record.apellidos
      ].filter(Boolean).join(' '),

      anexo_display:
        record.anexo === '' ||
        record.anexo === null ||
        record.anexo === undefined
          ? '—'
          : String(record.anexo),

      dependencia_display: record.estructura_name || '—',

      local_display: record.local_name || '—',

      estado_display: isActive(record)
        ? 'Activo'
        : 'Inactivo'

    }));

  }


  /* =====================================================
     6. TABLA REUTILIZABLE
     ===================================================== */


    
  function renderTable() {

    const container = getElements().table;

    if (!container) return;

    if (
      !window.SUNARPUI ||
      typeof SUNARPUI.createDataTable !== 'function'
    ) {
      throw new Error(
        'No está disponible el componente DataTable de SUNARP UI.'
      );
    }

    const options = {

      containerId: 'directoryTableContainer',

      mode: 'server',

      loadData: async params => {
        const elements = getElements();
        const result = await callServer('listDirectoryAssignments', {
          active: 'all',
          page: params.page,
          pageSize: params.pageSize,
          search: params.search,
          sedeId: elements.sedeFilter ? elements.sedeFilter.value : '',
          cargoId: elements.cargoFilter ? elements.cargoFilter.value : '',
          estructuraId: state.hierarchyPath.length
            ? state.hierarchyPath[state.hierarchyPath.length - 1]
            : ''
        });
        return {
          items: prepareRows(result.records || []),
          total: Number(result.total) || 0
        };
      },

      columns: [

        {
          key: 'servidor',
          label: 'Servidor',
          searchable: true
        },

        {
          key: 'cargo_name',
          label: 'Cargo',
          searchable: true
        },

        {
          key: 'anexo_display',
          label: 'Anexo',
          align: 'center',
          searchable: true
        },

        {
          key: 'dependencia_display',
          label: 'Dependencia',
          searchable: true
        },

        {
          key: 'local_display',
          label: 'Local',
          searchable: true
        },

        {
          key: 'active',
          label: 'Estado',
          searchable: false,

          render: (value, record) => {

            const active = isActive(record);

            const wrapper = document.createElement('div');

            wrapper.className =
              'sunarp-datatable-status access-status-cell';

            // Badge de estado.
            const badge = SUNARPUI.createBadge({
              label: active ? 'Activo' : 'Inactivo',
              variant: active ? 'success' : 'danger',
              icon: active ? 'check_circle' : 'cancel'
            });

            wrapper.appendChild(badge);

            // Acción de cambio de estado.
            const statusButton = document.createElement('button');

            statusButton.type = 'button';

            statusButton.className =
              `sunarp-datatable-status-link access-status-link ${
                active
                  ? 'sunarp-datatable-status-link--deactivate access-status-link--deactivate'
                  : 'sunarp-datatable-status-link--activate access-status-link--activate'
              }`;

            statusButton.textContent = active
              ? 'Desactivar'
              : 'Activar';

            statusButton.addEventListener('click', async () => {

              statusButton.disabled = true;

              try {

                await changeDirectoryStatus(
                  record,
                  !active
                );

              } catch (error) {

                notify(
                  'error',
                  error.message || 'No se pudo cambiar el estado.'
                );

              } finally {

                if (statusButton.isConnected) {
                  statusButton.disabled = false;
                }

              }

            });

            wrapper.appendChild(statusButton);

            return wrapper;

          }
        }

      ],

      pageSize: 10,

      pageSizeOptions: [10, 25, 50],

      rowActions: [

        {
          label: 'Editar',
          icon: 'edit',
          variant: 'primary',
          title: 'Editar servidor',

          onClick: record => openDirectoryForm(record)
        },

        {
          label: 'Nueva asignación',
          icon: 'plus',
          variant: 'primary',
          title: 'Registrar otra asignación para esta persona',
          onClick: record => openDirectoryForm(record, { assignmentOnly: true })
        },

        {
          label: 'Historial',
          icon: 'history',
          variant: 'primary',
          title: 'Consultar historial del servidor',

          onClick: record => {
            if (
              !window.SUNARPAccessHistory ||
              typeof window.SUNARPAccessHistory.open !== 'function'
            ) {
              notify(
                'error',
                'No está disponible el componente de historial.'
              );

              return;
            }

            window.SUNARPAccessHistory.open(
              'SERVIDOR',
              record.persona_id,
              [
                record.nombres,
                record.apellidos
              ].filter(Boolean).join(' ')
            );
          }
        },

        {
          label: 'Eliminar',
          icon: 'delete',
          variant: 'danger',
          title: 'Eliminar asignación',

          onClick: record => deleteDirectoryEntry(record)
        }

      ]

    };

    if (!state.table) {

      state.table = SUNARPUI.createDataTable(options);

    } else {

      state.table.refresh();

    }

  }




  /* =====================================================
     7. FORMULARIO: ESTRUCTURA JERÁRQUICA
     ===================================================== */

  function getFormStructurePath(structureId) {

    const structureMap = new Map(
      state.catalogs.estructuraOrg.map(node => [
        key(node.id),
        node
      ])
    );

    const path = [];
    const visited = new Set();

    let current = structureMap.get(key(structureId));

    while (current) {

      const currentId = key(current.id);

      if (!currentId || visited.has(currentId)) {
        break;
      }

      visited.add(currentId);
      path.unshift(currentId);

      const parentId = key(current.parent_id);

      current = parentId
        ? structureMap.get(parentId) || null
        : null;

    }

    return path;
  }


  function getFormHierarchyNodes(parentId, sedeId) {

    return state.catalogs.estructuraOrg
      .filter(node => {

        if (parentId) {
          return key(node.parent_id) === key(parentId);
        }

        return (
          !key(node.parent_id) &&
          key(node.sede_id) === key(sedeId)
        );

      })
      .sort((a, b) => {

        const orderA = Number(a.order) || 0;
        const orderB = Number(b.order) || 0;

        return orderA - orderB ||
          String(a.name).localeCompare(String(b.name), 'es');

      });
  }


  function renderFormLocalOptions(
    structureId,
    selectedRelationId
  ) {

    const select = document.getElementById(
      'directoryFormLocal'
    );

    if (!select) return;

    select.innerHTML = '';

    const placeholder = document.createElement('option');

    placeholder.value = '';
    placeholder.textContent = structureId
      ? 'Selecciona un local'
      : 'Selecciona una dependencia';

    select.appendChild(placeholder);

    const relations = state.catalogs.estructuraLocal
      .filter(relation =>
        key(relation.estructura_id) === key(structureId) &&
        relation.active !== false &&
        relation.active !== 0 &&
        String(relation.active).toLowerCase() !== 'false'
      );

    relations.forEach(relation => {

      const option = document.createElement('option');

      option.value = key(relation.id);

      option.textContent = [
        relation.local_name,
        relation.referencia
      ].filter(Boolean).join(' — ');

      select.appendChild(option);

    });

    select.value = relations.some(relation =>
      key(relation.id) === key(selectedRelationId)
    )
      ? key(selectedRelationId)
      : '';

    select.disabled = relations.length === 0;

  }


  function renderFormHierarchy(
    sedeId,
    selectedPath,
    selectedRelationId
  ) {

    const container = document.getElementById(
      'directoryFormHierarchy'
    );

    if (!container) return;

    container.innerHTML = '';

    let selectedStructureId = '';

    function appendLevel(parentId, level) {

      const nodes = getFormHierarchyNodes(
        parentId,
        sedeId
      );

      if (!nodes.length) return;

      const wrapper = document.createElement('div');
      wrapper.className = 'sunarp-form-field sunarp-form-field--full';

      const label = document.createElement('label');
      label.textContent = getHierarchyLabel(nodes, level);

      const select = document.createElement('select');
      select.className = 'sunarp-select';

      const placeholder = document.createElement('option');
      placeholder.value = '';
      placeholder.textContent = 'Selecciona una opción';

      select.appendChild(placeholder);

      nodes.forEach(node => {

        const option = document.createElement('option');

        option.value = key(node.id);
        option.textContent = node.name;

        select.appendChild(option);

      });

      const previous = selectedPath[level] || '';

      const exists = nodes.some(node =>
        key(node.id) === previous
      );

      const selectedValue = exists ? previous : '';

      if (!exists) {
        selectedPath.splice(level);
      }

      select.value = selectedValue;

      select.addEventListener('change', () => {

        selectedPath.splice(level);

        if (select.value) {
          selectedPath.push(select.value);
        }

        renderFormHierarchy(
          sedeId,
          selectedPath,
          ''
        );

      });

      label.appendChild(select);
      wrapper.appendChild(label);
      container.appendChild(wrapper);

      if (selectedValue) {
        selectedStructureId = selectedValue;
        appendLevel(selectedValue, level + 1);
      }

    }

    appendLevel('', 0);

    // El local se relaciona con el último elemento
    // seleccionado de la jerarquía.
    if (selectedPath.length) {
      selectedStructureId = selectedPath[
        selectedPath.length - 1
      ];
    }

    renderFormLocalOptions(
      selectedStructureId,
      selectedRelationId
    );

  }


  /* =====================================================
     8. FORMULARIO: CONTENIDO
     ===================================================== */

  function buildDirectoryForm(record, assignmentOnly = false) {

    const isEditing = Boolean(record) && !assignmentOnly;

    const selectedSede = record
      ? key(record.sede_id)
      : key(getElements().sedeFilter?.value);

    const selectedPath = record
      ? getFormStructurePath(record.estructura_id)
      : [];

    const cargoOptions = state.catalogs.cargos
      .filter(cargo =>
        cargo.active !== false &&
        cargo.active !== 0 &&
        String(cargo.active).toLowerCase() !== 'false'
      )
      .slice()
      .sort(sortByName)
      .map(cargo => `
        <option
          value="${escapeHtml(cargo.id)}"
          ${record && !assignmentOnly && key(record.cargo_id) === key(cargo.id) ? 'selected' : ''}>
          ${escapeHtml(cargo.name)}
        </option>
      `)
      .join('');

    const sedeOptions = state.catalogs.sedes
      .filter(sede =>
        sede.active !== false &&
        sede.active !== 0
      )
      .slice()
      .sort(sortByName)
      .map(sede => `
        <option
          value="${escapeHtml(sede.id)}"
          ${selectedSede === key(sede.id) ? 'selected' : ''}>
          ${escapeHtml(sede.name)}
        </option>
      `)
      .join('');

    const selectedMode = record && key(record.local_id) && key(record.estructura_local_id)
      ? 'both'
      : record && key(record.local_id)
        ? 'local'
        : 'structure';

    const directLocalOptions = state.catalogs.locales
      .filter(local => local.active !== false && local.active !== 0 &&
        String(local.active).toLowerCase() !== 'false')
      .slice().sort(sortByName)
      .map(local => `<option value="${escapeHtml(local.id)}" ${record && key(record.local_id) === key(local.id) ? 'selected' : ''}>${escapeHtml(local.name)}</option>`)
      .join('');

    return {
      html: `
        <form id="directoryForm" class="sunarp-form-grid">

          <input type="hidden" id="directoryFormId" value="${escapeHtml(assignmentOnly ? '' : (record?.id || ''))}">
          <input type="hidden" id="directoryFormMode" value="${assignmentOnly ? 'assignment' : 'person'}">
          <input type="hidden" id="directoryFormPersonaId" value="${escapeHtml(record?.persona_id || '')}">

          <div class="sunarp-form-field">
            <label for="directoryFormNombres">
              Nombres *
            </label>

            <input
              type="text"
              class="sunarp-input"
              id="directoryFormNombres"
              maxlength="100"
              value="${escapeHtml(record?.nombres || '')}"
              ${assignmentOnly ? 'readonly' : 'required'}>
          </div>

          <div class="sunarp-form-field">
            <label for="directoryFormApellidos">
              Apellidos *
            </label>

            <input
              type="text"
              class="sunarp-input"
              id="directoryFormApellidos"
              maxlength="150"
              value="${escapeHtml(record?.apellidos || '')}"
              ${assignmentOnly ? 'readonly' : 'required'}>
          </div>

          ${assignmentOnly ? '' : `
          <div class="sunarp-form-field sunarp-form-field--full">
            <label for="directoryFormCorreoInstitucional">Correo institucional</label>
            <input
              type="email"
              class="sunarp-input"
              id="directoryFormCorreoInstitucional"
              maxlength="150"
              placeholder="usuario@sunarp.gob.pe"
              value="${escapeHtml(record?.correo_institucional || '')}">
            <small>Se utiliza para vincular la identidad con la cuenta institucional de acceso.</small>
          </div>

          <div class="sunarp-form-field">
            <label for="directoryFormTipoDocumento">Tipo de documento *</label>
            <input type="text" class="sunarp-input" id="directoryFormTipoDocumento"
              maxlength="30" value="${escapeHtml(record?.tipo_documento || '')}" required>
          </div>

          <div class="sunarp-form-field">
            <label for="directoryFormNumeroDocumento">Número de documento *</label>
            <input type="text" class="sunarp-input" id="directoryFormNumeroDocumento"
              maxlength="30" value="${escapeHtml(record?.numero_documento || '')}" required>
          </div>

          <div class="sunarp-form-field">
            <label for="directoryFormFechaNacimiento">Fecha de nacimiento</label>
            <input type="date" class="sunarp-input" id="directoryFormFechaNacimiento"
              value="${escapeHtml(record?.fecha_nacimiento || '')}">
          </div>

          <div class="sunarp-form-field">
            <label for="directoryFormFechaInicio">Fecha de inicio de servicios</label>
            <input type="date" class="sunarp-input" id="directoryFormFechaInicio"
              value="${escapeHtml(record?.fecha_inicio_servicios || '')}">
          </div>

          <div class="sunarp-form-field">
            <label for="directoryFormFechaCese">Fecha de cese</label>
            <input type="date" class="sunarp-input" id="directoryFormFechaCese"
              value="${escapeHtml(record?.fecha_cese || '')}">
          </div>

          `}
          <div class="sunarp-form-field">
            <label for="directoryFormCargo">
              Cargo *
            </label>

            <select
              id="directoryFormCargo"
              class="sunarp-select"
              required>

              <option value="">Selecciona un cargo</option>

              ${cargoOptions}

            </select>
          </div>

          <div class="sunarp-form-field">
            <label for="directoryFormCondicionCargo">
              Condición del cargo
            </label>
            <input
              type="text"
              class="sunarp-input"
              id="directoryFormCondicionCargo"
              maxlength="150"
              value="${escapeHtml(assignmentOnly ? '' : (record?.condicion_cargo || ''))}">
          </div>

          <div class="sunarp-form-field">
            <label for="directoryFormAnexo">
              Anexo
            </label>

            <input
              type="number"
              class="sunarp-input"
              id="directoryFormAnexo"
              min="1"
              max="99999"
              step="1"
              value="${escapeHtml(assignmentOnly ? '' : (record?.anexo ?? ''))}">
          </div>

          <div class="sunarp-form-field sunarp-form-field--full">
            <label for="directoryFormObservaciones">Observaciones</label>
            <textarea
              id="directoryFormObservaciones"
              class="sunarp-input"
              maxlength="1000"
              rows="3">${escapeHtml(assignmentOnly ? '' : (record?.observaciones || ''))}</textarea>
          </div>

          <div class="sunarp-form-field sunarp-form-field--full">
            <label for="directoryFormSede">
              Sede *
            </label>

            <select
              id="directoryFormSede"
              class="sunarp-select"
              required>

              <option value="">Selecciona una sede</option>

              ${sedeOptions}

            </select>
          </div>

          <div class="sunarp-form-field sunarp-form-field--full">
            <label for="directoryFormAssignmentMode">Adscripción de la asignación *</label>
            <select id="directoryFormAssignmentMode" class="sunarp-select" required>
              <option value="structure" ${selectedMode === 'structure' ? 'selected' : ''}>Unidad orgánica</option>
              <option value="local" ${selectedMode === 'local' ? 'selected' : ''}>Local directamente</option>
              <option value="both" ${selectedMode === 'both' ? 'selected' : ''}>Unidad orgánica y local</option>
            </select>
          </div>

          <div class="sunarp-form-field sunarp-form-field--full" id="directoryFormHierarchyField">
            <div id="directoryFormHierarchy"></div>
          </div>

          <div class="sunarp-form-field sunarp-form-field--full" id="directoryFormRelationField">
            <label for="directoryFormLocal">Relación con local *</label>
            <select id="directoryFormLocal" class="sunarp-select" required disabled>
              <option value="">Selecciona una dependencia</option>
            </select>
          </div>

          <div class="sunarp-form-field sunarp-form-field--full" id="directoryFormDirectLocalField" style="display:none">
            <label for="directoryFormDirectLocal">Local directamente asignado *</label>
            <select id="directoryFormDirectLocal" class="sunarp-select">
              <option value="">Selecciona un local</option>
              ${directLocalOptions}
            </select>
          </div>

          <div class="sunarp-form-field sunarp-form-field--full">
            <div class="directory-form-actions">

              <button
                type="button"
                class="sunarp-btn sunarp-btn-outline"
                id="directoryFormCancel">
                Cancelar
              </button>

              <button
                type="submit"
                class="sunarp-btn sunarp-btn-primary"
                id="directoryFormSave">
                ${assignmentOnly ? 'Registrar asignación' : (isEditing ? 'Guardar cambios' : 'Registrar servidor')}
              </button>

            </div>
          </div>

        </form>
      `,

      selectedSede,
      selectedPath,
      selectedRelationId: record ? key(record.estructura_local_id) : '',
      selectedLocalId: record ? key(record.local_id) : '',
      selectedMode
    };
  }


  /* =====================================================
     9. FORMULARIO: ALTA Y EDICIÓN
     ===================================================== */


  async function openDirectoryForm(record, options = {}) {

    const assignmentOnly = options.assignmentOnly === true;
    const isEditing = Boolean(record) && !assignmentOnly;
    let formRecord = record;

    if (isEditing) {
      try {
        const detail = await callServer('getDirectoryPersonById', record.persona_id);
        if (!detail) throw new Error('No se encontró la ficha de la persona.');
        const assignment = (detail.assignments || []).find(item =>
          key(item.asignacion_id) === key(record.asignacion_id || record.id)
        );
        if (!assignment) throw new Error('No se encontró la asignación que deseas editar dentro de tu ámbito.');
        formRecord = Object.assign({}, detail, assignment, {
          id: assignment.asignacion_id
        }, detail.personalData || {});
      } catch (error) {
        notify('error', error.message || 'No se pudo recuperar la ficha de la persona.');
        return;
      }
    }

    const formData = buildDirectoryForm(formRecord, assignmentOnly);

    // Convertir la cadena HTML del formulario en un fragmento DOM.
    const template = document.createElement('template');

    template.innerHTML = formData.html.trim();

    // SUNARP UI recibe un elemento DOM mediante la propiedad content.
    SUNARPUI.openModal({
      title: assignmentOnly
        ? 'Nueva asignación'
        : (isEditing ? 'Editar servidor' : 'Registrar servidor'),

      content: template.content,
      size: 'lg'
    });

    // Obtener los elementos una vez insertado el contenido en el modal.
    const form = document.getElementById('directoryForm');

    const sedeSelect = document.getElementById(
      'directoryFormSede'
    );

    const modeSelect = document.getElementById('directoryFormAssignmentMode');
    const relationSelect = document.getElementById('directoryFormLocal');
    const directLocalSelect = document.getElementById('directoryFormDirectLocal');

    function refreshDirectLocalOptions(sedeId, selectedId) {
      const current = selectedId !== undefined ? key(selectedId) : key(directLocalSelect.value);
      directLocalSelect.replaceChildren();
      const placeholder = document.createElement('option');
      placeholder.value = '';
      placeholder.textContent = 'Selecciona un local';
      directLocalSelect.appendChild(placeholder);
      state.catalogs.locales
        .filter(local => !sedeId || key(local.sede_id) === key(sedeId))
        .slice().sort(sortByName).forEach(local => {
          const option = document.createElement('option');
          option.value = key(local.id);
          option.textContent = local.name;
          directLocalSelect.appendChild(option);
        });
      directLocalSelect.value = Array.from(directLocalSelect.options).some(option => option.value === current)
        ? current : '';
    }

    function syncAssignmentMode() {
      const mode = modeSelect.value;
      const useStructure = mode === 'structure' || mode === 'both';
      const useDirectLocal = mode === 'local' || mode === 'both';
      document.getElementById('directoryFormHierarchyField').style.display = useStructure ? '' : 'none';
      document.getElementById('directoryFormRelationField').style.display = useStructure ? '' : 'none';
      document.getElementById('directoryFormDirectLocalField').style.display = useDirectLocal ? '' : 'none';
      relationSelect.required = useStructure;
      directLocalSelect.required = useDirectLocal;
      // Ocultar conserva la selección anterior: el usuario puede cambiar
      // de modalidad y volver sin perder la estructura ya elegida.
      if (!useDirectLocal) directLocalSelect.value = '';
      if (mode === 'both' && relationSelect.value) {
        const relation = state.catalogs.estructuraLocal.find(x => key(x.id) === key(relationSelect.value));
        if (relation) directLocalSelect.value = key(relation.local_id);
      }
    }

    relationSelect.addEventListener('change', () => {
      if (modeSelect.value === 'both') {
        const relation = state.catalogs.estructuraLocal.find(x => key(x.id) === key(relationSelect.value));
        directLocalSelect.value = relation ? key(relation.local_id) : '';
      }
    });
    modeSelect.addEventListener('change', syncAssignmentMode);


    const cancelButton = document.getElementById(
      'directoryFormCancel'
    );

    // Comprobar que el formulario se haya insertado correctamente.
    if (!form || !sedeSelect || !cancelButton) {

      SUNARPUI.closeModal();

      notify(
        'error',
        'No se pudo inicializar el formulario del directorio.'
      );

      return;
    }

    // Construir los selectores jerárquicos y el local físico.
    renderFormHierarchy(
      formData.selectedSede,
      formData.selectedPath,
      formData.selectedRelationId
    );

    refreshDirectLocalOptions(formData.selectedSede, formData.selectedLocalId);
    syncAssignmentMode();

    // Cambiar de sede reinicia la selección jerárquica.
    sedeSelect.addEventListener('change', () => {

      renderFormHierarchy(
        sedeSelect.value,
        [],
        ''
      );
      refreshDirectLocalOptions(sedeSelect.value, '');

    });

    // Cerrar el formulario.
    cancelButton.addEventListener('click', () => {
      SUNARPUI.closeModal();
    });

    // Guardar el registro.
    form.addEventListener('submit', saveForm);

  }



  /* =====================================================
     10. GUARDAR REGISTRO
     ===================================================== */

  async function saveForm(event) {

    event.preventDefault();

    const form = event.currentTarget;

    if (!form.reportValidity()) return;

    const id = document.getElementById(
      'directoryFormId'
    ).value;

    const nombres = document.getElementById(
      'directoryFormNombres'
    ).value.trim();

    const apellidos = document.getElementById(
      'directoryFormApellidos'
    ).value.trim();

    const cargoId = document.getElementById(
      'directoryFormCargo'
    ).value;

    const anexoInput = document.getElementById(
      'directoryFormAnexo'
    ).value;

    const assignmentMode = document.getElementById('directoryFormAssignmentMode').value;
    const estructuraLocalId = (assignmentMode === 'structure' || assignmentMode === 'both')
      ? document.getElementById('directoryFormLocal').value
      : '';
    const localId = (assignmentMode === 'local' || assignmentMode === 'both')
      ? document.getElementById('directoryFormDirectLocal').value
      : '';

    if ((assignmentMode === 'structure' || assignmentMode === 'both') && !estructuraLocalId) {
      notify('warning', 'Selecciona la unidad orgánica y su relación con el local.');
      return;
    }
    if ((assignmentMode === 'local' || assignmentMode === 'both') && !localId) {
      notify('warning', 'Selecciona el local directamente asignado.');
      return;
    }
    if (assignmentMode === 'both') {
      const relation = state.catalogs.estructuraLocal.find(x => key(x.id) === key(estructuraLocalId));
      if (!relation || key(relation.local_id) !== key(localId)) {
        notify('warning', 'El local debe coincidir con el local de la relación estructura-local seleccionada.');
        return;
      }
    }

    const personaId = document.getElementById('directoryFormPersonaId').value;
    const payload = {
      persona_id: personaId,
      asignacion_id: id,
      nombres,
      apellidos,
      correo_institucional: document.getElementById('directoryFormCorreoInstitucional')?.value.trim().toLowerCase() || '',
      tipo_documento: document.getElementById('directoryFormTipoDocumento')?.value.trim() || '',
      numero_documento: document.getElementById('directoryFormNumeroDocumento')?.value.trim() || '',
      fecha_nacimiento: document.getElementById('directoryFormFechaNacimiento')?.value || '',
      fecha_inicio_servicios: document.getElementById('directoryFormFechaInicio')?.value || '',
      fecha_cese: document.getElementById('directoryFormFechaCese')?.value || '',
      cargo_id: cargoId,
      condicion_cargo: document.getElementById('directoryFormCondicionCargo').value.trim(),
      anexo: anexoInput === '' ? '' : Number(anexoInput),
      estructura_local_id: estructuraLocalId,
      local_id: localId,
      observaciones: document.getElementById('directoryFormObservaciones')?.value.trim() || ''
    };

    const saveButton = document.getElementById(
      'directoryFormSave'
    );

    saveButton.disabled = true;
    saveButton.textContent = 'Guardando...';

    try {

      const result = await callServer(
        'saveDirectoryEntry',
        payload
      );

      SUNARPUI.closeModal();

      notify(
        'success',
        result.message || 'Registro guardado correctamente.'
      );

      await load(true);

    } catch (error) {

      notify(
        'error',
        error.message || 'No se pudo guardar el registro.'
      );

      saveButton.disabled = false;
      saveButton.textContent = id
        ? 'Guardar cambios'
        : (personaId ? 'Registrar asignación' : 'Registrar servidor');

    }

  }


  /* =====================================================
     11. DESACTIVAR Y REACTIVAR
     ===================================================== */

  
/**
 * Activa o desactiva un servidor desde su celda de estado.
 */
async function changeDirectoryStatus(record, active) {

  const result = await callServer(
    'setDirectoryAssignmentActive',
    record.asignacion_id || record.id,
    active
  );

  await load(true);

  notify(
    'success',
    result.message ||
      `Asignación ${active ? 'activada' : 'desactivada'} correctamente.`
  );

}


/**
 * Elimina definitivamente un servidor.
 * Utiliza SweetAlert2 para solicitar confirmación.
 */
async function deleteDirectoryEntry(record) {

  if (!window.Swal) {
    throw new Error(
      'SweetAlert2 no está disponible. Verifica su carga en SUNARP UI.'
    );
  }

  const fullName = [
    record.nombres,
    record.apellidos
  ].filter(Boolean).join(' ');

  // Confirmación de eliminación.
  const confirmation = await Swal.fire({

    title: '¿Eliminar asignación?',

    text: `Se eliminará la asignación de ${fullName}. La persona y sus datos personales se conservarán.`,

    icon: 'warning',

    showCancelButton: true,

    confirmButtonText: 'Sí, eliminar',

    cancelButtonText: 'Cancelar',

    reverseButtons: true,

    focusCancel: true,

    customClass: {
      popup: 'sunarp-swal-popup'
    }

  });

  if (!confirmation.isConfirmed) {
    return;
  }

  // Ejecutar eliminación en el servidor.
  const result = await callServer(
    'deleteDirectoryAssignment',
    record.asignacion_id || record.id
  );

  // Recargar la información actualizada.
  await load(true);

  notify(
    'success',
    result.message || 'Asignación eliminada correctamente.'
  );

}


  /* =====================================================
     12. ACCIÓN SUPERIOR: NUEVO SERVIDOR
     ===================================================== */

  function setPageActions() {

    if (
      !window.SUNARPUI ||
      typeof SUNARPUI.setPageActions !== 'function'
    ) {
      return;
    }

    SUNARPUI.setPageActions([

      {
        label: 'Nuevo servidor',
        icon: 'person_add',
        variant: 'primary',
        onClick: () => openDirectoryForm(null)
      }

    ]);

    state.pageActionsActive = true;

  }


  function clearPageActions() {

    if (
      state.pageActionsActive &&
      window.SUNARPUI &&
      typeof SUNARPUI.clearPageActions === 'function'
    ) {
      SUNARPUI.clearPageActions();
    }

    state.pageActionsActive = false;

  }


  /* =====================================================
     13. EVENTOS DE FILTROS
     ===================================================== */


  function bindEvents() {

    if (state.eventsBound) return;

    const elements = getElements();

    if (
      !elements.sedeFilter ||
      !elements.cargoFilter
    ) {
      return;
    }

    // Cambio de sede.
    elements.sedeFilter.addEventListener('change', () => {
      refreshDependentFilters('sede');
    });

    // Cambio de cargo.
    elements.cargoFilter.addEventListener('change', () => {
      refreshDependentFilters('cargo');
    });

    state.eventsBound = true;
  }

  /* =====================================================
     14. CARGA PRINCIPAL
     ===================================================== */

  
  async function load(force = false) {

    if (state.loading) return;

    // Conservar una instantánea funcional si una actualización posterior
    // falla por tiempo de espera o por un error transitorio del servidor.
    const hadLoadedSnapshot = state.loaded &&
      Boolean(state.catalogs) &&
      Array.isArray(state.records);

    // Evitar volver a consultar los archivos si ya se cargaron.
    if (state.loaded && !force) {
      setPageActions();
      return;
    }

    state.loading = true;

    let finishLoading = null;

    const totalStart = performance.now();

    const timings = {
      server: 0,
      filters: 0,
      table: 0
    };

    try {

      if (
        window.SUNARPUI &&
        typeof SUNARPUI.beginLoading === 'function'
      ) {
        finishLoading = SUNARPUI.beginLoading();
      }

      setPageActions();

      // 1. Obtener información del servidor.
      const serverStart = performance.now();

      const result = await callServer(
        'getDirectoryInitialData'
      );

      timings.server = performance.now() - serverStart;

      if (
        !result ||
        !result.catalogs ||
        !Array.isArray(result.records)
      ) {
        throw new Error(
          'El servidor devolvió una respuesta incompleta.'
        );
      }

      state.records = result.records;
      state.catalogs = result.catalogs;

      // 2. Preparar filtros.
      const filtersStart = performance.now();

      populateSedeFilter();
      populateCargoFilter();

      renderHierarchyFilters();

      bindEvents();

      timings.filters = performance.now() - filtersStart;

      // 3. Crear o actualizar la tabla.
      const tableStart = performance.now();

      renderTable();

      timings.table = performance.now() - tableStart;

      state.loaded = true;

      // Diagnóstico de rendimiento.
      const totalTime = performance.now() - totalStart;

      console.group('Rendimiento - Información de personal');

      console.table({
        'Consulta al servidor': {
          milisegundos: Math.round(timings.server),
          segundos: (timings.server / 1000).toFixed(2)
        },
        'Preparación de filtros': {
          milisegundos: Math.round(timings.filters),
          segundos: (timings.filters / 1000).toFixed(2)
        },
        'Creación de tabla': {
          milisegundos: Math.round(timings.table),
          segundos: (timings.table / 1000).toFixed(2)
        },
        'Tiempo total': {
          milisegundos: Math.round(totalTime),
          segundos: (totalTime / 1000).toFixed(2)
        }
      });

      console.log('Registros recibidos:', state.records.length);

      console.groupEnd();

    } catch (error) {

      state.loaded = hadLoadedSnapshot;

      console.error(
        'Error al cargar Información de personal:',
        error
      );

      notify(
        hadLoadedSnapshot ? 'warning' : 'error',
        hadLoadedSnapshot
          ? 'No se pudo actualizar el directorio. Se conserva la última información cargada.'
          : (error.message || 'No se pudo cargar la información de personal.')
      );

      // No destruir una tabla válida por un fallo de actualización.
      // En la primera carga no hay instantánea que conservar.
      const container = getElements().table;

      if (!hadLoadedSnapshot && container) {
        container.textContent =
          'No se pudo cargar la información de personal.';
      }

    } finally {

      state.loading = false;

      if (typeof finishLoading === 'function') {
        finishLoading();
      }

    }

  }



  /* =====================================================
     15. NAVEGACIÓN
     ===================================================== */

  document.addEventListener('sunarp:navigate', event => {

    const route = String(
      event.detail?.route || ''
    );

    if (route === 'informacion-personal') {
      load();
    } else {
      clearPageActions();
    }

  });


  return Object.freeze({
    load,
    refresh: load
  });

})();
</script>
