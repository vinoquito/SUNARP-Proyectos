<script>
  /**
   * Devuelve las estructuras reales que deben aparecer en los filtros:
   * las unidades con asignaciones coincidentes y sus ancestros reales.
   * Los ancestros son seleccionables; nunca se crean opciones de contexto.
   */
  /**
   * Devuelve todos los nodos reales que forman las rutas hacia asignaciones
   * autorizadas. Incluye ancestros intermedios aunque no tengan asignaciones
   * propias: omitirlos aplana la jerarquía y muestra nietos como hermanos.
   * No incluye ramas sin registros autorizados ni cruza límites de sede.
   */
  /**
   * Construye los nodos orgánicos navegables a partir de asignaciones ya
   * autorizadas. Conserva los padres reales y respeta cada raíz de ámbito.
   */
  function _directoryBuildHierarchyFilterSets_(records, structures, filterContract, siteId) {
    const site = String(siteId || '').trim();
    const scopes = filterContract && Array.isArray(filterContract.scopes)
      ? filterContract.scopes
      : [];
    const hasTotalScope = scopes.some(scope => scope.type === 'TOTAL');
    const hasBroadSiteScope = hasTotalScope || scopes.some(scope =>
      scope.type === 'SEDE' && String(scope.referenceId || '').trim() === site
    );
    const structureScopes = scopes.filter(scope =>
      scope.type === 'ESTRUCTURA_ORG' && String(scope.referenceId || '').trim()
    );

    if ((!site && !hasTotalScope) || (!hasBroadSiteScope && !structureScopes.length)) {
      return new Set();
    }

    const keyOf = value => String(value === null || value === undefined ? '' : value).trim();
    const structureMap = new Map((structures || []).map(node => [
      keyOf(node && node.id), node
    ]).filter(entry => entry[0]));
    const selectableIds = new Set();

    const addPathWithinScope = (structureId, expectedSiteId, scopeRootId) => {
      const path = [];
      const visited = new Set();
      let current = structureMap.get(keyOf(structureId));
      let reachedScopeRoot = false;

      while (current) {
        const id = keyOf(current.id);
        if (!id || visited.has(id) || keyOf(current.sede_id) !== expectedSiteId) return false;
        visited.add(id);
        path.push(id);
        if (id === scopeRootId) {
          reachedScopeRoot = true;
          break;
        }
        const parentId = keyOf(current.parent_id);
        if (!parentId) break;
        const parent = structureMap.get(parentId);
        if (!parent || keyOf(parent.sede_id) !== expectedSiteId) break;
        current = parent;
      }

      if (!reachedScopeRoot) return false;
      path.forEach(id => selectableIds.add(id));
      return true;
    };

    (records || []).forEach(record => {
      const recordSite = keyOf(record && (record.filter_sede_id || record.sede_id));
      const structureId = keyOf(record && record.estructura_id);
      if ((site && recordSite !== site) || !recordSite || !structureId) return;

      const structure = structureMap.get(structureId);
      if (!structure || keyOf(structure.sede_id) !== recordSite) return;

      if (hasBroadSiteScope) {
        let current = structure;
        const visited = new Set();
        while (current) {
          const id = keyOf(current.id);
          if (!id || visited.has(id) || keyOf(current.sede_id) !== recordSite) break;
          visited.add(id);
          selectableIds.add(id);
          const parentId = keyOf(current.parent_id);
          const parent = parentId ? structureMap.get(parentId) : null;
          current = parent && keyOf(parent.sede_id) === recordSite ? parent : null;
        }
        return;
      }

      structureScopes.forEach(scope => {
        const rootId = keyOf(scope.referenceId);
        const root = structureMap.get(rootId);
        if (!root || keyOf(root.sede_id) !== recordSite) return;
        const includeDescendants = scope.includeDescendants === true;
        if (structureId === rootId) {
          selectableIds.add(rootId);
          return;
        }
        if (includeDescendants) {
          addPathWithinScope(structureId, recordSite, rootId);
        }
      });
    });

    return selectableIds;
  }

  function _directoryGetSelectableHierarchyChildren_(parentId, hierarchyIndex, selectableIds) {
    const keyOf = value => String(value === null || value === undefined ? '' : value).trim();
    const parentKey = keyOf(parentId);
    if (!parentKey || !hierarchyIndex || !hierarchyIndex.structureById) return [];

    const parent = hierarchyIndex.structureById.get(parentKey);
    if (!parent) return [];
    const parentSiteId = keyOf(parent.sede_id);
    const allowedIds = selectableIds instanceof Set ? selectableIds : new Set();

    return (hierarchyIndex.childrenByParent.get(parentKey) || []).filter(node =>
      keyOf(node && node.sede_id) === parentSiteId &&
      allowedIds.has(keyOf(node && node.id))
    );
  }

  function _directoryGetHierarchyDisplayPath_(node, structures) {
    const structureMap = new Map((structures || []).map(item => [
      String(item.id || '').trim(), item
    ]));
    const parts = [];
    const visited = new Set();
    const expectedSiteId = String(node && node.sede_id || '').trim();
    let current = node;
    while (current) {
      const id = String(current.id || '').trim();
      if (!id || visited.has(id)) break;
      if (String(current.sede_id || '').trim() !== expectedSiteId) break;
      visited.add(id);
      const name = String(current.name || '').trim();
      if (name) parts.unshift(name);
      const parentId = String(current.parent_id || '').trim();
      current = parentId ? structureMap.get(parentId) || null : null;
    }
    return parts.join(' / ');
  }

  /**
   * Precalcula una sola vez las relaciones usadas por filtros y tabla.
   * La pertenencia a un subárbol se resuelve con intervalos DFS O(1), y
   * las opciones por local se derivan únicamente de asignaciones reales.
   */
  function _directoryBuildHierarchyClientIndex_(records, structures) {
    const keyOf = value => String(value === null || value === undefined ? '' : value).trim();
    const nodes = Array.isArray(structures) ? structures : [];
    const structureById = new Map();
    nodes.forEach(node => {
      const id = keyOf(node && node.id);
      if (id) structureById.set(id, node);
    });

    const childrenByParent = new Map();
    nodes.forEach(node => {
      const id = keyOf(node && node.id);
      if (!id || structureById.get(id) !== node) return;
      const parentId = keyOf(node.parent_id);
      if (!childrenByParent.has(parentId)) childrenByParent.set(parentId, []);
      childrenByParent.get(parentId).push(node);
    });
    const compareNodes = (a, b) => {
      const orderA = Number(a.order);
      const orderB = Number(b.order);
      const normalizedA = Number.isFinite(orderA) ? orderA : Number.MAX_SAFE_INTEGER;
      const normalizedB = Number.isFinite(orderB) ? orderB : Number.MAX_SAFE_INTEGER;
      return normalizedA - normalizedB ||
        String(a.name || '').localeCompare(String(b.name || ''), 'es', { sensitivity: 'base' }) ||
        keyOf(a.id).localeCompare(keyOf(b.id));
    };
    childrenByParent.forEach(children => children.sort(compareNodes));

    const structurePathById = new Map();
    const resolvePath = structureId => {
      const startId = keyOf(structureId);
      if (!startId) return [];
      if (structurePathById.has(startId)) return structurePathById.get(startId);
      const first = structureById.get(startId);
      if (!first) return [];
      const expectedSiteId = keyOf(first.sede_id);
      const reversePath = [];
      const visited = new Set();
      let current = first;
      while (current) {
        const id = keyOf(current.id);
        if (!id || visited.has(id) || keyOf(current.sede_id) !== expectedSiteId) break;
        visited.add(id);
        reversePath.push(current);
        const parentId = keyOf(current.parent_id);
        const parent = parentId ? structureById.get(parentId) : null;
        current = parent && keyOf(parent.sede_id) === expectedSiteId ? parent : null;
      }
      const path = reversePath.reverse();
      path.forEach((node, index) => {
        const id = keyOf(node.id);
        if (!structurePathById.has(id)) structurePathById.set(id, path.slice(0, index + 1));
      });
      if (!structurePathById.has(startId)) structurePathById.set(startId, path);
      return structurePathById.get(startId);
    };
    nodes.forEach(node => resolvePath(node && node.id));

    const entryIndexByStructureId = new Map();
    const subtreeIntervalsByStructureId = new Map();
    const visiting = new Set();
    const visited = new Set();
    let cursor = 0;
    const visit = node => {
      const id = keyOf(node && node.id);
      if (!id || visiting.has(id) || visited.has(id)) return;
      visiting.add(id);
      const start = cursor++;
      entryIndexByStructureId.set(id, start);
      const siteId = keyOf(node.sede_id);
      (childrenByParent.get(id) || []).forEach(child => {
        if (keyOf(child.sede_id) === siteId) visit(child);
      });
      subtreeIntervalsByStructureId.set(id, { start, end: cursor });
      visiting.delete(id);
      visited.add(id);
    };
    nodes.forEach(node => {
      const parentId = keyOf(node && node.parent_id);
      const parent = parentId ? structureById.get(parentId) : null;
      if (!parent || keyOf(parent.sede_id) !== keyOf(node.sede_id)) visit(node);
    });
    nodes.forEach(visit);

    const recordsByLocal = new Map();
    const localOptionsById = new Map();
    const selectableByLocal = new Map();
    (Array.isArray(records) ? records : []).forEach(record => {
      const siteId = keyOf(record.filter_sede_id || record.sede_id);
      const localId = keyOf(record.filter_local_id || record.local_id);
      if (!siteId || !localId) return;
      if (!recordsByLocal.has(localId)) recordsByLocal.set(localId, []);
      recordsByLocal.get(localId).push(record);
      if (!localOptionsById.has(localId)) {
        localOptionsById.set(localId, {
          id: localId,
          name: keyOf(record.local_name) || localId
        });
      }
      const structureId = keyOf(record.estructura_id);
      if (!structureId) return;
      const structure = structureById.get(structureId);
      if (!structure || keyOf(structure.sede_id) !== siteId) return;
      if (!selectableByLocal.has(localId)) selectableByLocal.set(localId, new Set());
      // Los ancestros se conservan en structurePathById para trazabilidad,
      // pero solo se ofrecen estructuras con asignaciones autorizadas.
      selectableByLocal.get(localId).add(structureId);
    });

    return {
      structureById,
      childrenByParent,
      structurePathById,
      entryIndexByStructureId,
      subtreeIntervalsByStructureId,
      recordsByLocal,
      localOptionsById,
      selectableByLocal
    };
  }

  /**
   * Construye las estructuras navegables para el local elegido a partir de
   * asignaciones ya autorizadas. Añade ancestros reales de parent_id para
   * conservar las rutas, sin heredarles la ubicación física del descendiente.
   */
  /**
 * Determina desde qué nivel de la jerarquía debe comenzar la exploración.
 * Los filtros ancestros al ámbito concedido no se muestran como selectores.
 */
function _directoryGetAccessFilterPlan_(filterContract, siteId) {
  const keyOf = value => String(value === null || value === undefined ? '' : value).trim();
  const scopes = filterContract && Array.isArray(filterContract.scopes)
    ? filterContract.scopes
    : [];
  const site = keyOf(siteId);
  const hasBroadSiteScope = scopes.some(scope =>
    scope && (
      scope.type === 'TOTAL' ||
      (scope.type === 'SEDE' && keyOf(scope.referenceId) === site)
    )
  );
  const localScopeIds = Array.from(new Set(scopes
    .filter(scope => scope && scope.type === 'LOCAL')
    .map(scope => keyOf(scope.referenceId))
    .filter(Boolean)));
  const structureScopes = scopes.filter(scope =>
    scope && scope.type === 'ESTRUCTURA_ORG' && keyOf(scope.referenceId)
  );

  if (hasBroadSiteScope) {
    return {
      entryScope: 'SITE',
      localMode: 'selectable',
      hierarchyMode: 'local',
      localScopeIds,
      structureScopes
    };
  }
  if (structureScopes.length) {
    return {
      entryScope: 'ESTRUCTURA_ORG',
      localMode: 'hidden',
      hierarchyMode: 'structure-scope',
      localScopeIds,
      structureScopes
    };
  }
  if (localScopeIds.length === 1) {
    return {
      entryScope: 'LOCAL',
      localMode: 'fixed',
      hierarchyMode: 'local',
      localScopeIds,
      structureScopes
    };
  }
  if (localScopeIds.length > 1) {
    return {
      entryScope: 'LOCAL',
      localMode: 'selectable-scoped',
      hierarchyMode: 'local',
      localScopeIds,
      structureScopes
    };
  }
  return {
    entryScope: 'NONE',
    localMode: 'hidden',
    hierarchyMode: 'none',
    localScopeIds: [],
    structureScopes
  };
}


function _directoryBuildLocalHierarchyFilterSets_(records, structures, localId, siteId) {
    const keyOf = value => String(value === null || value === undefined ? '' : value).trim();
    const selectedLocalId = keyOf(localId);
    const selectedSiteId = keyOf(siteId);
    const structureMap = new Map((Array.isArray(structures) ? structures : []).map(node => [
      keyOf(node && node.id), node
    ]).filter(entry => entry[0]));
    const selectableIds = new Set();
    if (!selectedLocalId || !selectedSiteId) return selectableIds;

    (Array.isArray(records) ? records : []).forEach(record => {
      if (keyOf(record && (record.filter_local_id || record.local_id)) !== selectedLocalId) return;
      if (keyOf(record && (record.filter_sede_id || record.sede_id)) !== selectedSiteId) return;
      let current = structureMap.get(keyOf(record && record.estructura_id));
      const visited = new Set();
      while (current) {
        const id = keyOf(current.id);
        if (!id || visited.has(id) || keyOf(current.sede_id) !== selectedSiteId) break;
        visited.add(id);
        selectableIds.add(id);
        const parentId = keyOf(current.parent_id);
        const parent = parentId ? structureMap.get(parentId) : null;
        current = parent && keyOf(parent.sede_id) === selectedSiteId ? parent : null;
      }
    });
    return selectableIds;
  }

  function _directoryMatchesHierarchySubtree_(recordStructureId, selectedStructureId, index) {
    const selectedId = String(selectedStructureId || '').trim();
    const recordId = String(recordStructureId || '').trim();
    if (!selectedId || !recordId || !index) return false;
    const interval = index.subtreeIntervalsByStructureId.get(selectedId);
    const recordIndex = index.entryIndexByStructureId.get(recordId);
    return Boolean(interval && recordIndex !== undefined &&
      recordIndex >= interval.start && recordIndex < interval.end);
  }

  /**
 * GESTOR DE INTRANET SUNARP
 * Módulo: Información de personal
 *
 * Operaciones:
 * - Listar servidores.
 * - Buscar y filtrar.
 * - Registrar.
 * - Editar.
 * - Desactivar.
 * - Reactivar.
 *
 * Interfaz: SUNARP UI.
 * Operaciones de datos: SUNARP Core.
 * Reglas particulares: DirectoryService.gs.
 */

const DirectoryPage = (() => {

  const DIRECTORY_SITE_CLIENT_CACHE_TTL_MS = 600000;
  const DIRECTORY_SITE_CLIENT_CACHE_MAX_ENTRIES = 5;

  const state = {
    records: [],
    catalogs: null,
    authorizedSedes: [],
    hasTotalScope: false,
    table: null,
    hierarchyPath: [],
    hierarchyIndex: null,
    hierarchySelectableIds: new Set(),
    activeSedeId: '',
    siteDataCache: new Map(),
    contextWarmupPromise: null,
    siteRequestId: 0,
    siteLoading: false,
    loading: false,
    loaded: false,
    eventsBound: false,
    pageActionsActive: false
  };


  /* =====================================================
     1. COMUNICACIÓN CON EL SERVIDOR
     ===================================================== */

  function callServer(functionName, ...args) {
    return new Promise((resolve, reject) => {

      const runner = google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(reject);

      runner[functionName](...args);

    });
  }


  function notify(type, message) {
    if (window.SUNARPUI &&
        typeof SUNARPUI.notify === 'function') {
      SUNARPUI.notify(type, message);
    }
  }


  function escapeHtml(value) {
    return String(value ?? '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }


  function key(value) {
    return String(value ?? '').trim();
  }


  function isActive(record) {
    return !(
      record.active === false ||
      record.active === 0 ||
      String(record.active).toLowerCase() === 'false' ||
      String(record.active) === '0'
    );
  }


  /* =====================================================
     2. ELEMENTOS DE LA VISTA
     ===================================================== */

  function getElements() {
    return {
      sedeFilter: document.getElementById(
        'directorySedeFilter'
      ),

      localFilter: document.getElementById(
        'directoryLocalFilter'
      ),

      hierarchyFilters: document.getElementById(
        'directoryHierarchyFilters'
      ),

      cargoFilter: document.getElementById(
        'directoryCargoFilter'
      ),

      table: document.getElementById(
        'directoryTableContainer'
      )
    };
  }



  /* =====================================================
     3. FILTROS DINÁMICOS DE SEDE, JERARQUÍA Y CARGO
     ===================================================== */

  function sortByName(a, b) {
    return String(a.name || '').localeCompare(
      String(b.name || ''),
      'es',
      { sensitivity: 'base' }
    );
  }


  /**
   * Devuelve la ruta orgánica completa de un servidor.
   * Ejemplo: Órgano -> Oficina -> Unidad.
   */
  function getRecordStructurePath(record) {
    const index = state.hierarchyIndex;
    return index
      ? index.structurePathById.get(key(record && record.estructura_id)) || []
      : [];
  }


  function recordMatchesHierarchyPath(record, path) {
    if (!path || !path.length) return true;
    const selectedId = key(path[path.length - 1]);
    return _directoryMatchesHierarchySubtree_(
      record && record.estructura_id,
      selectedId,
      state.hierarchyIndex
    );
  }


  /**
   * Aplica una selección orgánica respetando el alcance de la raíz del
   * ámbito. Una referencia sin descendientes filtra solo su propia unidad,
   * aunque exista otra autorización independiente sobre un nodo hijo.
   */
  function _directoryMatchesHierarchySelection_(recordStructureId, hierarchyPath, scopes, hierarchyIndex) {
    if (!Array.isArray(hierarchyPath) || !hierarchyPath.length) return true;
    const keyOf = value => String(value === null || value === undefined ? '' : value).trim();
    const rootId = keyOf(hierarchyPath[0]);
    const selectedId = keyOf(hierarchyPath[hierarchyPath.length - 1]);
    if (!rootId || !selectedId) return true;

    const rootScopes = (Array.isArray(scopes) ? scopes : []).filter(scope =>
      scope && scope.type === 'ESTRUCTURA_ORG' &&
      keyOf(scope.referenceId) === rootId
    );
    const rootIsExactOnly = rootScopes.length > 0 &&
      !rootScopes.some(scope => scope.includeDescendants === true);

    if (hierarchyPath.length === 1 && rootIsExactOnly) {
      return keyOf(recordStructureId) === rootId;
    }
    return _directoryMatchesHierarchySubtree_(
      recordStructureId, selectedId, hierarchyIndex
    );
  }

  /**
   * Aplica los filtros seleccionados.
   *
   * excludedFilters permite excluir uno de los filtros
   * para calcular las opciones disponibles de ese filtro
   * a partir de los otros dos.
   */
  function getRecordsForFilters(excludedFilters) {
    const excluded = excludedFilters || new Set();
    const elements = getElements();
    const siteId = elements.sedeFilter ? key(elements.sedeFilter.value) : '';
    const localId = elements.localFilter ? key(elements.localFilter.value) : '';
    const cargoId = elements.cargoFilter ? key(elements.cargoFilter.value) : '';
    const selectedHierarchyPath = !excluded.has('hierarchy')
      ? state.hierarchyPath
      : [];
    const contract = state.catalogs && state.catalogs.filterContract;
    const hierarchyScopes = contract && Array.isArray(contract.scopes)
      ? contract.scopes
      : [];
    return state.records.filter(record => {
      const recordSiteId = key(record.filter_sede_id || record.sede_id);
      const recordLocalId = key(record.filter_local_id || record.local_id);
      if (!excluded.has('sede') && siteId && recordSiteId !== siteId) return false;
      if (!excluded.has('local') && localId && recordLocalId !== localId) return false;
      if (!excluded.has('cargo') && cargoId && key(record.cargo_id) !== cargoId) return false;
      if (selectedHierarchyPath.length && !_directoryMatchesHierarchySelection_(
        record.estructura_id,
        selectedHierarchyPath,
        hierarchyScopes,
        state.hierarchyIndex
      )) return false;
      return true;
    });
  }

  function getUsedCatalogItems(records, field, catalog) {
    const usedIds = new Set(
      records
        .map(record => key(record[field]))
        .filter(Boolean)
    );

    return (catalog || [])
      .filter(item => usedIds.has(key(item.id)))
      .sort(sortByName);
  }


  /**
   * Actualiza las opciones de un selector y conserva
   * su selección si todavía está disponible.
   */
  function updateFilterOptions(select, placeholder, items) {
    if (!select) return;

    const selectedValue = key(select.value);

    select.replaceChildren();

    const defaultOption = document.createElement('option');

    defaultOption.value = '';
    defaultOption.textContent = placeholder;

    select.appendChild(defaultOption);

    items.forEach(item => {
      const option = document.createElement('option');

      option.value = key(item.id);
      option.textContent = item.name;

      select.appendChild(option);
    });

    const selectionExists = items.some(item =>
      key(item.id) === selectedValue
    );

    select.value = selectionExists ? selectedValue : '';
  }


  /**
   * Sedes utilizadas por los registros que cumplen
   * los filtros de cargo y jerarquía.
   */
  function populateSedeFilter() {
    const select = getElements().sedeFilter;
    if (!select) return;
    const sedes = (state.authorizedSedes || [])
      .filter(item => isActive(item))
      .slice()
      .sort(sortByName);
    const isTotalSelection = state.hasTotalScope === true;
    const fixedSingleSede = !isTotalSelection && sedes.length === 1;
    const placeholder = isTotalSelection
      ? 'Seleccione una opción'
      : fixedSingleSede
        ? 'Sede determinada por el ámbito autorizado'
        : 'Seleccione una sede';
    updateFilterOptions(select, placeholder, sedes);
    const wrapper = select.closest('.sunarp-filter');
    if (fixedSingleSede) select.value = key(sedes[0].id);
    else if (isTotalSelection) select.value = '';
    select.disabled = sedes.length === 0 || (!isTotalSelection && fixedSingleSede);
    if (wrapper) wrapper.hidden = fixedSingleSede;
  }

  /**
   * Muestra Local solo cuando es un nivel descendiente del ámbito concedido.
   * Los ámbitos ESTRUCTURA_ORG comienzan directamente en la estructura
   * autorizada; un ámbito LOCAL fija el local o limita el selector a sus
   * referencias explícitas.
   */
  function populateLocalFilter() {
    const select = getElements().localFilter;
    if (!select) return;
    const elements = getElements();
    const siteId = key(elements.sedeFilter && elements.sedeFilter.value);
    const hasLoadedSite = Boolean(siteId && siteId === state.activeSedeId);
    const wrapper = select.closest('.sunarp-filter');
    const filterContract = state.catalogs && state.catalogs.filterContract || {};
    const plan = _directoryGetAccessFilterPlan_(filterContract, siteId);

    if (!hasLoadedSite || plan.localMode === 'hidden' || plan.localMode === 'fixed') {
      const scopedLocalId = plan.localMode === 'fixed' ? plan.localScopeIds[0] : '';
      const fixedLocal = scopedLocalId
        ? (state.catalogs.locales || []).find(local => key(local.id) === scopedLocalId)
        : null;
      updateFilterOptions(
        select,
        scopedLocalId ? 'Local determinado por el ámbito autorizado' : 'Locales de la información autorizada',
        fixedLocal ? [fixedLocal] : []
      );
      if (scopedLocalId && fixedLocal) select.value = scopedLocalId;
      else select.value = '';
      select.disabled = true;
      if (wrapper) wrapper.hidden = true;
      return;
    }

    const usedLocalIds = new Set(getRecordsForFilters(
      new Set(['local', 'cargo', 'hierarchy'])
    ).map(record => key(record.filter_local_id || record.local_id)).filter(Boolean));
    const permittedLocalIds = plan.localMode === 'selectable-scoped'
      ? new Set(plan.localScopeIds)
      : null;
    const locals = (state.catalogs.locales || []).filter(local =>
      isActive(local) &&
      key(local.sede_id) === siteId &&
      usedLocalIds.has(key(local.id)) &&
      (!permittedLocalIds || permittedLocalIds.has(key(local.id)))
    );

    updateFilterOptions(select, 'Seleccione un local', locals);
    // Para varios ámbitos LOCAL, si solo uno tiene registros, no se obliga
    // a elegir un selector que no ofrece una alternativa real.
    if (plan.localMode === 'selectable-scoped' && locals.length === 1) {
      select.value = key(locals[0].id);
      select.disabled = true;
      if (wrapper) wrapper.hidden = true;
    } else {
      select.disabled = locals.length === 0;
      if (wrapper) wrapper.hidden = locals.length === 0;
    }
  }


  function populateCargoFilter() {
    const select = getElements().cargoFilter;
    if (!select) return;
    const elements = getElements();
    const siteId = key(elements.sedeFilter && elements.sedeFilter.value);
    const hasLoadedSite = Boolean(siteId && siteId === state.activeSedeId);
    const wrapper = select.closest('.sunarp-filter');
    if (!hasLoadedSite) {
      updateFilterOptions(select, 'Cargos de la información autorizada', []);
      select.disabled = true;
      if (wrapper) wrapper.hidden = true;
      return;
    }
    const options = new Map();
    getRecordsForFilters(new Set(['cargo'])).forEach(record => {
      const id = key(record.cargo_id);
      if (!id || options.has(id)) return;
      options.set(id, { id, name: key(record.cargo_name) || id });
    });
    const cargos = Array.from(options.values()).sort(sortByName);
    updateFilterOptions(select, 'Todos los cargos autorizados', cargos);
    select.disabled = cargos.length <= 1;
    if (wrapper) wrapper.hidden = cargos.length === 0;
  }

  function getHierarchyFilterSets() {
    return { selectableIds: state.hierarchySelectableIds || new Set() };
  }

  /**
   * Obtiene las raíces ESTRUCTURA_ORG visibles para la sede activa.
   * Elimina referencias redundantes cubiertas por una raíz ancestro que
   * ya concede acceso a sus descendientes.
   */
  function _directoryGetHierarchyScopeRoots_(scopes, hierarchyIndex, selectableIds, siteId) {
    const keyOf = value => String(value === null || value === undefined ? '' : value).trim();
    const site = keyOf(siteId);
    const byId = new Map();
    (Array.isArray(scopes) ? scopes : []).forEach(scope => {
      if (!scope || scope.type !== 'ESTRUCTURA_ORG') return;
      const id = keyOf(scope.referenceId);
      if (!id || !selectableIds.has(id)) return;
      const node = hierarchyIndex && hierarchyIndex.structureById
        ? hierarchyIndex.structureById.get(id)
        : null;
      if (!node || keyOf(node.sede_id) !== site) return;
      const current = byId.get(id);
      byId.set(id, {
        referenceId: id,
        includeDescendants: Boolean(scope.includeDescendants || (current && current.includeDescendants)),
        node
      });
    });

    const roots = Array.from(byId.values());
    const visibleRoots = roots.filter(candidate => !roots.some(other =>
      other.referenceId !== candidate.referenceId &&
      other.includeDescendants &&
      _directoryMatchesHierarchySubtree_(
        candidate.referenceId,
        other.referenceId,
        hierarchyIndex
      )
    ));
    // El orden de los ámbitos no representa el orden institucional.
    // Las raíces autorizadas se presentan según estructura_org.order.
    visibleRoots.sort((a, b) => {
      const rawOrderA = a.node.order;
      const rawOrderB = b.node.order;
      const orderA = rawOrderA === null || rawOrderA === undefined ||
        String(rawOrderA).trim() === '' ? Number.MAX_SAFE_INTEGER : Number(rawOrderA);
      const orderB = rawOrderB === null || rawOrderB === undefined ||
        String(rawOrderB).trim() === '' ? Number.MAX_SAFE_INTEGER : Number(rawOrderB);
      const normalizedA = Number.isFinite(orderA) ? orderA : Number.MAX_SAFE_INTEGER;
      const normalizedB = Number.isFinite(orderB) ? orderB : Number.MAX_SAFE_INTEGER;
      return normalizedA - normalizedB ||
        keyOf(a.node.name).localeCompare(keyOf(b.node.name), 'es', { sensitivity: 'base' }) ||
        keyOf(a.node.id).localeCompare(keyOf(b.node.id), 'es', { numeric: true, sensitivity: 'base' });
    });
    return visibleRoots;
  }

  function getHierarchyNodes(parentId) {
    const selectableIds = getHierarchyFilterSets().selectableIds;
    const index = state.hierarchyIndex;
    if (!index || !selectableIds.size) return [];

    const selectedParentId = key(parentId);
    const contract = state.catalogs && state.catalogs.filterContract;
    const scopes = contract && Array.isArray(contract.scopes) ? contract.scopes : [];
    const activeSiteId = key(state.activeSedeId);
    const accessPlan = _directoryGetAccessFilterPlan_(contract, activeSiteId);
    const broadScope = accessPlan.hierarchyMode === 'local';

    if (selectedParentId) {
      if (!selectableIds.has(selectedParentId)) return [];
      return _directoryGetSelectableHierarchyChildren_(
        selectedParentId, index, selectableIds
      );
    }

    if (!broadScope) {
      const scopeRoots = _directoryGetHierarchyScopeRoots_(
        scopes, index, selectableIds, activeSiteId
      );
      if (scopeRoots.length === 1) {
        const root = scopeRoots[0];
        return root.includeDescendants
          ? _directoryGetSelectableHierarchyChildren_(root.referenceId, index, selectableIds)
          : [];
      }
      return scopeRoots.map(item => item.node);
    }

    const roots = Array.from(index.structureById.values()).filter(node => {
      const parentId = key(node && node.parent_id);
      if (!parentId) return true;
      const parent = index.structureById.get(parentId);
      return !parent || key(parent.sede_id) !== key(node.sede_id);
    });
    roots.sort((a, b) => {
      const orderA = Number(a.order);
      const orderB = Number(b.order);
      const normalizedA = Number.isFinite(orderA) ? orderA : Number.MAX_SAFE_INTEGER;
      const normalizedB = Number.isFinite(orderB) ? orderB : Number.MAX_SAFE_INTEGER;
      return normalizedA - normalizedB ||
        key(a.name).localeCompare(key(b.name), 'es', { sensitivity: 'base' }) ||
        key(a.id).localeCompare(key(b.id));
    });
    return roots.filter(node => selectableIds.has(key(node && node.id)));
  }

  function getHierarchyLabel(nodes, level) {
    const types = [
      ...new Set(
        nodes
          .map(node => key(node.tipo_estructura_name))
          .filter(Boolean)
      )
    ];

    if (types.length === 1) {
      return types[0].charAt(0).toLocaleUpperCase() +
        types[0].slice(1);
    }

    return level === 0
      ? 'Órgano o dependencia'
      : 'Unidad o dependencia';
  }


  /**
   * Construye un selector para cada nivel jerárquico.
   */
  function appendHierarchyLevel(parentId, level) {
    const container = getElements().hierarchyFilters;

    if (!container) return;

    const nodes = getHierarchyNodes(parentId);

    if (!nodes.length) return;

    const wrapper = document.createElement('div');

    wrapper.className = 'sunarp-filter';

    const selectId = `directoryHierarchyFilter${level}`;

    const label = document.createElement('label');

    label.htmlFor = selectId;
    label.textContent = getHierarchyLabel(nodes, level);

    const select = document.createElement('select');

    select.id = selectId;
    select.className = 'sunarp-select';

    const placeholder = document.createElement('option');

    placeholder.value = '';
    placeholder.textContent = level === 0
      ? 'Todas'
      : 'Todas las dependencias';

    select.appendChild(placeholder);

    nodes.forEach(node => {
      const option = document.createElement('option');
      const id = key(node.id);
      option.value = id;
      option.textContent = key(node.name) || id;
      select.appendChild(option);
    });

    const previousSelection =
      state.hierarchyPath[level] || '';

    const exists = nodes.some(node =>
      key(node.id) === key(previousSelection)
    );

    const selectedValue = exists
      ? key(previousSelection)
      : '';

    if (!exists && previousSelection) {
      state.hierarchyPath =
        state.hierarchyPath.slice(0, level);
    }

    select.value = selectedValue;

    select.addEventListener('change', () => {
      const value = key(select.value);

      state.hierarchyPath =
        state.hierarchyPath.slice(0, level);

      if (value) {
        state.hierarchyPath.push(value);
      }

      refreshDependentFilters('hierarchy');
    });

    wrapper.appendChild(label);
    wrapper.appendChild(select);

    container.appendChild(wrapper);

    if (selectedValue) {
      appendHierarchyLevel(selectedValue, level + 1);
    }
  }


  /**
   * Reconstruye los filtros jerárquicos.
   *
   * Solo utiliza registros que cumplen los filtros
   * de sede y cargo.
   */
  function renderHierarchyFilters() {
    const container = getElements().hierarchyFilters;
    if (!container) return;
    container.replaceChildren();
    const elements = getElements();
    const siteId = key(elements.sedeFilter && elements.sedeFilter.value);
    const localId = key(elements.localFilter && elements.localFilter.value);
    const hasLoadedSite = Boolean(siteId && siteId === state.activeSedeId);
    const filterContract = state.catalogs && state.catalogs.filterContract || {};
    const accessPlan = _directoryGetAccessFilterPlan_(filterContract, siteId);
    if (!hasLoadedSite || accessPlan.hierarchyMode === 'none') {
      state.hierarchyPath = [];
      state.hierarchySelectableIds = new Set();
      container.hidden = true;
      return;
    }

    if (accessPlan.hierarchyMode === 'structure-scope') {
      // El permiso ya identifica una estructura orgánica concreta. No se
      // exige ni se inventa un Local ancestro: la cascada comienza en los
      // hijos descendientes del nodo concedido.
      state.hierarchySelectableIds = _directoryBuildHierarchyFilterSets_(
        state.records,
        state.catalogs.estructuraOrg || [],
        filterContract,
        siteId
      );
    } else {
      // Para TOTAL/SEDE o LOCAL, Local sí es el nivel físico desde el que
      // corresponde abrir las ramas orgánicas.
      if (!localId) {
        state.hierarchyPath = [];
        state.hierarchySelectableIds = new Set();
        container.hidden = true;
        return;
      }
      state.hierarchySelectableIds = _directoryBuildLocalHierarchyFilterSets_(
        state.records, state.catalogs.estructuraOrg || [], localId, siteId
      );
    }
    const selectableIds = getHierarchyFilterSets().selectableIds;
    if (!selectableIds.size) {
      state.hierarchyPath = [];
      container.hidden = true;
      return;
    }
    appendHierarchyLevel('', 0);
    container.hidden = container.childElementCount === 0;
    if (container.hidden) state.hierarchyPath = [];
  }

  function hasAvailableFilterSelection(filter) {
    const elements = getElements();
    if (filter === 'sede') {
      const selected = key(elements.sedeFilter && elements.sedeFilter.value);
      return !selected || (state.catalogs.sedes || []).some(item => key(item.id) === selected);
    }
    if (filter === 'local') {
      const selected = key(elements.localFilter && elements.localFilter.value);
      return !selected || (state.catalogs.locales || []).some(item => key(item.id) === selected);
    }
    if (filter === 'cargo') {
      const selected = key(elements.cargoFilter && elements.cargoFilter.value);
      return !selected || (state.catalogs.cargos || []).some(item => key(item.id) === selected);
    }
    if (filter === 'hierarchy') {
      const selectableIds = getHierarchyFilterSets().selectableIds;
      return state.hierarchyPath.every(id => selectableIds.has(key(id)));
    }
    return true;
  }

  function refreshDependentFilters(changedFilter) {
    const startedAt = performance.now();
    if (changedFilter === 'sede') return;
    if (changedFilter === 'cargo') {
      renderTable();
      console.info('[DirectoryPage] Filtro actualizado:', {
        changedFilter,
        totalMs: Math.round(performance.now() - startedAt)
      });
      return;
    }
    if (changedFilter === 'local') state.hierarchyPath = [];
    const cargoStartedAt = performance.now();
    populateCargoFilter();
    const cargoOptionsMs = performance.now() - cargoStartedAt;
    const hierarchyStartedAt = performance.now();
    renderHierarchyFilters();
    const hierarchyOptionsMs = performance.now() - hierarchyStartedAt;
    renderTable();
    console.info('[DirectoryPage] Filtros dependientes actualizados:', {
      changedFilter,
      cargoOptionsMs: Math.round(cargoOptionsMs),
      hierarchyOptionsMs: Math.round(hierarchyOptionsMs),
      totalMs: Math.round(performance.now() - startedAt)
    });
  }

  function getFilteredRecords() {
    return getRecordsForFilters(new Set());
  }

  function getStructureDisplayParts(record) {
    const path = key(record && record.estructura_path);
    const names = path
      ? path.split(' / ').map(item => item.trim()).filter(Boolean)
      : [key(record && record.estructura_name)].filter(Boolean);
    return {
      primary: names[0] || '—',
      secondary: names.slice(1).join(' / ')
    };
  }


  function renderStackedTableCell(primaryValue, secondaryValue) {
    const wrapper = document.createElement('div');
    wrapper.className = 'directory-table-cell-stack';
    const primary = document.createElement('div');
    primary.textContent = key(primaryValue) || '—';
    wrapper.appendChild(primary);
    const secondaryText = key(secondaryValue);
    if (secondaryText) {
      const secondary = document.createElement('small');
      secondary.textContent = secondaryText;
      wrapper.appendChild(secondary);
    }
    return wrapper;
  }


  function prepareRows(records) {
    return records.map(record => {
      const structureDisplay = getStructureDisplayParts(record);
      return {
        ...record,
        servidor: [record.nombres, record.apellidos].filter(Boolean).join(' '),
        anexo_display:
          record.anexo === '' || record.anexo === null || record.anexo === undefined
            ? '—'
            : String(record.anexo),
        sede_display: record.sede_name || '—',
        local_display: record.local_name || '—',
        dependencia_display: record.estructura_path || record.estructura_name || '—',
        referencia_display: record.referencia || '',
        dependencia_primary_display: structureDisplay.primary,
        dependencia_secondary_display: structureDisplay.secondary,
        estado_display: isActive(record) ? 'Activo' : 'Inactivo'
      };
    });
  }


  /* =====================================================
     6. TABLA REUTILIZABLE
     ===================================================== */


    
  function renderTable() {
    const container = getElements().table;
    if (!container) return;

    if (!state.activeSedeId) {
      if (state.table) {
        state.table.destroy();
        state.table = null;
      }
      container.textContent = 'Selecciona una sede para consultar la información de personal.';
      return;
    }

    if (!window.SUNARPUI || typeof SUNARPUI.createDataTable !== 'function') {
      throw new Error('No está disponible el componente DataTable de SUNARP UI.');

    const tableStartedAt = performance.now();
    const filterStartedAt = performance.now();
    const filteredRecords = getFilteredRecords();
    const filteringMs = performance.now() - filterStartedAt;
    const preparationStartedAt = performance.now();
    const preparedRows = prepareRows(filteredRecords);

    const options = {

  function getFormStructurePath(structureId) {

    const structureMap = new Map(
      state.catalogs.estructuraOrg.map(node => [
        key(node.id),
        node
      ])
    );

    const path = [];
    const visited = new Set();

    let current = structureMap.get(key(structureId));

    while (current) {

      const currentId = key(current.id);

      if (!currentId || visited.has(currentId)) {
        break;
      }

      visited.add(currentId);
      path.unshift(currentId);

      const parentId = key(current.parent_id);

      current = parentId
        ? structureMap.get(parentId) || null
        : null;

    }

    return path;
  }


  function getFormHierarchyNodes(parentId, sedeId, localId) {
    const scopes = state.formScopes || [];
    const plan = _directoryGetAccessFilterPlan_({ scopes }, sedeId);
    const structures = (state.catalogs.estructuraOrg || []).filter(isActive);
    const structureById = new Map(structures.map(node => [key(node.id), node]));
    const selectedParentId = key(parentId);
    const selectedSiteId = key(sedeId);
    const effectiveLocalId = key(localId) ||
      (plan.localMode === 'fixed' ? key(plan.localScopeIds[0]) : '');

    const sortNodes = nodes => nodes.slice().sort((a, b) => {
      const rawA = a.order;
      const rawB = b.order;
      const orderA = rawA === '' || rawA === null || rawA === undefined
        ? Number.MAX_SAFE_INTEGER : Number(rawA);
      const orderB = rawB === '' || rawB === null || rawB === undefined
        ? Number.MAX_SAFE_INTEGER : Number(rawB);
      return (Number.isFinite(orderA) ? orderA : Number.MAX_SAFE_INTEGER) -
        (Number.isFinite(orderB) ? orderB : Number.MAX_SAFE_INTEGER) ||
        key(a.name).localeCompare(key(b.name), 'es', { sensitivity: 'base' });
    });

    if (!selectedSiteId) return [];

    if (plan.entryScope === 'ESTRUCTURA_ORG') {
      const scopeRoots = plan.structureScopes
        .map(scope => ({ scope, node: structureById.get(key(scope.referenceId)) }))
        .filter(item => item.node && key(item.node.sede_id) === selectedSiteId);

      const allowedIds = new Set();
      scopeRoots.forEach(({ scope, node }) => {
        const rootId = key(node.id);
        allowedIds.add(rootId);
        if (!scope.includeDescendants) return;
        const queue = [rootId];
        while (queue.length) {
          const currentId = queue.shift();
          structures.forEach(child => {
            const childId = key(child.id);
            if (key(child.parent_id) === currentId &&
                key(child.sede_id) === selectedSiteId &&
                !allowedIds.has(childId)) {
              allowedIds.add(childId);
              queue.push(childId);
            }
          });
        }
      });

      if (selectedParentId) {
        if (!allowedIds.has(selectedParentId)) return [];
        return sortNodes(structures.filter(node =>
          key(node.parent_id) === selectedParentId &&
          key(node.sede_id) === selectedSiteId &&
          allowedIds.has(key(node.id))
        ));
      }

      if (scopeRoots.length === 1) {
        const root = scopeRoots[0];
        return root.scope.includeDescendants
          ? sortNodes(structures.filter(node =>
              key(node.parent_id) === key(root.node.id) &&
              key(node.sede_id) === selectedSiteId &&
              allowedIds.has(key(node.id))
            ))
          : [];
      }
      return sortNodes(scopeRoots.map(item => item.node));
    }

    if ((plan.entryScope !== 'SITE' && plan.entryScope !== 'LOCAL') || !effectiveLocalId) {
      return [];
    }

    // TOTAL/SEDE y LOCAL: estructura desde el Local elegido, por relación real.
    const allowedIds = new Set();
    (state.catalogs.estructuraLocal || [])
      .filter(relation =>
        isActive(relation) && key(relation.local_id) === effectiveLocalId
      )
      .forEach(relation => {
        let current = structureById.get(key(relation.estructura_id));
        const visited = new Set();
        while (current) {
          const id = key(current.id);
          if (!id || visited.has(id) || key(current.sede_id) !== selectedSiteId) break;
          visited.add(id);
          allowedIds.add(id);
          const parentId = key(current.parent_id);
          current = parentId ? structureById.get(parentId) || null : null;
        }
      });

    if (selectedParentId) {
      if (!allowedIds.has(selectedParentId)) return [];
      return sortNodes(structures.filter(node =>
        key(node.parent_id) === selectedParentId &&
        key(node.sede_id) === selectedSiteId &&
        allowedIds.has(key(node.id))
      ));
    }

    return sortNodes(structures.filter(node => {
      if (!allowedIds.has(key(node.id)) || key(node.sede_id) !== selectedSiteId) return false;
      const parent = structureById.get(key(node.parent_id));
      return !parent || key(parent.sede_id) !== selectedSiteId ||
        !allowedIds.has(key(parent.id));
    }));
  }

  function renderFormLocalOptions(structureId, selectedRelationId, selectedLocalId, suffix = '') {
    const select = document.getElementById('directoryFormLocal' + suffix);
    if (!select) return;
    const wrapper = select.closest('.sunarp-form-field');
    select.replaceChildren();

    const placeholder = document.createElement('option');
    placeholder.value = '';
    placeholder.textContent = 'Selecciona una ubicación';
    select.appendChild(placeholder);

    const relations = (state.catalogs.estructuraLocal || [])
      .filter(relation =>
        isActive(relation) &&
        key(relation.estructura_id) === key(structureId) &&
        (!key(selectedLocalId) || key(relation.local_id) === key(selectedLocalId))
      )
      .slice()
      .sort((a, b) =>
        key(a.referencia).localeCompare(key(b.referencia), 'es', { sensitivity: 'base' })
      );

    relations.forEach(relation => {
      const option = document.createElement('option');
      option.value = key(relation.id);
      option.textContent = [relation.local_name, relation.referencia]
        .filter(Boolean).join(' — ') || 'Ubicación registrada';
      select.appendChild(option);
    });

    const selectedExists = relations.some(relation => key(relation.id) === key(selectedRelationId));
    select.value = selectedExists
      ? key(selectedRelationId)
      : (relations.length === 1 ? key(relations[0].id) : '');

    const needsChoice = relations.length > 1;
    select.disabled = relations.length <= 1;
    select.required = needsChoice;
    if (wrapper) wrapper.hidden = !needsChoice;
  }

  function renderFormHierarchy(sedeId, selectedPath, selectedRelationId, suffix = '', selectedLocalId = '') {
    const container = document.getElementById('directoryFormHierarchy' + suffix);
    const relationSelect = document.getElementById('directoryFormLocal' + suffix);
    if (!container) return;
    container.replaceChildren();

    const scopes = state.formScopes || [];
    const plan = _directoryGetAccessFilterPlan_({ scopes }, sedeId);
    const path = Array.isArray(selectedPath) ? selectedPath.slice() : [];
    let selectedStructureId = '';
    let initialParentId = '';

    if (plan.entryScope === 'ESTRUCTURA_ORG') {
      // El punto de entrada se determina por las referencias del ámbito que
      // pertenecen a la sede seleccionada, no por el total de sedes autorizadas.
      const siteStructureScopes = plan.structureScopes.filter(scope => {
        const root = (state.catalogs.estructuraOrg || []).find(node =>
          key(node.id) === key(scope.referenceId)
        );
        return root && key(root.sede_id) === key(sedeId);
      });
      const rootIds = siteStructureScopes.map(scope => key(scope.referenceId));
      const rootIndex = path.findIndex(id => rootIds.includes(key(id)));
      if (rootIndex >= 0) {
        path.splice(0, siteStructureScopes.length === 1 ? rootIndex + 1 : rootIndex);
      }

      if (siteStructureScopes.length === 1) {
        const scope = siteStructureScopes[0];
        const rootId = key(scope.referenceId);
        selectedStructureId = rootId;
        if (scope.includeDescendants) initialParentId = rootId;
        else path.length = 0;
      }
    }

    function appendLevel(parentId, level) {
      const nodes = getFormHierarchyNodes(parentId, sedeId, selectedLocalId);
      if (!nodes.length) return;

      const wrapper = document.createElement('div');
      wrapper.className = 'sunarp-form-field directory-form-hierarchy-level';
      const label = document.createElement('label');
      const select = document.createElement('select');
      const selectId = 'directoryFormHierarchySelect' + suffix + '_' + level;

      label.htmlFor = selectId;
      label.textContent = getHierarchyLabel(nodes, level);
      select.id = selectId;
      select.className = 'sunarp-select directory-form-hierarchy-select';

      const placeholder = document.createElement('option');
      placeholder.value = '';
      placeholder.textContent = level === 0 ? 'Selecciona una opción' : 'Selecciona una dependencia';
      select.appendChild(placeholder);

      nodes.forEach(node => {
        const option = document.createElement('option');
        option.value = key(node.id);
        option.textContent = key(node.name) || key(node.id);
        select.appendChild(option);
      });

      const previous = key(path[level]);
      const exists = nodes.some(node => key(node.id) === previous);
      const selectedValue = exists ? previous : '';
      if (!exists && previous) path.splice(level);
      select.value = selectedValue;

      select.addEventListener('change', () => {
        path.splice(level);
        if (select.value) path.push(select.value);
        renderFormHierarchy(sedeId, path, '', suffix, selectedLocalId);
      });

      wrapper.append(label, select);
      container.appendChild(wrapper);
      if (selectedValue) {
        selectedStructureId = selectedValue;
        appendLevel(selectedValue, level + 1);
      }
    }

    if (plan.hierarchyMode !== 'none') appendLevel(initialParentId, 0);
    if (path.length) selectedStructureId = path[path.length - 1];

    renderFormLocalOptions(
      selectedStructureId,
      selectedRelationId,
      (plan.entryScope === 'SITE' || plan.entryScope === 'LOCAL') ? selectedLocalId : '',
      suffix
    );

    if (relationSelect && !selectedStructureId) {
      relationSelect.value = '';
      const wrapper = relationSelect.closest('.sunarp-form-field');
      if (wrapper) wrapper.hidden = true;
    }
  }

    const localScopes = scopes.filter(scope => scope.type === 'LOCAL' && scope.referenceId);
    const totalScope = scopes.some(scope => scope.type === 'TOTAL');
    const structureMapForScope = new Map((state.catalogs.estructuraOrg || []).map(node => [key(node.id), node]));
    const localMapForScope = new Map((state.catalogs.locales || []).map(node => [key(node.id), node]));
    const allowedSiteIds = new Set(siteScopes.map(scope => key(scope.referenceId)));
    structureScopes.forEach(scope => {
      const node = structureMapForScope.get(key(scope.referenceId));
      if (node && node.sede_id) allowedSiteIds.add(key(node.sede_id));
    });
    localScopes.forEach(scope => {
      const node = localMapForScope.get(key(scope.referenceId));

    const fixedSiteId = !totalScope && allowedSiteIds.size === 1 ? Array.from(allowedSiteIds)[0] : '';

    const canChooseSite = totalScope || allowedSiteIds.size > 1;
    const cargoOptions = state.catalogs.cargos

    const selectedMode = record && key(record.local_id) && key(record.estructura_local_id)

        : 'structure';

    const directLocalOptions = state.catalogs.locales
      .filter(local => (totalScope || siteScopes.length || structureScopes.length
          ? (totalScope || allowedSiteIds.has(key(local.sede_id)))
          : (localScopes.length ? localScopes.some(scope => key(scope.referenceId) === key(local.id)) : false))
        && local.active !== false && local.active !== 0 &&
        String(local.active).toLowerCase() !== 'false')
      .slice().sort(sortByName)
      .map(local => `<option value="${escapeHtml(local.id)}" ${record && key(record.local_id) === key(local.id) ? 'selected' : ''}>${escapeHtml(local.name)}</option>`)
      .join('');

    return {

          <div class="sunarp-form-field">

          </div>

              ${(state.catalogs.documentTypes || []).map(item => `
                <option value="${escapeHtml(item.id)}" ${key(record?.tipo_documento) === key(item.id) ? 'selected' : ''}>${escapeHtml(item.name)}</option>

                    <div id="directoryAssignmentsContainer">

<div class="sunarp-form-field">

            <select
