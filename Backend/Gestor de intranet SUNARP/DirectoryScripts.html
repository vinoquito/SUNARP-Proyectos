<script>
  /**
   * Devuelve las estructuras reales que deben aparecer en los filtros:
   * las unidades con asignaciones coincidentes y sus ancestros reales.
   * Los ancestros son seleccionables; nunca se crean opciones de contexto.
   */
  /**
   * Devuelve todos los nodos reales que forman las rutas hacia asignaciones
   * autorizadas. Incluye ancestros intermedios aunque no tengan asignaciones
   * propias: omitirlos aplana la jerarquía y muestra nietos como hermanos.
   * No incluye ramas sin registros autorizados ni cruza límites de sede.
   */
  /**
   * Construye los nodos orgánicos navegables a partir de asignaciones ya
   * autorizadas. Conserva los padres reales y respeta cada raíz de ámbito.
   */
  function _directoryBuildHierarchyFilterSets_(records, structures, filterContract, siteId) {
    const site = String(siteId || '').trim();
    const scopes = filterContract && Array.isArray(filterContract.scopes)
      ? filterContract.scopes
      : [];
    const hasTotalScope = scopes.some(scope => scope.type === 'TOTAL');
    const hasBroadSiteScope = hasTotalScope || scopes.some(scope =>
      scope.type === 'SEDE' && String(scope.referenceId || '').trim() === site
    );
    const structureScopes = scopes.filter(scope =>
      scope.type === 'ESTRUCTURA_ORG' && String(scope.referenceId || '').trim()
    );

    if ((!site && !hasTotalScope) || (!hasBroadSiteScope && !structureScopes.length)) {
      return new Set();
    }

    const keyOf = value => String(value === null || value === undefined ? '' : value).trim();
    const structureMap = new Map((structures || []).map(node => [
      keyOf(node && node.id), node
    ]).filter(entry => entry[0]));
    const selectableIds = new Set();

    const addPathWithinScope = (structureId, expectedSiteId, scopeRootId) => {
      const path = [];
      const visited = new Set();
      let current = structureMap.get(keyOf(structureId));
      let reachedScopeRoot = false;

      while (current) {
        const id = keyOf(current.id);
        if (!id || visited.has(id) || keyOf(current.sede_id) !== expectedSiteId) return false;
        visited.add(id);
        path.push(id);
        if (id === scopeRootId) {
          reachedScopeRoot = true;
          break;
        }
        const parentId = keyOf(current.parent_id);
        if (!parentId) break;
        const parent = structureMap.get(parentId);
        if (!parent || keyOf(parent.sede_id) !== expectedSiteId) break;
        current = parent;
      }

      if (!reachedScopeRoot) return false;
      path.forEach(id => selectableIds.add(id));
      return true;
    };

    (records || []).forEach(record => {
      const recordSite = keyOf(record && (record.filter_sede_id || record.sede_id));
      const structureId = keyOf(record && record.estructura_id);
      if ((site && recordSite !== site) || !recordSite || !structureId) return;

      const structure = structureMap.get(structureId);
      if (!structure || keyOf(structure.sede_id) !== recordSite) return;

      if (hasBroadSiteScope) {
        let current = structure;
        const visited = new Set();
        while (current) {
          const id = keyOf(current.id);
          if (!id || visited.has(id) || keyOf(current.sede_id) !== recordSite) break;
          visited.add(id);
          selectableIds.add(id);
          const parentId = keyOf(current.parent_id);
          const parent = parentId ? structureMap.get(parentId) : null;
          current = parent && keyOf(parent.sede_id) === recordSite ? parent : null;
        }
        return;
      }

      structureScopes.forEach(scope => {
        const rootId = keyOf(scope.referenceId);
        const root = structureMap.get(rootId);
        if (!root || keyOf(root.sede_id) !== recordSite) return;
        const includeDescendants = scope.includeDescendants === true;
        if (structureId === rootId) {
          selectableIds.add(rootId);
          return;
        }
        if (includeDescendants) {
          addPathWithinScope(structureId, recordSite, rootId);
        }
      });
    });

    return selectableIds;
  }

  function _directoryGetSelectableHierarchyChildren_(parentId, hierarchyIndex, selectableIds) {
    const keyOf = value => String(value === null || value === undefined ? '' : value).trim();
    const parentKey = keyOf(parentId);
    if (!parentKey || !hierarchyIndex || !hierarchyIndex.structureById) return [];

    const parent = hierarchyIndex.structureById.get(parentKey);
    if (!parent) return [];
    const parentSiteId = keyOf(parent.sede_id);
    const allowedIds = selectableIds instanceof Set ? selectableIds : new Set();

    return (hierarchyIndex.childrenByParent.get(parentKey) || []).filter(node =>
      keyOf(node && node.sede_id) === parentSiteId &&
      allowedIds.has(keyOf(node && node.id))
    );
  }

  function _directoryGetHierarchyDisplayPath_(node, structures) {
    const structureMap = new Map((structures || []).map(item => [
      String(item.id || '').trim(), item
    ]));
    const parts = [];
    const visited = new Set();
    const expectedSiteId = String(node && node.sede_id || '').trim();
    let current = node;
    while (current) {
      const id = String(current.id || '').trim();
      if (!id || visited.has(id)) break;
      if (String(current.sede_id || '').trim() !== expectedSiteId) break;
      visited.add(id);
      const name = String(current.name || '').trim();
      if (name) parts.unshift(name);
      const parentId = String(current.parent_id || '').trim();
      current = parentId ? structureMap.get(parentId) || null : null;
    }
    return parts.join(' / ');
  }

  /**
   * Precalcula una sola vez las relaciones usadas por filtros y tabla.
   * La pertenencia a un subárbol se resuelve con intervalos DFS O(1), y
   * las opciones por local se derivan únicamente de asignaciones reales.
   */
  function _directoryBuildHierarchyClientIndex_(records, structures) {
    const keyOf = value => String(value === null || value === undefined ? '' : value).trim();
    const nodes = Array.isArray(structures) ? structures : [];
    const structureById = new Map();
    nodes.forEach(node => {
      const id = keyOf(node && node.id);
      if (id) structureById.set(id, node);
    });

    const childrenByParent = new Map();
    nodes.forEach(node => {
      const id = keyOf(node && node.id);
      if (!id || structureById.get(id) !== node) return;
      const parentId = keyOf(node.parent_id);
      if (!childrenByParent.has(parentId)) childrenByParent.set(parentId, []);
      childrenByParent.get(parentId).push(node);
    });
    const compareNodes = (a, b) => {
      const orderA = Number(a.order);
      const orderB = Number(b.order);
      const normalizedA = Number.isFinite(orderA) ? orderA : Number.MAX_SAFE_INTEGER;
      const normalizedB = Number.isFinite(orderB) ? orderB : Number.MAX_SAFE_INTEGER;
      return normalizedA - normalizedB ||
        String(a.name || '').localeCompare(String(b.name || ''), 'es', { sensitivity: 'base' }) ||
        keyOf(a.id).localeCompare(keyOf(b.id));
    };
    childrenByParent.forEach(children => children.sort(compareNodes));

    const structurePathById = new Map();
    const resolvePath = structureId => {
      const startId = keyOf(structureId);
      if (!startId) return [];
      if (structurePathById.has(startId)) return structurePathById.get(startId);
      const first = structureById.get(startId);
      if (!first) return [];
      const expectedSiteId = keyOf(first.sede_id);
      const reversePath = [];
      const visited = new Set();
      let current = first;
      while (current) {
        const id = keyOf(current.id);
        if (!id || visited.has(id) || keyOf(current.sede_id) !== expectedSiteId) break;
        visited.add(id);
        reversePath.push(current);
        const parentId = keyOf(current.parent_id);
        const parent = parentId ? structureById.get(parentId) : null;
        current = parent && keyOf(parent.sede_id) === expectedSiteId ? parent : null;
      }
      const path = reversePath.reverse();
      path.forEach((node, index) => {
        const id = keyOf(node.id);
        if (!structurePathById.has(id)) structurePathById.set(id, path.slice(0, index + 1));
      });
      if (!structurePathById.has(startId)) structurePathById.set(startId, path);
      return structurePathById.get(startId);
    };
    nodes.forEach(node => resolvePath(node && node.id));

    const entryIndexByStructureId = new Map();
    const subtreeIntervalsByStructureId = new Map();
    const visiting = new Set();
    const visited = new Set();
    let cursor = 0;
    const visit = node => {
      const id = keyOf(node && node.id);
      if (!id || visiting.has(id) || visited.has(id)) return;
      visiting.add(id);
      const start = cursor++;
      entryIndexByStructureId.set(id, start);
      const siteId = keyOf(node.sede_id);
      (childrenByParent.get(id) || []).forEach(child => {
        if (keyOf(child.sede_id) === siteId) visit(child);
      });
      subtreeIntervalsByStructureId.set(id, { start, end: cursor });
      visiting.delete(id);
      visited.add(id);
    };
    nodes.forEach(node => {
      const parentId = keyOf(node && node.parent_id);
      const parent = parentId ? structureById.get(parentId) : null;
      if (!parent || keyOf(parent.sede_id) !== keyOf(node.sede_id)) visit(node);
    });
    nodes.forEach(visit);

    const recordsByLocal = new Map();
    const localOptionsById = new Map();
    const selectableByLocal = new Map();
    (Array.isArray(records) ? records : []).forEach(record => {
      const siteId = keyOf(record.filter_sede_id || record.sede_id);
      const localId = keyOf(record.filter_local_id || record.local_id);
      if (!siteId || !localId) return;
      if (!recordsByLocal.has(localId)) recordsByLocal.set(localId, []);
      recordsByLocal.get(localId).push(record);
      if (!localOptionsById.has(localId)) {
        localOptionsById.set(localId, {
          id: localId,
          name: keyOf(record.local_name) || localId
        });
      }
      const structureId = keyOf(record.estructura_id);
      if (!structureId) return;
      const structure = structureById.get(structureId);
      if (!structure || keyOf(structure.sede_id) !== siteId) return;
      if (!selectableByLocal.has(localId)) selectableByLocal.set(localId, new Set());
      // Los ancestros se conservan en structurePathById para trazabilidad,
      // pero solo se ofrecen estructuras con asignaciones autorizadas.
      selectableByLocal.get(localId).add(structureId);
    });

    return {
      structureById,
      childrenByParent,
      structurePathById,
      entryIndexByStructureId,
      subtreeIntervalsByStructureId,
      recordsByLocal,
      localOptionsById,
      selectableByLocal
    };
  }

  /**
   * Construye las estructuras navegables para el local elegido a partir de
   * asignaciones ya autorizadas. Añade ancestros reales de parent_id para
   * conservar las rutas, sin heredarles la ubicación física del descendiente.
   */
  /**
 * Determina desde qué nivel de la jerarquía debe comenzar la exploración.
 * Los filtros ancestros al ámbito concedido no se muestran como selectores.
 */
function _directoryGetAccessFilterPlan_(filterContract, siteId) {
  const keyOf = value => String(value === null || value === undefined ? '' : value).trim();
  const scopes = filterContract && Array.isArray(filterContract.scopes)
    ? filterContract.scopes
    : [];
  const site = keyOf(siteId);
  const hasBroadSiteScope = scopes.some(scope =>
    scope && (
      scope.type === 'TOTAL' ||
      (scope.type === 'SEDE' && keyOf(scope.referenceId) === site)
    )
  );
  const localScopeIds = Array.from(new Set(scopes
    .filter(scope => scope && scope.type === 'LOCAL')
    .map(scope => keyOf(scope.referenceId))
    .filter(Boolean)));
  const structureScopes = scopes.filter(scope =>
    scope && scope.type === 'ESTRUCTURA_ORG' && keyOf(scope.referenceId)
  );

  if (hasBroadSiteScope) {
    return {
      entryScope: 'SITE',
      localMode: 'selectable',
      hierarchyMode: 'local',
      localScopeIds,
      structureScopes
    };
  }
  if (structureScopes.length) {
    return {
      entryScope: 'ESTRUCTURA_ORG',
      localMode: 'hidden',
      hierarchyMode: 'structure-scope',
      localScopeIds,
      structureScopes
    };
  }
  if (localScopeIds.length === 1) {
    return {
      entryScope: 'LOCAL',
      localMode: 'fixed',
      hierarchyMode: 'local',
      localScopeIds,
      structureScopes
    };
  }
  if (localScopeIds.length > 1) {
    return {
      entryScope: 'LOCAL',
      localMode: 'selectable-scoped',
      hierarchyMode: 'local',
      localScopeIds,
      structureScopes
    };
  }
  return {
    entryScope: 'NONE',
    localMode: 'hidden',
    hierarchyMode: 'none',
    localScopeIds: [],
    structureScopes
  };
}


function _directoryBuildLocalHierarchyFilterSets_(records, structures, localId, siteId) {
    const keyOf = value => String(value === null || value === undefined ? '' : value).trim();
    const selectedLocalId = keyOf(localId);
    const selectedSiteId = keyOf(siteId);
    const structureMap = new Map((Array.isArray(structures) ? structures : []).map(node => [
      keyOf(node && node.id), node
    ]).filter(entry => entry[0]));
    const selectableIds = new Set();
    if (!selectedLocalId || !selectedSiteId) return selectableIds;

    (Array.isArray(records) ? records : []).forEach(record => {
      if (keyOf(record && (record.filter_local_id || record.local_id)) !== selectedLocalId) return;
      if (keyOf(record && (record.filter_sede_id || record.sede_id)) !== selectedSiteId) return;
      let current = structureMap.get(keyOf(record && record.estructura_id));
      const visited = new Set();
      while (current) {
        const id = keyOf(current.id);
        if (!id || visited.has(id) || keyOf(current.sede_id) !== selectedSiteId) break;
        visited.add(id);
        selectableIds.add(id);
        const parentId = keyOf(current.parent_id);
        const parent = parentId ? structureMap.get(parentId) : null;
        current = parent && keyOf(parent.sede_id) === selectedSiteId ? parent : null;
      }
    });
    return selectableIds;
  }

  function _directoryMatchesHierarchySubtree_(recordStructureId, selectedStructureId, index) {
    const selectedId = String(selectedStructureId || '').trim();
    const recordId = String(recordStructureId || '').trim();
    if (!selectedId || !recordId || !index) return false;
    const interval = index.subtreeIntervalsByStructureId.get(selectedId);
    const recordIndex = index.entryIndexByStructureId.get(recordId);
    return Boolean(interval && recordIndex !== undefined &&
      recordIndex >= interval.start && recordIndex < interval.end);
  }

  /**
 * GESTOR DE INTRANET SUNARP
 * Módulo: Información de personal
 *
 * Operaciones:
 * - Listar servidores.
 * - Buscar y filtrar.
 * - Registrar.
 * - Editar.
 * - Desactivar.
 * - Reactivar.
 *
 * Interfaz: SUNARP UI.
 * Operaciones de datos: SUNARP Core.
 * Reglas particulares: DirectoryService.gs.
 */

const DirectoryPage = (() => {

  const DIRECTORY_SITE_CLIENT_CACHE_TTL_MS = 600000;
  const DIRECTORY_SITE_CLIENT_CACHE_MAX_ENTRIES = 5;

  const state = {
    records: [],
    catalogs: null,
    authorizedSedes: [],
    hasTotalScope: false,
    table: null,
    hierarchyPath: [],
    hierarchyIndex: null,
    hierarchySelectableIds: new Set(),
    activeSedeId: '',
    siteDataCache: new Map(),
    contextWarmupPromise: null,
    siteRequestId: 0,
    siteLoading: false,
    loading: false,
    loaded: false,
    eventsBound: false,
    pageActionsActive: false
  };


  /* =====================================================
     1. COMUNICACIÓN CON EL SERVIDOR
     ===================================================== */

  function callServer(functionName, ...args) {
    return new Promise((resolve, reject) => {

      const runner = google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(reject);

      runner[functionName](...args);

    });
  }


  function notify(type, message) {
    if (window.SUNARPUI &&
        typeof SUNARPUI.notify === 'function') {
      SUNARPUI.notify(type, message);
    }
  }


  function escapeHtml(value) {
    return String(value ?? '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }


  function key(value) {
    return String(value ?? '').trim();
  }


  function isActive(record) {
    return !(
      record.active === false ||
      record.active === 0 ||
      String(record.active).toLowerCase() === 'false' ||
      String(record.active) === '0'
    );
  }


  /* =====================================================
     2. ELEMENTOS DE LA VISTA
     ===================================================== */

  function getElements() {
    return {
      sedeFilter: document.getElementById(
        'directorySedeFilter'
      ),

      localFilter: document.getElementById(
        'directoryLocalFilter'
      ),

      hierarchyFilters: document.getElementById(
        'directoryHierarchyFilters'
      ),

      cargoFilter: document.getElementById(
        'directoryCargoFilter'
      ),

      table: document.getElementById(
        'directoryTableContainer'
      )
    };
  }



  /* =====================================================
     3. FILTROS DINÁMICOS DE SEDE, JERARQUÍA Y CARGO
     ===================================================== */

  function sortByName(a, b) {
    return String(a.name || '').localeCompare(
      String(b.name || ''),
      'es',
      { sensitivity: 'base' }
    );
  }


  /**
   * Devuelve la ruta orgánica completa de un servidor.
   * Ejemplo: Órgano -> Oficina -> Unidad.
   */
  function getRecordStructurePath(record) {
    const index = state.hierarchyIndex;
    return index
      ? index.structurePathById.get(key(record && record.estructura_id)) || []
      : [];
  }


  function recordMatchesHierarchyPath(record, path) {
    if (!path || !path.length) return true;
    const selectedId = key(path[path.length - 1]);
    return _directoryMatchesHierarchySubtree_(
      record && record.estructura_id,
      selectedId,
      state.hierarchyIndex
    );
  }


  /**
   * Aplica una selección orgánica respetando el alcance de la raíz del
   * ámbito. Una referencia sin descendientes filtra solo su propia unidad,
   * aunque exista otra autorización independiente sobre un nodo hijo.
   */
  function _directoryMatchesHierarchySelection_(recordStructureId, hierarchyPath, scopes, hierarchyIndex) {
    if (!Array.isArray(hierarchyPath) || !hierarchyPath.length) return true;
    const keyOf = value => String(value === null || value === undefined ? '' : value).trim();
    const rootId = keyOf(hierarchyPath[0]);
    const selectedId = keyOf(hierarchyPath[hierarchyPath.length - 1]);
    if (!rootId || !selectedId) return true;

    const rootScopes = (Array.isArray(scopes) ? scopes : []).filter(scope =>
      scope && scope.type === 'ESTRUCTURA_ORG' &&
      keyOf(scope.referenceId) === rootId
    );
    const rootIsExactOnly = rootScopes.length > 0 &&
      !rootScopes.some(scope => scope.includeDescendants === true);

    if (hierarchyPath.length === 1 && rootIsExactOnly) {
      return keyOf(recordStructureId) === rootId;
    }
    return _directoryMatchesHierarchySubtree_(
      recordStructureId, selectedId, hierarchyIndex
    );
  }

  /**
   * Aplica los filtros seleccionados.
   *
   * excludedFilters permite excluir uno de los filtros
   * para calcular las opciones disponibles de ese filtro
   * a partir de los otros dos.
   */
  function getRecordsForFilters(excludedFilters) {
    const excluded = excludedFilters || new Set();
    const elements = getElements();
    const siteId = elements.sedeFilter ? key(elements.sedeFilter.value) : '';
    const localId = elements.localFilter ? key(elements.localFilter.value) : '';
    const cargoId = elements.cargoFilter ? key(elements.cargoFilter.value) : '';
    const selectedHierarchyPath = !excluded.has('hierarchy')
      ? state.hierarchyPath
      : [];
    const contract = state.catalogs && state.catalogs.filterContract;
    const hierarchyScopes = contract && Array.isArray(contract.scopes)
      ? contract.scopes
      : [];
    return state.records.filter(record => {
      const recordSiteId = key(record.filter_sede_id || record.sede_id);
      const recordLocalId = key(record.filter_local_id || record.local_id);
      if (!excluded.has('sede') && siteId && recordSiteId !== siteId) return false;
      if (!excluded.has('local') && localId && recordLocalId !== localId) return false;
      if (!excluded.has('cargo') && cargoId && key(record.cargo_id) !== cargoId) return false;
      if (selectedHierarchyPath.length && !_directoryMatchesHierarchySelection_(
        record.estructura_id,
        selectedHierarchyPath,
        hierarchyScopes,
        state.hierarchyIndex
      )) return false;
      return true;
    });
  }

  function getUsedCatalogItems(records, field, catalog) {
    const usedIds = new Set(
      records
        .map(record => key(record[field]))
        .filter(Boolean)
    );

    return (catalog || [])
      .filter(item => usedIds.has(key(item.id)))
      .sort(sortByName);
  }


  /**
   * Actualiza las opciones de un selector y conserva
   * su selección si todavía está disponible.
   */
  function updateFilterOptions(select, placeholder, items) {
    if (!select) return;

    const selectedValue = key(select.value);

    select.replaceChildren();

    const defaultOption = document.createElement('option');

    defaultOption.value = '';
    defaultOption.textContent = placeholder;

    select.appendChild(defaultOption);

    items.forEach(item => {
      const option = document.createElement('option');

      option.value = key(item.id);
      option.textContent = item.name;

      select.appendChild(option);
    });

    const selectionExists = items.some(item =>
      key(item.id) === selectedValue
    );

    select.value = selectionExists ? selectedValue : '';
  }


  /**
   * Sedes utilizadas por los registros que cumplen
   * los filtros de cargo y jerarquía.
   */
  function populateSedeFilter() {
    const select = getElements().sedeFilter;
    if (!select) return;
    const sedes = (state.authorizedSedes || [])
      .filter(item => isActive(item))
      .slice()
      .sort(sortByName);
    const isTotalSelection = state.hasTotalScope === true;
    const fixedSingleSede = !isTotalSelection && sedes.length === 1;
    const placeholder = isTotalSelection
      ? 'Seleccione una opción'
      : fixedSingleSede
        ? 'Sede determinada por el ámbito autorizado'
        : 'Seleccione una sede';
    updateFilterOptions(select, placeholder, sedes);
    const wrapper = select.closest('.sunarp-filter');
    if (fixedSingleSede) select.value = key(sedes[0].id);
    else if (isTotalSelection) select.value = '';
    select.disabled = sedes.length === 0 || (!isTotalSelection && fixedSingleSede);
    if (wrapper) wrapper.hidden = fixedSingleSede;
  }

  /**
   * Muestra Local solo cuando es un nivel descendiente del ámbito concedido.
   * Los ámbitos ESTRUCTURA_ORG comienzan directamente en la estructura
   * autorizada; un ámbito LOCAL fija el local o limita el selector a sus
   * referencias explícitas.
   */
  function populateLocalFilter() {
    const select = getElements().localFilter;
    if (!select) return;
    const elements = getElements();
    const siteId = key(elements.sedeFilter && elements.sedeFilter.value);
    const hasLoadedSite = Boolean(siteId && siteId === state.activeSedeId);
    const wrapper = select.closest('.sunarp-filter');
    const filterContract = state.catalogs && state.catalogs.filterContract || {};
    const plan = _directoryGetAccessFilterPlan_(filterContract, siteId);

    if (!hasLoadedSite || plan.localMode === 'hidden' || plan.localMode === 'fixed') {
      const scopedLocalId = plan.localMode === 'fixed' ? plan.localScopeIds[0] : '';
      const fixedLocal = scopedLocalId
        ? (state.catalogs.locales || []).find(local => key(local.id) === scopedLocalId)
        : null;
      updateFilterOptions(
        select,
        scopedLocalId ? 'Local determinado por el ámbito autorizado' : 'Locales de la información autorizada',
        fixedLocal ? [fixedLocal] : []
      );
      if (scopedLocalId && fixedLocal) select.value = scopedLocalId;
      else select.value = '';
      select.disabled = true;
      if (wrapper) wrapper.hidden = true;
      return;
    }

    const usedLocalIds = new Set(getRecordsForFilters(
      new Set(['local', 'cargo', 'hierarchy'])
    ).map(record => key(record.filter_local_id || record.local_id)).filter(Boolean));
    const permittedLocalIds = plan.localMode === 'selectable-scoped'
      ? new Set(plan.localScopeIds)
      : null;
    const locals = (state.catalogs.locales || []).filter(local =>
      isActive(local) &&
      key(local.sede_id) === siteId &&
      usedLocalIds.has(key(local.id)) &&
      (!permittedLocalIds || permittedLocalIds.has(key(local.id)))
    );

    updateFilterOptions(select, 'Seleccione un local', locals);
    // Para varios ámbitos LOCAL, si solo uno tiene registros, no se obliga
    // a elegir un selector que no ofrece una alternativa real.
    if (plan.localMode === 'selectable-scoped' && locals.length === 1) {
      select.value = key(locals[0].id);
      select.disabled = true;
      if (wrapper) wrapper.hidden = true;
    } else {
      select.disabled = locals.length === 0;
      if (wrapper) wrapper.hidden = locals.length === 0;
    }
  }


  function populateCargoFilter() {
    const select = getElements().cargoFilter;
    if (!select) return;
    const elements = getElements();
    const siteId = key(elements.sedeFilter && elements.sedeFilter.value);
    const hasLoadedSite = Boolean(siteId && siteId === state.activeSedeId);
    const wrapper = select.closest('.sunarp-filter');
    if (!hasLoadedSite) {
      updateFilterOptions(select, 'Cargos de la información autorizada', []);
      select.disabled = true;
      if (wrapper) wrapper.hidden = true;
      return;
    }
    const options = new Map();
    getRecordsForFilters(new Set(['cargo'])).forEach(record => {
      const id = key(record.cargo_id);
      if (!id || options.has(id)) return;
      options.set(id, { id, name: key(record.cargo_name) || id });
    });
    const cargos = Array.from(options.values()).sort(sortByName);
    updateFilterOptions(select, 'Todos los cargos autorizados', cargos);
    select.disabled = cargos.length <= 1;
    if (wrapper) wrapper.hidden = cargos.length === 0;
  }

  function getHierarchyFilterSets() {
    return { selectableIds: state.hierarchySelectableIds || new Set() };
  }

  /**
   * Obtiene las raíces ESTRUCTURA_ORG visibles para la sede activa.
   * Elimina referencias redundantes cubiertas por una raíz ancestro que
   * ya concede acceso a sus descendientes.
   */
  function _directoryGetHierarchyScopeRoots_(scopes, hierarchyIndex, selectableIds, siteId) {
    const keyOf = value => String(value === null || value === undefined ? '' : value).trim();
    const site = keyOf(siteId);
    const byId = new Map();
    (Array.isArray(scopes) ? scopes : []).forEach(scope => {
      if (!scope || scope.type !== 'ESTRUCTURA_ORG') return;
      const id = keyOf(scope.referenceId);
      if (!id || !selectableIds.has(id)) return;
      const node = hierarchyIndex && hierarchyIndex.structureById
        ? hierarchyIndex.structureById.get(id)
        : null;
      if (!node || keyOf(node.sede_id) !== site) return;
      const current = byId.get(id);
      byId.set(id, {
        referenceId: id,
        includeDescendants: Boolean(scope.includeDescendants || (current && current.includeDescendants)),
        node
      });
    });

    const roots = Array.from(byId.values());
    const visibleRoots = roots.filter(candidate => !roots.some(other =>
      other.referenceId !== candidate.referenceId &&
      other.includeDescendants &&
      _directoryMatchesHierarchySubtree_(
        candidate.referenceId,
        other.referenceId,
        hierarchyIndex
      )
    ));
    // El orden de los ámbitos no representa el orden institucional.
    // Las raíces autorizadas se presentan según estructura_org.order.
    visibleRoots.sort((a, b) => {
      const rawOrderA = a.node.order;
      const rawOrderB = b.node.order;
      const orderA = rawOrderA === null || rawOrderA === undefined ||
        String(rawOrderA).trim() === '' ? Number.MAX_SAFE_INTEGER : Number(rawOrderA);
      const orderB = rawOrderB === null || rawOrderB === undefined ||
        String(rawOrderB).trim() === '' ? Number.MAX_SAFE_INTEGER : Number(rawOrderB);
      const normalizedA = Number.isFinite(orderA) ? orderA : Number.MAX_SAFE_INTEGER;
      const normalizedB = Number.isFinite(orderB) ? orderB : Number.MAX_SAFE_INTEGER;
      return normalizedA - normalizedB ||
        keyOf(a.node.name).localeCompare(keyOf(b.node.name), 'es', { sensitivity: 'base' }) ||
        keyOf(a.node.id).localeCompare(keyOf(b.node.id), 'es', { numeric: true, sensitivity: 'base' });
    });
    return visibleRoots;
  }

  function getHierarchyNodes(parentId) {
    const selectableIds = getHierarchyFilterSets().selectableIds;
    const index = state.hierarchyIndex;
    if (!index || !selectableIds.size) return [];

    const selectedParentId = key(parentId);
    const contract = state.catalogs && state.catalogs.filterContract;
    const scopes = contract && Array.isArray(contract.scopes) ? contract.scopes : [];
    const activeSiteId = key(state.activeSedeId);
    const accessPlan = _directoryGetAccessFilterPlan_(contract, activeSiteId);
    const broadScope = accessPlan.hierarchyMode === 'local';

    if (selectedParentId) {
      if (!selectableIds.has(selectedParentId)) return [];
      return _directoryGetSelectableHierarchyChildren_(
        selectedParentId, index, selectableIds
      );
    }

    if (!broadScope) {
      const scopeRoots = _directoryGetHierarchyScopeRoots_(
        scopes, index, selectableIds, activeSiteId
      );
      if (scopeRoots.length === 1) {
        const root = scopeRoots[0];
        return root.includeDescendants
          ? _directoryGetSelectableHierarchyChildren_(root.referenceId, index, selectableIds)
          : [];
      }
      return scopeRoots.map(item => item.node);
    }

    const roots = Array.from(index.structureById.values()).filter(node => {
      const parentId = key(node && node.parent_id);
      if (!parentId) return true;
      const parent = index.structureById.get(parentId);
      return !parent || key(parent.sede_id) !== key(node.sede_id);
    });
    roots.sort((a, b) => {
      const orderA = Number(a.order);
      const orderB = Number(b.order);
      const normalizedA = Number.isFinite(orderA) ? orderA : Number.MAX_SAFE_INTEGER;
      const normalizedB = Number.isFinite(orderB) ? orderB : Number.MAX_SAFE_INTEGER;
      return normalizedA - normalizedB ||
        key(a.name).localeCompare(key(b.name), 'es', { sensitivity: 'base' }) ||
        key(a.id).localeCompare(key(b.id));
    });
    return roots.filter(node => selectableIds.has(key(node && node.id)));
  }

  function getHierarchyLabel(nodes, level) {
    const types = [
      ...new Set(
        nodes
          .map(node => key(node.tipo_estructura_name))
          .filter(Boolean)
      )
    ];

    if (types.length === 1) {
      return types[0].charAt(0).toLocaleUpperCase() +
        types[0].slice(1);
    }

    return level === 0
      ? 'Órgano o dependencia'
      : 'Unidad o dependencia';
  }


  /**
   * Construye un selector para cada nivel jerárquico.
   */
  function appendHierarchyLevel(parentId, level) {
    const container = getElements().hierarchyFilters;

    if (!container) return;

    const nodes = getHierarchyNodes(parentId);

    if (!nodes.length) return;

    const wrapper = document.createElement('div');

    wrapper.className = 'sunarp-filter';

    const selectId = `directoryHierarchyFilter${level}`;

    const label = document.createElement('label');

    label.htmlFor = selectId;
    label.textContent = getHierarchyLabel(nodes, level);

    const select = document.createElement('select');

    select.id = selectId;
    select.className = 'sunarp-select';

    const placeholder = document.createElement('option');

    placeholder.value = '';
    placeholder.textContent = level === 0
      ? 'Todas'
      : 'Todas las dependencias';

    select.appendChild(placeholder);

    nodes.forEach(node => {
      const option = document.createElement('option');
      const id = key(node.id);
      option.value = id;
      option.textContent = key(node.name) || id;
      select.appendChild(option);
    });

    const previousSelection =
      state.hierarchyPath[level] || '';

    const exists = nodes.some(node =>
      key(node.id) === key(previousSelection)
    );

    const selectedValue = exists
      ? key(previousSelection)
      : '';

    if (!exists && previousSelection) {
      state.hierarchyPath =
        state.hierarchyPath.slice(0, level);
    }

    select.value = selectedValue;

    select.addEventListener('change', () => {
      const value = key(select.value);

      state.hierarchyPath =
        state.hierarchyPath.slice(0, level);

      if (value) {
        state.hierarchyPath.push(value);
      }

      refreshDependentFilters('hierarchy');
    });

    wrapper.appendChild(label);
    wrapper.appendChild(select);

    container.appendChild(wrapper);

    if (selectedValue) {
      appendHierarchyLevel(selectedValue, level + 1);
    }
  }


  /**
   * Reconstruye los filtros jerárquicos.
   *
   * Solo utiliza registros que cumplen los filtros
   * de sede y cargo.
   */
  function renderHierarchyFilters() {
    const container = getElements().hierarchyFilters;
    if (!container) return;
    container.replaceChildren();
    const elements = getElements();
    const siteId = key(elements.sedeFilter && elements.sedeFilter.value);
    const localId = key(elements.localFilter && elements.localFilter.value);
    const hasLoadedSite = Boolean(siteId && siteId === state.activeSedeId);
    const filterContract = state.catalogs && state.catalogs.filterContract || {};
    const accessPlan = _directoryGetAccessFilterPlan_(filterContract, siteId);
    if (!hasLoadedSite || accessPlan.hierarchyMode === 'none') {
      state.hierarchyPath = [];
      state.hierarchySelectableIds = new Set();
      container.hidden = true;
      return;
    }

    if (accessPlan.hierarchyMode === 'structure-scope') {
      // El permiso ya identifica una estructura orgánica concreta. No se
      // exige ni se inventa un Local ancestro: la cascada comienza en los
      // hijos descendientes del nodo concedido.
      state.hierarchySelectableIds = _directoryBuildHierarchyFilterSets_(
        state.records,
        state.catalogs.estructuraOrg || [],
        filterContract,
        siteId
      );
    } else {
      // Para TOTAL/SEDE o LOCAL, Local sí es el nivel físico desde el que
      // corresponde abrir las ramas orgánicas.
      if (!localId) {
        state.hierarchyPath = [];
        state.hierarchySelectableIds = new Set();
        container.hidden = true;
        return;
      }
      state.hierarchySelectableIds = _directoryBuildLocalHierarchyFilterSets_(
        state.records, state.catalogs.estructuraOrg || [], localId, siteId
      );
    }
    const selectableIds = getHierarchyFilterSets().selectableIds;
    if (!selectableIds.size) {
      state.hierarchyPath = [];
      container.hidden = true;
      return;
    }
    appendHierarchyLevel('', 0);
    container.hidden = container.childElementCount === 0;
    if (container.hidden) state.hierarchyPath = [];
  }

  function hasAvailableFilterSelection(filter) {
    const elements = getElements();
    if (filter === 'sede') {
      const selected = key(elements.sedeFilter && elements.sedeFilter.value);
      return !selected || (state.catalogs.sedes || []).some(item => key(item.id) === selected);
    }
    if (filter === 'local') {
      const selected = key(elements.localFilter && elements.localFilter.value);
      return !selected || (state.catalogs.locales || []).some(item => key(item.id) === selected);
    }
    if (filter === 'cargo') {
      const selected = key(elements.cargoFilter && elements.cargoFilter.value);
      return !selected || (state.catalogs.cargos || []).some(item => key(item.id) === selected);
    }
    if (filter === 'hierarchy') {
      const selectableIds = getHierarchyFilterSets().selectableIds;
      return state.hierarchyPath.every(id => selectableIds.has(key(id)));
    }
    return true;
  }

  function refreshDependentFilters(changedFilter) {
    const startedAt = performance.now();
    if (changedFilter === 'sede') return;
    if (changedFilter === 'cargo') {
      renderTable();
      console.info('[DirectoryPage] Filtro actualizado:', {
        changedFilter,
        totalMs: Math.round(performance.now() - startedAt)
      });
      return;
    }
    if (changedFilter === 'local') state.hierarchyPath = [];
    const cargoStartedAt = performance.now();
    populateCargoFilter();
    const cargoOptionsMs = performance.now() - cargoStartedAt;
    const hierarchyStartedAt = performance.now();
    renderHierarchyFilters();
    const hierarchyOptionsMs = performance.now() - hierarchyStartedAt;
    renderTable();
    console.info('[DirectoryPage] Filtros dependientes actualizados:', {
      changedFilter,
      cargoOptionsMs: Math.round(cargoOptionsMs),
      hierarchyOptionsMs: Math.round(hierarchyOptionsMs),
      totalMs: Math.round(performance.now() - startedAt)
    });
  }

  function getFilteredRecords() {
    return getRecordsForFilters(new Set());
  }

  function getStructureDisplayParts(record) {
    const path = key(record && record.estructura_path);
    const names = path
      ? path.split(' / ').map(item => item.trim()).filter(Boolean)
      : [key(record && record.estructura_name)].filter(Boolean);
    return {
      primary: names[0] || '—',
      secondary: names.slice(1).join(' / ')
    };
  }


  function renderStackedTableCell(primaryValue, secondaryValue) {
    const wrapper = document.createElement('div');
    wrapper.className = 'directory-table-cell-stack';
    const primary = document.createElement('div');
    primary.textContent = key(primaryValue) || '—';
    wrapper.appendChild(primary);
    const secondaryText = key(secondaryValue);
    if (secondaryText) {
      const secondary = document.createElement('small');
      secondary.textContent = secondaryText;
      wrapper.appendChild(secondary);
    }
    return wrapper;
  }


  function prepareRows(records) {
    return records.map(record => {
      const structureDisplay = getStructureDisplayParts(record);
      return {
        ...record,
        servidor: [record.nombres, record.apellidos].filter(Boolean).join(' '),
        anexo_display:
          record.anexo === '' || record.anexo === null || record.anexo === undefined
            ? '—'
            : String(record.anexo),
        sede_display: record.sede_name || '—',
        local_display: record.local_name || '—',
        dependencia_display: record.estructura_path || record.estructura_name || '—',
        referencia_display: record.referencia || '',
        dependencia_primary_display: structureDisplay.primary,
        dependencia_secondary_display: structureDisplay.secondary,
        estado_display: isActive(record) ? 'Activo' : 'Inactivo'
      };
    });
  }


  /* =====================================================
     6. TABLA REUTILIZABLE
     ===================================================== */


    
  function renderTable() {
    const container = getElements().table;
    if (!container) return;

    if (!state.activeSedeId) {
      if (state.table) {
        state.table.destroy();
        state.table = null;
      }
      container.textContent = 'Selecciona una sede para consultar la información de personal.';
      return;
    }

    if (!window.SUNARPUI || typeof SUNARPUI.createDataTable !== 'function') {
      throw new Error('No está disponible el componente DataTable de SUNARP UI.');
    }

    const tableStartedAt = performance.now();
    const filterStartedAt = performance.now();
    const filteredRecords = getFilteredRecords();
    const filteringMs = performance.now() - filterStartedAt;
    const preparationStartedAt = performance.now();
    const preparedRows = prepareRows(filteredRecords);
    const rowPreparationMs = performance.now() - preparationStartedAt;
    const options = {
      containerId: 'directoryTableContainer',
      mode: 'client',
      data: preparedRows,
      emptyMessage: 'No se encontraron registros para los filtros seleccionados.',
      columns: [
        { key: 'servidor', label: 'Nombre', searchable: true },
        { key: 'cargo_name', label: 'Cargo', searchable: true },
        { key: 'sede_display', label: 'Sede', searchable: true },
        {
          key: 'local_display',
          label: 'Local',
          searchable: true,
          format: (_value, record) => [record.local_display, record.referencia_display].filter(Boolean).join(' '),
          render: (_value, record) => renderStackedTableCell(
            record.local_display,
            record.referencia_display
          )
        },
        {
          key: 'dependencia_display',
          label: 'Órgano / Unidad',
          searchable: true,
          format: (_value, record) => [
            record.dependencia_primary_display,
            record.dependencia_secondary_display
          ].filter(Boolean).join(' '),
          render: (_value, record) => renderStackedTableCell(
            record.dependencia_primary_display,
            record.dependencia_secondary_display
          )
        },
        { key: 'anexo_display', label: 'Anexo', align: 'center', searchable: true },
        {
          key: 'active',
          label: 'Estado',
          searchable: false,
          render: (value, record) => {
            const active = isActive(record);
            const wrapper = document.createElement('div');
            wrapper.className = 'sunarp-datatable-status access-status-cell';
            const badge = SUNARPUI.createBadge({
              label: active ? 'Activo' : 'Inactivo',
              variant: active ? 'success' : 'danger',
              icon: active ? 'check_circle' : 'cancel'
            });
            wrapper.appendChild(badge);
            const statusButton = document.createElement('button');
            statusButton.type = 'button';
            statusButton.className =
              `sunarp-datatable-status-link access-status-link ${
                active
                  ? 'sunarp-datatable-status-link--deactivate access-status-link--deactivate'
                  : 'sunarp-datatable-status-link--activate access-status-link--activate'
              }`;
            statusButton.textContent = active ? 'Desactivar' : 'Activar';
            statusButton.addEventListener('click', async () => {
              statusButton.disabled = true;
              try {
                await changeDirectoryStatus(record, !active);
              } catch (error) {
                notify('error', error.message || 'No se pudo cambiar el estado.');
              } finally {
                if (statusButton.isConnected) statusButton.disabled = false;
              }
            });
            wrapper.appendChild(statusButton);
            return wrapper;
          }
        }
      ],
      pageSize: 10,
      pageSizeOptions: [10, 25, 50],
      rowActions: [
        {
          label: 'Editar',
          icon: 'edit',
          variant: 'primary',
          title: 'Editar servidor',
          onClick: record => openDirectoryForm(record)
        },
        {
          label: 'Historial',
          icon: 'history',
          variant: 'primary',
          title: 'Consultar historial del servidor',
          onClick: record => {
            if (!window.SUNARPAccessHistory ||
                typeof window.SUNARPAccessHistory.open !== 'function') {
              notify('error', 'No está disponible el componente de historial.');
              return;
            }
            window.SUNARPAccessHistory.open(
              'SERVIDOR',
              record.persona_id,
              [record.nombres, record.apellidos].filter(Boolean).join(' ')
            );
          }
        },
        {
          label: 'Eliminar',
          icon: 'delete',
          variant: 'danger',
          title: 'Eliminar servidor',
          onClick: record => deleteDirectoryEntry(record)
        }
      ]
    };

    const tableUpdateStartedAt = performance.now();
    if (!state.table) {
      state.table = SUNARPUI.createDataTable(options);
    } else {
      // Actualización local: conserva el componente y no consulta al servidor.
      state.table.setData(options.data);
    }
    console.info('[DirectoryPage] Tabla actualizada:', {
      filteringMs: Math.round(filteringMs),
      rowPreparationMs: Math.round(rowPreparationMs),
      datatableUpdateMs: Math.round(performance.now() - tableUpdateStartedAt),
      totalClientMs: Math.round(performance.now() - tableStartedAt),
      totalSedeRecords: state.records.length,
      visibleRows: preparedRows.length
    });
  }


  function getFormStructurePath(structureId) {

    const structureMap = new Map(
      state.catalogs.estructuraOrg.map(node => [
        key(node.id),
        node
      ])
    );

    const path = [];
    const visited = new Set();

    let current = structureMap.get(key(structureId));

    while (current) {

      const currentId = key(current.id);

      if (!currentId || visited.has(currentId)) {
        break;
      }

      visited.add(currentId);
      path.unshift(currentId);

      const parentId = key(current.parent_id);

      current = parentId
        ? structureMap.get(parentId) || null
        : null;

    }

    return path;
  }


  function getFormHierarchyNodes(parentId, sedeId) {

    return state.catalogs.estructuraOrg
      .filter(node => {

        if (parentId) {
          return key(node.parent_id) === key(parentId);
        }

        return (
          !key(node.parent_id) &&
          key(node.sede_id) === key(sedeId)
        );

      })
      .sort((a, b) => {

        const orderA = Number(a.order) || 0;
        const orderB = Number(b.order) || 0;

        return orderA - orderB ||
          String(a.name).localeCompare(String(b.name), 'es');

      });
  }


  function renderFormLocalOptions(
    structureId,
    selectedRelationId
  ) {

    const select = document.getElementById(
      'directoryFormLocal'
    );

    if (!select) return;

    select.innerHTML = '';

    const placeholder = document.createElement('option');

    placeholder.value = '';
    placeholder.textContent = structureId
      ? 'Selecciona un local'
      : 'Selecciona una dependencia';

    select.appendChild(placeholder);

    const relations = state.catalogs.estructuraLocal
      .filter(relation =>
        key(relation.estructura_id) === key(structureId) &&
        relation.active !== false &&
        relation.active !== 0 &&
        String(relation.active).toLowerCase() !== 'false'
      );

    relations.forEach(relation => {

      const option = document.createElement('option');

      option.value = key(relation.id);

      option.textContent = [
        relation.local_name,
        relation.referencia
      ].filter(Boolean).join(' — ');

      select.appendChild(option);

    });

    select.value = relations.some(relation =>
      key(relation.id) === key(selectedRelationId)
    )
      ? key(selectedRelationId)
      : '';

    select.disabled = relations.length === 0;

  }


  function renderFormHierarchy(
    sedeId,
    selectedPath,
    selectedRelationId
  ) {

    const container = document.getElementById(
      'directoryFormHierarchy'
    );

    if (!container) return;

    container.innerHTML = '';

    let selectedStructureId = '';

    function appendLevel(parentId, level) {

      const nodes = getFormHierarchyNodes(
        parentId,
        sedeId
      );

      if (!nodes.length) return;

      const wrapper = document.createElement('div');
      wrapper.className = 'sunarp-form-field sunarp-form-field--full';

      const label = document.createElement('label');
      label.textContent = getHierarchyLabel(nodes, level);

      const select = document.createElement('select');
      select.className = 'sunarp-select';

      const placeholder = document.createElement('option');
      placeholder.value = '';
      placeholder.textContent = 'Selecciona una opción';

      select.appendChild(placeholder);

      nodes.forEach(node => {

        const option = document.createElement('option');

        option.value = key(node.id);
        option.textContent = node.name;

        select.appendChild(option);

      });

      const previous = selectedPath[level] || '';

      const exists = nodes.some(node =>
        key(node.id) === previous
      );

      const selectedValue = exists ? previous : '';

      if (!exists) {
        selectedPath.splice(level);
      }

      select.value = selectedValue;

      select.addEventListener('change', () => {

        selectedPath.splice(level);

        if (select.value) {
          selectedPath.push(select.value);
        }

        renderFormHierarchy(
          sedeId,
          selectedPath,
          ''
        );

      });

      label.appendChild(select);
      wrapper.appendChild(label);
      container.appendChild(wrapper);

      if (selectedValue) {
        selectedStructureId = selectedValue;
        appendLevel(selectedValue, level + 1);
      }

    }

    appendLevel('', 0);

    // El local se relaciona con el último elemento
    // seleccionado de la jerarquía.
    if (selectedPath.length) {
      selectedStructureId = selectedPath[
        selectedPath.length - 1
      ];
    }

    renderFormLocalOptions(
      selectedStructureId,
      selectedRelationId
    );

  }


  /* =====================================================
     8. FORMULARIO: CONTENIDO
     ===================================================== */

  function buildDirectoryForm(record, formData, isEditing) {
    const personalData = formData.personalData || {};
    const documentOptions = (formData.catalogs.tiposDocumento || []).map(item =>
      '<option value="' + escapeHtml(item.id) + '"' +
      (key(personalData.tipo_documento) === key(item.id) ? ' selected' : '') +
      '>' + escapeHtml(item.name) + '</option>'
    ).join('');

    const html = [
      '<form id="directoryForm" class="sunarp-form-grid">',
      '<input type="hidden" id="directoryFormPersonaId" value="' + escapeHtml(record && record.persona_id || '') + '">',
      '<div class="sunarp-form-field"><label for="directoryFormNombres">Nombres *</label>',
      '<input type="text" class="sunarp-input" id="directoryFormNombres" maxlength="100" required value="' + escapeHtml(record && record.nombres || '') + '"></div>',
      '<div class="sunarp-form-field"><label for="directoryFormApellidos">Apellidos *</label>',
      '<input type="text" class="sunarp-input" id="directoryFormApellidos" maxlength="150" required value="' + escapeHtml(record && record.apellidos || '') + '"></div>',
      '<div class="sunarp-form-field sunarp-form-field--full"><label for="directoryFormCorreoInstitucional">Correo institucional</label>',
      '<input type="email" class="sunarp-input" id="directoryFormCorreoInstitucional" maxlength="150" placeholder="usuario@sunarp.gob.pe" value="' + escapeHtml(record && record.correo_institucional || '') + '"></div>',
      '<div class="sunarp-form-field"><label for="directoryFormTipoDocumento">Tipo de documento *</label>',
      '<select class="sunarp-select" id="directoryFormTipoDocumento" required><option value="">Selecciona un tipo de documento</option>' + documentOptions + '</select></div>',
      '<div class="sunarp-form-field"><label for="directoryFormNumeroDocumento">Número de documento *</label>',
      '<input type="text" class="sunarp-input" id="directoryFormNumeroDocumento" maxlength="30" autocomplete="off" required value="' + escapeHtml(personalData.numero_documento || '') + '"></div>',
      '<div class="sunarp-form-field sunarp-form-field--full"><button type="button" id="directoryFormSearchDocument" class="sunarp-btn sunarp-btn-outline">Buscar DNI / documento</button>',
      '<small id="directoryFormDocumentStatus" aria-live="polite">Debes validar el documento antes de guardar.</small></div>',
      '<div class="sunarp-form-field"><label for="directoryFormFechaNacimiento">Fecha de nacimiento</label><input type="date" class="sunarp-input" id="directoryFormFechaNacimiento" value="' + escapeHtml(personalData.fecha_nacimiento || '') + '"></div>',
      '<div class="sunarp-form-field"><label for="directoryFormFechaInicio">Fecha de inicio de servicios</label><input type="date" class="sunarp-input" id="directoryFormFechaInicio" value="' + escapeHtml(personalData.fecha_inicio_servicios || '') + '"></div>',
      '<div class="sunarp-form-field"><label for="directoryFormFechaCese">Fecha de cese</label><input type="date" class="sunarp-input" id="directoryFormFechaCese" value="' + escapeHtml(personalData.fecha_cese || '') + '"></div>',
      '<div class="sunarp-form-field sunarp-form-field--full"><div class="directory-form-section-heading"><h3>Asignaciones</h3><p>Registra y administra todas las asignaciones del servidor en este mismo formulario.</p></div>',
      '<div id="directoryFormAssignments"></div><button type="button" id="directoryFormAddAssignment" class="sunarp-btn sunarp-btn-outline">Agregar asignación</button></div>',
      '<div class="sunarp-form-field sunarp-form-field--full"><div class="directory-form-actions">',
      '<button type="button" class="sunarp-btn sunarp-btn-outline" id="directoryFormCancel">Cancelar</button>',
      '<button type="submit" class="sunarp-btn sunarp-btn-primary" id="directoryFormSave" disabled>' + (isEditing ? 'Guardar cambios' : 'Registrar servidor') + '</button>',
      '</div></div></form>'
    ].join('');

    return { html };
  }


  /* =====================================================
     9. FORMULARIO: ALTA Y EDICIÓN
     ===================================================== */


  async function openDirectoryForm(record) {
    const isEditing = Boolean(record);
    let formData;
    let detail = null;
    try {
      formData = await callServer('getDirectoryFormData', isEditing ? 'edit' : 'create');
      if (isEditing) {
        detail = await callServer('getDirectoryPersonById', record.persona_id);
        if (!detail) throw new Error('No se encontró la ficha del servidor.');
        const requestedId = key(record.asignacion_id || record.id);
        if (!(detail.assignments || []).some(item => key(item.asignacion_id) === requestedId)) {
          throw new Error('La asignación seleccionada no está disponible dentro de tus ámbitos.');
        }
      }
    } catch (error) {
      notify('error', error.message || 'No se pudo preparar el formulario de Información de personal.');
      return;
    }

    const personalData = detail && detail.personalData || {};
    const built = buildDirectoryForm(detail || {}, Object.assign({}, formData, {
      personalData
    }), isEditing);
    const template = document.createElement('template');
    template.innerHTML = built.html.trim();
    SUNARPUI.openModal({
      title: isEditing ? 'Editar servidor' : 'Registrar servidor',
      content: template.content,
      size: 'xl'
    });

    const formElement = document.getElementById('directoryForm');
    const assignmentHost = document.getElementById('directoryFormAssignments');
    const addAssignmentButton = document.getElementById('directoryFormAddAssignment');
    const cancelButton = document.getElementById('directoryFormCancel');
    const saveButton = document.getElementById('directoryFormSave');
    const documentTypeSelect = document.getElementById('directoryFormTipoDocumento');
    const documentNumberInput = document.getElementById('directoryFormNumeroDocumento');
    const searchDocumentButton = document.getElementById('directoryFormSearchDocument');
    const documentStatus = document.getElementById('directoryFormDocumentStatus');
    if (!formElement || !assignmentHost || !addAssignmentButton || !cancelButton ||
        !saveButton || !documentTypeSelect || !documentNumberInput || !searchDocumentButton) {
      SUNARPUI.closeModal();
      notify('error', 'No se pudo inicializar el formulario de Información de personal.');
      return;
    }

    const catalogs = formData.catalogs || {};
    const scope = formData.scope || {};
    const assignmentRows = [];
    const removedAssignmentIds = new Set();
    let documentValidated = false;
    let documentAvailable = false;
    let documentSearchRequest = 0;

    const createField = (labelText, control, fullWidth) => {
      const wrapper = document.createElement('div');
      wrapper.className = 'sunarp-form-field' + (fullWidth ? ' sunarp-form-field--full' : '');
      const label = document.createElement('label');
      label.textContent = labelText;
      wrapper.append(label, control);
      return wrapper;
    };
    const createSelect = (items, placeholder, value, labelField) => {
      const select = document.createElement('select');
      select.className = 'sunarp-select';
      const empty = document.createElement('option');
      empty.value = '';
      empty.textContent = placeholder;
      select.appendChild(empty);
      (items || []).forEach(item => {
        const option = document.createElement('option');
        option.value = key(item.id);
        option.textContent = key(item[labelField || 'name']) || key(item.id);
        select.appendChild(option);
      });
      select.value = key(value);
      return select;
    };
    const createTextInput = (value, type, maxLength) => {
      const input = document.createElement('input');
      input.type = type || 'text';
      input.className = 'sunarp-input';
      input.maxLength = maxLength || 150;
      input.value = value === null || value === undefined ? '' : String(value);
      return input;
    };
    const activeItems = items => (items || []).filter(item =>
      item.active !== false && item.active !== 0 &&
      String(item.active).toLowerCase() !== 'false'
    );

    function getAssignmentLocation(existing) {
      const relation = (catalogs.estructuraLocal || []).find(item =>
        key(item.id) === key(existing && existing.estructura_local_id)
      );
      const structure = relation && (catalogs.estructuraOrg || []).find(node =>
        key(node.id) === key(relation.estructura_id)
      );
      return {
        siteId: key(existing && existing.sede_id) || key(structure && structure.sede_id),
        localId: key(existing && existing.local_id) || key(relation && relation.local_id),
        structureId: key(existing && existing.estructura_id) || key(relation && relation.estructura_id)
      };
    }

    function assignmentStructurePath(structureId, nodes) {
      const byId = new Map((nodes || []).map(node => [key(node.id), node]));
      const path = [];
      const visited = new Set();
      let current = byId.get(key(structureId));
      while (current) {
        const id = key(current.id);
        if (!id || visited.has(id)) break;
        visited.add(id);
        path.unshift(id);
        const parentId = key(current.parent_id);
        current = parentId ? byId.get(parentId) || null : null;
      }
      return path;
    }

    function setDocumentValidation(available, message) {
      documentValidated = true;
      documentAvailable = available === true;
      saveButton.disabled = !documentAvailable;
      documentStatus.textContent = message || '';
      documentStatus.dataset.state = documentAvailable ? 'valid' : 'invalid';
    }

    function invalidateDocumentValidation() {
      documentValidated = false;
      documentAvailable = false;
      saveButton.disabled = true;
      documentStatus.textContent = 'El documento cambió. Debes buscarlo nuevamente antes de guardar.';
      documentStatus.dataset.state = 'pending';
    }

    async function searchDocument() {
      const requestId = ++documentSearchRequest;
      const documentType = key(documentTypeSelect.value);
      const documentNumber = key(documentNumberInput.value);
      if (!documentType || !documentNumber) {
        invalidateDocumentValidation();
        notify('warning', 'Selecciona el tipo e ingresa el número de documento antes de buscar.');
        return;
      }
      searchDocumentButton.disabled = true;
      searchDocumentButton.textContent = 'Buscando...';
      documentStatus.textContent = 'Consultando el registro de documentos...';
      try {
        const result = await callServer('searchDirectoryDocument', {
          action: isEditing ? 'edit' : 'create',
          persona_id: isEditing ? key(detail.persona_id) : '',
          tipo_documento: documentType,
          numero_documento: documentNumber
        });
        if (requestId !== documentSearchRequest) return;
        setDocumentValidation(result && result.available === true, result && result.message);
      } catch (error) {
        if (requestId !== documentSearchRequest) return;
        invalidateDocumentValidation();
        documentStatus.textContent = error.message || 'No se pudo validar el documento.';
      } finally {
        if (requestId === documentSearchRequest) {
          searchDocumentButton.disabled = false;
          searchDocumentButton.textContent = 'Buscar DNI / documento';
        }
      }
    }

    documentTypeSelect.addEventListener('change', invalidateDocumentValidation);
    documentNumberInput.addEventListener('input', invalidateDocumentValidation);
    searchDocumentButton.addEventListener('click', searchDocument);

    function getStructureNodesForRow(siteId, localId) {
      const allNodes = catalogs.estructuraOrg || [];
      const selectable = new Set((scope.selectableStructureIds || []).map(value => key(value)));
      let allowed = new Set(selectable);
      if (scope.hierarchyMode !== 'structure-scope') {
        if (!localId) return [];
        const relatedIds = new Set((catalogs.estructuraLocal || [])
          .filter(relation => key(relation.local_id) === key(localId))
          .map(relation => key(relation.estructura_id)));
        allowed = new Set(relatedIds);
        const byId = new Map(allNodes.map(node => [key(node.id), node]));
        relatedIds.forEach(id => {
          let current = byId.get(id);
          const visited = new Set();
          while (current) {
            const parentId = key(current.parent_id);
            if (!parentId || visited.has(parentId)) break;
            visited.add(parentId);
            const parent = byId.get(parentId);
            if (!parent || key(parent.sede_id) !== key(current.sede_id)) break;
            allowed.add(parentId);
            current = parent;
          }
        });
      }
      return allNodes.filter(node =>
        allowed.has(key(node.id)) && (!siteId || key(node.sede_id) === key(siteId))
      );
    }

    function renderAssignmentCard(existing) {
      const assignment = existing || {};
      const location = getAssignmentLocation(assignment);
      const card = document.createElement('section');
      card.className = 'directory-assignment-card';
      const heading = document.createElement('div');
      heading.className = 'directory-assignment-card-heading';
      const title = document.createElement('h4');
      title.textContent = 'Asignación ' + (assignmentRows.length + 1);
      const removeButton = document.createElement('button');
      removeButton.type = 'button';
      removeButton.className = 'sunarp-btn sunarp-btn-outline';
      removeButton.textContent = 'Quitar';
      heading.append(title, removeButton);
      card.appendChild(heading);

      const controls = {};
      controls.cargo = createSelect(activeItems(catalogs.cargos), 'Selecciona un cargo', assignment.cargo_id);
      controls.cargo.required = true;
      controls.condicion = createTextInput(assignment.condicion_cargo || '', 'text', 150);
      controls.anexo = createTextInput(assignment.anexo ?? '', 'number', 5);
      controls.anexo.min = '1';
      controls.anexo.max = '99999';
      controls.anexo.step = '1';
      controls.observaciones = document.createElement('textarea');
      controls.observaciones.className = 'sunarp-input';
      controls.observaciones.maxLength = 1000;
      controls.observaciones.rows = 2;
      controls.observaciones.value = assignment.observaciones || '';
      card.append(
        createField('Cargo *', controls.cargo, false),
        createField('Condición del cargo', controls.condicion, false),
        createField('Anexo', controls.anexo, false),
        createField('Observaciones', controls.observaciones, true)
      );

      controls.sede = null;
      if (scope.siteMode === 'selectable') {
        controls.sede = createSelect(catalogs.sedes || [], 'Selecciona una sede', location.siteId);
        controls.sede.required = true;
        card.appendChild(createField('Sede *', controls.sede, true));
      }
      const selectedSiteId = () => controls.sede
        ? key(controls.sede.value)
        : key(scope.fixedSedeId);
      const visibleLocals = siteId => (catalogs.locales || []).filter(local =>
        (!siteId && scope.siteMode !== 'selectable') || key(local.sede_id) === key(siteId)
      );

      controls.local = null;
      controls.fixedLocalId = '';
      if (scope.localMode === 'selectable' || scope.localMode === 'selectable-scoped') {
        controls.local = createSelect(
          visibleLocals(selectedSiteId()),
          'Selecciona un local',
          location.localId
        );
        controls.local.required = true;
        controls.local.disabled = scope.siteMode === 'selectable' && !selectedSiteId();
        card.appendChild(createField('Local *', controls.local, true));
      } else if (scope.localMode === 'fixed') {
        controls.fixedLocalId = key(scope.fixedLocalId);
      }

      controls.hierarchy = document.createElement('div');
      controls.hierarchy.className = 'directory-assignment-hierarchy sunarp-form-field sunarp-form-field--full';
      card.appendChild(controls.hierarchy);
      controls.relationHost = document.createElement('div');
      controls.relationHost.className = 'sunarp-form-field sunarp-form-field--full';
      card.appendChild(controls.relationHost);
      controls.path = assignmentStructurePath(location.structureId, catalogs.estructuraOrg || []);
      controls.fixedStructureId = '';
      controls.relationId = key(assignment.estructura_local_id);
      controls.selectedRelationId = '';

      const structureScopes = scope.structureScopes || [];
      const scopeStructureRoots = (scope.rootStructureIds || []).map(value => key(value));
      const isSingleStructureScope = scope.hierarchyMode === 'structure-scope' && structureScopes.length === 1;
      if (isSingleStructureScope) {
        const onlyScope = structureScopes[0];
        if (!onlyScope.includeDescendants) {
          controls.fixedStructureId = key(onlyScope.referenceId);
          controls.path = [];
        } else {
          controls.path = controls.path.filter(id => id !== key(onlyScope.referenceId));
        }
      }

      function getRootNodes(nodes) {
        const byId = new Map(nodes.map(node => [key(node.id), node]));
        if (scope.hierarchyMode === 'structure-scope' && scopeStructureRoots.length > 1) {
          return scopeStructureRoots.map(id => byId.get(id)).filter(Boolean);
        }
        if (isSingleStructureScope && !structureScopes[0].includeDescendants) return [];
        if (isSingleStructureScope && structureScopes[0].includeDescendants) {
          const root = key(structureScopes[0].referenceId);
          return nodes.filter(node => key(node.parent_id) === root);
        }
        return nodes.filter(node => {
          const parentId = key(node.parent_id);
          const parent = parentId ? byId.get(parentId) : null;
          return !parent || key(parent.sede_id) !== key(node.sede_id);
        });
      }

      function renderRelationOptions() {
        controls.relationHost.replaceChildren();
        controls.relation = null;
        controls.selectedRelationId = '';
        controls.relationId = '';
        const localId = controls.local ? key(controls.local.value) : key(controls.fixedLocalId);
        const structureId = controls.fixedStructureId || key(controls.path[controls.path.length - 1]);
        const candidates = (catalogs.estructuraLocal || []).filter(relation =>
          key(relation.estructura_id) === structureId &&
          (!localId || key(relation.local_id) === localId)
        );
        if (!structureId || !candidates.length) return;
        if (candidates.length === 1) {
          controls.selectedRelationId = key(candidates[0].id);
          controls.relationId = controls.selectedRelationId;
          return;
        }
        controls.relation = createSelect(
          candidates.map(item => ({
            id: item.id,
            name: [item.local_name, item.referencia].filter(Boolean).join(' — ') || item.id
          })),
          'Selecciona el local vinculado',
          assignment.estructura_local_id
        );
        controls.relation.required = true;
        controls.relation.addEventListener('change', () => {
          controls.selectedRelationId = key(controls.relation.value);
          controls.relationId = controls.selectedRelationId;
        });
        controls.relationHost.appendChild(createField('Local vinculado *', controls.relation, true));
        controls.selectedRelationId = key(controls.relation.value);
        controls.relationId = controls.selectedRelationId;
      }

      function renderHierarchy() {
        controls.hierarchy.replaceChildren();
        const siteId = selectedSiteId();
        const localId = controls.local ? key(controls.local.value) : key(controls.fixedLocalId);
        const nodes = getStructureNodesForRow(siteId, localId);
        if (!nodes.length) {
          controls.path = [];
          controls.hierarchy.hidden = true;
          if (scope.hierarchyMode === 'structure-scope' && isSingleStructureScope &&
              !structureScopes[0].includeDescendants) {
            controls.fixedStructureId = key(structureScopes[0].referenceId);
          }
          renderRelationOptions();
          return;
        }
        controls.fixedStructureId = '';
        controls.hierarchy.hidden = false;
        const roots = getRootNodes(nodes);
        function appendLevel(parentId, level, levelNodes) {
          const options = parentId
            ? nodes.filter(node => key(node.parent_id) === key(parentId))
            : levelNodes;
          if (!options.length) return;
          const wrapper = document.createElement('div');
          wrapper.className = 'sunarp-form-field sunarp-form-field--full';
          const label = document.createElement('label');
          const typeNames = Array.from(new Set(options.map(node => key(node.tipo_estructura_name)).filter(Boolean)));
          label.textContent = typeNames.length === 1
            ? typeNames[0].charAt(0).toUpperCase() + typeNames[0].slice(1)
            : (level === 0 ? 'Órgano o dependencia' : 'Unidad o dependencia');
          const selected = key(controls.path[level]);
          const select = createSelect(options, 'Selecciona una opción', selected);
          select.addEventListener('change', () => {
            controls.path = controls.path.slice(0, level);
            if (select.value) controls.path.push(key(select.value));
            renderHierarchy();
          });
          label.appendChild(select);
          wrapper.appendChild(label);
          controls.hierarchy.appendChild(wrapper);
          if (selected && options.some(node => key(node.id) === selected)) {
            appendLevel(selected, level + 1, []);
          }
        }
        appendLevel('', 0, roots);
        if (!controls.hierarchy.childElementCount) controls.hierarchy.hidden = true;
        renderRelationOptions();
      }

      function refreshLocalOptions() {
        if (!controls.local) return;
        const current = key(controls.local.value) || location.localId;
        const siteId = selectedSiteId();
        const options = visibleLocals(siteId);
        controls.local.replaceChildren();
        const placeholder = document.createElement('option');
        placeholder.value = '';
        placeholder.textContent = 'Selecciona un local';
        controls.local.appendChild(placeholder);
        options.forEach(local => {
          const option = document.createElement('option');
          option.value = key(local.id);
          option.textContent = local.name;
          controls.local.appendChild(option);
        });
        controls.local.value = options.some(item => key(item.id) === current) ? current : '';
        controls.local.disabled = scope.siteMode === 'selectable' && !siteId;
      }

      if (controls.sede) controls.sede.addEventListener('change', () => {
        controls.path = [];
        controls.fixedStructureId = '';
        refreshLocalOptions();
        renderHierarchy();
      });
      if (controls.local) controls.local.addEventListener('change', () => {
        controls.path = [];
        controls.fixedStructureId = '';
        renderHierarchy();
      });
      renderHierarchy();

      return {
        card,
        assignment,
        controls,
        getPayload() {
          const siteId = selectedSiteId();
          const localId = controls.local ? key(controls.local.value) : key(controls.fixedLocalId);
          const structureId = controls.fixedStructureId || key(controls.path[controls.path.length - 1]);
          const relationId = key(controls.selectedRelationId || controls.relationId);
          if (scope.siteMode === 'selectable' && !siteId) throw new Error('Selecciona la sede de cada asignación.');
          if ((scope.localMode === 'selectable' || scope.localMode === 'selectable-scoped' || scope.localMode === 'fixed') && !localId) {
            throw new Error('Selecciona el local de cada asignación.');
          }
          if (scope.hierarchyMode === 'structure-scope' && !structureId) {
            throw new Error('Selecciona la unidad orgánica autorizada para la asignación.');
          }
          if (structureId && !relationId) {
            throw new Error('La unidad orgánica seleccionada no tiene una relación válida con el local autorizado.');
          }
          if (!localId && !relationId) {
            throw new Error('Cada asignación debe vincularse con un local o con una unidad orgánica autorizada.');
          }
          if (relationId) {
            const relation = (catalogs.estructuraLocal || []).find(item => key(item.id) === relationId);
            if (!relation || (localId && key(relation.local_id) !== localId)) {
              throw new Error('La relación seleccionada no corresponde al local de la asignación.');
            }
          }
          return {
            asignacion_id: key(assignment.asignacion_id),
            cargo_id: key(controls.cargo.value),
            condicion_cargo: key(controls.condicion.value),
            anexo: controls.anexo.value === '' ? '' : Number(controls.anexo.value),
            estructura_local_id: relationId,
            local_id: scope.hierarchyMode === 'structure-scope' ? '' : localId,
            observaciones: key(controls.observaciones.value),
            active: assignment.active === undefined ? true : assignment.active,
            order: assignment.order
          };
        }
      };
    }

    function addAssignment(existing) {
      const row = renderAssignmentCard(existing);
      assignmentRows.push(row);
      assignmentHost.appendChild(row.card);
      row.card.querySelector('.directory-assignment-card-heading h4').textContent =
        'Asignación ' + assignmentRows.length;
      row.card.querySelector('.directory-assignment-card-heading button').addEventListener('click', () => {
        if (assignmentRows.length <= 1) {
          notify('warning', 'El servidor debe conservar al menos una asignación.');
          return;
        }
        if (isEditing && key(row.assignment.asignacion_id)) {
          const remainingExisting = assignmentRows.filter(item =>
            item !== row && key(item.assignment.asignacion_id)
          );
          if (!remainingExisting.length) {
            notify('warning', 'Conserva al menos una asignación existente para actualizar la ficha del servidor.');
            return;
          }
        }
        const position = assignmentRows.indexOf(row);
        if (position >= 0) {
          assignmentRows.splice(position, 1);
          if (key(row.assignment.asignacion_id)) removedAssignmentIds.add(key(row.assignment.asignacion_id));
        }
        row.card.remove();
        assignmentRows.forEach((item, index) => {
          item.card.querySelector('.directory-assignment-card-heading h4').textContent =
            'Asignación ' + (index + 1);
        });
      });
    }

    (detail && detail.assignments || []).forEach(addAssignment);
    if (!isEditing) addAssignment(null);
    addAssignmentButton.addEventListener('click', () => addAssignment(null));
    cancelButton.addEventListener('click', () => SUNARPUI.closeModal());

    formElement.__directorySubmitState = {
      isEditing,
      detail,
      assignmentRows,
      removedAssignmentIds,
      isDocumentValidated: () => documentValidated && documentAvailable
    };
    formElement.addEventListener('submit', saveForm);

    if (isEditing && personalData.tipo_documento && personalData.numero_documento) {
      searchDocument();
    }
  }


  async function saveForm(event) {
    event.preventDefault();
    const form = event.currentTarget;
    if (!form.reportValidity()) return;
    const formState = form.__directorySubmitState;
    if (!formState || !formState.isDocumentValidated()) {
      notify('warning', 'Primero debes buscar y validar el documento de identidad.');
      return;
    }

    let assignments;
    try {
      assignments = formState.assignmentRows.map(row => {
        const item = row.getPayload();
        if (!item.cargo_id) throw new Error('Selecciona el cargo de todas las asignaciones.');
        return item;
      });
    } catch (error) {
      notify('warning', error.message);
      return;
    }

    const personaId = key(formState.detail && formState.detail.persona_id);
    const payload = {
      persona_id: personaId,
      nombres: key(document.getElementById('directoryFormNombres').value),
      apellidos: key(document.getElementById('directoryFormApellidos').value),
      correo_institucional: key(document.getElementById('directoryFormCorreoInstitucional').value).toLowerCase(),
      tipo_documento: key(document.getElementById('directoryFormTipoDocumento').value),
      numero_documento: key(document.getElementById('directoryFormNumeroDocumento').value),
      fecha_nacimiento: document.getElementById('directoryFormFechaNacimiento').value || '',
      fecha_inicio_servicios: document.getElementById('directoryFormFechaInicio').value || '',
      fecha_cese: document.getElementById('directoryFormFechaCese').value || '',
      assignments,
      removed_assignment_ids: Array.from(formState.removedAssignmentIds)
    };

    const saveButton = document.getElementById('directoryFormSave');
    saveButton.disabled = true;
    saveButton.textContent = 'Guardando...';
    try {
