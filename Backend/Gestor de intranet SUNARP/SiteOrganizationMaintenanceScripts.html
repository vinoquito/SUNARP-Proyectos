<script>
(function () {
  'use strict';

  const groups = {
    'sedes-locales': {
      tabsId: 'maintenanceSedesTabs',
      panelId: 'maintenanceSedesPanel',
      label: 'Sedes y locales',
      tabs: [
        { id: 'sede', label: 'Sedes' },
        { id: 'tipos_local', label: 'Tipos de local' },
        { id: 'locales', label: 'Locales' }
      ]
    },
    'organizacion-institucional': {
      tabsId: 'maintenanceOrganizacionTabs',
      panelId: 'maintenanceOrganizacionPanel',
      label: 'Organización institucional',
      tabs: [
        { id: 'tipos_estructura', label: 'Tipos de estructura' },
        { id: 'estructura_org', label: 'Estructura orgánica' }
      ]
    }
  };

  const shared = { data: null, loadPromise: null };
  const states = {};
  Object.keys(groups).forEach(function (route) {
    states[route] = {
      tabs: null,
      table: null,
      activeTab: groups[route].tabs[0].id
    };
  });

  const entityLabels = {
    sede: 'sede',
    tipos_local: 'tipo de local',
    locales: 'local',
    tipos_estructura: 'tipo de estructura',
    estructura_org: 'estructura orgánica'
  };

  function rpc(name) {
    const args = Array.prototype.slice.call(arguments, 1);
    return new Promise(function (resolve, reject) {
      const runner = google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(reject);
      if (typeof runner[name] !== 'function') {
        reject(new Error('No existe la función del servidor "' + name + '".'));
        return;
      }
      runner[name].apply(runner, args);
    });
  }

  function el(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined && text !== null) node.textContent = String(text);
    return node;
  }

  function notify(type, message) {
    if (window.SUNARPUI && typeof SUNARPUI.notify === 'function') {
      SUNARPUI.notify(type, message);
    }
  }

  function beginLoading(target, message) {
    if (window.SUNARPUI && typeof SUNARPUI.beginSectionLoading === 'function') {
      return SUNARPUI.beginSectionLoading(target, { message: message || '' });
    }
    return function () {};
  }

  function catalogs() {
    return shared.data && shared.data.catalogs ? shared.data.catalogs : {};
  }

  function records(entity) {
    return catalogs()[entity] || [];
  }

  function findById(entity, id) {
    return records(entity).find(function (item) {
      return String(item.id) === String(id);
    }) || null;
  }

  function isActive(value) {
    return value === true ||
      String(value).trim().toUpperCase() === 'TRUE' ||
      String(value).trim() === '1';
  }

  function destroyTable(route) {
    const state = states[route];
    if (state.table && typeof state.table.destroy === 'function') {
      state.table.destroy();
    }
    state.table = null;
  }

  function showMessage(panel, message, isError) {
    panel.replaceChildren(el(
      'p',
      isError ? 'maintenance-error' : 'maintenance-placeholder',
      message
    ));
  }

  /**
   * Ambas pantallas comparten una sola instantánea de los seis catálogos.
   * Salir/entrar a una ruta y cambiar de pestaña solo vuelve a renderizar.
   */
  function loadSnapshot() {
    if (shared.data) return Promise.resolve(shared.data);
    if (shared.loadPromise) return shared.loadPromise;

    const target = document.getElementById('maintenanceSedesPanel') ||
      document.getElementById('maintenanceOrganizacionPanel');
    const finish = beginLoading(target, 'Consultando sedes y catálogos institucionales...');
    shared.loadPromise = rpc('getSiteOrganizationMaintenanceData')
      .then(function (data) {
        if (!data || !data.catalogs || !data.entities) {
          throw new Error('El servidor devolvió una instantánea incompleta de los catálogos institucionales.');
        }
        shared.data = data;
        Object.keys(groups).forEach(function (route) {
          if (states[route].tabs) renderActiveTab(route);
        });
        return shared.data;
      })
      .catch(function (error) {
        shared.data = null;
        Object.keys(groups).forEach(function (route) {
          destroyTable(route);
          const panel = document.getElementById(groups[route].panelId);
          if (panel) showMessage(panel, error.message || 'No se pudieron consultar los catálogos.', true);
        });
        throw error;
      })
      .finally(function () {
        finish();
        shared.loadPromise = null;
      });
    return shared.loadPromise;
  }

  function buildTabs(route) {
    const state = states[route];
    const config = groups[route];
    if (state.tabs) return;
    state.tabs = SUNARPUI.createTabs({
      containerId: config.tabsId,
      panelId: config.panelId,
      label: config.label,
      tabs: config.tabs,
      activeId: state.activeTab,
      onChange: function (tabId) {
        state.activeTab = tabId;
        renderActiveTab(route);
      }
    });
  }

  function token(value) {
    return String(value || '')
      .normalize('NFD')
      .replace(/[\u0300-\u036f]/g, '')
      .toUpperCase()
      .replace(/[^A-Z0-9]+/g, '_')
      .replace(/^_+|_+$/g, '');
  }

  function nameKey(value) {
    return String(value || '')
      .normalize('NFD')
      .replace(/[\u0300-\u036f]/g, '')
      .toLocaleLowerCase();
  }

  function sitePrefix(siteId) {
    const site = findById('sede', siteId);
    const id = String(siteId || '').trim().toUpperCase();
    if (id === 'SEDE_CENTRAL' || nameKey(site && site.name) === 'sede central') return 'SC';
    if (id.indexOf('ZR_') === 0) return id;
    return 'SEDE_' + (token(id) || token(site && site.name) || 'SIN_CODIGO');
  }

  function localNameToken(name, selectedTypeId) {
    let value = token(name);
    const types = records('tipos_local').slice().sort(function (a, b) {
      return token(b.name).length - token(a.name).length;
    });
    const selected = findById('tipos_local', selectedTypeId);
    if (selected && selected.name) {
      const selectedToken = token(selected.name);
      if (selectedToken && value.indexOf(selectedToken + '_') === 0) {
        value = value.slice(selectedToken.length + 1);
      } else if (selectedToken && value === selectedToken) {
        value = '';
      }
    }
    if (!value || value === token(name)) {
      for (let i = 0; i < types.length; i++) {
        const typeToken = token(types[i].name);
        if (typeToken && value.indexOf(typeToken + '_') === 0) {
          value = value.slice(typeToken.length + 1);
          break;
        }
      }
    }
    return value
      .replace(/^DE_/, '')
      .replace(/_SEDE_PRINCIPAL$/, '')
      .replace(/_SEDE_CENTRAL$/, '')
      .replace(/^SEDE_PRINCIPAL_/, '') || token(name);
  }

  function generatedBase(entity, payload) {
    const name = String(payload.name || '').trim();
    if (!name) return '';
    if (entity === 'sede') {
      if (nameKey(name) === 'sede central') return 'SEDE_CENTRAL';
      if (nameKey(name).indexOf('zona registral') === 0) {
        const tail = token(name.replace(/^zona\s+registral\s*/i, '')).replace(/^N_?/, '');
        return 'ZR_' + tail;
      }
      return 'SEDE_' + token(name);
    }
    if (entity === 'tipos_local' || entity === 'tipos_estructura') {
      return token(name);
    }
    if (entity === 'locales') {
      return sitePrefix(payload.sede_id) + '_' + localNameToken(name, payload.tipo_local_id);
    }
    if (entity === 'estructura_org') {
      let value = token(name);
      if (value.indexOf('UNIDAD_FUNCIONAL_DE_') === 0) {
        value = 'UF_' + value.slice('UNIDAD_FUNCIONAL_DE_'.length);
      }
      return sitePrefix(payload.sede_id) + '_' + value;
    }
    return '';
  }

  function previewIdentifier(entity, payload) {
    const base = generatedBase(entity, payload).slice(0, 80);
    if (!base) return '';
    const used = new Set(records(entity).map(function (item) {
      return String(item.id || '').toUpperCase();
    }));
    if (!used.has(base.toUpperCase())) return base;
    for (let number = 2; number < 10000; number++) {
      const suffix = '_' + number;
      const candidate = base.slice(0, 80 - suffix.length) + suffix;
      if (!used.has(candidate.toUpperCase())) return candidate;
    }
    return '';
  }

  function nameFor(entity, id) {
    const found = findById(entity, id);
    return found ? found.name : (id ? 'Referencia no disponible (' + id + ')' : '—');
  }

  function descendants(entity, recordId) {
    const all = records(entity);
    const found = new Set([String(recordId)]);
    let changed = true;
    while (changed) {
      changed = false;
      all.forEach(function (item) {
        if (item.parent_id && found.has(String(item.parent_id)) && !found.has(String(item.id))) {
          found.add(String(item.id));
          changed = true;
        }
      });
    }
    return found;
  }

  function deleteBlockReason(entity, record) {
    const id = String(record.id);
    if (entity === 'sede') {
      if (records('locales').some(item => String(item.sede_id) === id)) return 'Tiene locales asociados.';
      if (records('estructura_org').some(item => String(item.sede_id) === id)) return 'Tiene estructuras orgánicas asociadas.';
    } else if (entity === 'tipos_local') {
      if (records('locales').some(item => String(item.tipo_local_id) === id)) return 'Está utilizado por uno o más locales.';
    } else if (entity === 'locales') {
      if (records('locales').some(item => String(item.parent_id || '') === id)) return 'Tiene locales dependientes.';
      if (records('estructura_local').some(item => String(item.local_id) === id)) return 'Está vinculado a estructura_local.';
    } else if (entity === 'tipos_estructura') {
      if (records('estructura_org').some(item => String(item.tipo_estructura_id) === id)) return 'Está utilizado por estructuras orgánicas.';
    } else if (entity === 'estructura_org') {
      if (records('estructura_org').some(item => String(item.parent_id || '') === id)) return 'Tiene estructuras orgánicas dependientes.';
      if (records('estructura_local').some(item => String(item.estructura_id) === id)) return 'Está vinculada a estructura_local.';
    }
    return '';
  }

  function deleteAllowed(entity, record) {
    return !deleteBlockReason(entity, record);
  }

  function activeStatusCell(route, entity, record, capability) {
    const active = isActive(record.active);
    const wrapper = el('div', 'access-status-cell');
    wrapper.appendChild(SUNARPUI.createBadge({
      label: active ? 'Activo' : 'Inactivo',
      variant: active ? 'success' : 'danger',
      icon: active ? 'check_circle' : 'cancel'
    }));

    if (capability) {
      const button = el(
        'button',
        active
          ? 'sunarp-datatable-status-link access-status-link access-status-link--deactivate'
          : 'sunarp-datatable-status-link access-status-link access-status-link--activate',
        active ? 'Desactivar' : 'Activar'
      );
      button.type = 'button';
      button.addEventListener('click', async function () {
        const next = !active;
        const verb = next ? 'activar' : 'desactivar';
        if (!window.confirm('¿Deseas ' + verb + ' ' + entityLabels[entity] + ' "' + record.name + '"?')) return;

        button.disabled = true;
        const panel = document.getElementById(groups[route].panelId);
        const finish = beginLoading(panel, 'Actualizando estado...');
        try {
          const result = await rpc('setSiteOrganizationMaintenanceStatus', entity, record.id, next);
          replaceLocalRecord(entity, 'status', result.record || Object.assign({}, record, { active: next }), record.id);
          renderActiveTab(route);
          notify('success', result.message || 'Estado actualizado correctamente.');
        } catch (error) {
          notify('error', error.message || 'No se pudo cambiar el estado.');
        } finally {
          finish();
          if (button.isConnected) button.disabled = false;
        }
      });
      wrapper.appendChild(button);
    }
    return wrapper;
  }

  function replaceLocalRecord(entity, operation, record, originalId) {
    const collection = records(entity);
    const targetId = String(originalId || (record && record.id) || '');
    const index = collection.findIndex(item => String(item.id) === targetId);
    if (operation === 'create' && record) {
      collection.push(Object.assign({}, record));
    } else if (operation === 'edit' || operation === 'status') {
      if (index >= 0 && record) collection[index] = Object.assign({}, record);
    } else if (operation === 'delete' && index >= 0) {
      collection.splice(index, 1);
    }
  }

  function columnsFor(route, entity, metadata) {
    const columns = [
      { key: 'id', label: 'Código', searchable: true },
      { key: 'name', label: metadata.nameLabel, searchable: true }
    ];

    if (entity === 'locales') {
      columns.push(
        {
          key: 'sede_id', label: 'Sede', searchable: true,
          render: value => nameFor('sede', value)
        },
        {
          key: 'tipo_local_id', label: 'Tipo de local', searchable: true,
          render: value => nameFor('tipos_local', value)
        },
        {
          key: 'parent_id', label: 'Local padre', searchable: true,
          render: value => nameFor('locales', value)
        },
        { key: 'order', label: 'Orden', align: 'center', searchable: false }
      );
    }

    if (entity === 'estructura_org') {
      columns.push(
        {
          key: 'sede_id', label: 'Sede', searchable: true,
          render: value => nameFor('sede', value)
        },
        {
          key: 'tipo_estructura_id', label: 'Tipo de estructura', searchable: true,
          render: value => nameFor('tipos_estructura', value)
        },
        {
          key: 'parent_id', label: 'Estructura padre', searchable: true,
          render: value => nameFor('estructura_org', value)
        },
        { key: 'order', label: 'Orden', align: 'center', searchable: false }
      );
    }

    if (metadata.hasActive) {
      columns.push({
        key: 'active',
        label: 'Estado',
        align: 'center',
        searchable: false,
        render: function (_value, record) {
          return activeStatusCell(route, entity, record,
            metadata.capabilities && metadata.capabilities.canChangeStatus);
        }
      });
    }
    return columns;
  }

  function rowActions(route, entity, metadata) {
    const capability = metadata.capabilities || {};
    const actions = [];
    if (capability.canEdit) {
      actions.push({
        label: 'Editar',
        icon: 'edit',
        variant: 'primary',
        title: 'Editar registro',
        onClick: record => openForm(route, entity, metadata, record)
      });
    }
    if (capability.canDelete) {
      actions.push({
        label: 'Eliminar',
        icon: 'delete',
        variant: 'danger',
        disabled: record => !deleteAllowed(entity, record),
        title: record => deleteBlockReason(entity, record) || 'Eliminar registro',
        onClick: record => {
          if (deleteAllowed(entity, record)) deleteRecord(route, entity, record);
        }
      });
    }
    if (capability.canViewHistory && window.SUNARPAccessHistory &&
        typeof window.SUNARPAccessHistory.open === 'function') {
      actions.push({
        label: 'Historial',
        icon: 'history',
        variant: 'outline',
        title: 'Consultar historial del registro',
        onClick: record => window.SUNARPAccessHistory.open(
          'MANTENIMIENTO',
          record.id,
          record.name
        )
      });
    }
    return actions;
  }

  function renderActiveTab(route) {
    const state = states[route];
    const config = groups[route];
    const panel = document.getElementById(config.panelId);
    if (!panel || !shared.data) return;
    const entity = state.activeTab;
    const metadata = shared.data.entities[entity];
    if (!metadata) {
      destroyTable(route);
      showMessage(panel, 'No hay un contrato disponible para este mantenimiento.', false);
      return;
    }

    destroyTable(route);
    panel.replaceChildren();

    const heading = el('div', 'maintenance-section-heading');
    const block = el('div');
    block.appendChild(el('h2', '', metadata.label));
    block.appendChild(el('p', '', 'Administra el catálogo maestro y conserva sus relaciones institucionales.'));
    heading.appendChild(block);
    if (metadata.capabilities && metadata.capabilities.canCreate) {
      const button = el('button', 'sunarp-btn sunarp-btn--primary', 'Nuevo registro');
      button.type = 'button';
      button.addEventListener('click', function () {
        openForm(route, entity, metadata, null);
      });
      heading.appendChild(button);
    }

    const tableHost = el('div', 'maintenance-table-host');
    tableHost.id = 'siteOrganizationTable_' + route.replace(/[^a-z0-9_-]/gi, '_');
    panel.append(heading, tableHost);
    states[route].table = SUNARPUI.createDataTable({
      containerId: tableHost.id,
      mode: 'client',
      data: records(entity),
      columns: columnsFor(route, entity, metadata),
      rowActions: rowActions(route, entity, metadata),
      search: true,
      searchPlaceholder: 'Buscar en ' + metadata.label.toLowerCase() + '...',
      pageSize: 10,
      pageSizeOptions: [10, 25, 50],
      emptyMessage: 'No hay registros para mostrar.'
    });
  }

  function addHint(wrapper, message) {
    wrapper.appendChild(el('small', 'access-field-hint', message));
  }

  function addTextField(form, labelText, value, options) {
    const settings = options || {};
    const wrapper = el('label', 'sunarp-form-field');
    wrapper.appendChild(el('span', '', labelText));
    const input = el('input', 'sunarp-input');
    input.type = settings.type || 'text';
    input.name = settings.name || '';
    input.value = value === undefined || value === null ? '' : String(value);
    input.required = settings.required !== false;
    if (settings.maxLength) input.maxLength = settings.maxLength;
    if (settings.readOnly) input.readOnly = true;
    if (settings.placeholder) input.placeholder = settings.placeholder;
    if (settings.inputMode) input.inputMode = settings.inputMode;
    if (settings.min !== undefined) input.min = settings.min;
    if (settings.step !== undefined) input.step = settings.step;
    wrapper.appendChild(input);
    if (settings.hint) addHint(wrapper, settings.hint);
    form.appendChild(wrapper);
    return input;
  }

  function addSelectField(form, labelText, value, options, settings) {
    const config = settings || {};
    const wrapper = el('label', 'sunarp-form-field');
    wrapper.appendChild(el('span', '', labelText));
    const select = el('select', 'sunarp-select');
    select.name = config.name || '';
    select.required = config.required !== false;
    (options || []).forEach(function (item) {
      const option = el('option', '', item.label);
      option.value = item.value;
      option.disabled = item.disabled === true;
      select.appendChild(option);
    });
    select.value = value === undefined || value === null ? '' : String(value);
    if (config.disabled) select.disabled = true;
    wrapper.appendChild(select);
    if (config.hint) addHint(wrapper, config.hint);
    form.appendChild(wrapper);
    return select;
  }

  function activeReferenceOptions(entity, currentValue, emptyLabel) {
    const all = records(entity);
    const options = [{ value: '', label: emptyLabel || 'Selecciona una opción' }];
    all.filter(function (item) {
      return item.active !== false || String(item.id) === String(currentValue || '');
    }).forEach(function (item) {
      options.push({ value: item.id, label: item.name });
    });
    if (currentValue && !all.some(item => String(item.id) === String(currentValue))) {
      options.push({
        value: currentValue,
        label: 'Referencia no disponible (' + currentValue + ')'
      });
    }
    return options;
  }

  function parentOptions(entity, siteId, currentRecord) {
    const collection = records(entity);
    const blocked = currentRecord ? descendants(entity, currentRecord.id) : new Set();
    const options = [{ value: '', label: 'Sin elemento padre (nivel superior)' }]
      .concat(collection.filter(function (item) {
        return String(item.sede_id) === String(siteId) &&
          (!currentRecord || !blocked.has(String(item.id)));
      }).map(function (item) {
        return { value: item.id, label: item.name };
      }));
    if (currentRecord && currentRecord.parent_id &&
        !options.some(item => String(item.value) === String(currentRecord.parent_id))) {
      options.push({
        value: currentRecord.parent_id,
        label: 'Referencia actual no disponible (' + currentRecord.parent_id + ')'
      });
    }
    return options;
  }

  function openForm(route, entity, metadata, record) {
    const editing = Boolean(record);
    const form = el('form', 'sunarp-form-grid');
    form.addEventListener('submit', event => event.preventDefault());

    const id = addTextField(
      form,
      'Código generado automáticamente',
      record && record.id,
      {
        name: 'id',
        readOnly: true,
        required: false,
        maxLength: 80,
        hint: editing
          ? 'El código identifica el registro y no se modifica durante la edición.'
          : 'Se genera a partir del nombre y de las relaciones seleccionadas. El servidor vuelve a validarlo antes de guardar.'
      }
    );
    const name = addTextField(form, metadata.nameLabel, record && record.name, {
      name: 'name',
      maxLength: 150,
      placeholder: 'Ingresa el nombre'
    });

    let site = null;
    let type = null;
    let parent = null;
    let order = null;

    if (entity === 'locales' || entity === 'estructura_org') {
      site = addSelectField(
        form,
        'Sede',
        record && record.sede_id,
        [{ value: '', label: 'Selecciona una sede' }].concat(
          records('sede').map(item => ({ value: item.id, label: item.name }))
        ),
        {
          name: 'sede_id',
          disabled: editing,
          hint: editing
            ? 'La sede no se modifica porque forma parte del identificador y de las referencias del registro.'
            : 'La jerarquía de este registro debe permanecer dentro de la sede seleccionada.'
        }
      );

      const typeEntity = entity === 'locales' ? 'tipos_local' : 'tipos_estructura';
      const typeFieldLabel = entity === 'locales' ? 'Tipo de local' : 'Tipo de estructura';
      const typeField = entity === 'locales' ? 'tipo_local_id' : 'tipo_estructura_id';
      type = addSelectField(
        form,
        typeFieldLabel,
        record && record[typeField],
        activeReferenceOptions(
          typeEntity,
          record && record[typeField],
          'Selecciona ' + (entity === 'locales' ? 'un tipo de local' : 'un tipo de estructura')
        ),
        { name: typeField, hint: 'Solo se ofrecen tipos activos para nuevas relaciones.' }
      );

      parent = addSelectField(
        form,
        entity === 'locales' ? 'Local padre' : 'Estructura padre',
        record && record.parent_id,
        parentOptions(entity, record && record.sede_id, record),
        {
          name: 'parent_id',
          required: false,
          hint: 'Déjalo vacío cuando corresponda a un elemento de nivel superior. El padre debe ser de la misma sede.'
        }
      );

      order = addTextField(form, 'Orden (opcional)', record && record.order, {
        name: 'order',
        type: 'number',
        required: false,
        min: 1,
        step: 1,
        placeholder: 'Ej. 1',
        hint: 'Número entero entre los elementos que comparten sede y elemento padre. No se renumera automáticamente.'
      });

      if (!editing) {
        site.addEventListener('change', function () {
          parent.replaceChildren();
          parentOptions(entity, site.value, null).forEach(function (item) {
            const option = el('option', '', item.label);
            option.value = item.value;
            parent.appendChild(option);
          });
          parent.value = '';
          updateId();
        });
      }
    }

    function updateId() {
      if (editing) {
        id.value = record.id;
        return;
      }
      const payload = { name: name.value };
      if (site) payload.sede_id = site.value;
      if (type) payload[entity === 'locales' ? 'tipo_local_id' : 'tipo_estructura_id'] = type.value;
      id.value = previewIdentifier(entity, payload);
    }

    if (!editing) {
      name.addEventListener('input', updateId);
      if (site) site.addEventListener('change', updateId);
      if (type) type.addEventListener('change', updateId);
      updateId();
    }

    const footer = el('div', 'access-modal-actions');
    const cancel = el('button', 'sunarp-btn sunarp-btn--outline', 'Cancelar');
    cancel.type = 'button';
    cancel.addEventListener('click', function () { SUNARPUI.closeModal(); });
    footer.appendChild(cancel);

    const save = el('button', 'sunarp-btn sunarp-btn--primary', editing ? 'Guardar cambios' : 'Registrar');
    save.type = 'button';
    save.addEventListener('click', async function () {
      if (save.disabled || !form.reportValidity()) return;
      if (!id.value) {
        notify('error', 'Completa el nombre y las relaciones para generar el código.');
        return;
      }
      save.disabled = true;
      const finish = beginLoading(form, 'Guardando registro...');
      try {
        const payload = {
          entity: entity,
          action: editing ? 'edit' : 'create',
          id: editing ? record.id : id.value.trim(),
          name: name.value.trim()
        };
        if (site) payload.sede_id = site.value;
        if (type) payload[entity === 'locales' ? 'tipo_local_id' : 'tipo_estructura_id'] = type.value;
        if (parent) payload.parent_id = parent.value;
        if (order) payload.order = order.value.trim();

        const result = await rpc('saveSiteOrganizationMaintenanceRecord', payload);
        replaceLocalRecord(entity, editing ? 'edit' : 'create', result.record || payload, editing && record.id);
        SUNARPUI.closeModal();
        notify('success', result.message || 'El registro se guardó correctamente.');
        renderActiveTab(route);
      } catch (error) {
        notify('error', error.message || 'No se pudo guardar el registro.');
      } finally {
        finish();
        if (save.isConnected) save.disabled = false;
      }
    });
    footer.appendChild(save);

    SUNARPUI.openModal({
      title: (editing ? 'Editar ' : 'Registrar ') + entityLabels[entity],
      content: form,
      footer: footer,
      size: 'lg'
    });
  }

  async function deleteRecord(route, entity, record) {
    const reason = deleteBlockReason(entity, record);
    if (reason) {
      notify('warning', 'No se puede eliminar el registro. ' + reason);
      return;
    }
    if (!window.confirm('¿Deseas eliminar ' + entityLabels[entity] + ' "' + record.name + '" (' + record.id + ')?')) {
      return;
    }
    const panel = document.getElementById(groups[route].panelId);
    const finish = beginLoading(panel, 'Eliminando registro...');
    try {
      const result = await rpc('deleteSiteOrganizationMaintenanceRecord', entity, record.id);
      replaceLocalRecord(entity, 'delete', null, record.id);
      notify('success', result.message || 'El registro se eliminó correctamente.');
      renderActiveTab(route);
    } catch (error) {
      notify('error', error.message || 'No se pudo eliminar el registro.');
    } finally {
      finish();
    }
  }

  function initializeRoute(route) {
    const config = groups[route];
    if (!config) return;
    const panel = document.getElementById(config.panelId);
    if (!panel) return;
    buildTabs(route);
    if (shared.data) {
      renderActiveTab(route);
      return;
    }
    loadSnapshot().catch(function (error) {
      console.error('[SiteOrganizationMaintenance] No se pudieron cargar los catálogos:', error);
    });
  }

  document.addEventListener('sunarp:navigate', function (event) {
    const route = event && event.detail && event.detail.route;
    if (Object.prototype.hasOwnProperty.call(groups, route)) {
      initializeRoute(route);
    }
  });
})();
</script>
