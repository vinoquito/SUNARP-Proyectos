<script>
(function () {
  'use strict';

  const groups = {
    'datos-personal': {
      tabsId: 'maintenancePersonalTabs',
      panelId: 'maintenancePersonalPanel',
      label: 'Datos de personal',
      tabs: [
        { id: 'cargos', label: 'Cargos' },
        { id: 'condicion_cargo', label: 'Condiciones de cargo' },
        { id: 'tipo_documento_identidad', label: 'Tipos de documento de identidad' }
      ]
    },
    'directorio-telefonico': {
      tabsId: 'maintenanceTelefonicoTabs',
      panelId: 'maintenanceTelefonicoPanel',
      label: 'Directorio telefónico',
      tabs: [
        { id: 'tipo_telefono', label: 'Tipos de teléfono' },
        { id: 'telefonos', label: 'Teléfonos' }
      ]
    }
  };

  const state = {};
  Object.keys(groups).forEach(function (route) {
    state[route] = {
      initialized: false,
      activeTab: groups[route].tabs[0].id,
      tabs: null,
      requestId: 0,
      table: null
    };
  });

  function rpc(functionName) {
    const args = Array.prototype.slice.call(arguments, 1);
    return new Promise(function (resolve, reject) {
      const runner = google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(reject);
      runner[functionName].apply(runner, args);
    });
  }

  function element(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined && text !== null) node.textContent = String(text);
    return node;
  }

  function notify(type, message) {
    if (window.SUNARPUI && typeof SUNARPUI.notify === 'function') {
      SUNARPUI.notify(type, message);
    }
  }

  function beginLoading(target, message) {
    if (window.SUNARPUI && typeof SUNARPUI.beginSectionLoading === 'function') {
      return SUNARPUI.beginSectionLoading(target, { message: message || '' });
    }
    return function () {};
  }

  function destroyTable(route) {
    const current = state[route];
    if (current.table && typeof current.table.destroy === 'function') {
      current.table.destroy();
    }
    current.table = null;
  }

  function showMessage(panel, message, isError) {
    panel.replaceChildren(element(
      'p',
      isError ? 'maintenance-error' : 'maintenance-placeholder',
      message
    ));
  }

  function isActive(value) {
    return value === true || String(value).trim().toLowerCase() === 'true' ||
      String(value).trim() === '1';
  }

  function renderPhoneSchemaNotice(panel) {
    destroyTable('directorio-telefonico');
    showMessage(
      panel,
      'El contrato físico de la tabla "telefonos" (nombre de pestaña, encabezados y relaciones) no está registrado en la documentación técnica versionada del proyecto. No se habilitan altas, cambios ni eliminaciones para evitar escribir en una estructura no verificada. "telefonos_ubicaciones" se mantiene como relación contextual y no como un CRUD independiente.',
      false
    );
  }

  function renderLoadedData(route, panel, data) {
    destroyTable(route);
    panel.replaceChildren();

    const heading = element('div', 'maintenance-section-heading');
    const titleBlock = element('div');
    titleBlock.appendChild(element('h2', '', data.label));
    titleBlock.appendChild(element('p', '', 'Administra el catálogo maestro utilizado por los módulos institucionales.'));
    heading.appendChild(titleBlock);

    if (data.capabilities && data.capabilities.canCreate) {
      const create = element('button', 'sunarp-btn sunarp-btn--primary', 'Nuevo registro');
      create.type = 'button';
      create.addEventListener('click', function () {
        openForm(route, data, null);
      });
      heading.appendChild(create);
    }
    panel.appendChild(heading);

    if (data.capabilities && data.capabilities.deleteUnavailableReason) {
      panel.appendChild(element(
        'p',
        'maintenance-placeholder',
        data.capabilities.deleteUnavailableReason
      ));
    }

    const tableHost = element('div', 'maintenance-table-host');
    tableHost.id = 'maintenanceCatalogTable_' + route.replace(/[^a-z0-9_-]/gi, '_');
    panel.appendChild(tableHost);

    const columns = [
      { key: 'id', label: 'Código', searchable: true },
      { key: data.nameField, label: data.nameLabel, searchable: true }
    ];
    if (data.hasActive) {
      columns.push({
        key: 'active',
        label: 'Estado',
        searchable: true,
        format: function (value) { return isActive(value) ? 'Activo' : 'Inactivo'; }
      });
    }

    const rowActions = [];
    if (data.capabilities && data.capabilities.canEdit) {
      rowActions.push({
        label: 'Editar',
        icon: 'edit',
        variant: 'primary',
        title: 'Editar registro',
        onClick: function (record) { openForm(route, data, record); }
      });
    }
    if (data.capabilities && data.capabilities.canDelete) {
      rowActions.push({
        label: 'Eliminar',
        icon: 'delete',
        variant: 'danger',
        title: 'Eliminar registro',
        onClick: function (record) { deleteRecord(route, data, record); }
      });
    }

    state[route].table = SUNARPUI.createDataTable({
      containerId: tableHost.id,
      mode: 'client',
      data: data.records || [],
      columns: columns,
      rowActions: rowActions,
      search: true,
      searchPlaceholder: 'Buscar en ' + data.label.toLowerCase() + '...',
      pageSize: 10,
      pageSizeOptions: [10, 25, 50],
      emptyMessage: 'No hay registros para mostrar.'
    });
  }

  async function loadTab(route) {
    const current = state[route];
    const config = groups[route];
    const panel = document.getElementById(config.panelId);
    if (!panel) return;

    if (route === 'directorio-telefonico' && current.activeTab === 'telefonos') {
      current.requestId += 1;
      renderPhoneSchemaNotice(panel);
      return;
    }

    const requestId = ++current.requestId;
    destroyTable(route);
    const finish = beginLoading(panel, 'Consultando catálogo...');
    try {
      const data = await rpc('getPersonnelTelephoneMaintenanceData', current.activeTab);
      if (requestId !== current.requestId) return;
      if (!data || data.entity !== current.activeTab || !Array.isArray(data.records) || !data.capabilities) {
        throw new Error('El servidor devolvió información incompleta para el mantenimiento.');
      }
      renderLoadedData(route, panel, data);
    } catch (error) {
      if (requestId === current.requestId) {
        destroyTable(route);
        showMessage(panel, error.message || 'No se pudo consultar el catálogo.', true);
      }
    } finally {
      finish();
    }
  }

  function addTextField(form, labelText, value, options) {
    const settings = options || {};
    const wrapper = element('label', 'sunarp-form-field');
    wrapper.appendChild(element('span', '', labelText));
    const input = element('input', 'sunarp-input');
    input.type = 'text';
    input.name = settings.name;
    input.value = value === undefined || value === null ? '' : String(value);
    input.required = true;
    input.maxLength = settings.maxLength || 150;
    input.autocomplete = 'off';
    if (settings.readOnly) input.readOnly = true;
    wrapper.appendChild(input);
    form.appendChild(wrapper);
    return input;
  }

  function openForm(route, data, record) {
    const editing = Boolean(record);
    const form = element('form', 'sunarp-form-grid');
    form.addEventListener('submit', function (event) { event.preventDefault(); });

    const idInput = addTextField(form, 'Código', record && record.id, {
      name: 'id',
      maxLength: 80,
      readOnly: editing
    });
    if (editing) {
      const hint = element('small', 'access-field-hint', 'El código identifica el registro y no se modifica durante la edición.');
      idInput.parentElement.appendChild(hint);
    }

    const nameInput = addTextField(
      form,
      data.nameLabel,
      record && record[data.nameField],
      { name: data.nameField, maxLength: 150 }
    );

    let activeInput = null;
    if (data.hasActive) {
      const activeLabel = element('label', 'sunarp-form-field');
      const control = element('span', 'sunarp-checkbox-field');
      activeInput = element('input');
      activeInput.type = 'checkbox';
      activeInput.name = 'active';
      activeInput.checked = editing ? isActive(record.active) : true;
      control.appendChild(activeInput);
      control.appendChild(element('span', '', 'Activo'));
      activeLabel.appendChild(control);
      form.appendChild(activeLabel);
    }

    const footer = element('div', 'access-modal-actions');
    const cancel = element('button', 'sunarp-btn sunarp-btn--outline', 'Cancelar');
    cancel.type = 'button';
    cancel.addEventListener('click', function () { SUNARPUI.closeModal(); });
    footer.appendChild(cancel);

    const save = element('button', 'sunarp-btn sunarp-btn--primary', editing ? 'Guardar cambios' : 'Registrar');
    save.type = 'button';
    save.addEventListener('click', async function () {
      if (save.disabled || !form.reportValidity()) return;
      save.disabled = true;
      const finish = beginLoading(form, 'Guardando registro...');
      try {
        const payload = {
          entity: data.entity,
          action: editing ? 'edit' : 'create',
          id: editing ? record.id : idInput.value.trim()
        };
        payload[data.nameField] = nameInput.value.trim();
        if (data.hasActive) payload.active = activeInput.checked;

        const result = await rpc('savePersonnelTelephoneMaintenanceRecord', payload);
        SUNARPUI.closeModal();
        notify('success', result && result.message || 'El registro se guardó correctamente.');
        await loadTab(route);
      } catch (error) {
        notify('error', error.message || 'No se pudo guardar el registro.');
      } finally {
        finish();
        if (save.isConnected) save.disabled = false;
      }
    });
    footer.appendChild(save);

    SUNARPUI.openModal({
      title: (editing ? 'Editar ' : 'Nuevo ') + data.label.toLowerCase(),
      content: form,
      footer: footer,
      size: 'md'
    });
  }

  async function deleteRecord(route, data, record) {
    const accepted = window.confirm(
      '¿Deseas eliminar el registro "' + record[data.nameField] + '" (' + record.id + ')?'
    );
    if (!accepted) return;

    const panel = document.getElementById(groups[route].panelId);
    const finish = beginLoading(panel, 'Eliminando registro...');
    try {
      const result = await rpc('deletePersonnelTelephoneMaintenanceRecord', data.entity, record.id);
      notify('success', result && result.message || 'El registro se eliminó correctamente.');
      await loadTab(route);
    } catch (error) {
      notify('error', error.message || 'No se pudo eliminar el registro.');
    } finally {
      finish();
    }
  }

  function initializeGroup(route) {
    const config = groups[route];
    const current = state[route];
    if (!config || !document.getElementById(config.panelId)) return;
    if (current.initialized) {
      loadTab(route);
      return;
    }

    current.initialized = true;
    current.tabs = SUNARPUI.createTabs({
      containerId: config.tabsId,
      panelId: config.panelId,
      label: config.label,
      tabs: config.tabs,
      activeId: current.activeTab,
      onChange: function (tabId) {
        current.activeTab = tabId;
        loadTab(route);
      }
    });

    loadTab(route);
  }

  document.addEventListener('sunarp:navigate', function (event) {
    const route = event && event.detail && event.detail.route;
    if (Object.prototype.hasOwnProperty.call(groups, route)) {
      initializeGroup(route);
    }
  });
})();
</script>
