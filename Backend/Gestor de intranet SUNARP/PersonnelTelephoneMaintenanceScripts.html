<script>
(function () {
  'use strict';

  const groups = {
    'datos-personal': {
      tabsId: 'maintenancePersonalTabs',
      panelId: 'maintenancePersonalPanel',
      label: 'Datos de personal',
      tabs: [
        { id: 'cargos', label: 'Cargos' },
        { id: 'condicion_cargo', label: 'Condiciones de cargo' },
        { id: 'tipo_documento_identidad', label: 'Tipos de documento de identidad' }
      ]
    },
    'directorio-telefonico': {
      tabsId: 'maintenanceTelefonicoTabs',
      panelId: 'maintenanceTelefonicoPanel',
      label: 'Directorio telefónico',
      tabs: [
        { id: 'tipo_telefono', label: 'Tipos de teléfono' },
        { id: 'telefonos', label: 'Teléfonos' }
      ]
    }
  };

  const entityLabels = {
    cargos: 'cargo',
    condicion_cargo: 'condición de cargo',
    tipo_documento_identidad: 'tipo de documento de identidad',
    tipo_telefono: 'tipo de teléfono'
  };

  const state = {};
  Object.keys(groups).forEach(function (route) {
    state[route] = {
      initialized: false,
      activeTab: groups[route].tabs[0].id,
      tabs: null,
      table: null,
      data: null,
      loadPromise: null
    };
  });

  function rpc(functionName) {
    const args = Array.prototype.slice.call(arguments, 1);
    return new Promise(function (resolve, reject) {
      const runner = google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(reject);
      if (typeof runner[functionName] !== 'function') {
        reject(new Error('No existe la función del servidor "' + functionName + '".'));
        return;
      }
      runner[functionName].apply(runner, args);
    });
  }

  function element(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined && text !== null) node.textContent = String(text);
    return node;
  }

  function notify(type, message) {
    if (window.SUNARPUI && typeof SUNARPUI.notify === 'function') {
      SUNARPUI.notify(type, message);
    }
  }

  function beginLoading(target, message) {
    if (window.SUNARPUI && typeof SUNARPUI.beginSectionLoading === 'function') {
      return SUNARPUI.beginSectionLoading(target, { message: message || '' });
    }
    return function () {};
  }

  function destroyTable(route) {
    const current = state[route];
    if (current.table && typeof current.table.destroy === 'function') {
      current.table.destroy();
    }
    current.table = null;
  }

  function showMessage(panel, message, isError) {
    panel.replaceChildren(element(
      'p',
      isError ? 'maintenance-error' : 'maintenance-placeholder',
      message
    ));
  }

  function isActive(value) {
    return value === true ||
      String(value).trim().toUpperCase() === 'TRUE' ||
      String(value).trim() === '1';
  }

  /**
   * Espeja los criterios del generador del backend. El servidor vuelve a
   * calcular el código antes de insertar: el valor del navegador no es confiable.
   */
  function generatedToken(value) {
    return String(value || '')
      .normalize('NFD')
      .replace(/[\u0300-\u036f]/g, '')
      .toUpperCase()
      .replace(/[^A-Z0-9]+/g, '_')
      .replace(/^_+|_+$/g, '');
  }

  function previewIdentifier(entity, name, records) {
    const rows = Array.isArray(records) ? records : [];
    if (entity === 'tipo_documento_identidad') {
      const maximum = rows.reduce(function (value, record) {
        const match = String(record.id || '').match(/^TD_(\d+)$/i);
        return match ? Math.max(value, Number(match[1])) : value;
      }, 0);
      return 'TD_' + String(maximum + 1).padStart(3, '0');
    }

    let token = generatedToken(name);
    if (entity === 'tipo_telefono') token = token.replace(/^TELEFONO_/, '');
    if (!token) return '';

    const prefix = entity === 'cargos'
      ? 'CARGO_'
      : entity === 'condicion_cargo'
        ? 'CONDICION_'
        : '';
    const maxLength = 80;
    const base = (prefix + token).slice(0, maxLength);
    const used = new Set(rows.map(record => String(record.id || '').toUpperCase()));
    if (!used.has(base.toUpperCase())) return base;

    for (let suffixNumber = 2; suffixNumber < 10000; suffixNumber++) {
      const suffix = '_' + suffixNumber;
      const candidate = base.slice(0, maxLength - suffix.length) + suffix;
      if (!used.has(candidate.toUpperCase())) return candidate;
    }
    return '';
  }

  function buildTabs(route) {
    const current = state[route];
    const config = groups[route];
    if (current.tabs) return;

    current.tabs = SUNARPUI.createTabs({
      containerId: config.tabsId,
      panelId: config.panelId,
      label: config.label,
      tabs: config.tabs,
      activeId: current.activeTab,
      onChange: function (tabId) {
        current.activeTab = tabId;
        renderActiveTab(route);
      }
    });
  }

  /**
   * La instantánea de cada grupo se solicita una sola vez por carga de la
   * aplicación. Reentrar a la pantalla o cambiar de pestaña no hace RPC.
   */
  function loadGroup(route) {
    const current = state[route];
    if (current.data) return Promise.resolve(current.data);
    if (current.loadPromise) return current.loadPromise;

    const config = groups[route];
    const panel = document.getElementById(config.panelId);
    const finish = beginLoading(panel, 'Consultando catálogos...');
    current.loadPromise = rpc('getPersonnelTelephoneMaintenanceData', route)
      .then(function (data) {
        if (!data || data.group !== route || !data.entities) {
          throw new Error('El servidor devolvió catálogos incompletos para el mantenimiento.');
        }
        current.data = data;
        renderActiveTab(route);
        return data;
      })
      .catch(function (error) {
        current.data = null;
        destroyTable(route);
        if (panel) showMessage(panel, error.message || 'No se pudieron consultar los catálogos.', true);
        throw error;
      })
      .finally(function () {
        finish();
        current.loadPromise = null;
      });

    return current.loadPromise;
  }

  function renderPhoneSchemaNotice(panel) {
    destroyTable('directorio-telefonico');
    showMessage(
      panel,
      'El contrato físico de la tabla "telefonos" (pestaña, encabezados, identificador y relaciones) no está registrado en la documentación técnica versionada. No se habilitan operaciones de escritura sobre una estructura no verificada. "telefonos_ubicaciones" permanece como relación contextual y no constituye un CRUD independiente.',
      false
    );
  }

  function updateLocalRecord(route, entity, action, record, id) {
    const current = state[route];
    const entityData = current.data && current.data.entities && current.data.entities[entity];
    if (!entityData) return;

    const records = entityData.records || [];
    const index = records.findIndex(function (item) {
      return String(item.id) === String(id || (record && record.id));
    });

    if (action === 'create' && record) {
      records.push(Object.assign({}, record));
    } else if (action === 'edit' || action === 'status') {
      if (index >= 0 && record) records[index] = Object.assign({}, record);
    } else if (action === 'delete' && index >= 0) {
      records.splice(index, 1);
    }
  }

  function createStatusCell(route, data, record) {
    const active = isActive(record.active);
    const wrapper = element('div', 'access-status-cell');
    wrapper.appendChild(SUNARPUI.createBadge({
      label: active ? 'Activo' : 'Inactivo',
      variant: active ? 'success' : 'danger',
      icon: active ? 'check_circle' : 'cancel'
    }));

    if (data.capabilities && data.capabilities.canChangeStatus) {
      const action = element(
        'button',
        active
          ? 'sunarp-datatable-status-link access-status-link access-status-link--deactivate'
          : 'sunarp-datatable-status-link access-status-link access-status-link--activate',
        active ? 'Desactivar' : 'Activar'
      );
      action.type = 'button';
      action.addEventListener('click', async function () {
        const next = !active;
        const verb = next ? 'activar' : 'desactivar';
        if (!window.confirm('¿Deseas ' + verb + ' ' + entityLabels[data.entity] + ' "' + record[data.nameField] + '"?')) {
          return;
        }

        action.disabled = true;
        const panel = document.getElementById(groups[route].panelId);
        const finish = beginLoading(panel, 'Actualizando estado...');
        try {
          const result = await rpc(
            'setPersonnelTelephoneMaintenanceStatus',
            data.entity,
            record.id,
            next
          );
          const updated = result && result.record
            ? result.record
            : Object.assign({}, record, { active: next });
          updateLocalRecord(route, data.entity, 'status', updated, record.id);
          renderActiveTab(route);
          notify('success', result && result.message || 'Estado actualizado correctamente.');
        } catch (error) {
          notify('error', error.message || 'No se pudo cambiar el estado.');
        } finally {
          finish();
          if (action.isConnected) action.disabled = false;
        }
      });
      wrapper.appendChild(action);
    }
    return wrapper;
  }

  function buildColumns(route, data) {
    const columns = [
      { key: 'id', label: 'Código', searchable: true },
      { key: data.nameField, label: data.nameLabel, searchable: true }
    ];
    if (data.hasActive) {
      columns.push({
        key: 'active',
        label: 'Estado',
        align: 'center',
        searchable: false,
        render: function (_value, record) {
          return createStatusCell(route, data, record);
        }
      });
    }
    return columns;
  }

  function buildRowActions(route, data) {
    const capabilities = data.capabilities || {};
    const actions = [];

    if (capabilities.canEdit) {
      actions.push({
        label: 'Editar',
        icon: 'edit',
        variant: 'primary',
        title: 'Editar registro',
        onClick: function (record) { openForm(route, data, record); }
      });
    }

    if (capabilities.canDeletePermission) {
      actions.push({
        label: 'Eliminar',
        icon: 'delete',
        variant: 'danger',
        title: capabilities.canDelete
          ? 'Eliminar registro'
          : capabilities.deleteUnavailableReason || 'Eliminación protegida por integridad referencial.',
        disabled: !capabilities.canDelete,
        onClick: function (record) {
          if (capabilities.canDelete) deleteRecord(route, data, record);
        }
      });
    }

    if (capabilities.canViewHistory && window.SUNARPAccessHistory &&
        typeof window.SUNARPAccessHistory.open === 'function') {
      actions.push({
        label: 'Historial',
        icon: 'history',
        variant: 'outline',
        title: 'Consultar historial del registro',
        onClick: function (record) {
          window.SUNARPAccessHistory.open(
            'MANTENIMIENTO',
            record.id,
            record[data.nameField]
          );
        }
      });
    }

    return actions;
  }

  function renderActiveTab(route) {
    const current = state[route];
    const config = groups[route];
    const panel = document.getElementById(config.panelId);
    if (!panel) return;

    if (route === 'directorio-telefonico' && current.activeTab === 'telefonos') {
      renderPhoneSchemaNotice(panel);
      return;
    }

    const data = current.data && current.data.entities
      ? current.data.entities[current.activeTab]
      : null;
    if (!data) {
      showMessage(panel, 'No hay un contrato disponible para este mantenimiento.', false);
      return;
    }

    destroyTable(route);
    panel.replaceChildren();

    const heading = element('div', 'maintenance-section-heading');
    const titleBlock = element('div');
    titleBlock.appendChild(element('h2', '', data.label));
    titleBlock.appendChild(element('p', '', 'Administra el catálogo maestro utilizado por los módulos institucionales.'));
    heading.appendChild(titleBlock);

    if (data.capabilities && data.capabilities.canCreate) {
      const create = element('button', 'sunarp-btn sunarp-btn--primary', 'Nuevo registro');
      create.type = 'button';
      create.addEventListener('click', function () {
        openForm(route, data, null);
      });
      heading.appendChild(create);
    }

    panel.appendChild(heading);

    if (data.capabilities && data.capabilities.deleteUnavailableReason &&
        data.capabilities.canDeletePermission) {
      panel.appendChild(element(
        'p',
        'maintenance-placeholder',
        data.capabilities.deleteUnavailableReason
      ));
    }

    const tableHost = element('div', 'maintenance-table-host');
    tableHost.id = 'maintenanceCatalogTable_' + route.replace(/[^a-z0-9_-]/gi, '_');
    panel.appendChild(tableHost);

    current.table = SUNARPUI.createDataTable({
      containerId: tableHost.id,
      mode: 'client',
      data: data.records || [],
      columns: buildColumns(route, data),
      rowActions: buildRowActions(route, data),
      search: true,
      searchPlaceholder: 'Buscar en ' + data.label.toLowerCase() + '...',
      pageSize: 10,
      pageSizeOptions: [10, 25, 50],
      emptyMessage: 'No hay registros para mostrar.'
    });
  }

  function addTextField(form, labelText, value, options) {
    const settings = options || {};
    const wrapper = element('label', 'sunarp-form-field');
    wrapper.appendChild(element('span', '', labelText));
    const input = element('input', 'sunarp-input');
    input.type = 'text';
    input.name = settings.name;
    input.value = value === undefined || value === null ? '' : String(value);
    input.required = settings.required !== false;
    input.maxLength = settings.maxLength || 150;
    input.autocomplete = 'off';
    if (settings.readOnly) input.readOnly = true;
    wrapper.appendChild(input);
    if (settings.hint) wrapper.appendChild(element('small', 'access-field-hint', settings.hint));
    form.appendChild(wrapper);
    return input;
  }

  function openForm(route, data, record) {
    const editing = Boolean(record);
    const form = element('form', 'sunarp-form-grid');
    form.addEventListener('submit', function (event) { event.preventDefault(); });

    const current = state[route];
    const idInput = addTextField(form, 'Código generado automáticamente', record && record.id, {
      name: 'id',
      maxLength: 80,
      readOnly: true,
      hint: editing
        ? 'El código identifica el registro y no se modifica durante la edición.'
        : 'Se completa a partir del nombre y de la codificación existente en el catálogo.'
    });

    const nameInput = addTextField(
      form,
      data.nameLabel,
      record && record[data.nameField],
      { name: data.nameField, maxLength: 150 }
    );

    function updateIdentifierPreview() {
      if (editing) {
        idInput.value = record.id;
        return;
      }
      const entityData = current.data.entities[data.entity];
      idInput.value = previewIdentifier(data.entity, nameInput.value, entityData.records || []);
    }

    if (!editing) {
      nameInput.addEventListener('input', updateIdentifierPreview);
      updateIdentifierPreview();
    }

    const footer = element('div', 'access-modal-actions');
    const cancel = element('button', 'sunarp-btn sunarp-btn--outline', 'Cancelar');
    cancel.type = 'button';
    cancel.addEventListener('click', function () { SUNARPUI.closeModal(); });
    footer.appendChild(cancel);

    const save = element('button', 'sunarp-btn sunarp-btn--primary', editing ? 'Guardar cambios' : 'Registrar');
    save.type = 'button';
    save.addEventListener('click', async function () {
      if (save.disabled || !form.reportValidity()) return;
      if (!editing && !idInput.value) {
        notify('error', 'Ingresa un nombre válido para generar el código.');
        return;
      }

      save.disabled = true;
      const finish = beginLoading(form, 'Guardando registro...');
      try {
        const payload = {
          entity: data.entity,
          action: editing ? 'edit' : 'create',
          id: editing ? record.id : idInput.value.trim()
        };
        payload[data.nameField] = nameInput.value.trim();

        const result = await rpc('savePersonnelTelephoneMaintenanceRecord', payload);
        const savedRecord = result && result.record
          ? result.record
          : Object.assign({}, payload);
        updateLocalRecord(route, data.entity, editing ? 'edit' : 'create', savedRecord, record && record.id);
        SUNARPUI.closeModal();
        notify('success', result && result.message || 'El registro se guardó correctamente.');
        renderActiveTab(route);
      } catch (error) {
        notify('error', error.message || 'No se pudo guardar el registro.');
      } finally {
        finish();
        if (save.isConnected) save.disabled = false;
      }
    });
    footer.appendChild(save);

    SUNARPUI.openModal({
      title: (editing ? 'Editar ' : 'Nuevo ') + data.label.toLowerCase(),
      content: form,
      footer: footer,
      size: 'md'
    });
  }

  async function deleteRecord(route, data, record) {
    const accepted = window.confirm(
      '¿Deseas eliminar el registro "' + record[data.nameField] + '" (' + record.id + ')?'
    );
    if (!accepted) return;

    const panel = document.getElementById(groups[route].panelId);
    const finish = beginLoading(panel, 'Eliminando registro...');
    try {
      const result = await rpc('deletePersonnelTelephoneMaintenanceRecord', data.entity, record.id);
      updateLocalRecord(route, data.entity, 'delete', null, record.id);
      renderActiveTab(route);
      notify('success', result && result.message || 'El registro se eliminó correctamente.');
    } catch (error) {
      notify('error', error.message || 'No se pudo eliminar el registro.');
    } finally {
      finish();
    }
  }

  function initializeGroup(route) {
    const config = groups[route];
    const current = state[route];
    if (!config || !document.getElementById(config.panelId)) return;

    buildTabs(route);
    if (current.data) {
      renderActiveTab(route);
      return;
    }
    loadGroup(route).catch(function (error) {
      console.error('[PersonnelTelephoneMaintenance] No se pudieron cargar los catálogos:', error);
    });
  }

  document.addEventListener('sunarp:navigate', function (event) {
    const route = event && event.detail && event.detail.route;
    if (Object.prototype.hasOwnProperty.call(groups, route)) {
      initializeGroup(route);
    }
  });
})();
</script>
