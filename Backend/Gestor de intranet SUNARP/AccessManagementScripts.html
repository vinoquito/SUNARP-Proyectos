<script>
  const AccessManagementPage = (() => {
  'use strict';

  const ROUTES = new Set(['accesos', 'administracion-accesos']);

  const state = {
    loaded: false,
    loading: false,
    data: null,
    activeTab: '',
    tabs: null,
    table: null,
  };

  const $ = (selector, root = document) => root.querySelector(selector);

  const $$ = (selector, root = document) =>
    Array.from(root.querySelectorAll(selector));


  function rpc(method, ...args) {
    return new Promise((resolve, reject) => {
      const runner = google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(error => reject(
          new Error(
            error && error.message
              ? error.message
              : 'No se pudo completar la operación.'
          )
        ));

      if (typeof runner[method] !== 'function') {
        reject(
          new Error(`No existe la función del servidor "${method}".`)
        );
        return;
      }

      runner[method](...args);
    });
  }


  function setMessage(message, isError) {
    const host = $('#accessPageMessage');

    if (!host) return;

    host.textContent = String(message || '');
    host.classList.toggle('is-error', Boolean(isError));
    host.hidden = !message;
  }


  function createButton(label, variant, onClick, icon) {
    const button = document.createElement('button');

    button.type = 'button';
    button.className = `sunarp-btn sunarp-btn--${variant || 'outline'}`;

    if (icon) {
      const iconNode = document.createElement('span');

      iconNode.className =
        'material-symbols-outlined sunarp-action-icon';

      iconNode.setAttribute('aria-hidden', 'true');
      iconNode.textContent = icon;

      button.appendChild(iconNode);
    }

    const text = document.createElement('span');
    text.textContent = label;

    button.appendChild(text);
    button.addEventListener('click', onClick);

    return button;
  }


  function createSelect(options, selectedValue, placeholder) {
    const select = document.createElement('select');

    select.className = 'access-control';

    if (placeholder) {
      const first = document.createElement('option');

      first.value = '';
      first.textContent = placeholder;

      select.appendChild(first);
    }

    (options || []).forEach(item => {
      const option = document.createElement('option');

      option.value = String(
        item.value ??
        item.id ??
        ''
      );

      option.textContent = String(
        item.label ??
        item.name ??
        item.value ??
        item.id ??
        ''
      );

      option.selected =
        option.value === String(selectedValue ?? '');

      select.appendChild(option);
    });

    return select;
  }


  function createInput(type, value, attributes) {
    const input = document.createElement('input');

    input.type = type || 'text';
    input.className = 'access-control';
    input.value = value == null ? '' : String(value);

    Object.entries(attributes || {}).forEach(([key, val]) => {
      if (
        key === 'required' ||
        key === 'readOnly' ||
        key === 'disabled'
      ) {
        input[key] = Boolean(val);

      } else if (val !== undefined && val !== null) {
        input.setAttribute(key, String(val));
      }
    });

    return input;
  }


  function createTextarea(value, rows) {
    const textarea = document.createElement('textarea');

    textarea.className =
      'access-control access-control--textarea';

    textarea.rows = rows || 3;
    textarea.value = value == null ? '' : String(value);

    return textarea;
  }


  function createField(labelText, control, hint) {
    const wrapper = document.createElement('label');

    wrapper.className = 'access-field';

    const label = document.createElement('span');

    label.className = 'access-field-label';
    label.textContent = labelText;

    wrapper.appendChild(label);
    wrapper.appendChild(control);

    if (hint) {
      const note = document.createElement('small');

      note.className = 'access-field-hint';
      note.textContent = hint;

      wrapper.appendChild(note);
    }

    return wrapper;
  }


  function createFormGrid() {
    const grid = document.createElement('div');

    grid.className = 'access-form-grid';

    return grid;
  }


  function openFormModal(title, form, onSave, saveLabel, options) {
    options = options || {};
    const footer = document.createElement('div');

    footer.className = 'access-modal-actions';

    footer.appendChild(
      createButton(
        'Cancelar',
        'outline',
        () => SUNARPUI.closeModal()
      )
    );

    const canSave = () => typeof options.canSave === 'function'
      ? options.canSave()
      : true;

    const save = createButton(
      saveLabel || 'Guardar',
      'primary',
      async () => {
        if (save.disabled || !form.reportValidity() || !canSave()) return;

        save.disabled = true;
        const finishLoading = SUNARPUI.beginLoading();

        try {
          await onSave();

          SUNARPUI.closeModal();

          await refreshData(false);

          SUNARPUI.notify(
            'success',
            'Los cambios se guardaron correctamente.'
          );

        } catch (error) {
          SUNARPUI.notify(
            'error',
            error.message ||
              'No se pudo guardar la información.'
          );

        } finally {
          finishLoading();
          if (save.isConnected) {
            save.disabled = !canSave();
          }
        }
      },
      'save'
    );

    save.disabled = !canSave();
    footer.appendChild(save);

    SUNARPUI.openModal({
      title,
      content: form,
      footer,
      size: options.size || 'lg'
    });

    return save;
  }


  function makeTabPanel(title, description, actionLabel, action) {
    const wrapper = document.createElement('div');

    wrapper.className = 'access-section';

    const heading = document.createElement('div');

    heading.className = 'access-section-heading';

    const copy = document.createElement('div');

    const titleNode = document.createElement('h3');

    titleNode.textContent = title;

    copy.appendChild(titleNode);

    if (description) {
      const paragraph = document.createElement('p');

      paragraph.textContent = description;

      copy.appendChild(paragraph);
    }

    heading.appendChild(copy);

    if (actionLabel && action) {
      heading.appendChild(
        createButton(
          actionLabel,
          'primary',
          action,
          'add'
        )
      );
    }

    wrapper.appendChild(heading);

    return wrapper;
  }


  function destroyTable() {
    if (
      state.table &&
      typeof state.table.destroy === 'function'
    ) {
      state.table.destroy();
    }

    state.table = null;
  }


  function renderTable(host, config) {
    const tableHost = document.createElement('div');

    tableHost.id = 'accessDataTableHost';

    host.appendChild(tableHost);

    destroyTable();

    state.table = SUNARPUI.createDataTable({
      containerId: tableHost.id,
      columns: config.columns,
      data: config.data || [],
      rowActions: config.rowActions || [],
      filters: config.filters || [],
      mode: config.mode || 'client',
      loadData: config.loadData,
      search: config.search !== false,

      searchPlaceholder:
        config.searchPlaceholder || 'Buscar...',

      pageSize: 10,
      pageSizeOptions: [10, 25, 50],

      emptyMessage:
        config.emptyMessage || 'No hay registros para mostrar.'
    });
  }


  function activeRoles() {
    return (state.data.roles || []).filter(role => role.active === true);
  }


  function roleName(roleId) {
    const role = (state.data.roles || []).find(
      item => item.rol_id === roleId
    );

    return role ? role.nombre : 'Rol no disponible';
  }


  function structureName(structureId) {
    const structure = (
      (state.data.catalogs || {}).estructuraOrg || []
    ).find(item => item.id === structureId);

    return structure
      ? structure.name
      : structureId || '—';
  }

  /**
 * Cambia el estado y actualiza la tabla.
 */
async function changeAccessStatus(method, id, row, entityLabel) {
  const isActive = _accessUiIsActive(row.active);
  const nextActive = !isActive;
  const action = isActive ? 'desactivar' : 'activar';
  const confirmed = window.confirm('¿Deseas ' + action + ' ' + entityLabel + '?\n\n' + id);
  if (!confirmed) return;
  const result = await rpc(method, id, nextActive);
  await refreshData(false);
  SUNARPUI.notify('success', result.message || 'Estado actualizado correctamente.');
}


function _accessUiIsActive(value) {
  return value === true || String(value || '').trim().toUpperCase() === 'TRUE';
}


function createAccessStatusCell(row, method, id, entityLabel) {
  const active = _accessUiIsActive(row.active);
  const wrapper = document.createElement('div');
  wrapper.className = 'access-status-cell';
  wrapper.appendChild(SUNARPUI.createBadge({
    label: active ? 'Activo' : 'Inactivo',
    variant: active ? 'success' : 'danger',
    icon: active ? 'check_circle' : 'cancel'
  }));
  const link = document.createElement('button');
  link.type = 'button';
  link.className = active
    ? 'access-status-link access-status-link--deactivate'
    : 'access-status-link access-status-link--activate';
  link.textContent = active ? 'Desactivar' : 'Activar';
  link.addEventListener('click', async () => {
    link.disabled = true;
    try {
      await changeAccessStatus(method, id, row, entityLabel);
    } catch (error) {
      SUNARPUI.notify('error', error.message || 'No se pudo cambiar el estado.');
    } finally {
      if (link.isConnected) link.disabled = false;
    }
  });
  wrapper.appendChild(link);
  return wrapper;
}



  function _accessScopeSignature(scopes) {
    return (scopes || [])
      .map(scope => [
        String(scope.tipo_ambito || ''),
        String(scope.referencia_id || ''),
        String(scope.incluir_descendientes || 'NO')
      ].join('\u0000'))
      .sort()
      .join('\u0001');
  }


  /**
   * Editor unificado de roles por módulo y ámbitos de acceso.
   * Reutiliza los catálogos y asignaciones que ya entrega getAccessManagementData().
   */

  function createUserModuleAccessEditor(personaId, disabled) {
    const capabilities = state.data.capabilities || {};
    const canManageRoles = capabilities.userRoles === true;
    const canManageScopes = canManageRoles && capabilities.scopes === true;

    const host = document.createElement('div');
    host.className = 'access-user-modules';

    const heading = document.createElement('div');
    heading.className = 'access-user-modules-heading';

    const title = document.createElement('h3');
    title.textContent = 'Accesos por módulo';

    const description = document.createElement('p');
    description.className = 'access-muted';
    description.textContent = 'Agrega únicamente los módulos que esta persona necesita utilizar y define sus ámbitos de acceso.';

    heading.append(title, description);
    host.appendChild(heading);

    if (!canManageRoles) {
      const note = document.createElement('p');
      note.className = 'access-muted';
      note.textContent = 'Tu cuenta no tiene permiso para administrar roles por módulo.';
      host.appendChild(note);
      return {
        element: host,
        getAssignments: () => []
      };
    }

    const allModules = (state.data.modules || []).slice();
    const modules = allModules
      .filter(item => item.active === true)
      .sort((a, b) => String(a.nombre || '').localeCompare(String(b.nombre || ''), 'es'));

    const catalogs = state.data.catalogs || {};
    const typeLabels = {
      TOTAL: 'Total',
      SEDE: 'Sede',
      ESTRUCTURA_ORG: 'Unidad orgánica',
      LOCAL: 'Local'
    };

    const roleAssignments = (state.data.userRoles || []).filter(item =>
      item.persona_id === personaId && item.active === true
    );

    const user = (state.data.users || []).find(item =>
      item.persona_id === personaId
    );

    const fallbackRoles = user && Array.isArray(user.roles)
      ? user.roles
      : [];

    const persistedModuleIds = new Set([
      ...roleAssignments.map(item => item.modulo_id),
      ...fallbackRoles.map(item => item.modulo_id)
    ]);

    const scopeAssignments = (state.data.scopes || []).filter(item =>
      item.persona_id === personaId && item.active === true
    );

    const draft = new Map();

    roleAssignments.forEach(item => {
      const module = allModules.find(candidate =>
        candidate.modulo_id === item.modulo_id
      );
      if (!module) return;

      draft.set(item.modulo_id, {
        modulo_id: item.modulo_id,
        rol_id: item.rol_id,
        ambitos: scopeAssignments
          .filter(scope => scope.modulo_id === item.modulo_id)
          .map(scope => ({
            tipo_ambito: scope.tipo_ambito,
            referencia_id: scope.referencia_id,
            incluir_descendientes: scope.incluir_descendientes || 'NO'
          }))
      });
    });

    fallbackRoles.forEach(item => {
      if (draft.has(item.modulo_id)) return;

      const module = allModules.find(candidate =>
        candidate.modulo_id === item.modulo_id
      );
      if (!module) return;

      draft.set(item.modulo_id, {
        modulo_id: item.modulo_id,
        rol_id: item.rol_id,
        ambitos: scopeAssignments
          .filter(scope => scope.modulo_id === item.modulo_id)
          .map(scope => ({
            tipo_ambito: scope.tipo_ambito,
            referencia_id: scope.referencia_id,
            incluir_descendientes: scope.incluir_descendientes || 'NO'
          }))
      });
    });

    const modulePicker = createSelect(
      [],
      '',
      'Selecciona un módulo'
    );

    const addModuleButton = createButton(
      'Agregar módulo',
      'primary',
      () => {
        if (!modulePicker.value) {
          SUNARPUI.notify('warning', 'Selecciona el módulo que deseas agregar.');
          return;
        }
        openModuleEditor(modulePicker.value, null);
      },
      'add'
    );

    const pickerGrid = createFormGrid();
    pickerGrid.classList.add('access-user-module-picker');
    pickerGrid.append(
      createField('Módulo', modulePicker),
      addModuleButton
    );
    host.appendChild(pickerGrid);

    const editorHost = document.createElement('div');
    editorHost.className = 'access-user-module-editor';
    host.appendChild(editorHost);

    const tableHeading = document.createElement('h4');
    tableHeading.className = 'access-user-assignment-heading';
    tableHeading.textContent = 'Accesos asignados';
    host.appendChild(tableHeading);

    const tableHost = document.createElement('div');
    tableHost.className = 'access-user-assignment-table-host';
    host.appendChild(tableHost);

    function moduleName(moduleId) {
      const match = allModules.find(item => item.modulo_id === moduleId);
      if (!match) return 'Módulo no disponible';
      return match.active === true
        ? match.nombre
        : match.nombre + ' (inactivo)';
    }

    function scopeReferenceName(scope) {
      if (scope.tipo_ambito === 'TOTAL') {
        return 'Todos los registros del módulo';
      }

      const items = scope.tipo_ambito === 'SEDE'
        ? (catalogs.sedes || [])
        : scope.tipo_ambito === 'ESTRUCTURA_ORG'
          ? (catalogs.estructuraOrg || [])
          : (catalogs.locales || []);

      const match = items.find(item => item.id === scope.referencia_id);
      return match ? match.name : 'Referencia no disponible';
    }

    function scopeLabel(scope) {
      const label = typeLabels[scope.tipo_ambito] || 'Ámbito';
      const reference = scopeReferenceName(scope);

      return label + ': ' + reference +
        (scope.tipo_ambito === 'ESTRUCTURA_ORG' &&
          scope.incluir_descendientes === 'SI'
          ? ' (incluye descendientes)'
          : '');
    }

    function refreshModulePicker() {
      const options = modules
        .filter(module => !draft.has(module.modulo_id))
        .map(module => ({
          value: module.modulo_id,
          label: module.nombre
        }));

      const next = createSelect(
        options,
        '',
        options.length ? 'Selecciona un módulo' : 'No hay más módulos disponibles'
      );

      modulePicker.replaceChildren(...Array.from(next.childNodes));
      modulePicker.disabled = Boolean(disabled) || !options.length;
      addModuleButton.disabled = Boolean(disabled) || !options.length;
    }

    function renderTable() {
      tableHost.replaceChildren();

      if (!draft.size) {
        const empty = document.createElement('p');
        empty.className = 'access-muted access-user-assignment-empty';
        empty.textContent = 'Todavía no se ha agregado ningún módulo.';
        tableHost.appendChild(empty);
        return;
      }

      const table = document.createElement('table');
      table.className = 'access-user-assignment-table';

      const thead = document.createElement('thead');
      const headerRow = document.createElement('tr');

      [
        'Módulo',
        'Rol',
        'Ámbitos de acceso',
        'Acciones'
      ].forEach(label => {
        const th = document.createElement('th');
        th.scope = 'col';
        th.textContent = label;
        headerRow.appendChild(th);
      });

      thead.appendChild(headerRow);
      table.appendChild(thead);

      const tbody = document.createElement('tbody');

      Array.from(draft.values())
        .sort((a, b) => moduleName(a.modulo_id).localeCompare(moduleName(b.modulo_id), 'es'))
        .forEach(assignment => {
          const row = document.createElement('tr');

          const moduleCell = document.createElement('td');
          moduleCell.textContent = moduleName(assignment.modulo_id);

          const roleCell = document.createElement('td');
          const role = (state.data.roles || []).find(item =>
            item.rol_id === assignment.rol_id
          );
          roleCell.textContent = role
            ? role.nombre + (role.active === true ? '' : ' (inactivo)')
            : 'Rol no disponible';

          const scopesCell = document.createElement('td');
          const scopes = assignment.ambitos || [];
          scopesCell.textContent = canManageScopes
            ? scopes.length
              ? scopes.map(scopeLabel).join(' · ')
              : 'Sin ámbitos asignados'
            : 'No disponibles para esta cuenta';

          const actionsCell = document.createElement('td');
          actionsCell.className = 'access-user-assignment-actions';

          const moduleIsActive = modules.some(item =>
            item.modulo_id === assignment.modulo_id
          );

          const editButton = createButton(
            'Editar',
            'outline',
            () => openModuleEditor(assignment.modulo_id, assignment),
            'edit'
          );
          editButton.classList.add('access-small-button');
          editButton.disabled = Boolean(disabled) || !moduleIsActive;

          const removeButton = createButton(
            'Eliminar',
            'outline',
            () => {
              if (
                !canManageScopes &&
                persistedModuleIds.has(assignment.modulo_id)
              ) {
                SUNARPUI.notify(
                  'warning',
                  'No puedes retirar este acceso porque tiene ámbitos asignados y tu cuenta no tiene permiso para administrarlos.'
                );
                return;
              }

              if (editorHost.childElementCount) {
                SUNARPUI.notify(
                  'warning',
                  'Termina o cancela la edición actual antes de eliminar otra asignación.'
                );
                return;
              }

              draft.delete(assignment.modulo_id);
              refreshModulePicker();
              renderTable();
            },
            'delete'
          );
          removeButton.classList.add('access-small-button');
          removeButton.disabled = Boolean(disabled) || !moduleIsActive;

          actionsCell.append(editButton, removeButton);
          row.append(moduleCell, roleCell, scopesCell, actionsCell);
          tbody.appendChild(row);
        });

      table.appendChild(tbody);
      tableHost.appendChild(table);
    }

    function openModuleEditor(moduleId, existingAssignment) {
      if (disabled) return;

      if (editorHost.childElementCount) {
        SUNARPUI.notify(
          'warning',
          'Termina o cancela la edición actual antes de abrir otra asignación.'
        );
        return;
      }

      modulePicker.disabled = true;
      addModuleButton.disabled = true;

      const module = modules.find(item =>
        item.modulo_id === moduleId
      );
      if (!module) return;

      const editing = Boolean(existingAssignment);
      const original = existingAssignment || {
        modulo_id: moduleId,
        rol_id: '',
        ambitos: []
      };

      editorHost.replaceChildren();

      const panel = document.createElement('section');
      panel.className = 'access-user-module-editor-panel';

      const panelHeading = document.createElement('div');
      panelHeading.className = 'access-user-module-editor-heading';

      const panelTitle = document.createElement('h4');
      panelTitle.textContent = module.nombre;

      const panelDescription = document.createElement('p');
      panelDescription.className = 'access-muted';
      panelDescription.textContent = editing
        ? 'Modifica el rol o los ámbitos y actualiza esta asignación.'
        : 'Define el rol y los ámbitos antes de agregar este acceso.';

      panelHeading.append(panelTitle, panelDescription);

      const roleOptions = activeRoles().map(role => ({
        value: role.rol_id,
        label: role.nombre
      }));

      if (
        original.rol_id &&
        !roleOptions.some(option => option.value === original.rol_id)
      ) {
        const inactiveRole = (state.data.roles || []).find(role =>
          role.rol_id === original.rol_id
        );

        roleOptions.unshift({
          value: original.rol_id,
          label: (inactiveRole ? inactiveRole.nombre : 'Rol no disponible') +
            ' (inactivo)'
        });
      }

      const roleSelect = createSelect(
        [{ value: '', label: 'Selecciona un rol' }].concat(roleOptions),
        original.rol_id
      );
      roleSelect.required = true;

      const fields = createFormGrid();
      fields.appendChild(createField('Rol para este módulo', roleSelect));
      panel.append(panelHeading, fields);

      let scopeDraft = (original.ambitos || []).map(item => ({
        tipo_ambito: item.tipo_ambito,
        referencia_id: item.referencia_id,
        incluir_descendientes: item.incluir_descendientes || 'NO'
      }));

      if (canManageScopes) {
        const scopesPanel = document.createElement('div');
        scopesPanel.className = 'access-user-scope-editor';

        const scopesTitle = document.createElement('h5');
        scopesTitle.textContent = 'Ámbitos de acceso';

        const scopeType = createSelect([
          { value: 'TOTAL', label: 'Total — todos los registros del módulo' },
          { value: 'SEDE', label: 'Sede' },
          { value: 'ESTRUCTURA_ORG', label: 'Unidad orgánica' },
          { value: 'LOCAL', label: 'Local directamente asignado' }
        ], 'TOTAL');

        const referenceSelect = createSelect(
          [],
          '',
          'No requiere referencia'
        );

        const descendants = createInput('checkbox', '', {});
        descendants.className = 'access-checkbox';

        const descendantsLabel = document.createElement('label');
        descendantsLabel.className = 'access-inline-check';
        descendantsLabel.append(
          descendants,
          document.createTextNode('Incluir unidades orgánicas descendientes')
        );

        const scopeFields = createFormGrid();
        scopeFields.classList.add('access-user-scope-grid');
        scopeFields.append(
          createField('Tipo de ámbito', scopeType),
          createField('Referencia', referenceSelect)
        );

        const scopeActions = document.createElement('div');
        scopeActions.className = 'access-scope-actions';

        const addScopeButton = createButton(
          'Agregar ámbito',
          'outline',
          addScope,
          'add'
        );

        scopeActions.appendChild(addScopeButton);

        const scopeList = document.createElement('div');
        scopeList.className = 'access-user-scope-list';

        function updateReferenceOptions() {
          const type = scopeType.value;
          const items = type === 'SEDE'
            ? (catalogs.sedes || [])
            : type === 'ESTRUCTURA_ORG'
              ? (catalogs.estructuraOrg || [])
              : type === 'LOCAL'
                ? (catalogs.locales || [])
                : [];

          const options = items.map(item => ({
            value: item.id,
            label: item.name
          }));

          const next = createSelect(
            options,
            '',
            type === 'TOTAL'
              ? 'No requiere referencia'
              : 'Selecciona una referencia'
          );

          referenceSelect.replaceChildren(...Array.from(next.childNodes));
          referenceSelect.disabled = !roleSelect.value || type === 'TOTAL';
          descendantsLabel.hidden = type !== 'ESTRUCTURA_ORG';
          descendants.checked = false;
        }

        function paintScopes() {
          scopeList.replaceChildren();

          if (!scopeDraft.length) {
            const note = document.createElement('p');
            note.className = 'access-muted';
            note.textContent = 'No se han agregado ámbitos para este módulo.';
            scopeList.appendChild(note);
            return;
          }

          scopeDraft.forEach((scope, index) => {
            const item = document.createElement('div');
            item.className = 'access-user-scope-item';

            const label = document.createElement('span');
            label.textContent = scopeLabel(scope);

            const remove = createButton(
              'Quitar',
              'outline',
              () => {
                scopeDraft.splice(index, 1);
                paintScopes();
              },
              'close'
            );
            remove.classList.add('access-small-button');

            item.append(label, remove);
            scopeList.appendChild(item);
          });
        }

        function addScope() {
          if (!roleSelect.value) {
            roleSelect.reportValidity();
            return;
          }

          const type = scopeType.value;
          const referenceId = type === 'TOTAL' ? '' : referenceSelect.value;

          if (type !== 'TOTAL' && !referenceId) {
            referenceSelect.reportValidity();
            return;
          }

          if (type === 'TOTAL' && scopeDraft.length) {
            SUNARPUI.notify('warning', 'TOTAL es exclusivo dentro del mismo módulo.');
            return;
          }

          if (type !== 'TOTAL' && scopeDraft.some(item =>
            item.tipo_ambito === 'TOTAL'
          )) {
            SUNARPUI.notify('warning', 'Quita el ámbito Total antes de agregar otros ámbitos.');
            return;
          }

          if (scopeDraft.some(item =>
            item.tipo_ambito === type &&
            item.referencia_id === referenceId
          )) {
            SUNARPUI.notify('warning', 'Ese ámbito ya está agregado.');
            return;
          }

          scopeDraft.push({
            tipo_ambito: type,
            referencia_id: referenceId,
            incluir_descendientes:
              type === 'ESTRUCTURA_ORG' && descendants.checked
                ? 'SI'
                : 'NO'
          });

          paintScopes();
        }

        roleSelect.addEventListener('change', () => {
          const enabled = Boolean(roleSelect.value);
          scopeType.disabled = !enabled;
          referenceSelect.disabled = !enabled || scopeType.value === 'TOTAL';
          descendants.disabled = !enabled;
          addScopeButton.disabled = !enabled;
        });

        scopeType.addEventListener('change', updateReferenceOptions);

        panel.append(
          scopesPanel
        );
        scopesPanel.append(
          scopesTitle,
          scopeFields,
          descendantsLabel,
          scopeActions,
          scopeList
        );

        updateReferenceOptions();
        paintScopes();
        scopeType.disabled = !roleSelect.value;
        referenceSelect.disabled = !roleSelect.value || scopeType.value === 'TOTAL';
        descendants.disabled = !roleSelect.value;
        addScopeButton.disabled = !roleSelect.value;

      } else {
        const note = document.createElement('p');
        note.className = 'access-muted';
        note.textContent = (original.ambitos || []).length
          ? 'Ámbitos existentes: ' + original.ambitos.map(scopeLabel).join(' · ') +
            '. No tienes permiso para modificarlos.'
          : 'No tienes permiso para administrar los ámbitos de acceso.';
        panel.appendChild(note);
      }

      const actions = document.createElement('div');
      actions.className = 'access-modal-actions';

      const cancelButton = createButton(
        'Cancelar',
        'outline',
        () => {
          editorHost.replaceChildren();
          refreshModulePicker();
        }
      );

      const confirmButton = createButton(
        editing ? 'Actualizar acceso' : 'Agregar acceso',
        'primary',
        () => {
          if (!roleSelect.value) {
            roleSelect.reportValidity();
            return;
          }

          if (
            !canManageScopes &&
            existingAssignment &&
            String(existingAssignment.rol_id || '') !== String(roleSelect.value || '') &&
            (existingAssignment.ambitos || []).length
          ) {
            SUNARPUI.notify(
              'warning',
              'No puedes cambiar el rol de esta asignación porque tiene ámbitos que no puedes administrar.'
            );
            return;
          }

          draft.set(moduleId, {
            modulo_id: moduleId,
            rol_id: roleSelect.value,
            ambitos: canManageScopes
              ? scopeDraft.map(item => Object.assign({}, item))
              : (original.ambitos || []).map(item => Object.assign({}, item))
          });

          editorHost.replaceChildren();
          refreshModulePicker();
          renderTable();
        },
        editing ? 'save' : 'add'
      );

      actions.append(cancelButton, confirmButton);
      panel.appendChild(actions);
      editorHost.appendChild(panel);
    }

    if (disabled) {
      modulePicker.disabled = true;
      addModuleButton.disabled = true;

      const note = document.createElement('p');
      note.className = 'access-muted';
      note.textContent = 'La cuenta está inactiva. Actívala desde el listado para modificar sus accesos.';
      host.appendChild(note);
    } else {
      refreshModulePicker();
    }

    renderTable();

    return {
      element: host,
      getAssignments: () => Array.from(draft.values()).map(item => ({
        modulo_id: item.modulo_id,
        rol_id: item.rol_id,
        ambitos: (item.ambitos || []).map(scope => Object.assign({}, scope))
      }))
    };
  }


  function _accessScopeSignature(scopes) {
    return (scopes || [])
      .map(scope => [
        String(scope.tipo_ambito || ''),
        String(scope.referencia_id || ''),
        String(scope.incluir_descendientes || 'NO')
      ].join('\u0000'))
      .sort()
      .join('\u0001');
  }


  /**
   * Persiste el borrador de accesos por módulo.
   * Se conservan las reglas de validación y auditoría de los servicios existentes.
   */
  async function saveUserModuleAccess(personaId, editor) {
    if (!editor) return;

    const capabilities = state.data.capabilities || {};
    const canManageRoles = capabilities.userRoles === true;
    const canManageScopes = canManageRoles && capabilities.scopes === true;

    if (!canManageRoles) return;

    const desiredAssignments = new Map(
      editor.getAssignments().map(item => [item.modulo_id, item])
    );

    const previousRoles = (state.data.userRoles || []).filter(item =>
      item.persona_id === personaId && item.active === true
    );

    const previousScopes = (state.data.scopes || []).filter(item =>
      item.persona_id === personaId && item.active === true
    );

    const previousRoleByModule = new Map(
      previousRoles.map(item => [item.modulo_id, item.rol_id])
    );

    const previousScopesByModule = new Map();
    previousScopes.forEach(item => {
      if (!previousScopesByModule.has(item.modulo_id)) {
        previousScopesByModule.set(item.modulo_id, []);
      }
      previousScopesByModule.get(item.modulo_id).push({
        tipo_ambito: item.tipo_ambito,
        referencia_id: item.referencia_id,
        incluir_descendientes: item.incluir_descendientes || 'NO'
      });
    });

    const moduleIds = new Set([
      ...previousRoleByModule.keys(),
      ...previousScopesByModule.keys(),
      ...desiredAssignments.keys()
    ]);

    const changes = Array.from(moduleIds).map(moduleId => {
      const desired = desiredAssignments.get(moduleId);
      const previousRoleId = previousRoleByModule.get(moduleId) || '';
      const desiredRoleId = desired ? desired.rol_id : '';

      const oldScopes = previousScopesByModule.get(moduleId) || [];
      const newScopes = desired
        ? desired.ambitos || []
        : [];

      return {
        modulo_id: moduleId,
        previous_rol_id: previousRoleId,
        rol_id: desiredRoleId,
        previous_ambitos: oldScopes,
        ambitos: canManageScopes
          ? newScopes
          : oldScopes
      };
    });

    const roleChanges = changes.filter(item =>
      String(item.previous_rol_id || '') !== String(item.rol_id || '')
    );

    const scopeChanges = canManageScopes
      ? changes.filter(item =>
          _accessScopeSignature(item.previous_ambitos) !==
          _accessScopeSignature(item.ambitos)
        )
      : [];

    if (!roleChanges.length && !scopeChanges.length) return;

    if (!canManageScopes) {
      const removingRoleWithScopes = roleChanges.some(item =>
        !item.rol_id && item.previous_ambitos.length
      );

      if (removingRoleWithScopes) {
        throw new Error(
          'No puedes retirar un acceso que tiene ámbitos asignados porque no tienes permiso para administrarlos.'
        );
      }
    }

    let completedOperations = 0;

    async function run(method, payload) {
      await rpc(method, payload);
      completedOperations++;
    }

    try {
      // Primero se limpian los ámbitos modificados. Esto permite cambiar
      // referencias de sede sin chocar con ámbitos antiguos en otros módulos.
      for (const item of scopeChanges) {
        if (item.previous_ambitos.length) {
          await run('saveAccessScopes', {
            persona_id: personaId,
            modulo_id: item.modulo_id,
            ambitos: []
          });
        }
      }

      for (const item of roleChanges) {
        await run('saveAccessUserRole', {
          persona_id: personaId,
          modulo_id: item.modulo_id,
          rol_id: item.rol_id,
          active: Boolean(item.rol_id)
        });
      }

      for (const item of scopeChanges) {
        if (item.rol_id && item.ambitos.length) {
          await run('saveAccessScopes', {
            persona_id: personaId,
            modulo_id: item.modulo_id,
            ambitos: item.ambitos
          });
        }
      }

    } catch (error) {
      if (completedOperations) {
        try {
          await refreshData(false);
        } catch (refreshError) {
          // Se conserva el error de la operación original.
        }

        throw new Error(
          'La configuración no se completó por completo. Se guardaron ' +
          completedOperations +
          ' operación(es) antes del error. Actualiza la vista y revisa los accesos antes de volver a intentarlo. Detalle: ' +
          (error.message || 'Error no identificado.')
        );
      }

      throw error;
    }
  }

  function openUserModal(row) {
    const editing = Boolean(row);
    const documentTypes = (state.data.documentTypes || [])
      .filter(item => item && item.id && item.name);

    const form = document.createElement('form');
    form.className = 'access-form';
    form.addEventListener('submit', event => event.preventDefault());

    let selectedPerson = null;
    let selectedPersonCanEnable = false;
    let selectedConfiguration = null;
    let saveButton = null;

    const resultHost = document.createElement('div');
    resultHost.className = 'access-person-search-result';
    resultHost.setAttribute('aria-live', 'polite');

    const alertHost = document.createElement('div');
    alertHost.id = 'accessUserDocumentSearchAlert';

    function showSearchAlert(type, title, message, details) {
      SUNARPUI.showAlert({
        containerId: alertHost.id,
        type,
        title,
        details,
        message,
        dismissible: false,
        replace: true
      });
    }

    function updateSaveState() {
      if (saveButton && !editing) {
        saveButton.disabled = !selectedPersonCanEnable;
      }
    }

    function resetSearchResult() {
      selectedPerson = null;
      selectedPersonCanEnable = false;
      selectedConfiguration = null;
      resultHost.replaceChildren();
      configHost.replaceChildren();
      updateSaveState();
    }

    const configHost = document.createElement('div');
    configHost.className = 'access-user-configuration';

    if (editing) {
      const identity = document.createElement('div');
      identity.className = 'access-person-identity';

      const name = document.createElement('strong');
      name.textContent = row.nombre_completo || 'Persona';

      const email = document.createElement('span');
      email.textContent = row.correo_institucional || 'Sin correo institucional';

      identity.append(name, email);

      selectedConfiguration = createUserModuleAccessEditor(
        row.persona_id,
        row.active !== true
      );

      configHost.appendChild(selectedConfiguration.element);
      form.append(identity, configHost);

    } else {
      const grid = createFormGrid();

      const documentType = createSelect(
        documentTypes.map(item => ({
          value: item.id,
          label: item.name
        })),
        '',
        'Selecciona un tipo de documento'
      );
      documentType.required = true;

      const documentNumber = createInput('text', '', {
        required: true,
        maxlength: 30,
        autocomplete: 'off',
        spellcheck: 'false',
        inputmode: 'text'
      });

      const searchButton = createButton(
        'Buscar persona',
        'outline',
        async () => {
          if (!documentType.value) {
            documentType.reportValidity();
            return;
          }
          if (!documentNumber.value.trim()) {
            documentNumber.reportValidity();
            return;
          }

          resetSearchResult();
          searchButton.disabled = true;
          clearButton.disabled = true;

          if (searchButton.lastElementChild) {
            searchButton.lastElementChild.textContent = 'Buscando...';
          }

          const searchCriteria = {
            tipo_documento: documentType.value,
            numero_documento: documentNumber.value.trim()
          };

          documentType.disabled = true;
          documentNumber.disabled = true;

          resultHost.appendChild(alertHost);
          const finishLoading = SUNARPUI.beginLoading({
            backdrop: 'translucent'
          });

          showSearchAlert(
            'info',
            'Buscando persona',
            'Consultando el documento en el directorio institucional.'
          );

          try {
            const result = await rpc('searchAccessPersonByDocument', searchCriteria);

            resultHost.replaceChildren(alertHost);

            if (!result || result.found !== true || !result.person) {
              showSearchAlert(
                'info',
                'Sin coincidencias',
                result && result.message
                  ? result.message
                  : 'No se encontró una persona con esos datos.'
              );
              return;
            }

            selectedPerson = result.person;

            const existingAccount = result.existingAccount || {
              exists: false,
              active: false
            };

            const accountExists = existingAccount.exists === true;

            selectedPersonCanEnable = Boolean(
              result.canEnableAccount && !accountExists
            );

            const personDetails = [
              selectedPerson.nombre_completo || 'Persona localizada',
              (selectedPerson.tipo_documento_name || 'Documento') +
                ': ' + selectedPerson.numero_documento +
                ' · Correo institucional: ' +
                (selectedPerson.correo_institucional || 'No registrado'),
              'Identificador: ' + selectedPerson.persona_id
            ];

            if (accountExists && existingAccount.active) {
              showSearchAlert(
                'warning',
                'La cuenta ya está habilitada',
                'Esta persona ya tiene una cuenta activa. No se puede crear otra cuenta.',
                personDetails
              );
            } else if (accountExists) {
              showSearchAlert(
                'warning',
                'La cuenta ya está registrada',
                'La cuenta de esta persona está inactiva. Actívala desde el listado de usuarios y luego utiliza «Configurar accesos».',
                personDetails
              );
            } else if (!result.canEnableAccount) {
              showSearchAlert(
                'warning',
                'No es posible habilitar la cuenta',
                result.reason || 'La persona no cumple las condiciones para habilitar una cuenta.',
                personDetails
              );
            } else {
              showSearchAlert(
                'success',
                'Persona localizada',
                'Configura los roles y ámbitos de acceso antes de habilitar la cuenta.',
                personDetails
              );

              selectedConfiguration = createUserModuleAccessEditor(
                selectedPerson.persona_id,
                false
              );
              configHost.replaceChildren(selectedConfiguration.element);
            }

            updateSaveState();

          } catch (error) {
            selectedPerson = null;
            selectedPersonCanEnable = false;
            selectedConfiguration = null;
            configHost.replaceChildren();

            showSearchAlert(
              'error',
              'No se pudo completar la búsqueda',
              error.message || 'Ocurrió un error al consultar el directorio.'
            );

            updateSaveState();

          } finally {
            finishLoading();

            documentType.disabled = false;
            documentNumber.disabled = false;
            searchButton.disabled = false;
            clearButton.disabled = false;

            if (searchButton.lastElementChild) {
              searchButton.lastElementChild.textContent = 'Buscar persona';
            }
          }
        },
        'search'
      );

      const clearButton = createButton(
        'Limpiar',
        'outline',
        () => {
          documentType.value = '';
          documentNumber.value = '';
          resetSearchResult();
          documentType.focus();
        },
        'backspace'
      );

      const searchActions = document.createElement('div');
      searchActions.className = 'access-modal-actions access-search-actions';
      searchActions.append(searchButton, clearButton);

      grid.append(
        createField('Tipo de documento', documentType),
        createField('Número de documento', documentNumber)
      );

      form.append(grid, searchActions, resultHost, configHost);

      documentType.addEventListener('change', resetSearchResult);
      documentNumber.addEventListener('input', resetSearchResult);

      if (!documentTypes.length) {
        documentType.disabled = true;
        documentNumber.disabled = true;
        searchButton.disabled = true;
        clearButton.disabled = true;
        resultHost.appendChild(alertHost);

        showSearchAlert(
          'error',
          'Catálogo no disponible',
          'No se encontraron tipos de documento en la pestaña tipo_documento_identidad.'
        );
      }
    }

    saveButton = openFormModal(
      editing ? 'Configurar accesos' : 'Habilitar cuenta',
      form,
      async () => {
        if (editing) {
          if (row.active !== true) {
            throw new Error('Activa la cuenta desde el listado antes de modificar sus accesos.');
          }

          await saveUserModuleAccess(row.persona_id, selectedConfiguration);
          return;
        }

        if (!selectedPerson || !selectedPersonCanEnable) {
          throw new Error('Primero busca una persona que no tenga una cuenta registrada.');
        }

        await rpc('saveAccessUser', {
          action: 'create',
          persona_id: selectedPerson.persona_id,
          tipo_documento: selectedPerson.tipo_documento,
          numero_documento: selectedPerson.numero_documento,
          active: true
        });

        try {
          await saveUserModuleAccess(
            selectedPerson.persona_id,
            selectedConfiguration
          );
        } catch (error) {
          try {
            await refreshData(false);
          } catch (refreshError) {
            // Se conserva el error de la configuración.
          }

          throw new Error(
            'La cuenta fue habilitada, pero no se completó toda la configuración de accesos. ' +
            (error.message || '')
          );
        }
      },
      editing ? 'Guardar accesos' : 'Habilitar cuenta',
      {
        size: 'xl',
        canSave: () => editing
          ? row.active === true
          : selectedPersonCanEnable
      }
    );
  }

      row && row.modulo_id,
      'Selecciona un módulo'
    );
    if (editing) module.disabled = true;

    const operation = createInput('text', row && row.operacion, {
      required: true, maxlength: 60
    });
    const description = createTextarea(row && row.descripcion, 3);
    description.required = true;
    const active = createSelect(
      [{ value: 'true', label: 'Activo' }, { value: 'false', label: 'Inactivo' }],
      row ? String(Boolean(row.active)) : 'true'
    );

    grid.append(
      createField('ID del permiso', id),
      createField('Código', code, 'Ejemplo: INFORMACION_PERSONAL_VER.'),
      createField('Módulo', module),
      createField('Operación', operation),
      createField('Descripción', description),
      createField('Estado', active)
    );
    form.appendChild(grid);

    openFormModal(
      editing ? 'Editar permiso' : 'Crear permiso',
      form,
      () => rpc('saveAccessPermission', {
        action: editing ? 'edit' : 'create',
        permiso_id: id.value.trim().toUpperCase(),
        codigo: code.value.trim().toUpperCase(),
        modulo_id: editing ? row.modulo_id : module.value,
        operacion: operation.value.trim().toUpperCase(),
        descripcion: description.value.trim(),
        active: active.value === 'true'
      }),
      editing ? 'Guardar cambios' : 'Crear permiso'
    );
  }


  function renderAssignments(host) {
    const section = makeTabPanel(
      'Asignación de permisos',
      'Selecciona un rol y marca las operaciones que tendrá habilitadas.'
    );
    host.appendChild(section);
    const panel = document.createElement('div');
    panel.className = 'access-assignment';

    const roleSelect = createSelect(
      activeRoles().map(role => ({
        value: role.rol_id,
        label: role.nombre + ' (' + role.rol_id + ')'
      })),
      '',
      'Selecciona un rol'
    );
    panel.appendChild(createField('Rol', roleSelect));

    const checklist = document.createElement('div');
    checklist.className = 'access-permission-groups';
    checklist.id = 'accessPermissionChecklist';
    panel.appendChild(checklist);

    const save = createButton('Guardar asignaciones', 'primary', async () => {
      if (!roleSelect.value) {
        SUNARPUI.notify('warning', 'Selecciona un rol.');
        return;
      }
      const selected = $$('input[type="checkbox"][data-permission-id]:checked', checklist)
        .map(input => input.dataset.permissionId);
      save.disabled = true;
      try {
        await rpc('saveRolePermissions', {
          rol_id: roleSelect.value,
          permiso_ids: selected
        });
        await refreshData(false);
        SUNARPUI.notify('success', 'Asignaciones actualizadas correctamente.');
        renderActiveTab('assignments');
      } catch (error) {
        SUNARPUI.notify('error', error.message);
      } finally {
        save.disabled = false;
      }
    }, 'save');
    panel.appendChild(save);
    host.appendChild(panel);

    function paintChecklist() {
      checklist.replaceChildren();
      if (!roleSelect.value) {
        const note = document.createElement('p');
        note.className = 'access-muted';
        note.textContent = 'Selecciona un rol para consultar sus permisos.';
        checklist.appendChild(note);
        return;
      }

      const assigned = new Set((state.data.rolePermissions || [])
        .filter(item => item.rol_id === roleSelect.value && item.active === true)
        .map(item => item.permiso_id));
      const permissions = (state.data.permissions || []).filter(item => item.active === true);
      const modules = new Map((state.data.modules || []).map(item => [item.modulo_id, item]));
      const groups = new Map();

      permissions.forEach(permission => {
        if (!groups.has(permission.modulo_id)) groups.set(permission.modulo_id, []);
        groups.get(permission.modulo_id).push(permission);
      });

      if (!permissions.length) {
        const note = document.createElement('p');
        note.className = 'access-muted';
        note.textContent = 'No hay permisos activos en el catálogo.';
        checklist.appendChild(note);
        return;
      }

      groups.forEach((items, moduleId) => {
        const group = document.createElement('section');
        group.className = 'access-permission-group';
        const heading = document.createElement('h4');
        const module = modules.get(moduleId);
        heading.textContent = module ? module.nombre : moduleId;
        group.appendChild(heading);

        items.forEach((permission, index) => {
          const label = document.createElement('label');
          label.className = 'access-check-row';
          const checkbox = document.createElement('input');
          checkbox.type = 'checkbox';
          checkbox.checked = assigned.has(permission.permiso_id);
          checkbox.dataset.permissionId = permission.permiso_id;
          checkbox.id = 'access-permission-' + moduleId + '-' + index;
          const text = document.createElement('span');
          text.textContent = permission.descripcion + ' (' + permission.codigo + ')';
          label.append(checkbox, text);
          group.appendChild(label);
        });
        checklist.appendChild(group);
      });
    }

    roleSelect.addEventListener('change', paintChecklist);
    paintChecklist();
  }


  function formatDate(value) {
    if (!value) return '—';

    const date = new Date(value);

    if (Number.isNaN(date.getTime())) {
      return String(value);
    }

    return new Intl.DateTimeFormat('es-PE', {
      dateStyle: 'short',
      timeStyle: 'short'
    }).format(date);
  }


  /**
 * Abre el historial particular de un registro.
 *
 * Utiliza la hoja Auditoria y permite consultar
 * los eventos paginados del registro seleccionado.
 */
function openEntityHistory(entityType, recordId, displayName) {
  const content = document.createElement('div');

  content.className = 'access-history';

  const description = document.createElement('p');

  description.className = 'access-history-description';

  description.textContent =
    `${displayName || recordId} — Identificador: ${recordId}`;

  const list = document.createElement('div');

  list.className = 'access-history-list';

  const message = document.createElement('p');

  message.className = 'access-muted';
  message.textContent = 'Consultando historial...';

  const loadMore = createButton(
    'Cargar más registros',
    'outline',
    loadNextPage,
    'expand_more'
  );

  loadMore.hidden = true;

  content.append(
    description,
    list,
    message,
    loadMore
  );

  const footer = document.createElement('div');

  footer.className = 'access-modal-actions';

  footer.appendChild(
    createButton(
      'Cerrar',
      'outline',
      () => SUNARPUI.closeModal()
    )
  );

  SUNARPUI.openModal({
    title: 'Historial del registro',
    content,
    footer,
    size: 'xl'
  });

  let currentPage = 1;
  const pageSize = 20;

  let loading = false;
  let total = 0;
  let loaded = 0;


  function appendAuditDetails(container, label, value) {
    if (!value) return;

    const details = document.createElement('details');

    details.className = 'access-history-details';

    const summary = document.createElement('summary');

    summary.textContent = label;

    const pre = document.createElement('pre');

    try {
      pre.textContent = JSON.stringify(
        JSON.parse(value),
        null,
        2
      );
    } catch (error) {
      pre.textContent = value;
    }

    details.append(summary, pre);
    container.appendChild(details);
  }


  function appendEvent(event) {
    const item = document.createElement('article');

    item.className = 'access-history-item';

    const heading = document.createElement('div');

    heading.className = 'access-history-item-heading';

    const action = document.createElement('strong');

    action.textContent = event.accion || 'Operación';

    const result = document.createElement('span');

    result.className =
      `access-history-result access-history-result--${
        String(event.resultado || '').toLowerCase()
      }`;

    result.textContent = event.resultado || '—';

    heading.append(action, result);

    const meta = document.createElement('div');

    meta.className = 'access-history-meta';

    const date = document.createElement('span');

    date.textContent = formatDate(event.fecha_hora);

    const actor = document.createElement('span');

    actor.textContent = [
      event.actor_nombre,
      event.actor_correo
    ].filter(Boolean).join(' — ');

    const module = document.createElement('span');

    module.textContent =
      `${event.modulo || '—'} · ${event.tipo_entidad || '—'}`;

    meta.append(date, actor, module);

    const detail = document.createElement('p');

    detail.className = 'access-history-detail';

    detail.textContent =
      event.detalle || 'Sin detalle adicional.';

    item.append(
      heading,
      meta,
      detail
    );

    appendAuditDetails(
      item,
      'Ver datos anteriores',
      event.datos_antes
    );

    appendAuditDetails(
      item,
      'Ver datos posteriores',
      event.datos_despues
    );

    list.appendChild(item);
  }


  async function loadNextPage() {
    if (loading) return;

    loading = true;
    loadMore.disabled = true;

    message.hidden = false;
    message.textContent = 'Consultando historial...';

    try {
      const result = await rpc(
        'getAccessEntityHistory',
        {
          tipo_entidad: entityType,
          registro_id: recordId,
          page: currentPage,
          pageSize
        }
      );

      total = result.total || 0;

      result.items.forEach(appendEvent);

      loaded += result.items.length;
      currentPage++;

      message.textContent = total
        ? `Se muestran ${loaded} de ${total} eventos.`
        : 'Este registro todavía no tiene eventos de auditoría.';

      loadMore.hidden = loaded >= total;

    } catch (error) {
      message.textContent =
        error.message || 'No se pudo consultar el historial.';

      SUNARPUI.notify(
        'error',
        message.textContent
      );

      loadMore.hidden = true;

    } finally {
      loading = false;
      loadMore.disabled = false;
    }
  }


  loadNextPage();
}


/**
 * Expone el componente para que Directorios y otros
 * módulos puedan abrir el mismo historial.
 */
window.SUNARPAccessHistory = Object.freeze({
  open: openEntityHistory
});


  function openAuditDetail(row) {
  const content = document.createElement('div');

  content.className = 'access-audit-detail';

  function addDetail(label, value) {
    const section = document.createElement('section');

    section.className = 'access-audit-detail-section';

    const heading = document.createElement('h4');

    heading.textContent = label;

    const pre = document.createElement('pre');

    pre.textContent = value || 'Sin información registrada.';

    section.append(heading, pre);
    content.appendChild(section);
  }

  addDetail(
    'Datos anteriores',
    row.datos_antes
  );

  addDetail(
    'Datos posteriores',
    row.datos_despues
  );

  addDetail(
    'Detalle de la operación',
    row.detalle
  );

  addDetail(
    'Información del ámbito',
    [
      `Módulo: ${row.ambito_modulo || '—'}`,
      `Tipo: ${row.ambito_tipo || '—'}`,
      `Referencia: ${row.ambito_referencia_id || '—'}`
    ].join('\n')
  );

  const footer = document.createElement('div');

  footer.className = 'access-modal-actions';

  footer.appendChild(
    createButton(
      'Cerrar',
      'outline',
      () => SUNARPUI.closeModal()
    )
  );

  SUNARPUI.openModal({
    title: 'Detalle de auditoría',
    content,
    footer,
    size: 'lg'
  });
}


  function renderAudit(host) {
    const section = makeTabPanel(
      'Auditoría',
      'Consulta el historial de operaciones y los resultados de autorización.'
    );

    host.appendChild(section);

    renderTable(host, {
      mode: 'server',

      loadData: params => rpc(
        'getAccessAuditHistory',
        {
          search: params.search,
          ...params.filters,
          page: params.page,
          pageSize: params.pageSize
        }
      ),

      columns: [
        {
          key: 'fecha_hora',
          label: 'Fecha y hora',
          render: value => formatDate(value)
        },
        {
          key: 'actor_correo',
          label: 'Usuario'
        },
        {
          key: 'accion',
          label: 'Acción'
        },
        {
          key: 'modulo',
          label: 'Módulo'
        },
        {
          key: 'registro_nombre',
          label: 'Registro'
        },
        {
          key: 'resultado',
          label: 'Resultado',
          align: 'center'
        },
        {
          key: 'detalle',
          label: 'Detalle'
        }
      ],

      rowActions: [
        {
          label: 'Ver detalle',
          icon: 'visibility',
          variant: 'outline',
          onClick: row => openAuditDetail(row)
        }
      ],

      filters: [
        {
          key: 'resultado',
          label: 'Resultado',
          options: [
            {
              value: 'OK',
              label: 'Correcto'
            },
            {
              value: 'DENEGADO',
              label: 'Denegado'
            },
            {
              value: 'ERROR',
              label: 'Error'
            }
          ]
        },

        {
          key: 'modulo',
          label: 'Módulo',

          options: (state.data.modules || []).map(item => ({
            value: item,
            label: item
          }))
        }
      ],

      searchPlaceholder:
        'Buscar usuario, acción, registro o detalle...',

      emptyMessage:
        'No hay eventos de auditoría para los filtros seleccionados.'
    });
  }


  function getAvailableTabs() {
    const caps = state.data.capabilities || {};

    const tabs = [];

    if (caps.users) {
      tabs.push({
        id: 'users',
        label: 'Usuarios'
      });
    }

    if (caps.roles) {
      tabs.push({
        id: 'roles',
        label: 'Roles'
      });
    }

    if (caps.permissions) {
      tabs.push({
        id: 'permissions',
        label: 'Permisos'
      });
    }

    if (caps.assignments) {
      tabs.push({
        id: 'assignments',
        label: 'Asignación de permisos'
      });
    }

    if (caps.audit) {
      tabs.push({
        id: 'audit',
        label: 'Auditoría'
      });
    }

    return tabs;
  }


  function renderActiveTab(tabId) {
    const panel = $('#accessTabPanel');

    if (!panel || !state.data) return;

    destroyTable();

    panel.replaceChildren();

    const renderers = {
      users: renderUsers,
      roles: renderRoles,
      permissions: renderPermissions,
      assignments: renderAssignments,
      audit: renderAudit
    };

    const renderer = renderers[tabId];

    if (!renderer) return;

    state.activeTab = tabId;

    renderer(panel);
  }


  function renderPage() {
    const tabs = getAvailableTabs();

    if (!tabs.length) {
      setMessage(
        'Tu cuenta no tiene permisos para administrar accesos ni consultar auditoría.',
        true
      );

      $('#accessTabs').replaceChildren();
      $('#accessTabPanel').replaceChildren();

      return;
    }

    setMessage('');

    const active = tabs.some(
      tab => tab.id === state.activeTab
    )
      ? state.activeTab
      : tabs[0].id;

    if (state.tabs) {
      state.tabs.destroy();
    }

    state.tabs = SUNARPUI.createTabs({
      containerId: 'accessTabs',
      panelId: 'accessTabPanel',
      label: 'Administración de accesos',
      tabs,
      activeId: active,
      onChange: renderActiveTab
    });

    renderActiveTab(active);
  }


  async function refreshData(showNotification) {
    if (state.loading) return;

    state.loading = true;

    const finish = SUNARPUI.beginLoading();

    setMessage('Consultando información de seguridad...');

    try {
      state.data = await rpc('getAccessManagementData');

      state.loaded = true;

      renderPage();

      if (showNotification) {
        SUNARPUI.notify(
          'success',
          'Información actualizada.'
        );
      }

    } catch (error) {
      setMessage(
        error.message ||
          'No se pudo cargar la administración de accesos.',
        true
      );

      SUNARPUI.notify(
        'error',
        error.message ||
          'No se pudo cargar la información.'
      );

    } finally {
      state.loading = false;
      finish();
    }
  }


  function isAccessRoute(route) {
    return ROUTES.has(
      String(route || '').trim().toLowerCase()
    );
  }


  document.addEventListener('sunarp:navigate', event => {
    if (
      isAccessRoute(
        event.detail && event.detail.route
      )
    ) {
      if (!state.loaded) {
        refreshData(false);
      } else {
        renderPage();
      }
    }
  });


  document.addEventListener('DOMContentLoaded', () => {
    const refreshButton = $('#accessRefreshButton');

    if (refreshButton) {
      refreshButton.addEventListener(
        'click',
        () => refreshData(true)
      );
    }
  });


  return Object.freeze({
    refresh: () => refreshData(true)
  });

})();
</script>
