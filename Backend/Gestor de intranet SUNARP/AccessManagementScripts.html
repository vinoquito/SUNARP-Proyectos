<script>
  const AccessManagementPage = (() => {
  'use strict';

  const ROUTES = new Set(['accesos', 'administracion-accesos']);

  const state = {
    loaded: false,
    loading: false,
    data: null,
    activeTab: '',
    tabs: null,
    table: null,
    userListController: null,
    localLoadingCount: 0,
    localLoadingElement: null
  };

  const $ = (selector, root = document) => root.querySelector(selector);

  const queryAll = (selector, root = document) =>
    Array.from(root.querySelectorAll(selector));


  function beginAccessPanelLoading(message) {
    const card = $('.access-card');
    if (!card) return () => {};
    state.localLoadingCount += 1;
    if (!state.localLoadingElement) {
      const overlay = document.createElement('div');
      overlay.className = 'access-local-loader';
      overlay.setAttribute('role', 'status');
      overlay.setAttribute('aria-live', 'polite');
      const spinner = document.createElement('span');
      spinner.className = 'access-local-loader-spinner';
      spinner.setAttribute('aria-hidden', 'true');
      const label = document.createElement('span');
      label.className = 'access-local-loader-message';
      label.textContent = message || 'Actualizando información...';
      overlay.append(spinner, label);
      card.appendChild(overlay);
      card.setAttribute('aria-busy', 'true');
      state.localLoadingElement = overlay;
    }
    let finished = false;
    return function finishAccessPanelLoading() {
      if (finished) return;
      finished = true;
      state.localLoadingCount = Math.max(0, state.localLoadingCount - 1);
      if (!state.localLoadingCount && state.localLoadingElement) {
        state.localLoadingElement.remove();
        state.localLoadingElement = null;
        card.removeAttribute('aria-busy');
      }
    };
  }


  function rpc(method, ...args) {
    return new Promise((resolve, reject) => {
      const runner = google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(error => reject(
          new Error(
            error && error.message
              ? error.message
              : 'No se pudo completar la operación.'
          )
        ));

      if (typeof runner[method] !== 'function') {
        reject(
          new Error(`No existe la función del servidor "${method}".`)
        );
        return;
      }

      runner[method](...args);
    });
  }


  function setMessage(message, isError) {
    const host = $('#accessPageMessage');

    if (!host) return;

    host.textContent = String(message || '');
    host.classList.toggle('is-error', Boolean(isError));
    host.hidden = !message;
  }


  function createButton(label, variant, onClick, icon) {
    const button = document.createElement('button');

    button.type = 'button';
    button.className = `sunarp-btn sunarp-btn--${variant || 'outline'}`;

    if (icon) {
      const iconNode = document.createElement('span');

      iconNode.className =
        'material-symbols-outlined sunarp-action-icon';

      iconNode.setAttribute('aria-hidden', 'true');
      iconNode.textContent = icon;

      button.appendChild(iconNode);
    }

    const text = document.createElement('span');
    text.textContent = label;

    button.appendChild(text);
    button.addEventListener('click', onClick);

    return button;
  }


  function createSelect(options, selectedValue, placeholder) {
    const select = document.createElement('select');

    select.className = 'access-control';

    if (placeholder) {
      const first = document.createElement('option');

      first.value = '';
      first.textContent = placeholder;
      first.selected = true;

      select.appendChild(first);
    }

    (options || []).forEach(item => {
      const option = document.createElement('option');

      option.value = String(
        item.value ??
        item.id ??
        ''
      );

      option.textContent = String(
        item.label ??
        item.name ??
        item.value ??
        item.id ??
        ''
      );

      option.selected =
        option.value === String(selectedValue ?? '');

      select.appendChild(option);
    });

    if (selectedValue === null || selectedValue === undefined || String(selectedValue) === '') {
      select.selectedIndex = 0;
    }

    return select;
  }


  function createInput(type, value, attributes) {
    const input = document.createElement('input');

    input.type = type || 'text';
    input.className = 'access-control';
    input.value = value == null ? '' : String(value);

    Object.entries(attributes || {}).forEach(([key, val]) => {
      if (
        key === 'required' ||
        key === 'readOnly' ||
        key === 'disabled'
      ) {
        input[key] = Boolean(val);

      } else if (val !== undefined && val !== null) {
        input.setAttribute(key, String(val));
      }
    });

    return input;
  }


  function createTextarea(value, rows) {
    const textarea = document.createElement('textarea');

    textarea.className =
      'access-control access-control--textarea';

    textarea.rows = rows || 3;
    textarea.value = value == null ? '' : String(value);

    return textarea;
  }


  function createField(labelText, control, hint) {
    const wrapper = document.createElement('label');

    wrapper.className = 'access-field';

    const label = document.createElement('span');

    label.className = 'access-field-label';
    label.textContent = labelText;

    wrapper.appendChild(label);
    wrapper.appendChild(control);

    if (hint) {
      const note = document.createElement('small');

      note.className = 'access-field-hint';
      note.textContent = hint;

      wrapper.appendChild(note);
    }

    return wrapper;
  }


  function createFormGrid() {
    const grid = document.createElement('div');

    grid.className = 'access-form-grid';

    return grid;
  }


  function openFormModal(title, form, onSave, saveLabel, options) {
    options = options || {};
    const footer = document.createElement('div');

    footer.className = 'access-modal-actions';

    footer.appendChild(
      createButton(
        'Cancelar',
        'outline',
        () => SUNARPUI.closeModal()
      )
    );

    const canSave = () => typeof options.canSave === 'function'
      ? options.canSave()
      : true;

    const save = createButton(
      saveLabel || 'Guardar',
      'primary',
      async () => {
        if (save.disabled || !form.reportValidity() || !canSave()) return;

        save.disabled = true;
        const finishLoading = beginAccessPanelLoading();

        try {
          await onSave();

          SUNARPUI.closeModal();

          await refreshCurrentTabData(false);

          SUNARPUI.notify(
            'success',
            'Los cambios se guardaron correctamente.'
          );

        } catch (error) {
          SUNARPUI.notify(
            'error',
            error.message ||
              'No se pudo guardar la información.'
          );

        } finally {
          finishLoading();
          if (save.isConnected) {
            save.disabled = !canSave();
          }
        }
      },
      'save'
    );

    save.disabled = !canSave();
    footer.appendChild(save);

    SUNARPUI.openModal({
      title,
      content: form,
      footer,
      size: options.size || 'lg'
    });

    return save;
  }


  function makeTabPanel(title, description, actionLabel, action, options) {
    options = options || {};
    const wrapper = document.createElement('div');
    wrapper.className = 'access-section';

    const heading = document.createElement('div');
    heading.className = 'access-section-heading';

    const copy = document.createElement('div');
    const titleNode = document.createElement('h3');
    titleNode.textContent = title;
    copy.appendChild(titleNode);

    if (description) {
      const paragraph = document.createElement('p');
      paragraph.textContent = description;
      copy.appendChild(paragraph);
    }

    heading.appendChild(copy);

    const actions = document.createElement('div');
    actions.className = 'access-section-actions';

    if (actionLabel && action) {
      actions.appendChild(createButton(actionLabel, 'primary', action, 'add'));
    }

    if (!options.hideRefresh) {
      actions.appendChild(createButton(
        'Actualizar',
        'outline',
        () => refreshCurrentTabData(true),
        'refresh'
      ));
    }

    if (actions.childElementCount) heading.appendChild(actions);
    wrapper.appendChild(heading);
    return wrapper;
  }


  function destroyTable() {
    if (
      state.table &&
      typeof state.table.destroy === 'function'
    ) {
      state.table.destroy();
    }

    state.table = null;
  }


  function renderTable(host, config) {
    const tableHost = document.createElement('div');

    tableHost.id = 'accessDataTableHost';

    host.appendChild(tableHost);

    destroyTable();

    state.table = SUNARPUI.createDataTable({
      containerId: tableHost.id,
      columns: config.columns,
      data: config.data || [],
      rowActions: config.rowActions || [],
      filters: config.filters || [],
      mode: config.mode || 'client',
      loadData: config.loadData,
      search: config.search !== false,

      searchPlaceholder:
        config.searchPlaceholder || 'Buscar...',

      pageSize: 10,
      pageSizeOptions: [10, 25, 50],

      emptyMessage:
        config.emptyMessage || 'No hay registros para mostrar.'
    });
  }


  function activeRoles() {
    return (state.data.roles || []).filter(role => role.active === true);
  }


  function roleName(roleId) {
    const role = (state.data.roles || []).find(
      item => item.rol_id === roleId
    );

    return role ? role.nombre : 'Rol no disponible';
  }


  function generatedToken(value) {
    return String(value || '')
      .normalize('NFD')
      .replace(/[\u0300-\u036f]/g, '')
      .toUpperCase()
      .replace(/[^A-Z0-9]+/g, '_')
      .replace(/^_+|_+$/g, '');
  }


  function previewIdentifier(prefix, value, maxLength) {
    const token = generatedToken(value);
    return token ? (prefix + token).slice(0, maxLength || 50) : '';
  }


  function previewPermissionCode(moduleCode, operation) {
    const moduleToken = generatedToken(moduleCode);
    const operationToken = generatedToken(operation);
    return moduleToken && operationToken
      ? (moduleToken + '_' + operationToken).slice(0, 80)
      : '';
  }



  /**
 * Cambia el estado y actualiza la tabla.
 */
async function changeAccessStatus(method, id, row, entityLabel) {
  const isActive = _accessUiIsActive(row.active);
  const nextActive = !isActive;
  const action = isActive ? 'desactivar' : 'activar';
  const confirmed = window.confirm('¿Deseas ' + action + ' ' + entityLabel + '?\n\n' + id);
  if (!confirmed) return;
  const finishLoading = beginAccessPanelLoading();
  let result;
  try {
    result = await rpc(method, id, nextActive);
    await refreshCurrentTabData(false);
  } finally {
    finishLoading();
  }
  SUNARPUI.notify('success', result.message || 'Estado actualizado correctamente.');
}


function _accessUiIsActive(value) {
  return value === true || String(value || '').trim().toUpperCase() === 'TRUE';
}


function createAccessStatusCell(row, method, id, entityLabel) {
  const active = _accessUiIsActive(row.active);
  const wrapper = document.createElement('div');
  wrapper.className = 'access-status-cell';
  wrapper.appendChild(SUNARPUI.createBadge({
    label: active ? 'Activo' : 'Inactivo',
    variant: active ? 'success' : 'danger',
    icon: active ? 'check_circle' : 'cancel'
  }));
  const link = document.createElement('button');
  link.type = 'button';
  link.className = active
    ? 'access-status-link access-status-link--deactivate'
    : 'access-status-link access-status-link--activate';
  link.textContent = active ? 'Desactivar' : 'Activar';
  link.addEventListener('click', async () => {
    link.disabled = true;
    try {
      await changeAccessStatus(method, id, row, entityLabel);
    } catch (error) {
      SUNARPUI.notify('error', error.message || 'No se pudo cambiar el estado.');
    } finally {
      if (link.isConnected) link.disabled = false;
    }
  });
  wrapper.appendChild(link);
  return wrapper;
}



  /**
   * Editor unificado de roles por módulo y ámbitos de acceso.
   * Reutiliza los catálogos y asignaciones que ya entrega getAccessManagementData().
   */

  function createUserModuleAccessEditor(personaId, disabled) {
    const capabilities = state.data.capabilities || {};
    const canManageRoles = capabilities.userRoles === true;
    const canManageScopes = canManageRoles && capabilities.scopes === true;

    const host = document.createElement('div');
    host.className = 'access-user-modules';

    const heading = document.createElement('div');
    heading.className = 'access-user-modules-heading';

    const title = document.createElement('h3');
    title.textContent = 'Accesos por módulo';

    const description = document.createElement('p');
    description.className = 'access-muted';
    description.textContent = 'Agrega únicamente los módulos que esta persona necesita utilizar y define sus ámbitos de acceso.';

    heading.append(title, description);
    host.appendChild(heading);

    if (!canManageRoles) {
      const note = document.createElement('p');
      note.className = 'access-muted';
      note.textContent = 'Tu cuenta no tiene permiso para administrar roles por módulo.';
      host.appendChild(note);
      return {
        element: host,
        getAssignments: () => []
      };
    }

    const allModules = (state.data.modules || []).slice();
    const modules = allModules
      .filter(item => item.active === true)
      .sort((a, b) => String(a.nombre || '').localeCompare(String(b.nombre || ''), 'es'));

    const catalogs = state.data.catalogs || {};
    const typeLabels = Object.fromEntries((state.data.scopeTypes || []).map(item => [item.tipo_ambito_id, item.nombre]));

    const roleAssignments = (state.data.userRoles || []).filter(item =>
      item.persona_id === personaId && item.active === true
    );

    const user = (state.data.users || []).find(item =>
      item.persona_id === personaId
    );

    const fallbackRoles = user && Array.isArray(user.roles)
      ? user.roles
      : [];

    const scopeAssignments = (state.data.scopes || []).filter(item =>
      item.persona_id === personaId && item.active === true
    );

    const draft = new Map();

    roleAssignments.forEach(item => {
      const module = allModules.find(candidate =>
        candidate.modulo_id === item.modulo_id
      );
      if (!module) return;

      draft.set(item.modulo_id, {
        modulo_id: item.modulo_id,
        rol_id: item.rol_id,
        has_scopes: item.has_scopes === true,
        ambitos: scopeAssignments
          .filter(scope => scope.modulo_id === item.modulo_id)
          .map(scope => ({
            tipo_ambito_id: scope.tipo_ambito_id,
            referencia_id: scope.referencia_id,
            incluir_descendientes: scope.incluir_descendientes || 'NO'
          }))
      });
    });

    fallbackRoles.forEach(item => {
      if (draft.has(item.modulo_id)) return;

      const module = allModules.find(candidate =>
        candidate.modulo_id === item.modulo_id
      );
      if (!module) return;

      draft.set(item.modulo_id, {
        modulo_id: item.modulo_id,
        rol_id: item.rol_id,
        has_scopes: roleAssignments.some(role =>
          role.modulo_id === item.modulo_id && role.has_scopes === true
        ),
        ambitos: scopeAssignments
          .filter(scope => scope.modulo_id === item.modulo_id)
          .map(scope => ({
            tipo_ambito_id: scope.tipo_ambito_id,
            referencia_id: scope.referencia_id,
            incluir_descendientes: scope.incluir_descendientes || 'NO'
          }))
      });
    });

    const modulePicker = createSelect(
      [],
      '',
      'Seleccionar el módulo que deseas agregar'
    );

    const pickerGrid = createFormGrid();
    pickerGrid.classList.add('access-user-module-picker');
    pickerGrid.append(
      createField('Agregar módulo', modulePicker)
    );
    host.appendChild(pickerGrid);

    const editorHost = document.createElement('div');
    editorHost.className = 'access-user-module-editor';
    host.appendChild(editorHost);

    const tableHeading = document.createElement('h4');
    tableHeading.className = 'access-user-assignment-heading';
    tableHeading.textContent = 'Accesos asignados';
    host.appendChild(tableHeading);

    const tableHost = document.createElement('div');
    tableHost.className = 'access-user-assignment-table-host';
    host.appendChild(tableHost);

    function moduleName(moduleId) {
      const match = allModules.find(item => item.modulo_id === moduleId);
      if (!match) return 'Módulo no disponible';
      return match.active === true
        ? match.nombre
        : match.nombre + ' (inactivo)';
    }

    function sedeName(sedeId) {
      const sede = (catalogs.sedes || []).find(item =>
        String(item.id) === String(sedeId)
      );
      return sede ? sede.name : 'Sede no disponible';
    }

    function structurePathName(structureId) {
      const byId = new Map((catalogs.estructuraOrg || []).map(item => [
        String(item.id),
        item
      ]));
      const parts = [];
      const visited = new Set();
      let current = byId.get(String(structureId));

      while (current) {
        const id = String(current.id);
        if (!id || visited.has(id)) break;
        visited.add(id);
        const structureType = (catalogs.tiposEstructura || []).find(item =>
          String(item.id) === String(current.tipo_estructura_id)
        );
        parts.unshift(
          structureType
            ? structureType.name + ': ' + current.name
            : current.name
        );
        current = current.parent_id
          ? byId.get(String(current.parent_id)) || null
          : null;
      }

      return parts.join(' / ');
    }

    function localStructurePaths(localId) {
      return (catalogs.estructuraLocal || [])
        .filter(item => String(item.local_id) === String(localId))
        .map(item => structurePathName(item.estructura_id))
        .filter(Boolean)
        .filter((path, index, all) => all.indexOf(path) === index);
    }

    function scopeReferenceName(scope) {
      if (scope.tipo_ambito_id === 'TOTAL') {
        return 'Todos los registros del módulo';
      }

      if (scope.tipo_ambito_id === 'SEDE') {
        return sedeName(scope.referencia_id);
      }

      if (scope.tipo_ambito_id === 'ESTRUCTURA_ORG') {
        const structure = (catalogs.estructuraOrg || []).find(item =>
          String(item.id) === String(scope.referencia_id)
        );
        if (!structure) return 'Unidad orgánica no disponible';

        const structureById = new Map((catalogs.estructuraOrg || []).map(item => [
          String(item.id),
          item
        ]));
        const relatedLocalIds = new Set();
        const visited = new Set();
        let current = structure;

        while (current) {
          const currentId = String(current.id);
          if (!currentId || visited.has(currentId)) break;
          visited.add(currentId);

          (catalogs.estructuraLocal || [])
            .filter(relation => String(relation.estructura_id) === currentId)
            .forEach(relation => relatedLocalIds.add(String(relation.local_id)));

          current = current.parent_id
            ? structureById.get(String(current.parent_id)) || null
            : null;
        }

        const localContext = Array.from(relatedLocalIds)
          .map(localId => (catalogs.locales || []).find(item =>
            String(item.id) === localId
          ))
          .filter(Boolean)
          .map(local => sedeName(local.sede_id) + ' — ' + local.name)
          .filter((value, index, all) => all.indexOf(value) === index)
          .sort((a, b) => a.localeCompare(b, 'es'));

        return [
          localContext.length ? localContext.join(' | ') : sedeName(structure.sede_id),
          structurePathName(structure.id)
        ].filter(Boolean).join(' / ');
      }

      const local = (catalogs.locales || []).find(item =>
        String(item.id) === String(scope.referencia_id)
      );
      if (!local) return 'Local no disponible';

      const paths = localStructurePaths(local.id);
      return [sedeName(local.sede_id), local.name].filter(Boolean).join(' / ') +
        (paths.length ? ' · Vinculado a: ' + paths.join(' | ') : ' · Sin unidad orgánica vinculada');
    }

    function scopeLabel(scope) {
      const label = typeLabels[scope.tipo_ambito_id] || 'Ámbito';
      const reference = scopeReferenceName(scope);

      return label + ': ' + reference +
        (scope.tipo_ambito_id === 'ESTRUCTURA_ORG' &&
          scope.incluir_descendientes === 'SI'
          ? ' (incluye descendientes)'
          : '');
    }

    function refreshModulePicker() {
      const options = modules
        .filter(module => !draft.has(module.modulo_id))
        .map(module => ({
          value: module.modulo_id,
          label: module.nombre
        }));

      const next = createSelect(
        options,
        '',
        options.length ? 'Seleccionar el módulo que deseas agregar' : 'No hay más módulos disponibles'
      );

      modulePicker.replaceChildren(...Array.from(next.childNodes));
      modulePicker.value = '';
      modulePicker.selectedIndex = 0;
      modulePicker.disabled = Boolean(disabled) || !options.length;
    }

    function renderTable() {
      tableHost.replaceChildren();

      if (!draft.size) {
        const empty = document.createElement('p');
        empty.className = 'access-muted access-user-assignment-empty';
        empty.textContent = 'Todavía no se ha agregado ningún módulo.';
        tableHost.appendChild(empty);
        return;
      }

      const table = document.createElement('table');
      table.className = 'access-user-assignment-table';

      const thead = document.createElement('thead');
      const headerRow = document.createElement('tr');

      [
        'Módulo',
        'Rol',
        'Ámbitos de acceso',
        'Acciones'
      ].forEach(label => {
        const th = document.createElement('th');
        th.scope = 'col';
        th.textContent = label;
        headerRow.appendChild(th);
      });

      thead.appendChild(headerRow);
      table.appendChild(thead);

      const tbody = document.createElement('tbody');

      Array.from(draft.values())
        .sort((a, b) => moduleName(a.modulo_id).localeCompare(moduleName(b.modulo_id), 'es'))
        .forEach(assignment => {
          const row = document.createElement('tr');

          const moduleCell = document.createElement('td');
          moduleCell.textContent = moduleName(assignment.modulo_id);

          const roleCell = document.createElement('td');
          const role = (state.data.roles || []).find(item =>
            item.rol_id === assignment.rol_id
          );
          roleCell.textContent = role
            ? role.nombre + (role.active === true ? '' : ' (inactivo)')
            : 'Rol no disponible';

          const scopesCell = document.createElement('td');
          const scopes = assignment.ambitos || [];
          scopesCell.textContent = canManageScopes
            ? scopes.length
              ? scopes.map(scopeLabel).join(' · ')
              : 'Sin ámbitos asignados'
            : 'Sin permiso para consultar ámbitos';

          const actionsCell = document.createElement('td');
          actionsCell.className = 'access-user-assignment-actions';

          const moduleIsActive = modules.some(item =>
            item.modulo_id === assignment.modulo_id
          );

          const editButton = createButton(
            'Editar',
            'outline',
            () => openModuleEditor(assignment.modulo_id, assignment),
            'edit'
          );
          editButton.classList.add('access-small-button');
          editButton.disabled = Boolean(disabled) || !moduleIsActive;

          const removeButton = createButton(
            'Eliminar',
            'outline',
            () => {
              if (!canManageScopes && assignment.has_scopes === true) {
                SUNARPUI.notify(
                  'warning',
                  'No puedes retirar este acceso porque tiene ámbitos asignados y tu cuenta no tiene permiso para administrarlos.'
                );
                return;
              }

              if (editorHost.childElementCount) {
                SUNARPUI.notify(
                  'warning',
                  'Termina o cancela la edición actual antes de eliminar otra asignación.'
                );
                return;
              }

              draft.delete(assignment.modulo_id);
              refreshModulePicker();
              renderTable();
            },
            'delete'
          );
          removeButton.classList.add('access-small-button');
          removeButton.disabled = Boolean(disabled) || !moduleIsActive;

          actionsCell.append(editButton, removeButton);
          row.append(moduleCell, roleCell, scopesCell, actionsCell);
          tbody.appendChild(row);
        });

      table.appendChild(tbody);
      tableHost.appendChild(table);
    }

    function openModuleEditor(moduleId, existingAssignment) {
      if (disabled) return;

      if (editorHost.childElementCount) {
        SUNARPUI.notify(
          'warning',
          'Termina o cancela la edición actual antes de abrir otra asignación.'
        );
        return;
      }

      const module = modules.find(item =>
        item.modulo_id === moduleId
      );

      if (!module) {
        SUNARPUI.notify('warning', 'El módulo seleccionado ya no está disponible.');
        return;
      }

      modulePicker.disabled = true;

      const editing = Boolean(existingAssignment);
      const original = existingAssignment || {
        modulo_id: moduleId,
        rol_id: '',
        ambitos: []
      };

      editorHost.replaceChildren();

      const panel = document.createElement('section');
      panel.className = 'access-user-module-editor-panel';

      const panelHeading = document.createElement('div');
      panelHeading.className = 'access-user-module-editor-heading';

      const panelTitle = document.createElement('h4');
      panelTitle.textContent = module.nombre;

      const panelDescription = document.createElement('p');
      panelDescription.className = 'access-muted';
      panelDescription.textContent = editing
        ? 'Modifica el rol o los ámbitos y actualiza esta asignación.'
        : 'Define el rol y los ámbitos antes de agregar este acceso.';

      panelHeading.append(panelTitle, panelDescription);

      const roleOptions = activeRoles().map(role => ({
        value: role.rol_id,
        label: role.nombre
      }));

      if (
        original.rol_id &&
        !roleOptions.some(option => option.value === original.rol_id)
      ) {
        const inactiveRole = (state.data.roles || []).find(role =>
          role.rol_id === original.rol_id
        );

        roleOptions.unshift({
          value: original.rol_id,
          label: (inactiveRole ? inactiveRole.nombre : 'Rol no disponible') +
            ' (inactivo)'
        });
      }

      const roleSelect = createSelect(
        [{ value: '', label: 'Selecciona un rol' }].concat(roleOptions),
        original.rol_id
      );
      roleSelect.required = true;

      const fields = createFormGrid();
      fields.appendChild(createField('Rol para este módulo', roleSelect));
      panel.append(panelHeading, fields);

      let scopeDraft = (original.ambitos || []).map(item => ({
        tipo_ambito_id: item.tipo_ambito_id,
        referencia_id: item.referencia_id,
        incluir_descendientes: item.incluir_descendientes || 'NO'
      }));

      // El botón de confirmación está fuera del bloque canManageScopes.
      // Se expone un recolector de ámbitos en el ámbito léxico del editor para
      // que el manejador del botón no acceda a controles locales inaccesibles.
      let collectScopes = () => ({
        valid: true,
        scopes: (original.ambitos || []).map(item => Object.assign({}, item))
      });

      if (canManageScopes) {
        const scopesPanel = document.createElement('div');
        scopesPanel.className = 'access-user-scope-editor';

        const scopesTitle = document.createElement('h5');
        scopesTitle.textContent = scopeDraft.length
          ? 'Ámbitos actualmente asignados'
          : 'Ámbito del acceso';

        const scopeTypeOptions = (state.data.scopeTypes || []).map(item => ({
          value: item.tipo_ambito_id,
          label: item.nombre
        }));
        const scopeType = createSelect(scopeTypeOptions, '', 'Selecciona un ámbito (opcional)');

        const descendants = createInput('checkbox', '', {});
        descendants.className = 'access-checkbox';

        const descendantsLabel = document.createElement('label');
        descendantsLabel.className = 'access-inline-check';
        descendantsLabel.append(
          descendants,
          document.createTextNode('Incluir unidades orgánicas descendientes')
        );

        const scopeFields = createFormGrid();
        scopeFields.classList.add('access-user-scope-grid');
        scopeFields.appendChild(createField('Tipo de ámbito', scopeType));

        const scopeContextHost = document.createElement('div');
        scopeContextHost.className = 'access-user-scope-context';
        scopeFields.appendChild(scopeContextHost);

        const scopeList = document.createElement('div');
        scopeList.className = 'access-user-scope-list';

        const scopeHelp = document.createElement('p');
        scopeHelp.className = 'access-muted access-user-scope-context-note';
        scopeHelp.textContent = 'Selecciona el ámbito aquí y pulsa Agregar acceso para guardar conjuntamente el módulo, el rol y el ámbito. Si no necesitas restringir el acceso, puedes dejarlo sin ámbito.';

        let selectedReferenceId = '';

        function structureHierarchyForLocal(localId) {
          const structures = catalogs.estructuraOrg || [];
          const structureById = new Map(structures.map(item => [
            String(item.id),
            item
          ]));

          const linkedStructureIds = new Set(
            (catalogs.estructuraLocal || [])
              .filter(relation => String(relation.local_id) === String(localId))
              .map(relation => String(relation.estructura_id || ''))
              .filter(id => id && structureById.has(id))
          );

          // Si el local tiene relaciones con varios niveles de una misma rama,
          // iniciar únicamente en el ancestro vinculado más alto evita mezclar
          // unidades, subunidades y áreas en el primer selector.
          const roots = Array.from(linkedStructureIds)
            .map(id => structureById.get(id))
            .filter(structure => {
              let parentId = String(structure.parent_id || '');
              const visited = new Set([String(structure.id)]);

              while (parentId && !visited.has(parentId)) {
                if (linkedStructureIds.has(parentId)) return false;

                visited.add(parentId);
                const parent = structureById.get(parentId);
                if (!parent) break;

                parentId = String(parent.parent_id || '');
              }

              return true;
            })
            .sort(compareStructures);

          return { structures, roots };
        }

        function compareStructures(a, b) {
          return (Number(a.order) || 0) - (Number(b.order) || 0) ||
            String(a.name || '').localeCompare(String(b.name || ''), 'es');
        }

        function structureTypeName(structure) {
          const structureType = (catalogs.tiposEstructura || []).find(type =>
            String(type.id) === String(structure.tipo_estructura_id)
          );
          return structureType ? structureType.name : '';
        }

        function structureOptionLabel(structure) {
          const typeName = structureTypeName(structure);
          return typeName
            ? typeName + ' — ' + structure.name
            : structure.name;
        }

        function renderStructureLevels(localId, levelsHost, selectedChain, type) {
          levelsHost.replaceChildren();

          const hierarchy = structureHierarchyForLocal(localId);
          let options = hierarchy.roots;
          let level = 1;

          if (!options.length) {
            const note = document.createElement('p');
            note.className = 'access-muted';
            note.textContent = type === 'LOCAL'
              ? 'Este local no tiene unidades orgánicas vinculadas. El ámbito se aplicará directamente al local.'
              : 'Este local no tiene unidades orgánicas vinculadas; no es posible asignar un ámbito de unidad orgánica.';
            levelsHost.appendChild(note);

            selectedReferenceId = type === 'LOCAL' ? String(localId) : '';
            return;
          }

          while (options.length && level <= 20) {
            const currentLevel = level;
            const selectedId = selectedChain[currentLevel - 1] || '';
            const levelTypeNames = Array.from(new Set(
              options.map(structureTypeName).filter(Boolean)
            ));
            const fieldLabel = currentLevel === 1
              ? 'Unidades orgánicas del local'
              : 'Nivel ' + currentLevel + (
                levelTypeNames.length === 1
                  ? ' — ' + levelTypeNames[0]
                  : ''
              );

            const levelSelect = createSelect(
              options.map(item => ({
                value: item.id,
                label: structureOptionLabel(item)
              })),
              selectedId,
              currentLevel === 1
                ? 'Selecciona una unidad del local'
                : 'Selecciona el nivel siguiente'
            );
            levelSelect.required = type === 'ESTRUCTURA_ORG';
            levelSelect.disabled = !roleSelect.value;

            levelsHost.appendChild(createField(fieldLabel, levelSelect));

            levelSelect.addEventListener('change', () => {
              selectedChain.splice(currentLevel - 1);
              if (levelSelect.value) selectedChain.push(levelSelect.value);

              selectedReferenceId = type === 'LOCAL'
                ? String(localId)
                : selectedChain.length
                  ? selectedChain[selectedChain.length - 1]
                  : '';

              renderStructureLevels(localId, levelsHost, selectedChain, type);
            });

            if (
              !selectedId ||
              !options.some(item => String(item.id) === String(selectedId))
            ) {
              break;
            }

            options = hierarchy.structures
              .filter(item => String(item.parent_id || '') === String(selectedId))
              .sort(compareStructures);
            level += 1;
          }

          selectedReferenceId = type === 'LOCAL'
            ? String(localId)
            : selectedChain.length
              ? selectedChain[selectedChain.length - 1]
              : '';
        }

        function updateReferenceOptions() {
          const type = scopeType.value;
          const canSelect = Boolean(roleSelect.value);

          selectedReferenceId = '';
          scopeContextHost.replaceChildren();
          const selectedScopeType = (state.data.scopeTypes || []).find(item => item.tipo_ambito_id === type);
          descendantsLabel.hidden = !(selectedScopeType && selectedScopeType.permite_descendientes === true);
          descendants.checked = false;

          if (!type) {
            const note = document.createElement('p');
            note.className = 'access-muted';
            note.textContent = 'El ámbito es opcional. Selecciona uno únicamente cuando necesites limitar los registros a los que tendrá acceso este módulo.';
            scopeContextHost.appendChild(note);
            return;
          }

          if (type === 'TOTAL') {
            const note = document.createElement('p');
            note.className = 'access-muted';
            note.textContent = 'Incluye todos los registros del módulo. No requiere sede ni referencia.';
            scopeContextHost.appendChild(note);
            return;
          }

          if (type === 'SEDE') {
            const siteSelect = createSelect(
              (catalogs.sedes || []).map(item => ({
                value: item.id,
                label: item.name
              })),
              '',
              'Selecciona una sede'
            );
            siteSelect.required = true;
            siteSelect.disabled = !canSelect;
            scopeContextHost.appendChild(createField('Sede', siteSelect));

            siteSelect.addEventListener('change', () => {
              selectedReferenceId = siteSelect.value;
            });
            return;
          }

          if (type === 'ESTRUCTURA_ORG' || type === 'LOCAL') {
            const availableLocals = (catalogs.locales || [])
              .slice()
              .sort((a, b) =>
                sedeName(a.sede_id).localeCompare(sedeName(b.sede_id), 'es') ||
                String(a.name || '').localeCompare(String(b.name || ''), 'es')
              );

            const localSelect = createSelect(
              availableLocals.map(item => ({
                value: item.id,
                label: sedeName(item.sede_id) + ' — ' + item.name
              })),
              '',
              'Selecciona un local'
            );
            localSelect.required = true;
            localSelect.disabled = !canSelect;
            scopeContextHost.appendChild(createField('Local', localSelect));

            const hierarchyNote = document.createElement('p');
            hierarchyNote.className = 'access-muted access-user-scope-context-note';
            hierarchyNote.hidden = true;
            scopeContextHost.appendChild(hierarchyNote);

            const levelsHost = document.createElement('div');
            levelsHost.className = 'access-user-scope-levels';
            scopeContextHost.appendChild(levelsHost);

            let selectedChain = [];

            localSelect.addEventListener('change', () => {
              const localId = String(localSelect.value || '');
              selectedChain = [];
              selectedReferenceId = type === 'LOCAL' ? localId : '';
              levelsHost.replaceChildren();

              if (!localId) {
                hierarchyNote.hidden = true;
                hierarchyNote.textContent = '';
                return;
              }

              hierarchyNote.textContent = type === 'LOCAL'
                ? 'El ámbito se aplicará directamente al local. La jerarquía se muestra como contexto y se guardará únicamente el ID del local.'
                : 'Selecciona la unidad orgánica recorriendo la jerarquía de este local. Se guardará únicamente el ID de la unidad seleccionada.';
              hierarchyNote.hidden = false;

              renderStructureLevels(localId, levelsHost, selectedChain, type);
            });
          }
        }

        function paintScopes() {
          scopeList.replaceChildren();

          if (!scopeDraft.length) {
            const note = document.createElement('p');
            note.className = 'access-muted';
            note.textContent = 'No se han agregado ámbitos para este módulo.';
            scopeList.appendChild(note);
            return;
          }

          scopeDraft.forEach((scope, index) => {
            const item = document.createElement('div');
            item.className = 'access-user-scope-item';

            const label = document.createElement('span');
            label.textContent = scopeLabel(scope);

            const remove = createButton(
              'Quitar',
              'outline',
              () => {
                scopeDraft.splice(index, 1);
                paintScopes();
              },
              'close'
            );
            remove.classList.add('access-small-button');

            item.append(label, remove);
            scopeList.appendChild(item);
          });
        }

        // Captura y valida el ámbito en el mismo momento en que se confirma
        // Agregar acceso / Actualizar acceso.
        collectScopes = function () {
          const nextScopes = scopeDraft.map(item => Object.assign({}, item));
          const type = scopeType.value;

          // No seleccionar un tipo es válido: el acceso puede no tener ámbito.
          if (!type) {
            return { valid: true, scopes: nextScopes };
          }

          const referenceId = type === 'TOTAL' ? '' : selectedReferenceId;

          if (type !== 'TOTAL' && !referenceId) {
            const requiredControl = Array.from(
              scopeContextHost.querySelectorAll('select[required]')
            ).find(control => !control.value);

            if (requiredControl) {
              requiredControl.reportValidity();
            } else {
              SUNARPUI.notify(
                'warning',
                'Selecciona la referencia correspondiente para el ámbito.'
              );
            }
            return { valid: false, scopes: nextScopes };
          }

          if (type === 'TOTAL' && nextScopes.length) {
            SUNARPUI.notify(
              'warning',
              'TOTAL es exclusivo dentro del mismo módulo. Quita los ámbitos existentes antes de seleccionar Total.'
            );
            return { valid: false, scopes: nextScopes };
          }

          if (type !== 'TOTAL' && nextScopes.some(item =>
            item.tipo_ambito_id === 'TOTAL'
          )) {
            SUNARPUI.notify(
              'warning',
              'Quita el ámbito Total antes de agregar un ámbito específico.'
            );
            return { valid: false, scopes: nextScopes };
          }

          if (nextScopes.some(item =>
            item.tipo_ambito_id === type &&
            String(item.referencia_id || '') === String(referenceId || '')
          )) {
            SUNARPUI.notify(
              'warning',
              'Ese ámbito ya está asignado a este módulo.'
            );
            return { valid: false, scopes: nextScopes };
          }

          nextScopes.push({
            tipo_ambito_id: type,
            referencia_id: referenceId,
            incluir_descendientes:
              type === 'ESTRUCTURA_ORG' && descendants.checked
                ? 'SI'
                : 'NO'
          });

          return { valid: true, scopes: nextScopes };
        };

        roleSelect.addEventListener('change', () => {
          const enabled = Boolean(roleSelect.value);
          scopeType.disabled = !enabled;
          descendants.disabled = !enabled;
          updateReferenceOptions();
        });

        scopeType.addEventListener('change', updateReferenceOptions);

        panel.append(
          scopesPanel
        );
        scopesPanel.append(
          scopesTitle,
          scopeFields,
          scopeHelp,
          descendantsLabel,
          scopeList
        );

        updateReferenceOptions();
        paintScopes();
        scopeType.disabled = !roleSelect.value;
        descendants.disabled = !roleSelect.value;
      } else {
        const note = document.createElement('p');
        note.className = 'access-muted';
        note.textContent = (original.ambitos || []).length
          ? 'Ámbitos existentes: ' + original.ambitos.map(scopeLabel).join(' · ') +
            '. No tienes permiso para modificarlos.'
          : 'No tienes permiso para administrar los ámbitos de acceso.';
        panel.appendChild(note);
      }

      const actions = document.createElement('div');
      actions.className = 'access-modal-actions';

      const cancelButton = createButton(
        'Cancelar',
        'outline',
        () => {
          editorHost.replaceChildren();
          refreshModulePicker();
        }
      );

      const confirmButton = createButton(
        editing ? 'Actualizar acceso' : 'Agregar acceso',
        'primary',
        () => {
          if (!roleSelect.value) {
            roleSelect.reportValidity();
            return;
          }

          if (
            !canManageScopes &&
            existingAssignment &&
            String(existingAssignment.rol_id || '') !== String(roleSelect.value || '') &&
            (existingAssignment.ambitos || []).length
          ) {
            SUNARPUI.notify(
              'warning',
              'No puedes cambiar el rol de esta asignación porque tiene ámbitos que no puedes administrar.'
            );
            return;
          }

          const scopeResult = collectScopes();
          if (!scopeResult.valid) return;

          draft.set(moduleId, {
            modulo_id: moduleId,
            rol_id: roleSelect.value,
            has_scopes: existingAssignment
              ? existingAssignment.has_scopes === true
              : false,
            ambitos: scopeResult.scopes
          });

          editorHost.replaceChildren();
          refreshModulePicker();
          renderTable();
        },
        editing ? 'save' : 'add'
      );

      actions.append(cancelButton, confirmButton);
      panel.appendChild(actions);
      editorHost.appendChild(panel);
    }

    modulePicker.addEventListener('change', () => {
      if (modulePicker.value) {
        openModuleEditor(modulePicker.value, null);
      }
    });

    if (disabled) {
      modulePicker.disabled = true;

      const note = document.createElement('p');
      note.className = 'access-muted';
      note.textContent = 'La cuenta está inactiva. Actívala desde el listado para modificar sus accesos.';
      host.appendChild(note);
    } else {
      refreshModulePicker();
    }

    renderTable();

    return {
      element: host,
      getAssignments: () => Array.from(draft.values()).map(item => ({
        modulo_id: item.modulo_id,
        rol_id: item.rol_id,
        ambitos: (item.ambitos || []).map(scope => Object.assign({}, scope))
      }))
    };
  }


  /**
   * Envía todas las asignaciones de la persona en una sola solicitud.
   * El backend valida y sincroniza roles y ámbitos en bloque.
   */
  async function saveUserModuleAccess(personaId, editor) {
    if (!editor || !state.data.capabilities.userRoles) return;

    return rpc('saveAccessUserConfiguration', {
      persona_id: personaId,
      accesos: editor.getAssignments()
    });
  }


  function renderUsers(host) {
    const canManage = state.data.capabilities.users;
    const canConfigure = state.data.capabilities.userRoles;
    const section = makeTabPanel(
      'Usuarios',
      'Selecciona una sede o un rol para consultar las cuentas. El buscador y la paginación consultan el servidor.',
      canManage ? 'Nueva cuenta' : '',
      canManage ? () => openUserModal(null) : null,
      { hideRefresh: true }
    );
    host.appendChild(section);

    const filters = document.createElement('div');
    filters.className = 'access-users-filters';

    const siteSelect = createSelect(
      (state.data.catalogs && state.data.catalogs.sedes || []).map(item => ({
        value: item.id,
        label: item.name
      })),
      '',
      'Todas las sedes'
    );

    const roleSelect = createSelect(
      activeRoles().map(role => ({
        value: role.rol_id,
        label: role.nombre
      })),
      '',
      'Todos los roles'
    );

    const applyButton = createButton(
      'Actualizar',
      'outline',
      () => loadFilteredUsers(true),
      'refresh'
    );
    applyButton.disabled = true;

    filters.append(
      createField('Sede', siteSelect),
      createField('Rol', roleSelect),
      applyButton
    );
    host.appendChild(filters);

    let loadingUsers = false;
    let requestNumber = 0;
    let lastPageResult = { items: [], total: 0 };

    function updateApplyState() {
      applyButton.disabled = loadingUsers || (!siteSelect.value && !roleSelect.value);
    }

    async function loadUserPage(params) {
      const sedeId = siteSelect.value;
      const rolId = roleSelect.value;
      if (!sedeId && !rolId) {
        lastPageResult = { items: [], total: 0 };
        state.data.users = [];
        return lastPageResult;
      }

      const currentRequest = ++requestNumber;
      const finishLoading = beginAccessPanelLoading();
      loadingUsers = true;
      updateApplyState();

      try {
        const result = await rpc('getAccessUsers', {
          sede_id: sedeId,
          rol_id: rolId,
          search: params && params.search || '',
          page: params && params.page || 1,
          pageSize: params && params.pageSize || 10
        });

        if (currentRequest !== requestNumber) return lastPageResult;

        lastPageResult = {
          items: Array.isArray(result.items) ? result.items : [],
          total: Number(result.total) || 0
        };
        state.data.users = lastPageResult.items;
        return lastPageResult;
      } catch (error) {
        if (currentRequest === requestNumber) {
          SUNARPUI.notify(
            'error',
            error.message || 'No se pudieron consultar los usuarios.'
          );
        }
        return lastPageResult;
      } finally {
        finishLoading();
        if (currentRequest === requestNumber) {
          loadingUsers = false;
          updateApplyState();
        }
      }
    }

    async function loadFilteredUsers(showLoading) {
      if (!siteSelect.value && !roleSelect.value) {
        lastPageResult = { items: [], total: 0 };
        state.data.users = [];
        if (state.table && typeof state.table.setData === 'function') {
          state.table.setData([]);
        }
        updateApplyState();
        return;
      }

      if (state.table && typeof state.table.refresh === 'function') {
        await state.table.refresh();
      } else {
        const result = await loadUserPage({ page: 1, pageSize: 10, search: '' });
        if (state.table && typeof state.table.setData === 'function') {
          state.table.setData(result.items);
        }
      }
    }

    // Los selectores solo actualizan el estado del botón.
    // La consulta se ejecuta al pulsar Actualizar o al cambiar página/búsqueda.
    siteSelect.addEventListener('change', updateApplyState);
    roleSelect.addEventListener('change', updateApplyState);

    renderTable(host, {
      data: [],
      mode: 'server',
      loadData: loadUserPage,
      columns: [
        { key: 'nombre_completo', label: 'Nombre' },
        { key: 'correo_institucional', label: 'Correo institucional' },
        { key: 'sede_nombre', label: 'Sede' },
        {
          key: 'roles',
          label: 'Roles por módulo',
          render: roles => (roles || []).map(item => {
            const module = (state.data.modules || []).find(m => m.modulo_id === item.modulo_id);
            return (module ? module.nombre : 'Módulo no disponible') + ': ' + roleName(item.rol_id);
          }).join(' · ') || 'Sin roles asignados'
        },
        {
          key: 'active',
          label: 'Estado',
          align: 'center',
          render: (value, row) => createAccessStatusCell(row, 'setAccessUserStatus', row.persona_id, 'la cuenta')
        }
      ],
      rowActions: [
        ...(canConfigure ? [{
          label: 'Configurar accesos',
          icon: 'tune',
          variant: 'outline',
          onClick: row => openUserModal(row)
        }] : []),
        ...(state.data.capabilities.audit ? [{
          label: 'Historial',
          icon: 'history',
          variant: 'outline',
          onClick: row => openEntityHistory('USUARIO', row.persona_id, row.nombre_completo)
        }] : [])
      ],
      searchPlaceholder: 'Buscar por nombre o correo institucional...',
      emptyMessage: 'Selecciona una sede o un rol para consultar usuarios.'
    });

    state.userListController = {
      refresh: () => loadFilteredUsers(false)
    };
    updateApplyState();
  }

  function openUserModal(row) {
    const editing = Boolean(row);
    const documentTypes = (state.data.documentTypes || [])
      .filter(item => item && item.id && item.name);

    const form = document.createElement('form');
    form.className = 'access-form';
    form.addEventListener('submit', event => event.preventDefault());

    let selectedPerson = null;
    let selectedPersonCanEnable = false;
    let selectedConfiguration = null;
    let saveButton = null;

    const resultHost = document.createElement('div');
    resultHost.className = 'access-person-search-result';
    resultHost.setAttribute('aria-live', 'polite');

    const alertHost = document.createElement('div');
    alertHost.id = 'accessUserDocumentSearchAlert';

    function showSearchAlert(type, title, message, details) {
      SUNARPUI.showAlert({
        containerId: alertHost.id,
        type,
        title,
        details,
        message,
        dismissible: false,
        replace: true
      });
    }

    function updateSaveState() {
      if (saveButton && !editing) {
        saveButton.disabled = !selectedPersonCanEnable;
      }
    }

    function resetSearchResult() {
      selectedPerson = null;
      selectedPersonCanEnable = false;
      selectedConfiguration = null;
      resultHost.replaceChildren();
      configHost.replaceChildren();
      updateSaveState();
    }

    const configHost = document.createElement('div');
    configHost.className = 'access-user-configuration';

    if (editing) {
      const identity = document.createElement('div');
      identity.className = 'access-person-identity';

      const name = document.createElement('strong');
      name.textContent = row.nombre_completo || 'Persona';

      const email = document.createElement('span');
      email.textContent = row.correo_institucional || 'Sin correo institucional';

      identity.append(name, email);

      selectedConfiguration = createUserModuleAccessEditor(
        row.persona_id,
        row.active !== true
      );

      configHost.appendChild(selectedConfiguration.element);
      form.append(identity, configHost);

    } else {
      const grid = createFormGrid();

      const documentType = createSelect(
        documentTypes.map(item => ({
          value: item.id,
          label: item.name
        })),
        '',
        'Selecciona un tipo de documento'
      );
      documentType.required = true;

      const documentNumber = createInput('text', '', {
        required: true,
        maxlength: 30,
        autocomplete: 'off',
        spellcheck: 'false',
        inputmode: 'text'
      });

      const searchButton = createButton(
        'Buscar persona',
        'outline',
        async () => {
          if (!documentType.value) {
            documentType.reportValidity();
            return;
          }
          if (!documentNumber.value.trim()) {
            documentNumber.reportValidity();
            return;
          }

          resetSearchResult();
          searchButton.disabled = true;
          clearButton.disabled = true;

          if (searchButton.lastElementChild) {
            searchButton.lastElementChild.textContent = 'Buscando...';
          }

          const searchCriteria = {
            tipo_documento: documentType.value,
            numero_documento: documentNumber.value.trim()
          };

          documentType.disabled = true;
          documentNumber.disabled = true;

          resultHost.appendChild(alertHost);
          const finishLoading = beginAccessPanelLoading();

          showSearchAlert(
            'info',
            'Buscando persona',
            'Consultando el documento en el directorio institucional.'
          );

          try {
            const result = await rpc('searchAccessPersonByDocument', searchCriteria);

            resultHost.replaceChildren(alertHost);

            if (!result || result.found !== true || !result.person) {
              showSearchAlert(
                'info',
                'Sin coincidencias',
                result && result.message
                  ? result.message
                  : 'No se encontró una persona con esos datos.'
              );
              return;
            }

            selectedPerson = result.person;

            const existingAccount = result.existingAccount || {
              exists: false,
              active: false
            };

            const accountExists = existingAccount.exists === true;

            selectedPersonCanEnable = Boolean(
              result.canEnableAccount && !accountExists
            );

            const personDetails = [
              selectedPerson.nombre_completo || 'Persona localizada',
              (selectedPerson.tipo_documento_name || 'Documento') +
                ': ' + selectedPerson.numero_documento +
                ' · Correo institucional: ' +
                (selectedPerson.correo_institucional || 'No registrado'),
              'Identificador: ' + selectedPerson.persona_id
            ];

            if (accountExists && existingAccount.active) {
              showSearchAlert(
                'warning',
                'La cuenta ya está habilitada',
                'Esta persona ya tiene una cuenta activa. No se puede crear otra cuenta.',
                personDetails
              );
            } else if (accountExists) {
              showSearchAlert(
                'warning',
                'La cuenta ya está registrada',
                'La cuenta de esta persona está inactiva. Actívala desde el listado de usuarios y luego utiliza «Configurar accesos».',
                personDetails
              );
            } else if (!result.canEnableAccount) {
              showSearchAlert(
                'warning',
                'No es posible habilitar la cuenta',
                result.reason || 'La persona no cumple las condiciones para habilitar una cuenta.',
                personDetails
              );
            } else {
              showSearchAlert(
                'success',
                'Persona localizada',
                'Configura los roles y ámbitos de acceso antes de habilitar la cuenta.',
                personDetails
              );

              selectedConfiguration = createUserModuleAccessEditor(
                selectedPerson.persona_id,
                false
              );
              configHost.replaceChildren(selectedConfiguration.element);
            }

            updateSaveState();

          } catch (error) {
            selectedPerson = null;
            selectedPersonCanEnable = false;
            selectedConfiguration = null;
            configHost.replaceChildren();

            showSearchAlert(
              'error',
              'No se pudo completar la búsqueda',
              error.message || 'Ocurrió un error al consultar el directorio.'
            );

            updateSaveState();

          } finally {
            finishLoading();

            documentType.disabled = false;
            documentNumber.disabled = false;
            searchButton.disabled = false;
            clearButton.disabled = false;

            if (searchButton.lastElementChild) {
              searchButton.lastElementChild.textContent = 'Buscar persona';
            }
          }
        },
        'search'
      );

      const clearButton = createButton(
        'Limpiar',
        'outline',
        () => {
          documentType.value = '';
          documentNumber.value = '';
          resetSearchResult();
          documentType.focus();
        },
        'backspace'
      );

      const searchActions = document.createElement('div');
      searchActions.className = 'access-modal-actions access-search-actions';
      searchActions.append(searchButton, clearButton);

      grid.append(
        createField('Tipo de documento', documentType),
        createField('Número de documento', documentNumber)
      );

      form.append(grid, searchActions, resultHost, configHost);

      documentType.addEventListener('change', resetSearchResult);
      documentNumber.addEventListener('input', resetSearchResult);

      if (!documentTypes.length) {
        documentType.disabled = true;
        documentNumber.disabled = true;
        searchButton.disabled = true;
        clearButton.disabled = true;
        resultHost.appendChild(alertHost);

        showSearchAlert(
          'error',
          'Catálogo no disponible',
          'No se encontraron tipos de documento en la pestaña tipo_documento_identidad.'
        );
      }
    }

    saveButton = openFormModal(
      editing ? 'Configurar accesos' : 'Habilitar cuenta',
      form,
      async () => {
        if (editing) {
          if (row.active !== true) {
            throw new Error('Activa la cuenta desde el listado antes de modificar sus accesos.');
          }

          await saveUserModuleAccess(row.persona_id, selectedConfiguration);
          return;
        }

        if (!selectedPerson || !selectedPersonCanEnable) {
          throw new Error('Primero busca una persona que no tenga una cuenta registrada.');
        }

        await rpc('saveAccessUser', {
          action: 'create',
          persona_id: selectedPerson.persona_id,
          tipo_documento: selectedPerson.tipo_documento,
          numero_documento: selectedPerson.numero_documento,
          active: true
        });

        try {
          await saveUserModuleAccess(
            selectedPerson.persona_id,
            selectedConfiguration
          );
        } catch (error) {
          try {
            await refreshCurrentTabData(false);
          } catch (refreshError) {
            // Se conserva el error de la configuración.
          }

          throw new Error(
            'La cuenta fue habilitada, pero no se completó toda la configuración de accesos. ' +
            (error.message || '')
          );
        }
      },
      editing ? 'Guardar accesos' : 'Habilitar cuenta',
      {
        size: 'xl',
        canSave: () => editing
          ? row.active === true
          : selectedPersonCanEnable
      }
    );
  }

  function openPermissionModal(row) {
    const editing = Boolean(row);
    const form = document.createElement('form');
    form.className = 'access-form';
    form.addEventListener('submit', event => event.preventDefault());
    const grid = createFormGrid();

    const id = createInput('text', row && row.permiso_id, {
      required: true,
      maxlength: 50,
      readOnly: true
    });
    const code = createInput('text', row && row.codigo, {
      required: true,
      maxlength: 80,
      readOnly: true
    });

    const modules = (state.data.modules || []).filter(item => item.active);
    const module = createSelect(
      modules.map(item => ({
        value: item.modulo_id,
        label: item.nombre + ' (' + item.codigo + ')'
      })),
      row && row.modulo_id,
      'Selecciona un módulo'
    );
    if (editing) module.disabled = true;

    const operationOptions = (state.data.operations || []).filter(item => item.active !== false).map(item => ({
      value: item.operacion_id,
      label: item.nombre + ' (' + item.operacion_id + ')'
    }));

    if (editing && row.operacion_id && !operationOptions.some(item => item.value === row.operacion_id)) {
      operationOptions.unshift({
        value: row.operacion_id,
        label: (row.operacion_nombre || row.operacion_id) + ' (' + row.operacion_id + ') — inactiva'
      });
    }

    const operation = createSelect(
      operationOptions,
      row && row.operacion_id,
      'Selecciona una operación'
    );
    if (editing) operation.disabled = true;

    const description = createTextarea(row && row.descripcion, 3);
    description.required = true;

    function updatePermissionPreview() {
      if (editing) {
        id.value = row.permiso_id;
        code.value = row.codigo;
        return;
      }

      const selectedModule = modules.find(item => item.modulo_id === module.value);
      const generatedCode = selectedModule
        ? previewPermissionCode(selectedModule.codigo, operation.value)
        : '';
      code.value = generatedCode;
      id.value = generatedCode
        ? previewIdentifier('PERM_', generatedCode, 50)
        : '';
    }

    if (!editing) {
      module.addEventListener('change', updatePermissionPreview);
      operation.addEventListener('change', updatePermissionPreview);
    }
    updatePermissionPreview();

    grid.append(
      createField('ID generado automáticamente', id, 'Se genera a partir del módulo y la operación.'),
      createField('Código generado automáticamente', code, 'Convención: MODULO_OPERACION.'),
      createField('Módulo', module),
      createField('Operación', operation),
      createField('Descripción', description)
    );
    form.appendChild(grid);

    openFormModal(
      editing ? 'Editar permiso' : 'Crear permiso',
      form,
      () => rpc('saveAccessPermission', {
        action: editing ? 'edit' : 'create',
        permiso_id: editing ? row.permiso_id : '',
        codigo: editing ? row.codigo : '',
        modulo_id: editing ? row.modulo_id : module.value,
        operacion_id: operation.value.trim().toUpperCase(),
        descripcion: description.value.trim(),
        active: editing ? row.active : true
      }),
      editing ? 'Guardar cambios' : 'Crear permiso'
    );
  }

    const section = makeTabPanel(

    );

    checklist.className = 'access-permission-groups';
    checklist.id = 'accessPermissionChecklist';
    panel.appendChild(checklist);

    const save = createButton('Guardar asignaciones', 'primary', async () => {
      if (!roleSelect.value) {
        SUNARPUI.notify('warning', 'Selecciona un rol.');
        return;
      }
      const selected = queryAll('input[type="checkbox"][data-permission-id]:checked', checklist)
        .map(input => input.dataset.permissionId);
      save.disabled = true;
      const finishLoading = beginAccessPanelLoading();
      try {
        await rpc('saveRolePermissions', {
          rol_id: roleSelect.value,
          permiso_ids: selected
        });
        await refreshCurrentTabData(false);
        SUNARPUI.notify('success', 'Asignaciones actualizadas correctamente.');
      } catch (error) {
        SUNARPUI.notify('error', error.message);
      } finally {
        finishLoading();
        save.disabled = false;
      }
    }, 'save');
    panel.appendChild(save);
    host.appendChild(panel);

    function paintChecklist() {
      checklist.replaceChildren();
      if (!roleSelect.value) {
        const note = document.createElement('p');
        note.className = 'access-muted';
        note.textContent = 'Selecciona un rol para consultar sus permisos.';
        checklist.appendChild(note);
        return;
      }

      const assigned = new Set((state.data.rolePermissions || [])
        .filter(item => item.rol_id === roleSelect.value && item.active === true)
        .map(item => item.permiso_id));
      const permissions = (state.data.permissions || []).filter(item => item.active === true);
      const modules = new Map((state.data.modules || []).map(item => [item.modulo_id, item]));
      const groups = new Map();

      permissions.forEach(permission => {
        if (!groups.has(permission.modulo_id)) groups.set(permission.modulo_id, []);
        groups.get(permission.modulo_id).push(permission);
      });

      if (!permissions.length) {
        const note = document.createElement('p');
        note.className = 'access-muted';
        note.textContent = 'No hay permisos activos en el catálogo.';
        checklist.appendChild(note);
        return;
      }

      groups.forEach((items, moduleId) => {
        const group = document.createElement('section');
        group.className = 'access-permission-group';
        const heading = document.createElement('div');
        heading.className = 'access-permission-group-heading';

        const module = modules.get(moduleId);
        const title = document.createElement('h4');
        title.textContent = module ? module.nombre : moduleId;

        const groupToggleLabel = document.createElement('label');
        groupToggleLabel.className = 'access-check-row access-check-row--group';
        const groupToggle = document.createElement('input');
        groupToggle.type = 'checkbox';
        groupToggle.setAttribute('aria-label', 'Seleccionar todos los permisos de ' + (module ? module.nombre : moduleId));
        const groupToggleText = document.createElement('span');
        groupToggleText.textContent = 'Seleccionar todo el bloque';
        groupToggleLabel.append(groupToggle, groupToggleText);
        heading.append(title, groupToggleLabel);
        group.appendChild(heading);

        function syncGroupToggle() {
          const checkboxes = Array.from(group.querySelectorAll('input[data-permission-id]'));
          const selectedCount = checkboxes.filter(input => input.checked).length;
          groupToggle.checked = checkboxes.length > 0 && selectedCount === checkboxes.length;
          groupToggle.indeterminate = selectedCount > 0 && selectedCount < checkboxes.length;
        }

        items.forEach((permission, index) => {
          const label = document.createElement('label');
          label.className = 'access-check-row';
          const checkbox = document.createElement('input');
          checkbox.type = 'checkbox';
          checkbox.checked = assigned.has(permission.permiso_id);
          checkbox.dataset.permissionId = permission.permiso_id;
          checkbox.id = 'access-permission-' + moduleId + '-' + index;
          checkbox.addEventListener('change', syncGroupToggle);
          const text = document.createElement('span');
          const operationLabel = permission.operacion_nombre || permission.operacion_id || permission.codigo;
          text.textContent = permission.descripcion + ' — ' + operationLabel + ' (' + permission.codigo + ')';
          label.append(checkbox, text);
          group.appendChild(label);
        });

        groupToggle.addEventListener('change', () => {
          group.querySelectorAll('input[data-permission-id]').forEach(checkbox => {
            checkbox.checked = groupToggle.checked;
          });
          syncGroupToggle();
        });

        syncGroupToggle();
        checklist.appendChild(group);
      });
    }

    roleSelect.addEventListener('change', paintChecklist);
    paintChecklist();
  }


  function formatDate(value) {
    if (!value) return '—';

    const date = new Date(value);

    if (Number.isNaN(date.getTime())) {
      return String(value);
    }

    return new Intl.DateTimeFormat('es-PE', {
      dateStyle: 'short',
      timeStyle: 'short'
    }).format(date);
  }
