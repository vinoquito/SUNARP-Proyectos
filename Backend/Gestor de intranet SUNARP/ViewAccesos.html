<style>
  /* Estilos propios del formulario de usuarios y su búsqueda documental. */
  .access-form {
    position: relative;
  }

  .access-search-loading-overlay {
    position: absolute;
    inset: 0;
    z-index: 20;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    border-radius: 8px;
    background: rgba(255, 255, 255, 0.58);
    backdrop-filter: blur(1.5px);
  }

  .access-search-loading-content {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    padding: 16px 20px;
    border-radius: 8px;
    background: rgba(255, 255, 255, 0.82);
    color: var(--ui-ink);
    text-align: center;
  }

  .access-search-loading-content p {
    margin: 0;
    font-size: 13px;
  }

  .access-search-loading-spinner {
    width: 30px;
    height: 30px;
    border: 3px solid #E5E9E3;
    border-top-color: var(--sunarp-green);
    border-radius: 50%;
    animation: access-search-spin .8s linear infinite;
  }

  @keyframes access-search-spin {
    to { transform: rotate(360deg); }
  }

  .access-person-search-result .sunarp-alert-message {
    white-space: pre-line;
    line-height: 1.38;
  }

  .access-person-identity {
    display: grid;
    gap: 3px;
    padding: 11px 13px;
    border: 1px solid var(--ui-border);
    border-radius: 7px;
    background: #fff;
    color: var(--ui-ink);
    font-size: 13px;
    line-height: 1.4;
  }

  .access-person-identity strong {
    font-size: 14px;
  }

  .access-user-configuration,
  .access-user-modules {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .access-user-modules-heading h3 {
    margin: 0 0 3px;
    font-size: 15px;
  }

  .access-user-modules-heading p {
    margin: 0;
  }

  .access-user-module-card {
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 13px;
    border: 1px solid var(--ui-border);
    border-radius: 8px;
    background: #fff;
  }

  .access-user-module-title {
    margin: 0;
    color: var(--ui-ink);
    font-size: 14px;
    font-weight: 700;
  }

  .access-user-module-card > .access-muted {
    margin: -6px 0 0;
  }

  .access-user-module-scopes {
    display: flex;
    flex-direction: column;
    gap: 9px;
    padding-top: 10px;
    border-top: 1px solid var(--ui-border);
  }

  .access-user-module-scopes h5 {
    margin: 0;
    color: var(--ui-ink);
    font-size: 12px;
    font-weight: 700;
  }

  .access-user-module-scopes > .access-muted {
    margin: -5px 0 0;
  }

  .access-user-scope-grid {
    gap: 10px;
  }

  .access-user-scope-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .access-user-scope-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 8px 10px;
    border: 1px solid var(--ui-border);
    border-radius: 6px;
    background: var(--ui-background);
  }

  .access-user-scope-copy {
    display: flex;
    flex-direction: column;
    gap: 2px;
    min-width: 0;
    font-size: 12px;
  }

  .access-user-scope-copy strong {
    color: var(--ui-ink);
  }

  .access-user-scope-copy span {
    color: var(--ui-muted);
  }

  .access-search-actions {
    justify-content: flex-start;
  }
</style>

<section
  class="access-page"
  id="viewAccesos"
  data-app-view="accesos"
  hidden>

  <div class="sunarp-card access-card">
    <div class="access-page-heading">
      <div>
        <h2>Administración de accesos</h2>
        <p>
          Gestiona usuarios, roles, permisos, ámbitos de acceso
          y el historial de operaciones.
        </p>
      </div>

      <button
        type="button"
        class="sunarp-btn sunarp-btn--outline"
        id="accessRefreshButton">

        <span
          class="material-symbols-outlined"
          aria-hidden="true">refresh</span>

        <span>Actualizar</span>
      </button>
    </div>

    <div
      id="accessPageMessage"
      class="access-page-message"
      role="status"
      aria-live="polite">

      Cargando administración de accesos...
    </div>

    <div id="accessTabs"></div>

    <div
      id="accessTabPanel"
      class="access-tab-panel"
      aria-live="polite">
    </div>
  </div>

</section>
