<style>
  :root {
    --sunarp-gray: #323C37;
    --sunarp-green: #8EC321;
    --sunarp-red: #EB3219;
    --sunarp-yellow: #FFAF00;
    --sunarp-turquoise: #00A5A5;

    --ui-primary: #323C37;
    --ui-primary-hover: #252E29;
    --ui-ink: #323C37;
    --ui-muted: #748078;
    --ui-border: #E5E9E3;
    --ui-surface: #FFFFFF;
    --ui-background: #F7F8F6;
    --ui-green-soft: #F3F7EB;
    --ui-red-soft: #FBF0EE;
    --ui-focus: rgb(142 195 33 / 24%);

    --ui-sidebar-width: 260px;
    --ui-topbar-height: 64px;
  }

  * {
    box-sizing: border-box;
  }

  [hidden] {
    display: none !important;
  }

  body {
    margin: 0;
    background: var(--ui-background);
    color: var(--ui-ink);
    font: 14px/1.5 Arial, Helvetica, sans-serif;
  }

  /* ============================================================
   ICONOS: GOOGLE MATERIAL SYMBOLS
============================================================ */

  .material-symbols-outlined {
    display: inline-block;
    font-family: 'Material Symbols Outlined';
    font-size: 20px;
    font-weight: normal;
    font-style: normal;
    line-height: 1;
    letter-spacing: normal;
    text-transform: none;
    white-space: nowrap;
    overflow-wrap: normal;
    direction: ltr;
    font-feature-settings: 'liga';
    -webkit-font-smoothing: antialiased;
    font-variation-settings:
      'FILL'0,
      'wght'400,
      'GRAD'0,
      'opsz'20;
  }

  .sunarp-card-icon.material-symbols-outlined {
    font-size: 24px;
  }

  .sunarp-action-icon.material-symbols-outlined {
    font-size: 18px;
  }

  button,
  input,
  select,
  textarea {
    font: inherit;
  }

  button {
    cursor: pointer;
  }

  button:disabled {
    opacity: .55;
    cursor: not-allowed;
  }

  /* ============================================================
   MENÚ LATERAL
============================================================ */

  .sunarp-sidebar {
    position: fixed;
    top: var(--ui-topbar-height);
    right: auto;
    bottom: 0;
    left: 0;
    z-index: 50;
    display: flex;
    flex-direction: column;
    width: var(--ui-sidebar-width);
    background: var(--ui-surface);
    border-right: 1px solid var(--ui-border);
    overflow-y: auto;
  }

  .sunarp-sidebar-heading {
    padding: 24px 20px 12px;
    color: var(--ui-muted);
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1px;
  }

  .sunarp-navigation {
    flex: 1;
    padding: 0 12px 20px;
  }

  .sunarp-navigation-loading {
    padding: 8px;
    color: var(--ui-muted);
    font-size: 12px;
  }

  .sunarp-nav-list {
    margin: 0;
    padding: 0;
    list-style: none;
  }

  .sunarp-nav-item {
    margin-bottom: 3px;
  }

  .sunarp-nav-link {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    min-height: 42px;
    padding: 10px 12px 10px 9px;
    border: 0;
    border-left: 3px solid transparent;
    border-radius: 2px;
    background: transparent;
    color: #58635C;
    text-align: left;
    text-decoration: none;
    font-size: 13px;
  }

  .sunarp-nav-link:hover {
    background: #F7F9F5;
    color: var(--ui-ink);
  }

  .sunarp-nav-link.is-active,
  .sunarp-nav-parent.is-current {
    background: var(--ui-green-soft);
    border-left-color: #6E9E1E;
    color: var(--ui-ink);
    font-weight: 700;
  }

  .sunarp-nav-icon:empty {
    display: none;
  }

  .sunarp-nav-icon {
    min-width: 18px;
    text-align: center;
  }

  .sunarp-nav-label {
    min-width: 0;
    flex: 1;
  }

  .sunarp-nav-chevron {
    color: var(--ui-muted);
    transition: transform .15s ease;
  }

  .sunarp-nav-parent[aria-expanded="true"] .sunarp-nav-chevron {
    transform: rotate(90deg);
  }

  .sunarp-nav-submenu {
    margin: 3px 0 7px 15px;
    padding-left: 8px;
    border-left: 1px solid var(--ui-border);
  }

  .sunarp-sidebar-footer {
    padding: 16px 20px;
    border-top: 1px solid var(--ui-border);
    color: var(--ui-muted);
    font-size: 11px;
  }

  /* ============================================================
   BARRA SUPERIOR: ANCHO COMPLETO
============================================================ */

  .sunarp-topbar {
    position: fixed;
    top: 0;
    right: 0;
    left: 0;
    z-index: 60;
    display: flex;
    align-items: center;
    gap: 14px;
    width: 100%;
    height: var(--ui-topbar-height);
    padding: 0 28px;
    background: var(--ui-surface);
    border-bottom: 1px solid var(--ui-border);
  }

  .sunarp-topbar-brand {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
  }

  .sunarp-topbar-brand strong {
    overflow: hidden;
    font-size: 15px;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .sunarp-brand-mark {
    display: grid;
    place-items: center;
    flex: 0 0 32px;
    width: 32px;
    height: 32px;
    border-radius: 6px;
    background: var(--sunarp-green);
    color: var(--ui-ink);
    font-size: 17px;
    font-weight: 700;
  }

  .sunarp-mobile-menu-button {
    display: none !important;
  }

  /* ============================================================
   CONTENIDO PRINCIPAL
============================================================ */

  .sunarp-main {
    min-width: 0;
    margin-left: var(--ui-sidebar-width);
    padding: calc(var(--ui-topbar-height) + 24px) 32px 32px;
  }

  .sunarp-page-header {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 24px;
    margin-bottom: 26px;
  }

  .sunarp-page-heading {
    min-width: 0;
  }

  .sunarp-breadcrumbs {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    margin-bottom: 10px;
    color: var(--ui-muted);
    font-size: 12px;
  }

  .sunarp-breadcrumb-separator {
    color: #A0A9A1;
  }

  .sunarp-breadcrumb-current {
    color: var(--ui-ink);
    font-weight: 600;
  }

  .sunarp-page-header h1 {
    margin: 0;
    font-size: 26px;
    line-height: 1.3;
    font-weight: 700;
  }

  .sunarp-page-description {
    margin: 7px 0 0;
    color: var(--ui-muted);
  }

  .sunarp-page-actions {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
  }

  /* ============================================================
   BOTONES
============================================================ */

  .sunarp-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    min-height: 38px;
    padding: 0 14px;
    border: 1px solid transparent;
    border-radius: 5px;
    font-size: 13px;
    font-weight: 600;
    text-decoration: none;
    transition:
      background-color .15s ease,
      border-color .15s ease;
  }

  .sunarp-btn--primary {
    background: var(--ui-primary);
    border-color: var(--ui-primary);
    color: #FFFFFF;
  }

  .sunarp-btn--primary:hover {
    background: var(--ui-primary-hover);
    border-color: var(--ui-primary-hover);
  }

  .sunarp-btn--outline {
    background: #FFFFFF;
    border-color: #D9DFD8;
    color: var(--ui-ink);
  }

  .sunarp-btn--outline:hover {
    background: var(--ui-green-soft);
  }

  .sunarp-btn--danger {
    background: #C83D2B;
    border-color: #C83D2B;
    color: #FFFFFF;
  }

  .sunarp-btn--danger:hover {
    background: #A92F20;
    border-color: #A92F20;
  }

  .sunarp-btn:focus-visible,
  .sunarp-icon-button:focus-visible,
  .sunarp-nav-link:focus-visible {
    outline: 2px solid var(--sunarp-turquoise);
    outline-offset: 2px;
  }

  .sunarp-icon-button {
    display: inline-grid;
    place-items: center;
    flex: 0 0 auto;
    width: 36px;
    height: 36px;
    border: 1px solid var(--ui-border);
    border-radius: 5px;
    background: #FFFFFF;
    color: var(--ui-ink);
    font-size: 20px;
  }

  .sunarp-icon-button:hover {
    background: #F4F6F2;
  }

  /* ============================================================
   TARJETAS Y CUADRÍCULAS
============================================================ */

  .sunarp-card {
    min-width: 0;
    padding: 22px;
    background: var(--ui-surface);
    border: 1px solid var(--ui-border);
    border-radius: 8px;
  }

  .sunarp-card h2 {
    margin: 0 0 8px;
    font-size: 17px;
  }

  .sunarp-card p {
    margin: 0;
    color: var(--ui-muted);
  }

  .sunarp-grid {
    display: grid;
    gap: 18px;
  }

  .sunarp-grid--cards {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  /* ============================================================
   MODALES
============================================================ */

  .sunarp-modal-layer {
    position: fixed;
    inset: 0;
    z-index: 1000;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .sunarp-modal-backdrop {
    position: absolute;
    inset: 0;
    background: rgb(50 60 55 / 55%);
  }

  .sunarp-modal {
    position: relative;
    display: flex;
    flex-direction: column;
    width: 100%;
    max-height: 92vh;
    overflow: hidden;
    border: 1px solid var(--ui-border);
    border-radius: 8px;
    background: #FFFFFF;
    box-shadow: 0 18px 55px rgb(0 0 0 / 20%);
  }

  .sunarp-modal--sm {
    max-width: 420px;
  }

  .sunarp-modal--md {
    max-width: 620px;
  }

  .sunarp-modal--lg {
    max-width: 850px;
  }

  .sunarp-modal--xl {
    max-width: 1100px;
  }

  .sunarp-modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 18px 22px;
    border-bottom: 1px solid var(--ui-border);
  }

  .sunarp-modal-header h2 {
    margin: 0;
    font-size: 18px;
  }

  .sunarp-modal-body {
    min-height: 0;
    padding: 22px;
    overflow-y: auto;
  }

  .sunarp-modal-footer {
    display: flex;
    justify-content: flex-end;
    flex-wrap: wrap;
    gap: 8px;
    padding: 16px 22px;
    border-top: 1px solid var(--ui-border);
  }

  /* ============================================================
   NOTIFICACIONES
============================================================ */

  .sunarp-toast-region {
    position: fixed;
    top: 80px;
    right: 22px;
    z-index: 1100;
    display: flex;
    flex-direction: column;
    gap: 10px;
    width: min(380px, calc(100vw - 32px));
  }

  .sunarp-toast {
    padding: 13px 16px;
    border: 1px solid var(--ui-border);
    border-left: 4px solid var(--sunarp-turquoise);
    border-radius: 6px;
    background: #FFFFFF;
    color: var(--ui-ink);
    box-shadow: 0 6px 20px rgb(0 0 0 / 9%);
    overflow-wrap: anywhere;
  }

  .sunarp-toast--success {
    border-left-color: #6E9E1E;
  }

  .sunarp-toast--error {
    border-left-color: var(--sunarp-red);
    background: var(--ui-red-soft);
  }

  .sunarp-toast--warning {
    border-left-color: var(--sunarp-yellow);
  }

  .sunarp-toast--leaving {
    opacity: 0;
    transition: opacity .2s ease;
  }

  .sunarp-empty-state {
    padding: 30px 20px;
    text-align: center;
    color: var(--ui-muted);
  }

  /* ============================================================
   DATATABLE: BUSCADOR, FILTROS, TABLA Y PAGINACIÓN
============================================================ */

  .sunarp-datatable {
    width: 100%;
    min-width: 0;
  }

  .sunarp-datatable-toolbar {
    display: flex;
    align-items: flex-end;
    flex-wrap: wrap;
    gap: 14px;
    margin-bottom: 16px;
  }

  .sunarp-datatable-control {
    display: flex;
    flex: 0 1 180px;
    flex-direction: column;
    gap: 6px;
    min-width: 0;
    color: var(--ui-muted);
    font-size: 12px;
    font-weight: 600;
  }

  .sunarp-datatable-search {
    flex: 1 1 240px;
  }

  .sunarp-datatable-control input,
  .sunarp-datatable-control select,
  .sunarp-datatable-page-size select {
    width: 100%;
    min-width: 0;
    min-height: 38px;
    padding: 0 10px;
    border: 1px solid var(--ui-border);
    border-radius: 5px;
    background: #FFFFFF;
    color: var(--ui-ink);
    font-size: 13px;
  }

  .sunarp-datatable-control input:focus,
  .sunarp-datatable-control select:focus,
  .sunarp-datatable-page-size select:focus {
    outline: 2px solid var(--ui-focus);
    outline-offset: 1px;
    border-color: #9ABF67;
  }

  .sunarp-datatable-wrap {
    width: 100%;
    overflow-x: auto;
    border: 1px solid var(--ui-border);
    border-radius: 6px;
  }

  .sunarp-datatable-table {
    width: 100%;
    min-width: 620px;
    border-collapse: collapse;
    background: #FFFFFF;
    text-align: left;
  }

  .sunarp-datatable-table th {
    padding: 13px 15px;
    border-bottom: 1px solid var(--ui-border);
    background: #F7F9F5;
    color: #667169;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .3px;
  }

  .sunarp-datatable-table td {
    padding: 13px 15px;
    border-bottom: 1px solid var(--ui-border);
    color: #536158;
    vertical-align: middle;
    overflow-wrap: anywhere;
  }

  .sunarp-datatable-table tbody tr:last-child td {
    border-bottom: 0;
  }

  .sunarp-datatable-table tbody tr:hover {
    background: #FAFBF9;
  }

  .sunarp-datatable-cell--left {
    text-align: left !important;
  }

  .sunarp-datatable-cell--center {
    text-align: center !important;
  }

  .sunarp-datatable-cell--right {
    text-align: right !important;
  }

  .sunarp-datatable-empty {
    padding: 30px 16px !important;
    color: var(--ui-muted) !important;
    text-align: center;
  }

  .sunarp-datatable-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 14px;
    padding-top: 16px;
  }

  .sunarp-datatable-summary {
    margin: 0;
    color: var(--ui-muted);
    font-size: 12px;
  }

  .sunarp-datatable-pagination {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    flex-wrap: wrap;
    gap: 8px;
  }

  .sunarp-datatable-page-size {
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--ui-muted);
    font-size: 12px;
    white-space: nowrap;
  }

  .sunarp-datatable-page-size select {
    width: auto;
    min-width: 65px;
    min-height: 32px;
    padding: 0 7px;
  }

  .sunarp-datatable-page-info {
    color: var(--ui-muted);
    font-size: 12px;
    white-space: nowrap;
  }

  .sunarp-datatable-pagination .sunarp-btn {
    min-height: 32px;
    padding: 0 10px;
    font-size: 12px;
  }

  .sunarp-datatable-pagination .sunarp-btn:disabled {
    opacity: .4;
    cursor: not-allowed;
  }

  /* ============================================================
   TABLET
============================================================ */

  @media (max-width: 991.98px) {
    .sunarp-main {
      padding-right: 22px;
      padding-left: 22px;
    }

    .sunarp-topbar {
      padding-right: 22px;
      padding-left: 22px;
    }

    .sunarp-grid--cards {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .sunarp-datatable-toolbar {
      gap: 12px;
    }

    .sunarp-datatable-control {
      flex-basis: 160px;
    }

    .sunarp-datatable-search {
      flex-basis: 220px;
    }
  }

  /* ============================================================
   MÓVIL
============================================================ */

  @media (max-width: 767.98px) {
    .sunarp-sidebar {
      top: var(--ui-topbar-height);
      right: auto;
      bottom: 0;
      left: 0;
      width: min(290px, 85vw);
      transform: translateX(-100%);
      transition: transform .2s ease;
    }

    .sunarp-sidebar.is-open {
      transform: translateX(0);
    }

    .sunarp-sidebar-overlay {
      position: fixed;
      inset: var(--ui-topbar-height) 0 0;
      z-index: 45;
      background: rgb(50 60 55 / 45%);
    }

    .sunarp-topbar {
      left: 0;
      padding: 0 14px;
    }

    .sunarp-mobile-menu-button {
      display: inline-grid !important;
    }

    .sunarp-topbar-brand strong {
      font-size: 13px;
    }

    .sunarp-main {
      margin-left: 0;
      padding: calc(var(--ui-topbar-height) + 20px) 14px 24px;
    }

    .sunarp-page-header {
      align-items: flex-start;
      flex-direction: column;
      gap: 14px;
    }

    .sunarp-page-header h1 {
      font-size: 23px;
    }

    .sunarp-page-actions {
      width: 100%;
    }

    .sunarp-grid--cards {
      grid-template-columns: 1fr;
    }

    .sunarp-modal-layer {
      padding: 10px;
    }

    .sunarp-modal {
      max-height: 96vh;
    }

    .sunarp-modal-header,
    .sunarp-modal-body {
      padding: 16px;
    }

    .sunarp-modal-footer {
      padding: 14px 16px;
    }

    .sunarp-toast-region {
      top: 74px;
      right: 12px;
      width: calc(100vw - 24px);
    }

    .sunarp-datatable-toolbar {
      align-items: stretch;
      flex-direction: column;
    }

    .sunarp-datatable-control,
    .sunarp-datatable-search {
      flex: 1 1 auto;
      width: 100%;
    }

    .sunarp-datatable-footer {
      align-items: flex-start;
      flex-direction: column;
    }

    .sunarp-datatable-pagination {
      justify-content: flex-start;
      width: 100%;
    }
  }

  /* ============================================================
   CHART: GRÁFICOS CON CHART.JS
============================================================ */

  .sunarp-grid--dashboard {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 18px;
    margin-bottom: 18px;
  }

  .sunarp-chart {
    width: 100%;
    min-width: 0;
  }

  .sunarp-chart-header {
    margin-bottom: 14px;
  }

  .sunarp-chart-title {
    margin: 0;
    color: var(--ui-ink);
    font-size: 17px;
    font-weight: 700;
  }

  .sunarp-chart-description {
    margin: 5px 0 0;
    color: var(--ui-muted);
    font-size: 12px;
  }

  .sunarp-chart-plot {
    position: relative;
    width: 100%;
    height: 300px;
    min-width: 0;
  }

  .sunarp-chart-canvas {
    display: block;
    width: 100% !important;
    height: 100% !important;
  }

  .sunarp-chart-empty {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 20px;
    color: var(--ui-muted);
    text-align: center;
    font-size: 13px;
  }

  /* Tablet */

  @media (max-width: 991.98px) {
    .sunarp-grid--dashboard {
      grid-template-columns: 1fr;
    }
  }

  /* Móvil */

  @media (max-width: 767.98px) {
    .sunarp-chart-plot {
      height: 260px;
    }
  }

  /* ============================================================
   CARDS CONFIGURABLES
============================================================ */

  .sunarp-card--default,
  .sunarp-card--metric,
  .sunarp-card--compact {
    min-width: 0;
    background: var(--ui-surface);
    border: 1px solid var(--ui-border);
    border-radius: 8px;
  }

  .sunarp-card--metric {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 8px;
    padding: 20px;
  }

  .sunarp-card--compact {
    padding: 16px;
  }

  .sunarp-card-title {
    margin: 0;
    color: var(--ui-ink);
    font-size: 14px;
    font-weight: 600;
  }

  .sunarp-card-value {
    display: block;
    color: var(--ui-ink);
    font-size: 30px;
    line-height: 1.25;
    font-weight: 700;
    overflow-wrap: anywhere;
  }

  .sunarp-card-description {
    margin: 0;
    color: var(--ui-muted);
    font-size: 12px;
  }

  .sunarp-card-icon {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: var(--ui-muted);
    font-size: 20px;
  }

  .sunarp-card-footer {
    width: 100%;
    margin-top: 8px;
    padding-top: 12px;
    border-top: 1px solid var(--ui-border);
    color: var(--ui-muted);
    font-size: 12px;
  }

  .sunarp-card--interactive {
    cursor: pointer;
    transition:
      border-color .15s ease,
      background-color .15s ease;
  }

  .sunarp-card--interactive:hover {
    border-color: #BEC9B9;
    background: #FAFBF9;
  }

  .sunarp-card--interactive:focus-visible {
    outline: 2px solid var(--sunarp-turquoise);
    outline-offset: 2px;
  }


  /* ============================================================
   LOADER GLOBAL
============================================================ */

  body.sunarp-loading {
    overflow: hidden;
  }

  .sunarp-loader {
    position: fixed;
    inset: 0;
    z-index: 2000;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: #FFFFFF;
    opacity: 1;
    visibility: visible;
    transition:
      opacity .22s ease,
      visibility .22s ease;
  }

  .sunarp-loader[hidden] {
    display: none !important;
  }
